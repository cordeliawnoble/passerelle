<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passerelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #FFFFFF; --bg-2: #F6F3FB; --card: #FFFFFF;
    --line: rgba(124,92,191,0.18);
    --text: #2B2140; --text-dim: #7A7290;
    --lavender: #8C7FB0; --lavender-deep: #5E5286;
    --wine: #7A3B4A;
    --accent: #7C5CBF;
    --global-bg:#FFFFFF; --global-bg-2:#F6F3FB; --global-card:#FFFFFF;
    --global-line:rgba(124,92,191,0.18); --global-text:#2B2140; --global-text-dim:#7A7290; --global-accent:#7C5CBF;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Lora', serif; line-height:1.6; }
  h1,h2,h3,h4{ font-family:'Cormorant Garamond', serif; font-weight:600; letter-spacing:0.02em; margin:0; }
  .quote-hand{ font-family:'Caveat', cursive; font-size:1.4rem; color:var(--accent); }
  a{ color:inherit; text-decoration:none; cursor:pointer; }

  /* ---- structure générale : sidebar + contenu ---- */
  .shell{ display:flex; min-height:100vh; }
  .sidebar{ --bg:var(--global-bg); --bg-2:var(--global-bg-2); --card:var(--global-card); --line:var(--global-line); --text:var(--global-text); --text-dim:var(--global-text-dim); --accent:var(--global-accent); width:230px; flex-shrink:0; background:var(--bg-2); border-right:1px solid var(--line); padding:0 0 18px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .sidebar::-webkit-scrollbar{ width:7px; }
  .sidebar::-webkit-scrollbar-thumb{ background:var(--line); border-radius:10px; }
  .sidebar-brand-wrap{ position:sticky; top:0; z-index:20; background:var(--bg-2); border-bottom:1px solid var(--line); margin-bottom:10px; padding:14px 12px 10px; }
  .sidebar-brand{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; font-family:'Cormorant Garamond',serif; font-size:1.35rem; padding:8px 10px; border:none; border-radius:7px; background:transparent; color:var(--text); cursor:pointer; text-align:left; }
  .sidebar-brand:hover{ background:rgba(124,92,191,.07); }
  .sidebar-brand-chevron{ font-family:'Lora',serif; font-size:12px; color:var(--text-dim); transition:transform .15s ease; }
  .sidebar-brand-chevron.open{ transform:rotate(180deg); }
  .space-menu{ display:none; margin:6px 4px 0; padding:5px; border:1px solid var(--line); border-radius:7px; background:var(--card); box-shadow:0 8px 24px rgba(0,0,0,.08); }
  .space-menu.open{ display:block; }
  .space-menu-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 9px; border-radius:5px; font-size:12px; color:var(--text-dim); cursor:pointer; }
  .space-menu-item:hover{ background:rgba(124,92,191,.07); color:var(--text); }
  .space-menu-item.active{ color:var(--accent); font-weight:500; }
  .nav-group{ font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-dim); padding:16px 22px 6px; }
  .nav-link{ display:block; padding:9px 22px; font-size:14px; color:var(--text-dim); cursor:pointer; border-left:3px solid transparent; }
  .nav-link:hover{ color:var(--text); background:rgba(255,255,255,0.03); }
  .nav-link.active{ color:var(--accent); border-left-color:var(--accent); background:rgba(201,162,39,0.08); font-weight:500; }
  .sidebar-foot{ margin-top:auto; padding:16px 22px; border-top:1px solid var(--line); font-size:12px; color:var(--text-dim); }
  .sidebar-foot button{ background:none; border:1px solid var(--line); color:var(--text-dim); padding:6px 12px; border-radius:16px; cursor:pointer; font-family:'Lora',serif; font-size:11px; margin-top:8px; }

  .main{ flex:1; min-width:0; }
  .wrap{ max-width:1080px; margin:0 auto; padding:36px 32px 100px; }

  /* ---- bannière décorative ---- */
  /* ---- bannières des fiches catalogue ---- */
  .catalog-entity-banner{width:100%;height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block;margin:0 0 18px;box-shadow:0 8px 24px rgba(0,0,0,.08);}
  @media (max-width:800px){.catalog-entity-banner{height:150px;border-radius:9px;}}

  .banner{ position:relative; border:1px solid var(--line); background:var(--bg-2); border-radius:6px; padding:36px 40px; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:28px; }
  .banner::before, .banner::after{ content:"✦"; position:absolute; color:var(--accent); opacity:0.5; font-size:14px; }
  .banner::before{ top:16px; left:28px; } .banner::after{ bottom:16px; right:30px; }
  .banner h1{ font-size:2rem; text-align:center; }
  .banner .sub{ text-align:center; color:var(--text-dim); font-size:14px; margin-top:6px; font-style:italic; }

  /* ---- en-tête d'une fiche (œuvre, saga...) ---- */
  .oeuvre-head{ display:flex; gap:24px; margin-bottom:24px; align-items:flex-start; }
  .cover-block{ width:100px; height:130px; flex-shrink:0; border-radius:4px; background:linear-gradient(160deg, var(--lavender)33, var(--bg-2)); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond',serif; font-size:1.6rem; color:var(--text-dim); }
  .oeuvre-info{ flex:1; }
  .oeuvre-info h1{ font-size:1.9rem; margin-bottom:4px; }
  .oeuvre-sub{ color:var(--lavender); font-size:14px; margin-bottom:12px; }
  .status-badge{ display:inline-block; font-size:11px; padding:4px 12px; border-radius:20px; background:var(--accent); color:var(--bg); font-weight:500; margin-bottom:10px; }
  .progress-bar-outer{ width:100%; max-width:340px; height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin:8px 0; }
  .progress-bar-inner{ height:100%; background:var(--accent); }
  .oeuvre-meta-line{ font-size:13px; color:var(--text-dim); }

  /* ---- cartes de stats ---- */
  .stat-cards-row{ display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; margin-bottom:26px; }
  @media (max-width:800px){ .stat-cards-row{ grid-template-columns:repeat(2,1fr); } }
  .stat-card{ background:var(--card); border:1px solid var(--line); border-radius:6px; padding:20px; }
  .stat-card h3{ font-size:13px; color:var(--text-dim); font-weight:400; margin-bottom:10px; font-family:'Lora',serif; }
  .stat-big{ font-family:'Cormorant Garamond',serif; font-size:1.9rem; color:var(--accent); font-weight:600; }

  .panel{ background:var(--card); border:1px solid var(--line); border-radius:6px; padding:22px 24px; margin-bottom:20px; }
  .panel h2{ font-size:1.1rem; color:var(--lavender); margin-bottom:14px; font-family:'Lora',serif; font-weight:500; }
  .info-line{ display:flex; justify-content:space-between; font-size:13px; padding:8px 0; border-bottom:1px solid var(--line); }
  .info-line:last-child{ border-bottom:none; }

  .head-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; flex-wrap:wrap; gap:10px; }
  .btn-primary{ background:var(--accent); color:var(--bg); border:none; padding:10px 18px; border-radius:5px; cursor:pointer; font-family:'Lora',serif; font-size:13px; font-weight:500; }
  .btn-secondary{ background:var(--bg-2); border:1px solid var(--line); color:var(--text); padding:10px 18px; border-radius:5px; cursor:pointer; font-family:'Lora',serif; font-size:13px; }
  .search-input{ background:var(--bg-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:9px 14px; font-size:13px; font-family:'Lora',serif; min-width:220px; }

  /* ---- galerie de cartes (sagas, œuvres, personnages, idées) ---- */
  .gallery{ display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
  @media (max-width:820px){ .gallery{ grid-template-columns:repeat(2,1fr); } }
  .char-card{ position:relative; cursor:pointer; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--bg-2); transition:transform 0.15s ease, border-color 0.15s ease; }
  .char-card:hover{ transform:translateY(-3px); border-color:var(--accent); }
  .char-portrait{ height:100px; display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond',serif; font-size:1.7rem; color:var(--text); opacity:0.9; position:relative; }
  .fav-heart{ position:absolute; top:8px; right:10px; font-size:15px; color:var(--accent); }
  .char-name{ padding:12px 14px 3px; font-size:15px; font-weight:500; }
  .char-role{ padding:0 14px 14px; font-size:12px; color:var(--text-dim); }

  .empty{ text-align:center; padding:60px 24px; color:var(--text-dim); border:1px dashed var(--line); border-radius:6px; font-size:14px; }
  .status-line{ text-align:center; color:var(--text-dim); font-size:13px; padding:50px; }

  /* ---- auth ---- */
  .auth-box{ max-width:380px; margin:100px auto; background:var(--bg-2); border:1px solid var(--line); border-radius:8px; padding:36px; }
  .auth-box h1{ font-size:1.8rem; margin-bottom:6px; text-align:center; }
  .auth-box .sub{ text-align:center; color:var(--text-dim); font-size:13px; margin-bottom:26px; font-style:italic; }
  .auth-tabs{ display:flex; gap:4px; margin-bottom:22px; border:1px solid var(--line); border-radius:20px; padding:3px; }
  .auth-tabs button{ flex:1; background:none; border:none; color:var(--text-dim); padding:8px; border-radius:16px; cursor:pointer; font-family:'Lora',serif; font-size:13px; }
  .auth-tabs button.active{ background:var(--accent); color:var(--bg); font-weight:500; }
  label{ display:block; font-size:12px; color:var(--text-dim); margin:14px 0 5px; }
  input, select, textarea{ width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:5px; padding:10px 12px; font-family:'Lora',serif; font-size:14px; }
  textarea{ min-height:80px; resize:vertical; }
  .auth-submit{ width:100%; margin-top:22px; background:var(--accent); color:var(--bg); border:none; padding:12px; border-radius:5px; font-weight:500; cursor:pointer; font-family:'Lora',serif; font-size:14px; }
  .auth-msg{ font-size:12px; margin-top:14px; text-align:center; min-height:16px; }
  .auth-msg.error{ color:#e88; }
  .auth-msg.ok{ color:#8fc95a; }

  /* ---- modal ---- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:40px 20px; overflow-y:auto; }
  .modal-overlay.open{ display:flex; }
  .modal-box{ background:var(--card); border:1px solid var(--line); border-radius:6px; width:100%; max-width:560px; }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; padding:20px 26px; border-bottom:1px solid var(--line); }
  .modal-head h2{ font-size:1.3rem; }
  .modal-head button{ background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; }
  .modal-body{ padding:22px 26px; display:flex; flex-direction:column; gap:14px; max-height:65vh; overflow-y:auto; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:18px 26px; border-top:1px solid var(--line); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  table.ch-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.ch-table th{ text-align:left; color:var(--text-dim); font-weight:400; padding:8px 10px; border-bottom:1px solid var(--line); font-size:12px; }
  table.ch-table td{ padding:10px 10px; border-bottom:1px solid var(--line); }
  table.ch-table tbody tr{ cursor:pointer; }
  table.ch-table tbody tr:hover{ background:var(--bg-2); }
  .etat-pill{ font-size:11px; padding:3px 10px; border-radius:20px; display:inline-block; background:var(--line); color:var(--text-dim); }
  .cards-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .ch-card{ cursor:pointer; border:1px solid var(--line); border-radius:6px; padding:14px; background:var(--bg-2); }
  .ch-card:hover{ border-color:var(--accent); }
  .kanban-row{ display:flex; gap:14px; overflow-x:auto; padding-bottom:8px; }
  .kanban-col{ min-width:200px; flex:1; background:var(--bg-2); border:1px solid var(--line); border-radius:6px; padding:12px; }
  .kanban-col h4{ font-size:12px; color:var(--text-dim); text-transform:uppercase; margin-bottom:10px; }
  .kanban-card{ cursor:pointer; background:var(--card); border:1px solid var(--line); border-radius:5px; padding:10px 12px; margin-bottom:8px; font-size:13px; }
  .kanban-card:hover{ border-color:var(--accent); }

  .side-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; z-index:150; }
  .side-overlay.open{ display:block; }
  .side-panel{ position:fixed; top:0; right:-380px; width:360px; max-width:90vw; height:100%; background:var(--card); border-left:1px solid var(--line); z-index:151; transition:right .25s ease; padding:22px; overflow-y:auto; }
  .side-panel.open{ right:0; }
  .memo-item{ border:1px solid var(--line); border-radius:5px; padding:10px 12px; margin-bottom:10px; font-size:13px; }
  .memo-date{ font-size:11px; color:var(--text-dim); margin-bottom:4px; }


  /* ---- Accueil Passerelle : grille de cockpit ---- */
  .home-two-col{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; align-items:start; }
  .home-two-col > .panel{ margin-bottom:20px; height:calc(100% - 20px); box-sizing:border-box; }
  .home-stats-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .home-stats-grid .stat-card{ padding:16px; }
  .home-horizon-list{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .home-horizon-item{ border:1px solid var(--line); border-radius:6px; background:var(--bg-2); padding:12px; cursor:pointer; transition:border-color .15s ease, transform .15s ease; }
  .home-horizon-item:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .home-horizon-item strong{ display:block; font-size:13px; margin-bottom:3px; }
  .home-horizon-item span{ font-size:11px; color:var(--text-dim); }
  .home-quick-list{ display:grid; gap:8px; }
  .home-quick-link{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:var(--bg-2); font-size:12px; color:var(--text-dim); }
  .home-quick-link:hover{ border-color:var(--accent); color:var(--text); }
  .home-quick-link-left{ display:flex; align-items:center; gap:9px; min-width:0; }
  .home-quick-link-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  @media(max-width:930px){ .home-two-col{ grid-template-columns:1fr; } .home-two-col > .panel{ height:auto; } }
  @media(max-width:560px){ .home-stats-grid,.home-horizon-list{ grid-template-columns:1fr; } }


  /* ---- Passerelle · Back-office V1 ---- */
  .sidebar-quick{ padding:14px 14px 8px; border-top:1px solid var(--line); margin-top:auto; }
  .sidebar-quick-title{ font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-dim); padding:0 8px 8px; }
  .quick-link{ display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:5px; color:var(--text-dim); font-size:12px; cursor:pointer; }
  .quick-link:hover{ background:rgba(124,92,191,.08); color:var(--accent); }
  .quick-link-empty{ padding:4px 8px 10px; font-size:11px; color:var(--text-dim); font-style:italic; }
  .switch-space{ margin:8px 14px 12px; padding:9px 11px; border:1px solid var(--line); border-radius:6px; text-align:center; font-size:12px; cursor:pointer; color:var(--lavender-deep); background:var(--card); }
  .switch-space:hover{ border-color:var(--accent); color:var(--accent); }
  .admin-hero{ display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:24px; }
  .admin-hero h1{ font-size:2rem; }
  .admin-hero p{ margin:6px 0 0; color:var(--text-dim); font-size:13px; }
  .admin-tabs{ display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:22px; flex-wrap:wrap; }
  .admin-tab{ border:none; background:none; color:var(--text-dim); font-family:'Lora',serif; padding:10px 14px; cursor:pointer; border-bottom:2px solid transparent; }
  .admin-tab.active{ color:var(--accent); border-bottom-color:var(--accent); font-weight:500; }
  .admin-editor-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:14px 0 22px;flex-wrap:wrap;}
  .admin-editor-tabs button{border:0;background:transparent;color:var(--text-dim);font-family:'Lora',serif;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;}
  .admin-editor-tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
  .admin-editor-panel>.admin-section{margin-bottom:16px;}
  .admin-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:24px; }
  @media(max-width:900px){ .admin-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media(max-width:620px){ .admin-grid{ grid-template-columns:1fr; } }
  .admin-card{ border:1px solid var(--line); background:var(--card); border-radius:7px; padding:18px; }
  .admin-card h3{ font-size:1.05rem; margin-bottom:5px; }
  .admin-card p{ font-size:12px; color:var(--text-dim); margin:0 0 14px; min-height:38px; }
  .admin-card-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .admin-section{ border:1px solid var(--line); border-radius:7px; background:var(--card); padding:20px; margin-bottom:18px; }
  .admin-section-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
  .admin-section-head h2{ font-size:1.15rem; color:var(--lavender-deep); }
  .admin-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .admin-table th{ text-align:left; font-weight:400; color:var(--text-dim); border-bottom:1px solid var(--line); padding:8px; }
  .admin-table td{ border-bottom:1px solid var(--line); padding:9px 8px; vertical-align:middle; }
  .admin-table tr:last-child td{ border-bottom:none; }
  .admin-inline-form{ display:grid; grid-template-columns:1fr 2fr 80px auto; gap:8px; align-items:end; margin-bottom:14px; }
  @media(max-width:780px){ .admin-inline-form{ grid-template-columns:1fr; } }
  .admin-inline-form label{ margin:0 0 4px; }
  .tiny-btn{ border:1px solid var(--line); background:var(--bg-2); color:var(--text); border-radius:4px; padding:6px 9px; cursor:pointer; font-family:'Lora',serif; font-size:11px; }
  .tiny-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .danger-btn{ color:#9b4554; }
  .admin-notice{ border:1px dashed var(--line); background:var(--bg-2); border-radius:6px; padding:12px 14px; color:var(--text-dim); font-size:12px; margin-bottom:16px; }


  /* ---- Back-office : mode administration dédié ---- */
  .admin-mode-sidebar{ background:#fbf9f4; }
  .admin-mode-brand{ padding:18px 18px 14px; border-bottom:1px solid var(--line); }
  .admin-mode-brand strong{ display:block; font-family:'Cormorant Garamond',serif; font-size:1.35rem; color:var(--text); }
  .admin-mode-brand span{ display:block; font-size:10px; color:var(--text-dim); margin-top:2px; }
  .admin-back-link{ margin:10px 14px 8px; padding:9px 10px; border:1px solid var(--line); border-radius:6px; cursor:pointer; font-size:12px; color:var(--lavender-deep); background:var(--card); }
  .admin-back-link:hover{ border-color:var(--accent); color:var(--accent); }
  .admin-mode-nav{ padding:4px 0 14px; }
  .admin-mode-nav .nav-link{ padding:10px 20px; }
  .admin-mode-footer{ margin-top:auto; border-top:1px solid var(--line); padding:14px 18px; font-size:11px; color:var(--text-dim); }
  .admin-catalog-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:18px; padding-bottom:22px; margin-bottom:24px; border-bottom:1px solid var(--line); }
  .admin-catalog-head h1{ font-size:2rem; }
  .admin-catalog-head p{ margin:3px 0 0; color:var(--text-dim); font-size:13px; }
  .admin-catalog-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .admin-filterbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
  .admin-filterbar .search-input{ flex:1 1 280px; }
  .admin-filterbar select{ width:auto; min-width:170px; }
  .admin-catalog-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
  .admin-catalog-card{ border:1px solid var(--line); border-radius:10px; background:var(--card); overflow:hidden; cursor:pointer; transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease; }
  .admin-catalog-card:hover{ transform:translateY(-2px); border-color:var(--accent); box-shadow:0 8px 24px rgba(80,57,120,.08); }
  .admin-catalog-visual{ height:150px; background:var(--bg-2); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .admin-catalog-visual img{ width:100%; height:100%; object-fit:contain; }
  .admin-catalog-placeholder{ font-family:'Cormorant Garamond',serif; font-size:2rem; color:var(--lavender-deep); }
  .admin-catalog-body{ padding:16px; }

</head>
<body>

<div id="app"><div class="status-line">Chargement…</div></div>

<script>
  const supabaseUrl = 'https://ilhfzulwuuxyidhityoo.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsaGZ6dWx3dXV4eWlkaGl0eW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NDA5NTgsImV4cCI6MjEwMjQxNjk1OH0.nux1ehaes_1rPSQhaYJ3hdCcipYn3B5PQMokUzSuBl0';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);
  const db = () => sb.schema('passerelle');

  const app = document.getElementById('app');
  let currentUser = null;

  async function init(){
    try{
      const { data: { session }, error } = await sb.auth.getSession();
      if(error) throw error;
      if (session) { currentUser = session.user; await loadGlobalAppearance(); ensureMonthlyBackupV561().catch(console.warn); renderShell(); navigate('accueil'); }
      else renderAuth();
    }catch(err){
      console.error('Passerelle init error', err);
      app.innerHTML = `<div class="auth-box"><h1>✒️ Passerelle</h1><div class="auth-msg">Erreur de démarrage : ${safeText(err?.message||err)}</div></div>`;
    }
  }

  function renderAuth(mode){
    mode = mode || 'login';
    app.innerHTML = `
      <div class="auth-box">
        <h1>✒️ Passerelle</h1>
        <div class="sub">L'atelier de vos histoires</div>
        <div class="auth-tabs">
          <button class="${mode==='login'?'active':''}" onclick="renderAuth('login')">Se connecter</button>
          <button class="${mode==='signup'?'active':''}" onclick="renderAuth('signup')">Créer un compte</button>
        </div>
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="toi@exemple.com">
        <label>Mot de passe</label>
        <input type="password" id="auth-password" placeholder="••••••••">
        <button class="auth-submit" onclick="${mode==='login' ? 'doLogin()' : 'doSignup()'}">${mode==='login' ? 'Se connecter' : 'Créer mon compte'}</button>
        <div class="auth-msg" id="auth-msg"></div>
      </div>
    `;
  }

  async function doLogin(){
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const msg = document.getElementById('auth-msg');
    msg.textContent = 'Connexion…'; msg.className = 'auth-msg';
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { msg.textContent = error.message; msg.className = 'auth-msg error'; return; }
    currentUser = data.user;
    ensureMonthlyBackupV561().catch(console.warn);
    renderShell(); navigate('accueil');
  }

  async function doSignup(){
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const msg = document.getElementById('auth-msg');
    if (password.length < 6) { msg.textContent = 'Le mot de passe doit faire au moins 6 caractères.'; msg.className = 'auth-msg error'; return; }
    msg.textContent = 'Création du compte…'; msg.className = 'auth-msg';
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) { msg.textContent = error.message; msg.className = 'auth-msg error'; return; }
    if (data.session) { currentUser = data.user; ensureMonthlyBackupV561().catch(console.warn); renderShell(); navigate('accueil'); }
    else { msg.textContent = 'Compte créé — vérifie ta boîte mail, puis connecte-toi.'; msg.className = 'auth-msg ok'; }
  }

  async function doLogout(){ await sb.auth.signOut(); currentUser = null; renderAuth(); }

  const NAV = [
    { group: 'Passerelle', items: [
      { key:'accueil', label:'Accueil', real:true },
    ]},
    { group: 'Bibliothèque', items: [
      { key:'oeuvres', label:'Œuvres', real:true },
      { key:'sagas', label:'Sagas', real:true },
      { key:'poesie', label:'Recueils de poésie', real:true },
      { key:'personnages', label:'Personnages', real:true },
    ]},
    { group: 'Atelier', items: [
      { key:'relecture', label:'Relecture', real:true },
      { key:'planning', label:'Planning', real:true },
      { key:'idees', label:'Pépinière', real:true },
    ]},
    { group: 'Pilotage', items: [
      { key:'bureau-editorial', label:'Bureau éditorial', real:true },
      { key:'archives', label:'Archives', real:false },
      { key:'administration', label:'⚙ Administration', real:true },
    ]}
  ];

  function renderShell(){
    app.innerHTML = `
      <div class="shell">
        <div class="sidebar">
          <div class="sidebar-brand-wrap">
            <button class="sidebar-brand" type="button" onclick="toggleSpaceMenu(event)" aria-expanded="false">
              <span>✒️ Passerelle</span><span class="sidebar-brand-chevron" id="space-chevron">⌄</span>
            </button>
            <div class="space-menu" id="space-menu">
              <div class="space-menu-item active" onclick="closeSpaceMenu();navigate('accueil')"><span>✒️ Passerelle</span><span>Actif</span></div>
              <div class="space-menu-item" onclick="closeSpaceMenu();openPasseAiles()"><span>🪽 Passe-Ailes</span><span>↗</span></div>
            </div>
          </div>
          ${NAV.map(g => `
            <div class="nav-group">${g.group}</div>
            ${g.items.map(it => `<div class="nav-link" id="nav-${it.key}" onclick="navigate('${it.key}')">${it.label}</div>`).join('')}
          `).join('')}
          <div class="sidebar-quick">
            <div class="sidebar-quick-title">Liens rapides</div>
            <div id="sidebar-quick-links"><div class="quick-link-empty">Chargement…</div></div>
          </div>
          <div class="sidebar-foot">
            ${currentUser.email}
            <button onclick="doLogout()">Déconnexion</button>
          </div>
        </div>
        <div class="main"><div class="wrap" id="content"></div></div>
      </div>
      ${sagaModalHtml()}
      ${sousSagaModalHtml()}
      ${oeuvreModalHtml()}
      ${personnageModalHtml()}
      ${ideeModalHtml()}
      ${chapitreModalHtml()}
      ${personnageOeuvreModalHtml()}
      ${planModalHtml()}
      ${correctionModalHtml()}
      ${luModalHtml()}
      ${chronoModalHtml()}
      ${recueilModalHtml()}
      ${poemeModalHtml()}
      <div class="side-overlay" id="memo-overlay" onclick="closeMemoPanel()"></div>
      <div class="side-panel" id="memo-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h2 id="memo-panel-title" style="font-size:1.1rem;">Notes</h2>
          <button onclick="closeMemoPanel()" style="background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer;">✕</button>
        </div>
        <div id="memo-list"></div>
        <textarea id="memo-new" placeholder="Ajouter une note..." style="margin-top:14px;"></textarea>
        <button class="btn-primary" style="width:100%; margin-top:8px;" onclick="addMemo()">Ajouter</button>
      </div>`;
    loadSidebarQuickLinks();
  }

  function toggleSpaceMenu(event){
    if (event) event.stopPropagation();
    const menu = document.getElementById('space-menu');
    const chevron = document.getElementById('space-chevron');
    if (!menu) return;
    const opening = !menu.classList.contains('open');
    menu.classList.toggle('open', opening);
    if (chevron) chevron.classList.toggle('open', opening);
    const button = document.querySelector('.sidebar-brand');
    if (button) button.setAttribute('aria-expanded', opening ? 'true' : 'false');
  }

  function closeSpaceMenu(){
    const menu = document.getElementById('space-menu');
    const chevron = document.getElementById('space-chevron');
    if (menu) menu.classList.remove('open');
    if (chevron) chevron.classList.remove('open');
    const button = document.querySelector('.sidebar-brand');
    if (button) button.setAttribute('aria-expanded','false');
  }

  document.addEventListener('click', (event) => {
    if (!event.target.closest('.sidebar-brand-wrap')) closeSpaceMenu();
  });

  function setActiveNav(key){
    document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
    const el = document.getElementById('nav-'+key);
    if (el) el.classList.add('active');
  }

  function navigate(key){
    resetTheme();
    setActiveNav(key);
    const item = NAV.flatMap(g=>g.items).find(i=>i.key===key);
    const content = document.getElementById('content');
    if (item && item.special === 'todum'){ openQuickLinkBySlug('todum'); return; }
    if (!item.real){
      content.innerHTML = `<h2 style="margin-bottom:20px;">${item.label}</h2><div class="empty">Cette page n'est pas encore branchée à Supabase.<br><span style="font-size:11px;">Le schéma existe déjà pour elle — on la construit dès qu'on y arrive dans l'ordre.</span></div>`;
      return;
    }
    if (key === 'accueil') renderAccueil();
    if (key === 'oeuvres') renderOeuvres();
    if (key === 'sagas') renderSagas();
    if (key === 'personnages') renderPersonnages();
    if (key === 'idees') renderIdees();
    if (key === 'relecture') renderRelecture();
    if (key === 'planning') renderPlanning();
    if (key === 'bureau-editorial') renderBureauEditorial();
    if (key === 'poesie') renderPoesie();
    if (key === 'administration') renderAdministration();
  }


  // ============================================================
  // LIENS RAPIDES + BASCULE PASSE-AILES
  // ============================================================
  function safeText(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const PAGE_BANNER_LABELS = {
    accueil:'Accueil', oeuvres:'Œuvres', sagas:'Sagas', poesie:'Recueils de poésie', personnages:'Personnages',
    relecture:'Relecture', planning:'Planning', pepiniere:'Pépinière', 'bureau-editorial':'Bureau éditorial'
  };
  async function getPageBanner(pageKey){
    const {data,error}=await db().from('page_banners').select('image_url').eq('page_key',pageKey).maybeSingle();
    if(error) return null;
    return data?.image_url||null;
  }
  function renderPageImageBanner(url,alt='Bannière'){
    return url ? `<div class="page-image-banner"><img src="${safeText(url)}" alt="${safeText(alt)}"></div>` : '';
  }
  async function uploadAssetFile(file,folder='banners'){
    if(!file) return null;
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    const safeName=`${Date.now()}-${Math.random().toString(36).slice(2,9)}.${ext}`;
    const path=`${currentUser.id}/${folder}/${safeName}`;
    const {error}=await sb.storage.from('passerelle-assets').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||undefined});
    if(error){alert('Upload impossible : '+error.message);return null;}
    const {data}=sb.storage.from('passerelle-assets').getPublicUrl(path);
    return data?.publicUrl||null;
  }
  async function uploadPageBanner(pageKey,input){
    const file=input?.files?.[0]; if(!file)return;
    const url=await uploadAssetFile(file,`banners/pages/${pageKey}`); if(!url)return;
    const {error}=await db().from('page_banners').upsert({user_id:currentUser.id,page_key:pageKey,image_url:url,updated_at:new Date().toISOString()},{onConflict:'user_id,page_key'});
    if(error){alert('Erreur bannière : '+error.message);return;} adminNavigate('configuration');
  }
  async function removePageBanner(pageKey){
    if(!confirm('Retirer cette bannière ?'))return;
    const {error}=await db().from('page_banners').delete().eq('page_key',pageKey);if(error){alert(error.message);return;}adminNavigate('configuration');
  }
  async function uploadEntityBanner(table,id,input,targetInputId){
    const file=input?.files?.[0];if(!file||!id)return;
    const url=await uploadAssetFile(file,`banners/${table}/${id}`);if(!url)return;
    const {error}=await db().from(table).update({banniere:url}).eq('id',id);if(error){alert('Erreur bannière : '+error.message);return;}
    const target=document.getElementById(targetInputId);if(target)target.value=url;
    alert('Bannière téléversée ✓');
  }

  function renderCatalogEntityBanner(url,title=''){
    if(!url) return '';
    return `<img class="catalog-entity-banner" src="${safeText(url)}" alt="Bannière ${safeText(title)}">`;
  }

  async function loadSidebarQuickLinks(){
    const zone = document.getElementById('sidebar-quick-links');
    if (!zone) return;
    const { data, error } = await db().from('liens_rapides').select('id, nom, url, icone, slug, ordre, actif').eq('actif', true).order('ordre', { ascending:true });
    if (error){
      zone.innerHTML = `<div class="quick-link-empty">À configurer dans Administration</div>`;
      return;
    }
    if (!data?.length){ zone.innerHTML = `<div class="quick-link-empty">Aucun lien configuré</div>`; return; }
    zone.innerHTML = data.map(l => `<a class="quick-link" href="${safeText(l.url)}" target="_blank" rel="noopener"><span>${safeText(l.icone||'↗')}</span><span>${safeText(l.nom)}</span></a>`).join('');
  }

  async function openQuickLinkBySlug(slug){
    const { data, error } = await db().from('liens_rapides').select('url').eq('slug',slug).eq('actif',true).maybeSingle();
    if (error || !data?.url){
      alert('Ce lien rapide n’est pas encore configuré. Va dans Administration → Liens rapides.');
      navigate('administration');
      return;
    }
    window.open(data.url, '_blank', 'noopener');
  }

  function openPasseAiles(){
    alert('Passe-Ailes sera branché ici pendant son propre audit. Le bouton est déjà réservé dans la navigation.');
  }

  // ============================================================
  // ADMINISTRATION / BACK-OFFICE — MODE DÉDIÉ
  // ============================================================
  let adminTab = 'collections';
  const ADMIN_NAV = [
    ['collections','Collections'], ['sagas','Sagas'], ['sous-sagas','Sous-sagas'],
    ['oeuvres','Œuvres'], ['recueils','Recueils de poésie'], ['personnages','Personnages'],
    ['pepiniere','Pépinière'], ['configuration','Configuration'], ['sauvegardes','Sauvegarde & restauration']
  ];

  function renderAdminSidebar(){
    const sidebar=document.querySelector('.sidebar'); if(!sidebar) return;
    sidebar.classList.add('admin-mode-sidebar');
    sidebar.innerHTML=`
      <div class="admin-mode-brand"><strong>⚙ Back-office</strong><span>Administration de Passerelle</span></div>
      <div class="admin-back-link" onclick="leaveAdministration()">← Retour à Passerelle</div>
      <div class="nav-group">Catalogue</div>
      <nav class="admin-mode-nav">
        ${ADMIN_NAV.slice(0,7).map(([k,l])=>`<div class="nav-link admin-nav-link ${adminTab===k?'active':''}" data-admin-key="${k}" onclick="adminNavigate('${k}')">${l}</div>`).join('')}
      </nav>
      <div class="nav-group">Réglages</div>
      <nav class="admin-mode-nav">
        <div class="nav-link admin-nav-link ${adminTab==='configuration'?'active':''}" data-admin-key="configuration" onclick="adminNavigate('configuration')">Configuration</div>
        <div class="nav-link admin-nav-link ${adminTab==='sauvegardes'?'active':''}" data-admin-key="sauvegardes" onclick="adminNavigate('sauvegardes')">Sauvegarde & restauration</div>
      </nav>
      <div class="admin-mode-footer">${safeText(currentUser?.email||'')}<br><button class="tiny-btn" style="margin-top:8px" onclick="doLogout()">Déconnexion</button></div>`;
  }

  function leaveAdministration(){
    renderShell();
    navigate('accueil');
  }

  async function renderAdministration(tab){
    adminTab=tab || adminTab || 'collections';
    renderAdminSidebar();
    await adminNavigate(adminTab);
  }

  async function adminNavigate(tab){
    adminTab=tab;
    document.querySelectorAll('.admin-nav-link').forEach(el=>el.classList.toggle('active',el.dataset.adminKey===tab));
    const content=document.getElementById('content'); if(!content) return;
    content.innerHTML='<div class="status-line">Chargement du back-office…</div>';
    if(tab==='collections') return renderAdminCollectionsPage();
    if(tab==='sagas') return renderAdminSagasPage();
    if(tab==='sous-sagas') return renderAdminSousSagasPage();
    if(tab==='oeuvres') return renderAdminOeuvresPage();
    if(tab==='recueils') return renderAdminRecueilsPage();
    if(tab==='personnages') return renderAdminPersonnagesPage();
    if(tab==='pepiniere') return renderAdminPepinierePage();
    if(tab==='configuration') return renderAdminConfiguration(content);
    if(tab==='sauvegardes') return renderAdminSauvegardes(content);
  }

  function adminPageHead(title,desc,buttonHtml=''){
    return `<div class="admin-catalog-head"><div><h1>${title}</h1><p>${desc}</p></div><div class="admin-catalog-actions">${buttonHtml}</div></div>`;
  }
  function adminEmpty(text){ return `<div class="empty">${text}</div>`; }

  async function renderAdminCollectionsPage(){
    const content=document.getElementById('content');
    const {data,error}=await db().from('univers').select('id,nom,sous_titre,description,ordre').order('ordre',{ascending:true});
    if(error){content.innerHTML=adminEmpty('Erreur : '+safeText(error.message));return;}
    content.innerHTML=adminPageHead('Collections','Gérez les grandes familles éditoriales de Passerelle.',`<button class="btn-primary" onclick="openAdminCollectionForm()">+ Nouvelle collection</button>`)+
      `<div class="admin-filterbar"><input class="search-input" id="admin-collection-search" placeholder="🔍 Rechercher une collection…" oninput="filterAdminCards('admin-collections-grid',this.value)"></div>
      <div id="admin-collection-form"></div>
      <div class="admin-catalog-grid" id="admin-collections-grid">${(data||[]).map(c=>`<article class="admin-catalog-card" data-search="${safeText((c.nom+' '+(c.sous_titre||'')).toLowerCase())}"><div class="admin-catalog-visual"><div class="admin-catalog-placeholder">${initials(c.nom)}</div></div><div class="admin-catalog-body"><h3>${safeText(c.nom)}</h3><div class="admin-catalog-meta">${safeText(c.sous_titre||'Collection éditoriale')}<br>Ordre : ${c.ordre||0}</div><div class="admin-catalog-card-actions"><button class="btn-secondary" onclick="event.stopPropagation();openAdminCollectionForm('${c.id}')">Modifier</button></div></div></article>`).join('')||adminEmpty('Aucune collection pour le moment.')}</div>`;

  async function onAdminOeuvreSagaChange(){
    const sagaId=document.getElementById('aow-saga')?.value||'';
    const collection=document.getElementById('aow-collection');
    const ss=document.getElementById('aow-sous-saga');
    if(!collection||!ss) return;
    const help=document.getElementById('aow-collection-help');
    if(!sagaId){ ss.disabled=true; ss.innerHTML='<option value="">—</option>'; if(help) help.textContent='Rattachement direct pour une œuvre indépendante.'; return; }
    const saga=adminOeuvreSagas.find(s=>s.id===sagaId);
    if(saga?.univers_id) collection.value=saga.univers_id;
    if(help) help.textContent='Cette collection est portée par la saga. La modifier ici mettra aussi la saga à jour.';
    ss.disabled=false;
    const {data,error}=await db().from('sous_sagas').select('id,nom').eq('saga_id',sagaId).order('ordre');
    ss.innerHTML='<option value="">—</option>'+(!error?(data||[]).map(x=>`<option value="${x.id}">${safeText(x.nom)}</option>`).join(''):'');
  }

  async function saveAdminOeuvreEditor(){
    if(!adminEditingOeuvreId) return;
    const status=document.getElementById('aow-save-status');
    if(status) status.textContent='Enregistrement…';
    const sagaId=document.getElementById('aow-saga').value||null;
    const selectedCollectionId=document.getElementById('aow-collection').value||null;
    const selectedCoverMediaId=document.getElementById('aow-cover-media-id')?.value||null;
    const tropesRaw=document.getElementById('aow-tropes').value.trim();
    const enjeuxRaw=document.getElementById('aow-enjeux').value.trim();
    const newEditorial=document.getElementById('aow-editorial').value||null;
    const payload={
      titre:document.getElementById('aow-titre').value.trim()||'Sans titre',
      sous_titre:document.getElementById('aow-sous-titre').value.trim()||null,
      format_cible:document.getElementById('aow-format').value.trim()||null,
      univers_id:sagaId?null:selectedCollectionId,
      saga_id:sagaId,
      sous_saga_id:sagaId?(document.getElementById('aow-sous-saga').value||null):null,
      langue:document.getElementById('aow-langue').value.trim()||'Français',
      pitch:document.getElementById('aow-pitch').value.trim()||null,
      resume:document.getElementById('aow-resume').value.trim()||null,
      a_propos:document.getElementById('aow-a-propos').value.trim()||null,
      intentions:document.getElementById('aow-intentions').value.trim()||null,
      tient_a_coeur:document.getElementById('aow-coeur').checked,
      genre:document.getElementById('aow-genre').value.trim()||null,
      sous_genre:document.getElementById('aow-sous-genre').value.trim()||null,
      tonalite:document.getElementById('aow-tonalite').value.trim()||null,
      temporalite:document.getElementById('aow-temporalite').value.trim()||null,
      lieu_principal:document.getElementById('aow-lieu').value.trim()||null,
      public_cible:document.getElementById('aow-public').value||null,
      tropes:tropesRaw?tropesRaw.split(',').map(x=>x.trim()).filter(Boolean):null,
      enjeu_principal:document.getElementById('aow-enjeu').value.trim()||null,
      enjeux_secondaires:enjeuxRaw?enjeuxRaw.split('\n').map(x=>x.trim()).filter(Boolean):null,
      statut:document.getElementById('aow-statut').value,
      objectif_mots:document.getElementById('aow-objectif').value?Number(document.getElementById('aow-objectif').value):null,
      code_session:document.getElementById('aow-code-session').value.trim()||null,
      destination_editoriale:document.getElementById('aow-destination').value||null,
      niveau_editorial_cible:document.getElementById('aow-cible').value||null,
      statut_editorial_actuel:newEditorial,
      horizon_annee:document.getElementById('aow-horizon').value?Number(document.getElementById('aow-horizon').value):null,
      publication_envisagee:document.getElementById('aow-publication').value.trim()||null,
      notes_editoriales:document.getElementById('aow-notes-editoriales').value.trim()||null,
      couverture:document.getElementById('aow-couverture').value.trim()||null,
      page_color:document.getElementById('aow-page-color').value||null,
      banniere:document.getElementById('aow-banniere')?.value.trim()||null,
      module_lore:document.getElementById('aow-module-lore').checked,
      module_chronologie:document.getElementById('aow-module-chrono').checked,
      accent_color:document.getElementById('aow-accent').value,
      archive:document.getElementById('aow-archive').checked,
      updated_at:new Date().toISOString()
    };
    const {data:old}=await db().from('oeuvres').select('statut_editorial_actuel').eq('id',adminEditingOeuvreId).single();
    if((old?.statut_editorial_actuel||null)!==newEditorial) payload.date_dernier_changement_editorial=new Date().toISOString();
    if(sagaId){
      const {error:sagaCollectionError}=await db().from('sagas').update({univers_id:selectedCollectionId}).eq('id',sagaId);
      if(sagaCollectionError){ if(status) status.textContent='Erreur collection : '+sagaCollectionError.message; alert('Erreur collection : '+sagaCollectionError.message); return; }
    }
    await db().from('oeuvre_metadonnees').delete().eq('oeuvre_id',adminEditingOeuvreId);
    const metaIds=[...document.querySelectorAll('.aow-meta-check:checked')].map(x=>x.value);
    if(metaIds.length){ const mr=await db().from('oeuvre_metadonnees').insert(metaIds.map(metadata_id=>({oeuvre_id:adminEditingOeuvreId,metadata_id}))); if(mr.error){ if(status)status.textContent='Erreur métadonnées : '+mr.error.message; return alert(mr.error.message); } }
    const {error}=await db().from('oeuvres').update(payload).eq('id',adminEditingOeuvreId);
    if(error){ if(status) status.textContent='Erreur : '+error.message; alert('Erreur : '+error.message); return; }
    const resetCover=await db().from('medias').update({est_couverture_actuelle:false}).eq('oeuvre_id',adminEditingOeuvreId).eq('type','Couverture');
    if(!resetCover.error && selectedCoverMediaId) await db().from('medias').update({est_couverture_actuelle:true}).eq('id',selectedCoverMediaId);
    if(status) status.textContent='✓ Enregistré';
    setTimeout(()=>{ if(status) status.textContent=''; },2200);
    await openAdminOeuvreEditor(adminEditingOeuvreId);
  }

  async function downloadBackupV561(id){const {data,error}=await db().from('sauvegardes').select('*').eq('id',id).eq('user_id',currentUser.id).single();if(error)return alert(error.message);const blob=new Blob([JSON.stringify({passerelle_backup:1,id:data.id,created_at:data.created_at,type:data.type_sauvegarde,periode:data.periode,data:data.contenu},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Passerelle_Backup_${(data.created_at||new Date().toISOString()).slice(0,10)}_${data.type_sauvegarde}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;"><button class="btn-primary" onclick="openIdeeModal()">+ Capturer une idée</button><button class="btn-secondary" onclick="navigate('idees')">Voir la Pépinière</button></div>

  async function saveObjectifAnnuel(){
    const val = parseInt(document.getElementById('objectif-annuel-input').value);
    if (!val) return;
    const { error } = await db().from('objectifs_annuels').insert({ user_id: currentUser.id, annee: new Date().getFullYear(), objectif_mots: val });
    if (error) { alert('Erreur : ' + error.message); return; }
    renderAccueil();
  }


  // ============================================================
  // PLANNING CRÉATIF
  // ============================================================
  let planningView='week';
  let planningCursor=new Date();
  let planningSessions=[];
  let planningWorks=[];
  let planningChapters=[];
  let planningCsvRows=[];
  let planningCsvHeaders=[];

  function isoLocal(d){const x=new Date(d);const y=x.getFullYear(),m=String(x.getMonth()+1).padStart(2,'0'),day=String(x.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
  function formatDateFr(v){if(!v)return '';const d=new Date(v+'T12:00:00');return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});}
  function addDaysIso(v,n){const d=new Date(v+'T12:00:00');d.setDate(d.getDate()+n);return isoLocal(d);}
  function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(12,0,0,0);return x;}
  function endOfWeek(d){const x=mondayOf(d);x.setDate(x.getDate()+6);return x;}
  function startOfPlanningRange(){if(planningView==='month')return new Date(planningCursor.getFullYear(),planningCursor.getMonth(),1);if(planningView==='week')return mondayOf(planningCursor);const x=new Date();x.setMonth(x.getMonth()-2);return x;}
  function endOfPlanningRange(){if(planningView==='month')return new Date(planningCursor.getFullYear(),planningCursor.getMonth()+1,0);if(planningView==='week')return endOfWeek(planningCursor);const x=new Date();x.setMonth(x.getMonth()+8);return x;}
  function workById(id){return planningWorks.find(o=>o.id===id)||null;}
  function chapterById(id){return planningChapters.find(c=>c.id===id)||null;}
  function sessionLabel(s){const o=workById(s.oeuvre_id);const c=chapterById(s.chapitre_id);return s.titre||[o?.titre,c?`Chapitre ${c.numero}${c.titre?' · '+c.titre:''}`:''].filter(Boolean).join(' · ')||'Session';}
  function sessionSubLabel(s){const o=workById(s.oeuvre_id);const c=chapterById(s.chapitre_id);return [s.type_session==='relecture'?'Relecture':'Écriture',o?.titre,c?`Ch. ${c.numero}`:''].filter(Boolean).join(' · ');}
  function sessionColor(s){return s.couleur||(s.type_session==='relecture'?'#59A77A':'#7C5CBF');}

  function renderMiniPlanning(now,sessions,worksMap){
    const y=now.getFullYear(),m=now.getMonth();const first=new Date(y,m,1);const start=mondayOf(first);const cells=[];
    for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=isoLocal(d);const ds=sessions.filter(s=>s.date===iso);cells.push(`<div class="mini-cal-day ${d.getMonth()!==m?'muted':''} ${iso===isoLocal(now)?'today':''}"><div class="mini-cal-num">${d.getDate()}</div><div class="mini-cal-dots">${ds.slice(0,5).map(s=>{const o=worksMap.get(s.oeuvre_id);const title=[o?.titre,s.titre,s.type_session==='relecture'?'Relecture':'Écriture'].filter(Boolean).join(' · ');return `<span class="mini-cal-dot" style="background:${safeText(s.couleur|| (s.type_session==='relecture'?'#59A77A':'#7C5CBF'))}" title="${safeText(title)}"></span>`}).join('')}</div></div>`)}
    return `<div class="mini-cal-head"><strong>${now.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</strong><span style="font-size:10px;color:var(--text-dim)">${sessions.length} session${sessions.length>1?'s':''}</span></div><div class="mini-cal-week">${['L','M','M','J','V','S','D'].map(x=>`<span>${x}</span>`).join('')}</div><div class="mini-cal-grid">${cells.join('')}</div>`;
  }

  async function renderPlanning(){
    const content=document.getElementById('content');content.innerHTML='<div class="status-line">Chargement du planning…</div>';
    const planningBanner=await getPageBanner('planning');
    const start=isoLocal(startOfPlanningRange()),end=isoLocal(endOfPlanningRange());
    const [worksRes,sessionsRes,chapRes]=await Promise.all([
      db().from('oeuvres').select('id,titre,couverture,statut').eq('archive',false).order('titre',{ascending:true}),
      db().from('planning_sessions').select('*').gte('date',start).lte('date',end).order('date',{ascending:true}).order('ordre',{ascending:true}),
      db().from('chapitres').select('id,oeuvre_id,numero,titre,etat').order('numero',{ascending:true})
    ]);
    if(sessionsRes.error){content.innerHTML=`<div class="empty">Le Planning a besoin de sa migration SQL.<br><small>${safeText(sessionsRes.error.message)}</small></div>`;return;}
    planningWorks=worksRes.data||[];planningSessions=sessionsRes.data||[];planningChapters=chapRes.data||[];
    const title=planningView==='month'?planningCursor.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}):planningView==='week'?`${formatDateFr(isoLocal(mondayOf(planningCursor)))} → ${formatDateFr(isoLocal(endOfWeek(planningCursor)))}`:'Toutes les sessions';
    content.innerHTML=`${renderPageImageBanner(planningBanner,'Planning')}<div class="planning-head"><div><h1>📅 Planning</h1><p>Sessions d’écriture et de relecture. Tu planifies, puis tu fais tatrat-glisser quand la vraie vie décide de jouer au bowling.</p></div><div class="planning-actions"><button class="btn-secondary" onclick="openPlanningCsv()">⇩ Import CSV</button><button class="btn-secondary" onclick="exportPlanningCsv()">⇧ Export CSV</button><button class="btn-primary" onclick="openPlanningSessionModal()">+ Nouvelle session</button><button class="btn-secondary" onclick="openPlanningSeriesModal()">✨ Créer une série</button></div></div>
      <div class="planning-toolbar"><div class="planning-nav"><button class="tiny-btn" onclick="movePlanning(-1)">←</button><div class="planning-period">${safeText(title)}</div><button class="tiny-btn" onclick="movePlanning(1)">→</button><button class="tiny-btn" onclick="planningCursor=new Date();renderPlanning()">Aujourd’hui</button></div><div class="planning-views"><button class="tiny-btn ${planningView==='week'?'active':''}" onclick="setPlanningView('week')">Semaine</button><button class="tiny-btn ${planningView==='month'?'active':''}" onclick="setPlanningView('month')">Mois</button><button class="tiny-btn ${planningView==='list'?'active':''}" onclick="setPlanningView('list')">Liste</button></div></div>
      <div class="planning-legend"><span><i style="background:#7C5CBF"></i>Écriture</span><span><i style="background:#59A77A"></i>Relecture</span><span>La couleur peut être personnalisée par session.</span></div>
      <div id="planning-bulk" class="planning-bulk"><span id="planning-bulk-count">0 sélectionnée</span><button class="tiny-btn" onclick="bulkShiftPlanning(1)">+1 jour</button><button class="tiny-btn" onclick="bulkShiftPlanning(7)">+1 semaine</button><button class="tiny-btn" onclick="bulkSetPlanningDate()">Changer la date</button><button class="tiny-btn danger-btn" onclick="bulkDeletePlanning()">Supprimer</button></div>
      <div id="planning-body">${planningView==='month'?renderPlanningMonth():planningView==='week'?renderPlanningWeek():renderPlanningList()}</div>
      <input id="planning-csv-file" type="file" accept=".csv,text/csv" style="display:none" onchange="readPlanningCsvFile(event)">
      <div id="planning-modal-host"></div>`;
  }

  function setPlanningView(v){planningView=v;renderPlanning();}
  function movePlanning(dir){if(planningView==='month')planningCursor=new Date(planningCursor.getFullYear(),planningCursor.getMonth()+dir,1);else if(planningView==='week'){planningCursor=new Date(planningCursor);planningCursor.setDate(planningCursor.getDate()+dir*7)}renderPlanning();}

  function renderPlanningMonth(){const y=planningCursor.getFullYear(),m=planningCursor.getMonth();const start=mondayOf(new Date(y,m,1));let html=['<div class="planning-month">',...['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d=>`<div class="planning-month-head">${d}</div>`)];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=isoLocal(d);html.push(`<div class="planning-day ${d.getMonth()!==m?'other':''} ${iso===isoLocal(new Date())?'today':''}" data-date="${iso}" ondragover="planningDragOver(event)" ondragleave="planningDragLeave(event)" ondrop="planningDrop(event,'${iso}')"><div class="planning-day-num">${d.getDate()}</div>${planningSessions.filter(s=>s.date===iso).map(renderPlanningEvent).join('')}</div>`)}html.push('</div>');return html.join('');}
  function renderPlanningWeek(){const start=mondayOf(planningCursor);let html='<div class="planning-week">';for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=isoLocal(d);html+=`<div class="planning-week-col ${iso===isoLocal(new Date())?'today':''}" data-date="${iso}" ondragover="planningDragOver(event)" ondragleave="planningDragLeave(event)" ondrop="planningDrop(event,'${iso}')"><h3>${d.toLocaleDateString('fr-FR',{weekday:'long'})}</h3><small>${d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}</small>${planningSessions.filter(s=>s.date===iso).map(renderPlanningEvent).join('')}</div>`}return html+'</div>';}
  function renderPlanningEvent(s){return `<div class="planning-event" draggable="true" data-id="${s.id}" style="--event-color:${safeText(sessionColor(s))}" ondragstart="planningDragStart(event,'${s.id}')" ondblclick="openPlanningSessionModal('${s.id}')" title="Double-cliquer pour modifier"><strong>${safeText(sessionLabel(s))}</strong><small>${safeText(sessionSubLabel(s))}</small></div>`;}
  function renderPlanningList(){if(!planningSessions.length)return '<div class="empty">Aucune session dans cette période.</div>';return `<div class="planning-list-wrap"><table class="planning-list"><thead><tr><th><input type="checkbox" onchange="planningSelectAll(this.checked)"></th><th>Date</th><th>Type</th><th>Œuvre liée</th><th>Chapitre</th><th>Titre</th><th>Statut</th><th></th></tr></thead><tbody>${planningSessions.map(s=>{const o=workById(s.oeuvre_id),c=chapterById(s.chapitre_id);return `<tr><td><input class="planning-check" type="checkbox" value="${s.id}" onchange="refreshPlanningBulk()"></td><td>${formatDateFr(s.date)}</td><td><span style="display:inline-flex;align-items:center;gap:5px"><i style="width:8px;height:8px;border-radius:50%;background:${safeText(sessionColor(s))}"></i>${safeText(s.type_session)}</span></td><td>${safeText(o?.titre||'—')}</td><td>${c?`#${c.numero} ${safeText(c.titre||'')}`:'—'}</td><td>${safeText(s.titre||'')}</td><td>${safeText(s.statut||'planifiée')}</td><td><button class="tiny-btn" onclick="openPlanningSessionModal('${s.id}')">Modifier</button> <button class="tiny-btn" onclick="duplicatePlanningSession('${s.id}')">Dupliquer</button></td></tr>`}).join('')}</tbody></table></div>`;}

  function planningDragStart(e,id){e.dataTransfer.setData('text/planning-id',id);e.dataTransfer.effectAllowed='move';}
  function planningDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
  function planningDragLeave(e){e.currentTarget.classList.remove('drag-over');}
  async function planningDrop(e,date){e.preventDefault();e.currentTarget.classList.remove('drag-over');const id=e.dataTransfer.getData('text/planning-id');if(!id)return;const {error}=await db().from('planning_sessions').update({date,updated_at:new Date().toISOString()}).eq('id',id);if(error){alert('Erreur : '+error.message);return;}renderPlanning();}

  function planningWorkOptions(selected=''){return `<option value="">Choisir une œuvre…</option>${planningWorks.map(o=>`<option value="${o.id}" ${o.id===selected?'selected':''}>${safeText(o.titre)}</option>`).join('')}`;}
  function planningChapterOptions(workId,selected=''){const arr=planningChapters.filter(c=>c.oeuvre_id===workId);return `<option value="">Aucun chapitre précis</option>${arr.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>#${c.numero} ${safeText(c.titre||'Sans titre')}</option>`).join('')}`;}
  function refreshPlanningChapterSelect(selected=''){const workId=document.getElementById('ps-work')?.value;const el=document.getElementById('ps-chapter');if(el)el.innerHTML=planningChapterOptions(workId,selected);const preview=document.getElementById('ps-link-preview');const o=workById(workId);if(preview)preview.innerHTML=o?`🔗 Cette session sera liée à <strong>${safeText(o.titre)}</strong>. Le chapitre reste facultatif.`:'Choisis une œuvre : la session sera liée à sa vraie fiche Passerelle.';}

  function showPlanningModal(inner){document.getElementById('planning-modal-host').innerHTML=`<div class="modal-overlay open" id="planning-live-modal" onclick="if(event.target===this)closePlanningModal()"><div class="modal-box">${inner}</div></div>`;}
  function closePlanningModal(){const h=document.getElementById('planning-modal-host');if(h)h.innerHTML='';}
  function openPlanningSessionModal(id=''){
    const s=id?planningSessions.find(x=>x.id===id):null;const date=s?.date||isoLocal(planningCursor);const color=s?.couleur|| (s?.type_session==='relecture'?'#59A77A':'#7C5CBF');
    showPlanningModal(`<div class="modal-head"><h2>${s?'Modifier':'Nouvelle'} session</h2><button onclick="closePlanningModal()">✕</button></div><div class="modal-body"><div class="planning-modal-grid"><div><label>Type</label><select id="ps-type" onchange="document.getElementById('ps-color').value=this.value==='relecture'?'#59A77A':'#7C5CBF'"><option value="ecriture" ${s?.type_session!=='relecture'?'selected':''}>Écriture</option><option value="relecture" ${s?.type_session==='relecture'?'selected':''}>Relecture</option></select></div><div><label>Date</label><input type="date" id="ps-date" value="${date}"></div><div class="full"><label>Œuvre liée</label><select id="ps-work" onchange="refreshPlanningChapterSelect()">${planningWorkOptions(s?.oeuvre_id||'')}</select></div><div class="full"><label>Chapitre lié (facultatif)</label><select id="ps-chapter">${planningChapterOptions(s?.oeuvre_id||'',s?.chapitre_id||'')}</select></div><div class="full planning-link-preview" id="ps-link-preview"></div><div class="full"><label>Titre affiché (facultatif)</label><input id="ps-title" value="${safeText(s?.titre||'')}" placeholder="Ex. EC (14) — si vide, Passerelle utilise l’œuvre + le chapitre"></div><div><label>Couleur</label><input type="color" id="ps-color" value="${safeText(color)}" style="height:42px;padding:4px"></div><div><label>Statut</label><select id="ps-status"><option value="planifiée" ${s?.statut!=='réalisée'&&s?.statut!=='annulée'?'selected':''}>Planifiée</option><option value="réalisée" ${s?.statut==='réalisée'?'selected':''}>Réalisée</option><option value="annulée" ${s?.statut==='annulée'?'selected':''}>Annulée</option></select></div><div class="full"><label>Note</label><textarea id="ps-note">${safeText(s?.note||'')}</textarea></div></div></div><div class="modal-foot">${s?`<button class="btn-secondary danger-btn" onclick="deletePlanningSession('${s.id}')">Supprimer</button>`:''}<button class="btn-secondary" onclick="closePlanningModal()">Annuler</button><button class="btn-primary" onclick="savePlanningSession('${s?.id||''}')">Enregistrer</button></div>`);refreshPlanningChapterSelect(s?.chapitre_id||'');
  }
  async function savePlanningSession(id=''){const payload={oeuvre_id:document.getElementById('ps-work').value||null,chapitre_id:document.getElementById('ps-chapter').value||null,type_session:document.getElementById('ps-type').value,titre:document.getElementById('ps-title').value.trim()||null,date:document.getElementById('ps-date').value,couleur:document.getElementById('ps-color').value,statut:document.getElementById('ps-status').value,note:document.getElementById('ps-note').value.trim()||null,updated_at:new Date().toISOString()};if(!payload.oeuvre_id||!payload.date){alert('Choisis au moins une œuvre et une date.');return;}let q=id?db().from('planning_sessions').update(payload).eq('id',id):db().from('planning_sessions').insert({...payload,user_id:currentUser.id});const {error}=await q;if(error){alert('Erreur : '+error.message);return;}closePlanningModal();renderPlanning();}
  async function deletePlanningSession(id){if(!confirm('Supprimer cette session ?'))return;const {error}=await db().from('planning_sessions').delete().eq('id',id);if(error){alert('Erreur : '+error.message);return;}closePlanningModal();renderPlanning();}
  async function duplicatePlanningSession(id){const s=planningSessions.find(x=>x.id===id);if(!s)return;const title=s.titre?incrementPlanningTitle(s.titre):null;const payload={user_id:currentUser.id,oeuvre_id:s.oeuvre_id,chapitre_id:null,type_session:s.type_session,titre,date:addDaysIso(s.date,1),couleur:s.couleur,statut:'planifiée',note:s.note,ordre:s.ordre||0};const {error}=await db().from('planning_sessions').insert(payload);if(error){alert('Erreur : '+error.message);return;}renderPlanning();}
  function incrementPlanningTitle(t){return String(t||'').replace(/(\d+)(?!.*\d)/,m=>String(Number(m)+1));}

  function openPlanningSeriesModal(){showPlanningModal(`<div class="modal-head"><h2>✨ Créer une série</h2><button onclick="closePlanningModal()">✕</button></div><div class="modal-body"><div class="planning-modal-grid"><div><label>Type</label><select id="pser-type"><option value="ecriture">Écriture</option><option value="relecture">Relecture</option></select></div><div><label>Première date</label><input type="date" id="pser-date" value="${isoLocal(planningCursor)}"></div><div class="full"><label>Œuvre liée</label><select id="pser-work">${planningWorkOptions('')}</select></div><div><label>Premier numéro</label><input type="number" id="pser-start" value="1" min="0"></div><div><label>Nombre de sessions</label><input type="number" id="pser-count" value="10" min="1" max="200"></div><div class="full"><label>Modèle du titre</label><input id="pser-template" value="Chapitre ({n})" placeholder="EC ({n})"><small style="color:var(--text-dim)">Utilise {n}. Passerelle incrémente automatiquement : EC (1), EC (2), EC (3)…</small></div><div class="full"><label>Jours autorisés</label><div class="planning-days">${[['L',1],['M',2],['M',3],['J',4],['V',5],['S',6],['D',0]].map(([l,v])=>`<label class="planning-day-check"><input type="checkbox" class="pser-day" value="${v}" ${v>=1&&v<=5?'checked':''}>${l}</label>`).join('')}</div></div><div><label>Couleur</label><input type="color" id="pser-color" value="#7C5CBF" style="height:42px;padding:4px"></div></div></div><div class="modal-foot"><button class="btn-secondary" onclick="closePlanningModal()">Annuler</button><button class="btn-primary" onclick="createPlanningSeries()">Créer la série</button></div>`);}
  async function createPlanningSeries(){const work=document.getElementById('pser-work').value,type=document.getElementById('pser-type').value,start=Number(document.getElementById('pser-start').value||1),count=Number(document.getElementById('pser-count').value||1),template=document.getElementById('pser-template').value||'Chapitre ({n})',color=document.getElementById('pser-color').value,days=[...document.querySelectorAll('.pser-day:checked')].map(x=>Number(x.value));if(!work||!days.length){alert('Choisis une œuvre et au moins un jour.');return;}let d=new Date(document.getElementById('pser-date').value+'T12:00:00');const rows=[];for(let i=0;i<count;i++){while(!days.includes(d.getDay()))d.setDate(d.getDate()+1);const n=start+i;const chapter=planningChapters.find(c=>c.oeuvre_id===work&&Number(c.numero)===n);rows.push({user_id:currentUser.id,oeuvre_id:work,chapitre_id:chapter?.id||null,type_session:type,titre:template.replaceAll('{n}',String(n)),date:isoLocal(d),couleur:color,statut:'planifiée',ordre:i});d.setDate(d.getDate()+1);}const {error}=await db().from('planning_sessions').insert(rows);if(error){alert('Erreur : '+error.message);return;}closePlanningModal();renderPlanning();}

  function parseCsvLine(line,sep){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===sep&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out;}
  function readPlanningCsvFile(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{const text=String(r.result||'').replace(/^\uFEFF/,'');const lines=text.split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return;const sep=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';planningCsvHeaders=parseCsvLine(lines[0],sep);planningCsvRows=lines.slice(1).map(l=>parseCsvLine(l,sep));showPlanningCsvMapping();};r.readAsText(f,'utf-8');e.target.value='';}

  const DESTINATIONS = ['Découverte','Exclusivité abonnement','Passerelle','Librairie'];
  const NIVEAUX = ['V1','V1.5','V2'];
  const STATUTS_EDITORIAUX = ['V1 à écrire','V1 en cours','V1 terminée','V1.5 à faire','V1.5 en cours','V1.5 terminée','V2 à écrire','V2 en cours','V2 terminée'];
  const BE_TABS = [
    { key:'catalogue', label:'Catalogue' },
    { key:'destinations', label:'Destinations' },
    { key:'niveau', label:'Cibles éditoriales' },
  ];
  let beData = [];
  let beSagas = [];
  let beUnivers = [];
  let beSousSagas = [];

  function horizonLabel(year){
    const y = new Date().getFullYear();
    if (!year) return 'N/A';
    if (Number(year) === y) return `Horizon Y · ${y}`;
    if (Number(year) === y + 1) return `Horizon Y+1 · ${y+1}`;
    return String(year);
  }

  function editorialObjective(o){
    const target = o.niveau_editorial_cible;
    const status = o.statut_editorial_actuel;
    if (!target || !status) return 'À définir';
    const stage = { 'V1 à écrire':0, 'V1 en cours':1, 'V1 terminée':2, 'V1.5 à faire':3, 'V1.5 en cours':4, 'V1.5 terminée':5, 'V2 à écrire':6, 'V2 en cours':7, 'V2 terminée':8 };
    const targetDone = { 'V1':2, 'V1.5':5, 'V2':8 }[target];
    const current = stage[status];
    if (current == null || targetDone == null) return 'À définir';
    if (current === targetDone) return '✅ Objectif atteint';
    if (current > targetDone) return '✨ Cible dépassée';
    if (target === 'V1.5' && current < 5) return current >= 3 ? '🟣 En progression' : '🌿 Prochaine cible : V1.5';
    if (target === 'V2' && current < 8) return current >= 6 ? '🟣 En progression' : '💎 Prochaine cible : V2';
    return '🟣 En progression';
  }

  function destinationKey(value){
    return value || 'Non définie';
  }

  function buildDestinationDonut(data){
    const labels = [...DESTINATIONS, 'Non définie'];
    const counts = Object.fromEntries(labels.map(x => [x,0]));
    data.forEach(o => counts[destinationKey(o.destination_editoriale)] = (counts[destinationKey(o.destination_editoriale)]||0)+1);
    const total = Math.max(1, data.length);
    const palette = ['#78b55b','#aa79d6','#d4a52b','#b95a67','#73798b'];
    let cursor = 0;
    const stops = labels.map((label,i)=>{
      const start = cursor;
      cursor += counts[label] / total * 100;
      return `${palette[i]} ${start.toFixed(2)}% ${cursor.toFixed(2)}%`;
    }).join(',');
    return `<div class="be-destination-card">
      <div class="be-donut" style="background:conic-gradient(${stops});"><div class="be-donut-hole"><strong>${data.length}</strong><span>œuvres</span></div></div>
      <div class="be-legend">${labels.map((label,i)=>`<div><span class="be-dot" style="background:${palette[i]}"></span><span>${label}</span><strong>${counts[label]}</strong></div>`).join('')}</div>
    </div>`;
  }

  function showBeTab(key){
    document.querySelectorAll('[id^="betab-"]').forEach(b=>b.classList.remove('active'));
    document.getElementById('betab-'+key)?.classList.add('active');
    const zone = document.getElementById('be-tab-content');
    if (key === 'catalogue') renderBeCatalogue(zone);
    if (key === 'destinations') renderBeGroupe(zone,'destination_editoriale',DESTINATIONS,true);
    if (key === 'niveau') renderBeGroupe(zone,'niveau_editorial_cible',NIVEAUX,false);

  function sagaName(id){ return beSagas.find(s=>s.id===id)?.nom || '—'; }
  function sousSagaName(id){ return beSousSagas.find(s=>s.id===id)?.nom || ''; }
  function collectionName(o){
    const saga = beSagas.find(s=>s.id===o.saga_id);
    if (!saga) return '—';
    const uid = saga.univers_id || saga.collection_id || null;
    return beUnivers.find(u=>u.id===uid)?.nom || '—';
  }

  function renderBeCatalogue(zone){
    const y = new Date().getFullYear();
    const sagaOptions = beSagas.map(s=>`<option value="${s.id}">${safeText(s.nom)}</option>`).join('');
    zone.innerHTML = `
      <div class="be-filters">
        <input id="be-search" placeholder="Rechercher une œuvre…" oninput="applyBeFilters()">
        <select id="be-filter-saga" onchange="applyBeFilters()"><option value="">Toutes les sagas</option>${sagaOptions}</select>
        <select id="be-filter-dest" onchange="applyBeFilters()"><option value="">Toutes les destinations</option>${DESTINATIONS.map(v=>`<option>${v}</option>`).join('')}<option value="__none">Non définie</option></select>
        <select id="be-filter-cible" onchange="applyBeFilters()"><option value="">Toutes les cibles</option>${NIVEAUX.map(v=>`<option>${v}</option>`).join('')}<option value="__none">Non définie</option></select>
        <select id="be-filter-statut" onchange="applyBeFilters()"><option value="">Tous les statuts éditoriaux</option>${STATUTS_EDITORIAUX.map(v=>`<option>${v}</option>`).join('')}</select>
        <select id="be-filter-horizon" onchange="applyBeFilters()"><option value="">Tous les horizons</option><option value="${y}">Horizon Y · ${y}</option><option value="${y+1}">Horizon Y+1 · ${y+1}</option><option value="__none">N/A</option></select>
      </div>
      <div class="be-table-wrap"><table class="be-table"><thead><tr>
        <th>Œuvre</th><th>Collection</th><th>Saga / Sous-saga</th><th>Manuscrit</th><th>Destination</th><th>Cible</th><th>Éditorial actuel</th><th>Objectif</th><th>Horizon</th><th>Publication envisagée</th>
      </tr></thead><tbody id="be-catalogue-body"></tbody></table></div>
      <div class="be-count" id="be-count"></div>`;

  function drawBeRows(rows){
    const tbody = document.getElementById('be-catalogue-body');
    if (!tbody) return;
    const y = new Date().getFullYear();
    tbody.innerHTML = rows.map(o=>{
      const ss = sousSagaName(o.sous_saga_id);

        <td>${safeText(sagaName(o.saga_id))}${ss?`<small>${safeText(ss)}</small>`:''}</td>

        <td><select class="be-inline" onchange="saveBeField('${o.id}','niveau_editorial_cible',this.value)"><option value="">Non définie</option>${NIVEAUX.map(v=>`<option ${o.niveau_editorial_cible===v?'selected':''}>${v}</option>`).join('')}</select></td>
        <td><select class="be-inline" onchange="saveBeField('${o.id}','statut_editorial_actuel',this.value)"><option value="">Non défini</option>${STATUTS_EDITORIAUX.map(v=>`<option ${o.statut_editorial_actuel===v?'selected':''}>${v}</option>`).join('')}</select></td>

        <td><input class="be-inline be-publication" value="${safeText(o.publication_envisagee||'')}" placeholder="ex. 2029, T2 2030…" onchange="saveBeField('${o.id}','publication_envisagee',this.value)"></td>

    const c = document.getElementById('be-count'); if(c) c.textContent = `${rows.length} œuvre${rows.length>1?'s':''} affichée${rows.length>1?'s':''} · aucun découpage en pages`;

  function applyBeFilters(){
    const q=(document.getElementById('be-search')?.value||'').trim().toLowerCase();
    const saga=document.getElementById('be-filter-saga')?.value||'';
    const dest=document.getElementById('be-filter-dest')?.value||'';
    const cible=document.getElementById('be-filter-cible')?.value||'';
    const statut=document.getElementById('be-filter-statut')?.value||'';
    const horizon=document.getElementById('be-filter-horizon')?.value||'';
    const rows=beData.filter(o=>{
      if(q && !`${o.titre||''} ${sagaName(o.saga_id)} ${sousSagaName(o.sous_saga_id)} ${collectionName(o)}`.toLowerCase().includes(q)) return false;
      if(saga && o.saga_id!==saga) return false;
      if(dest && (dest==='__none' ? !!o.destination_editoriale : o.destination_editoriale!==dest)) return false;
      if(cible && (cible==='__none' ? !!o.niveau_editorial_cible : o.niveau_editorial_cible!==cible)) return false;
      if(statut && o.statut_editorial_actuel!==statut) return false;
      if(horizon && (horizon==='__none' ? !!o.horizon_annee : Number(o.horizon_annee)!==Number(horizon))) return false;
      return true;
    });
    drawBeRows(rows);
  }

  async function saveBeField(id,field,value){
    const payload = {}; payload[field] = value || null;
    const old = beData.find(o=>o.id===id);
    if (field === 'statut_editorial_actuel' && old?.statut_editorial_actuel !== (value||null)) payload.date_dernier_changement_editorial = new Date().toISOString();
    const { error } = await db().from('oeuvres').update(payload).eq('id',id);
    if(error){ alert('Erreur : '+error.message); return; }
    if(old) Object.assign(old,payload);
    if(field==='destination_editoriale') renderBureauEditorial();
    else if(field==='niveau_editorial_cible' || field==='statut_editorial_actuel') drawBeRows(beData);
  }

  async function saveBeHorizon(id,value){
    const year = value ? Number(value) : null;
    const { error } = await db().from('oeuvres').update({horizon_annee:year}).eq('id',id);
    if(error){ alert('Erreur : '+error.message); return; }
    const old=beData.find(o=>o.id===id); if(old) old.horizon_annee=year;
  }

  function renderBeGroupe(zone,champ,valeurs,isDestination){
    const groups={}; valeurs.forEach(v=>groups[v]=[]); const none=[];

    const cols=[...valeurs,'Non définie'];
