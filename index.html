      const arr=v==='Non définie'?none:groups[v];
      return `<section class="be-kanban-col"><h3>${safeText(v)} <span>${arr.length}</span></h3>${arr.map(o=>`<article class="be-kanban-card" onclick="openOeuvreDetail('${o.id}')">${o.couverture?`<img src="${safeText(o.couverture)}" alt="">`:''}<div><strong>${safeText(o.titre)}</strong><small>${safeText(horizonLabel(o.horizon_annee))}</small></div></article>`).join('')||'<div class="be-kanban-empty">Aucune œuvre</div>'}</section>`;
    }).join('')}</div>`;
  }
  async function renderRelecture(){
    const content = document.getElementById('content');
    const relectureBanner = await getPageBanner('relecture');
    content.innerHTML = `<div class="status-line">Chargement…</div>`;

    const now = new Date();
    const yearY = now.getFullYear();
    const yearY1 = yearY + 1;

    // La page Relecture est une vue du Bureau éditorial :
    // l'œuvre reste la donnée canonique, Horizon + statut éditorial décident de la colonne.
    const worksResult = await db().from('oeuvres')
      .select('id,titre,couverture,horizon_annee,statut_editorial_actuel,niveau_editorial_cible,archive,sagas(nom),sous_sagas(nom)')
      .eq('archive', false)
      .order('titre', { ascending:true });

    if (worksResult.error) {
      const missingCover = String(worksResult.error.message||'').includes('couverture');
      content.innerHTML = `<div class="empty">Erreur : ${safeText(worksResult.error.message)}${missingCover ? '<br><br><strong>La petite migration Relecture V1 doit être exécutée dans Supabase pour ajouter la couverture canonique aux œuvres.</strong>' : ''}</div>`;
      return;
    }

    // La vue existante fournit la progression lorsqu'une relecture a déjà été créée.
    // Si elle n'est pas encore disponible, la page continue à fonctionner avec une progression à 0.
    let progressByWork = {};
    const progressResult = await db().from('relecture_file_travail').select('oeuvre_id,total_chapitres,chapitres_relus');
    if (!progressResult.error) {
      (progressResult.data||[]).forEach(r => { progressByWork[r.oeuvre_id] = r; });
    }

    const works = worksResult.data || [];
    const isInProgress = o => ['V1.5 en cours','V2 en cours'].includes(o.statut_editorial_actuel);
    const isPlanned = o => ['V1.5 à faire','V2 à écrire'].includes(o.statut_editorial_actuel);

    const enCours = works.filter(isInProgress);
    const horizonY = works.filter(o => !isInProgress(o) && isPlanned(o) && Number(o.horizon_annee) === yearY);
    const horizonY1 = works.filter(o => !isInProgress(o) && isPlanned(o) && Number(o.horizon_annee) === yearY1);

    function versionLabel(o){
      const statut = o.statut_editorial_actuel || '';
      if (statut.startsWith('V1.5')) return 'V1.5';
      if (statut.startsWith('V2')) return 'V2';
      return o.niveau_editorial_cible || 'Relecture';
    }

    function contextLabel(o){
      const bits = [];
      if (o.sagas?.nom) bits.push(o.sagas.nom);
      if (o.sous_sagas?.nom) bits.push(o.sous_sagas.nom);
      return bits.length ? bits.join(' · ') : 'Œuvre indépendante';
    }

    function card(o, current=false){
      const p = progressByWork[o.id] || {};
      const total = Number(p.total_chapitres||0);
      const done = Number(p.chapitres_relus||0);
      const pct = total ? Math.min(100, Math.round(done/total*100)) : 0;
      const cover = o.couverture
        ? `<img class="relecture-cover" src="${safeText(o.couverture)}" alt="Couverture de ${safeText(o.titre)}">`
        : `<div class="relecture-cover relecture-cover-fallback">${safeText(initials(o.titre))}</div>`;
      return `<article class="relecture-card" onclick="openOeuvreDetail('${o.id}')">
        ${cover}
        <div class="relecture-card-body">
          <div class="relecture-card-title">${safeText(o.titre)}</div>
          <div class="relecture-card-context">${safeText(contextLabel(o))}</div>
          <span class="relecture-version">${safeText(versionLabel(o))}</span>
          ${current ? `<div class="relecture-progress-row"><span>${done} / ${total || '—'} chapitres</span><span>${total ? pct+' %' : 'À démarrer'}</span></div><div class="progress-bar-outer"><div class="progress-bar-inner" style="width:${pct}%;"></div></div>` : `<div style="font-size:10px;color:var(--text-dim);margin-top:auto;margin-bottom:8px;">${safeText(o.statut_editorial_actuel||'À préparer')}</div>`}
          <button class="btn-secondary relecture-action" type="button">${current ? 'Continuer la relecture' : 'Ouvrir l’œuvre'}</button>
        </div>
      </article>`;
    }

    function column(title, subtitle, items, current=false){
      return `<section class="relecture-column">
        <div class="relecture-column-title"><h2>${title}</h2><span>${subtitle}</span></div>
        ${items.length ? items.map(o=>card(o,current)).join('') : `<div class="relecture-empty">Aucune œuvre dans cette colonne pour le moment.</div>`}
      </section>`;
    }

    content.innerHTML = `<div class="relecture-page">
      <div class="relecture-banner-slot">
        <div><strong>Emplacement de ta bannière Relecture</strong><span>La bannière graphique complète remplacera ce cadre, sans titre ni texte ajouté par Passerelle.</span></div>
      </div>
      <div class="relecture-columns">
        ${column('🔥 En cours', `${enCours.length} œuvre${enCours.length>1?'s':''}`, enCours, true)}
        ${column(`📅 Horizon ${yearY}`, `${horizonY.length} prévue${horizonY.length>1?'s':''}`, horizonY)}
        ${column(`🔭 Horizon ${yearY1}`, `${horizonY1.length} prévue${horizonY1.length>1?'s':''}`, horizonY1)}
      </div>
      <div class="walter-corner" aria-hidden="true" title="Walter supervise">🐈‍⬛</div>
    </div>`;
  }

  function galleryContrastVars(hex){
    const raw=(hex||'#EDE7F6').replace('#',''); const h=raw.length===3?raw.split('').map(x=>x+x).join(''):raw.padEnd(6,'f').slice(0,6);
    const r=parseInt(h.slice(0,2),16)||0,g=parseInt(h.slice(2,4),16)||0,b=parseInt(h.slice(4,6),16)||0;
    const lum=(0.2126*r+0.7152*g+0.0722*b)/255; const dark=lum<0.56;
    if(dark)return `--gallery-text:#fffafc;--gallery-muted:rgba(255,250,252,.82);--gallery-chip-bg:rgba(8,6,16,.34);--gallery-chip-border:rgba(255,255,255,.28);--gallery-shadow:0 2px 14px rgba(0,0,0,.48);--gallery-gradient:linear-gradient(to bottom,rgba(${r},${g},${b},.08) 0%,rgba(${r},${g},${b},.40) 38%,rgba(${r},${g},${b},.92) 72%,rgb(${r},${g},${b}) 100%);`;
    return `--gallery-text:#241d31;--gallery-muted:rgba(36,29,49,.78);--gallery-chip-bg:rgba(255,255,255,.46);--gallery-chip-border:rgba(36,29,49,.14);--gallery-shadow:0 1px 12px rgba(255,255,255,.34);--gallery-gradient:linear-gradient(to bottom,rgba(${r},${g},${b},.08) 0%,rgba(${r},${g},${b},.42) 36%,rgba(${r},${g},${b},.94) 70%,rgb(${r},${g},${b}) 100%);`;
  }

'')}</div>`:'<div class="empty">Les médias liés à la saga et à ses enfants nourriront ce moodboard.</div>'}</section></div>`;

  function codexTablePaste(e,blockId){
    const html=e.clipboardData?.getData('text/html')||'';
    if(html && /<table[\s>]/i.test(html)) return; // le navigateur conserve le vrai tableau
    const plain=e.clipboardData?.getData('text/plain')||'';
    if(!plain.includes('\t') && !plain.includes('\n')) return;
    const rows=plain.trim().split(/\r?\n/).map(r=>r.split('\t'));
    if(rows.length<2 && rows[0]?.length<2) return;
    e.preventDefault();
    const table=`<table><tbody>${rows.map((r,i)=>`<tr>${r.map(c=>`${i===0?'<th>':'<td>'}${safeText(c)}${i===0?'</th>':'</td>'}`).join('')}</tr>`).join('')}</tbody></table>`;
    document.execCommand('insertHTML',false,table);

  let codexDraggedId=null;
  function codexDragStart(e){codexDraggedId=e.currentTarget.dataset.blockId;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move'}
  function codexDragEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.codex-block').forEach(x=>x.classList.remove('drag-over'))}
  function codexDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');e.dataTransfer.dropEffect='move'}
  function codexDragLeave(e){e.currentTarget.classList.remove('drag-over')}
  async function codexDrop(e){
    e.preventDefault(); const target=e.currentTarget.dataset.blockId; e.currentTarget.classList.remove('drag-over');
    if(!codexDraggedId||codexDraggedId===target)return;
    const cards=[...document.querySelectorAll('.codex-block')];
    const ids=cards.map(x=>x.dataset.blockId).filter(id=>id!==codexDraggedId);
    const idx=ids.indexOf(target); ids.splice(idx,0,codexDraggedId);
    await Promise.all(ids.map((id,i)=>db().from('codex_blocks').update({ordre:i+1,updated_at:new Date().toISOString()}).eq('id',id)));
    if(window._openCodexRefresh) window._openCodexRefresh();
  }

      let directIds=[], childSsIds=[], workIds=[];
      if(level==='saga'){
        const [ssR,wR]=await Promise.all([
          db().from('sous_sagas').select('id').eq('saga_id',id),
          db().from('oeuvres').select('id').eq('saga_id',id)
        ]);
        if(ssR.error||wR.error) throw (ssR.error||wR.error);
        childSsIds=(ssR.data||[]).map(x=>x.id);
        workIds=(wR.data||[]).map(x=>x.id);
        if(childSsIds.length){
          const cw=await db().from('oeuvres').select('id').in('sous_saga_id',childSsIds);
          if(cw.error) throw cw.error;
          workIds=[...new Set([...workIds,...(cw.data||[]).map(x=>x.id)])];
        }
      }else{
        const wR=await db().from('oeuvres').select('id').eq('sous_saga_id',id);
        if(wR.error) throw wR.error;
        workIds=(wR.data||[]).map(x=>x.id);
      }

      const mr=await db().from('medias').select('*').order('created_at',{ascending:false});
      if(mr.error) throw mr.error;
      const all=(mr.data||[]).filter(m=>{
        if(level==='saga') return m.saga_id===id || childSsIds.includes(m.sous_saga_id) || workIds.includes(m.oeuvre_id);
        return m.sous_saga_id===id || workIds.includes(m.oeuvre_id);
      });

      const filters=['Tout','Illustration','Promotion & Bonus','Couverture'];
      const filterKey=`${level}-${id}`;
      window._hierarchyMediaFilters=window._hierarchyMediaFilters||{};
      const active=window._hierarchyMediaFilters[filterKey]||'Tout';
      const rows=active==='Tout'?all:all.filter(m=>m.type===active);

      zone.innerHTML=`<div class="work-toolbar">
        <div class="segmented">${filters.map(x=>`<button class="btn-secondary ${active===x?'active':''}" onclick="window._hierarchyMediaFilters['${filterKey}']='${x}';${level==='saga'?"renderSagaMediasV565(document.getElementById('saga-tab-content'))":"renderSousSagaMediasV565(document.getElementById('soussaga-tab-content'))"}">${x}</button>`).join('')}</div>
        <button class="btn-primary" onclick="openMediaUploadDrawerV566('${level}','${id}')">+ Ajouter des médias 🌸</button>
      </div>
      ${rows.length?`<div class="media-grid">${rows.map(m=>`<article class="media-card" onclick="openMediaReadDrawerV565('${m.id}')">
        ${mediaImage(m)?`<img src="${safeText(mediaImage(m))}" alt="">`:'<div class="walter-empty">🖼</div>'}
        <div class="media-meta"><strong>${safeText(m.titre||'Sans titre')}</strong><small>${safeText(m.type||'Média')}</small></div>
      </article>`).join('')}</div>`:`<div class="walter-empty"><div class="walter-placeholder">🐈‍⬛</div><strong>Aucun média ici pour le moment.</strong><div>Les médias liés à ce niveau ou à ses enfants remonteront automatiquement.</div></div>`}`;
    }catch(err){
      zone.innerHTML=`<div class="empty"><strong>Impossible de charger les médias.</strong><br><span style="font-size:11px">${safeText(err?.message||String(err))}</span></div>`;
    }
  }
  function renderSagaMediasV565(zone){return renderHierarchyMediasV565(zone,{level:'saga',id:currentSagaId})}
  function renderSousSagaMediasV565(zone){return renderHierarchyMediasV565(zone,{level:'sous-saga',id:currentSousSagaId})}
  let mediaUploadBatchV566=[];
  let mediaUploadContextV566=null;

  function openMediaUploadDrawerV566(level,id){
    mediaUploadContextV566={level,id};
    mediaUploadBatchV566=[];
    openDrawer('Ajouter des médias',`
      <div class="media-upload-drawer-v566">
        <div id="media-drop-v566" class="media-drop-v566" onclick="document.getElementById('media-files-v566').click()" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="handleMediaDropV566(event)">
          <div style="font-size:34px">🌸</div>
          <strong>Glisse tes images ici</strong>
          <span>ou clique pour parcourir · 20 images maximum</span>
          <input id="media-files-v566" type="file" accept="image/*" multiple hidden onchange="prepareMediaFilesV566(this.files)">
        </div>
        <div id="media-batch-tools-v566"></div>
        <div id="media-batch-list-v566"></div>
      </div>`);
  }

  function handleMediaDropV566(e){
    e.preventDefault();e.currentTarget.classList.remove('drag');
    prepareMediaFilesV566(e.dataTransfer.files);
  }

  function cleanMediaFilenameV566(name){
    return (name||'').replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();
  }

  function prepareMediaFilesV566(fileList){
    const files=[...fileList].filter(f=>f.type.startsWith('image/')).slice(0,20);
    if(!files.length)return;
    if(fileList.length>20) alert('20 images maximum par envoi. Les 20 premières ont été retenues.');
    mediaUploadBatchV566=files.map((file,i)=>({
      key:`m${Date.now()}-${i}`,file,
      preview:URL.createObjectURL(file),
      titre:cleanMediaFilenameV566(file.name),
      type:'Illustration',
      current:false
    }));
    renderMediaBatchV566();
  }

  function renderMediaBatchV566(){
    const tools=document.getElementById('media-batch-tools-v566');
    const list=document.getElementById('media-batch-list-v566');
    if(!tools||!list)return;
    if(!mediaUploadBatchV566.length){tools.innerHTML='';list.innerHTML='';return}
    tools.innerHTML=`<div class="media-batch-tools-v566">
      <strong>${mediaUploadBatchV566.length} image${mediaUploadBatchV566.length>1?'s':''}</strong>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <select id="media-bulk-cat-v566"><option>Illustration</option><option>Promotion & Bonus</option><option>Couverture</option></select>
        <button class="btn-secondary" onclick="applyMediaBulkCategoryV566()">Appliquer à toutes</button>
      </div>
    </div>`;
    list.innerHTML=mediaUploadBatchV566.map((m,i)=>`<div class="media-batch-item-v566">
      <img src="${m.preview}" alt="">
      <div class="media-batch-fields-v566">
        <input value="${safeText(m.titre)}" oninput="mediaUploadBatchV566[${i}].titre=this.value">
        <select onchange="mediaUploadBatchV566[${i}].type=this.value;renderMediaBatchV566()">
          <option ${m.type==='Illustration'?'selected':''}>Illustration</option>
          <option ${m.type==='Promotion & Bonus'?'selected':''}>Promotion & Bonus</option>
          <option ${m.type==='Couverture'?'selected':''}>Couverture</option>
        </select>
        ${m.type==='Couverture'?`<label class="media-current-v566"><input type="checkbox" ${m.current?'checked':''} onchange="mediaUploadBatchV566[${i}].current=this.checked"> ★ Couverture actuelle</label>`:''}
      </div>
      <button class="btn-secondary" onclick="removeMediaBatchV566(${i})">✕</button>
    </div>`).join('')+`<div class="media-upload-footer-v566"><button class="btn-primary" id="media-upload-go-v566" onclick="commitMediaBatchV566()">Importer les ${mediaUploadBatchV566.length} média${mediaUploadBatchV566.length>1?'s':''}</button></div>`;
  }

  function applyMediaBulkCategoryV566(){
    const cat=document.getElementById('media-bulk-cat-v566').value;
    mediaUploadBatchV566.forEach(m=>m.type=cat);
    renderMediaBatchV566();
  }
  function removeMediaBatchV566(i){
    const [m]=mediaUploadBatchV566.splice(i,1);if(m?.preview)URL.revokeObjectURL(m.preview);
    renderMediaBatchV566();
  }

  async function commitMediaBatchV566(){
    if(!mediaUploadContextV566||!mediaUploadBatchV566.length)return;
    const btn=document.getElementById('media-upload-go-v566');if(btn){btn.disabled=true;btn.textContent='Téléversement…'}
    try{
      for(let i=0;i<mediaUploadBatchV566.length;i++){
        const m=mediaUploadBatchV566[i];
        if(btn)btn.textContent=`Téléversement ${i+1}/${mediaUploadBatchV566.length}…`;
        const url=await uploadAssetFile(m.file,`medias/${mediaUploadContextV566.level}/${mediaUploadContextV566.id}`);
        if(!url)throw new Error(`Échec du téléversement de ${m.file.name}`);
        const payload={user_id:currentUser.id,url,titre:m.titre||cleanMediaFilenameV566(m.file.name),type:m.type};
        if(mediaUploadContextV566.level==='saga')payload.saga_id=mediaUploadContextV566.id;
        else payload.sous_saga_id=mediaUploadContextV566.id;
        const {data,error}=await db().from('medias').insert(payload).select('id').single();
        if(error)throw error;
        if(m.type==='Couverture'&&m.current){
          if(mediaUploadContextV566.level==='saga') await db().from('sagas').update({couverture:url}).eq('id',mediaUploadContextV566.id);
          else await db().from('sous_sagas').update({couverture:url}).eq('id',mediaUploadContextV566.id);
        }
      }
      closeDrawer();
      if(mediaUploadContextV566.level==='saga')renderSagaMediasV565(document.getElementById('saga-tab-content'));
      else renderSousSagaMediasV565(document.getElementById('soussaga-tab-content'));
    }catch(err){
      alert('Erreur pendant l’import : '+(err?.message||err));
      if(btn){btn.disabled=false;btn.textContent='Reprendre l’import'}
    }
  }

  async function openMediaReadDrawerV565(id){
    const {data:m,error}=await db().from('medias').select('*').eq('id',id).single();
    if(error)return alert(error.message);
    openDrawer(m?.titre||'Média',`${mediaImage(m)?`<img src="${safeText(mediaImage(m))}" style="max-width:100%;border-radius:10px;margin-bottom:16px">`:''}<p><strong>Type :</strong> ${safeText(m?.type||'Média')}</p>${m?.description?`<div style="margin-top:12px">${m.description}</div>`:''}`);
  }

    { key:'informations', label:'Informations', real:true },
    { key:'oeuvres', label:'Œuvres', real:true },
    { key:'personnages', label:'Personnages', real:true },
    { key:'plan-global', label:'Plan global', real:true },
    { key:'codex', label:'Codex', real:true },
    { key:'chronologie', label:'Chronologie', real:true },

  async function showSousSagaTab(key){
    document.querySelectorAll('[id^="ssagatab-"]').forEach(b => { b.style.color='var(--text-dim)'; b.style.borderBottomColor='transparent'; b.style.fontWeight='400'; });
    const activeBtn = document.getElementById('ssagatab-'+key);
    if (activeBtn) { activeBtn.style.color='var(--accent)'; activeBtn.style.borderBottomColor='var(--accent)'; activeBtn.style.fontWeight='500'; }

    const tab = SOUS_SAGA_TABS.find(t=>t.key===key);
    const zone = document.getElementById('soussaga-tab-content');
    if (!tab.real){
      zone.innerHTML = `<div class="empty">Cet onglet n'est pas encore branché à Supabase.<br><span style="font-size:11px;">Le schéma existe déjà — on le construit dès qu'on y arrive dans l'ordre.</span></div>`;
      return;
    }
    if (key === 'informations') await renderSousSagaInformations(zone);
    if (key === 'oeuvres') await renderSousSagaOeuvres(zone);
    if (key === 'personnages') await renderSousSagaPersonnages(zone);
    if (key === 'plan-global') await renderSousSagaPlanGlobal(zone);
    if (key === 'codex') await renderSousSagaCodex(zone);
    if (key === 'chronologie') await renderSousSagaChronologie(zone);
    if (key === 'medias') await renderSousSagaMediasV565(zone);
  }

  async function renderSousSagaInformations(zone){
    zone.innerHTML='<div class="status-line">Chargement…</div>';
    try{
      const [ssR,worksR]=await Promise.all([
        db().from('sous_sagas').select('*,sagas(nom,univers_id)').eq('id',currentSousSagaId).single(),
        db().from('oeuvres').select('id,titre,statut,mots_ecrits,objectif_mots,couverture,numero_sous_saga,nature_sous_saga,ordre_sous_saga,statut_editorial_actuel').eq('sous_saga_id',currentSousSagaId)
      ]);

      const firstError=[ssR,worksR].find(r=>r?.error)?.error;
      if(firstError) throw firstError;

      const ss=ssR.data||{}, works=worksR.data||[];
      const totalWords=works.reduce((a,o)=>a+(Number(o.mots_ecrits)||0),0);
      const active=works.filter(o=>/cours|écriture|prepa|prépa/i.test((o.statut||'')+' '+(o.statut_editorial_actuel||''))).length;

      const rawTags=Array.isArray(ss.mots_cles)
        ? ss.mots_cles
        : (Array.isArray(ss.ambiance_tags)
            ? ss.ambiance_tags
            : (typeof ss.mots_cles==='string' ? ss.mots_cles.split(',').map(x=>x.trim()).filter(Boolean) : []));
      const tags=rawTags.map(x=>`<span class="ss-pill">✨ ${safeText(x)}</span>`).join('');

      zone.innerHTML=`<div class="ss-kpis"><div class="stat-card"><h3>Œuvres liées</h3><div class="stat-big">${works.length}</div></div><div class="stat-card"><h3>En cours / préparation</h3><div class="stat-big">${active}</div></div><div class="stat-card"><h3>Mots écrits cumulés</h3><div class="stat-big">${totalWords.toLocaleString('fr-FR')}</div></div></div>
        <div class="ss-info-grid"><section class="panel"><h2>À propos de la sous-saga</h2><div>${renderSimpleRichText(ss.description||ss.a_propos||'Pas encore de résumé.')}</div><div style="margin-top:12px">${tags}</div></section><section class="panel"><h2>Informations clés</h2><p><strong>Saga :</strong> ${safeText(ss.sagas?.nom||'—')}</p><p><strong>Genre dominant :</strong> ${safeText(ss.genre||'—')}</p><p><strong>Temporalité :</strong> ${safeText(ss.temporalite||'—')}</p><p><strong>Cadre :</strong> ${safeText(ss.lieu_principal||'—')}</p><p><strong>Nombre d’œuvres :</strong> ${works.length}</p></section></div>
        ${ss.citation?`<div class="panel" style="text-align:center;margin-top:18px;font:italic 17px 'Lora',serif">✦<br>${safeText(ss.citation)}</div>`:''}`;
    }catch(err){
      console.error('Sous-saga Informations',err);
      zone.innerHTML=`<div class="empty"><strong>Impossible de charger les informations de la sous-saga.</strong><br><span style="font-size:11px">${safeText(err?.message||String(err))}</span></div>`;
    }
  }

  async function renderSousSagaOeuvres(zone){

  async function renderSousSagaPersonnages(zone){

  async function renderSousSagaPlanGlobal(zone){

  function renderSsSegment(seg){const fields=[['identite','Identité du tome'],['resume_complet','Résumé complet'],['arc_protagonistes','Arc des protagonistes'],['arc_relationnel','Arc relationnel'],['evenements_importants','Événements importants'],['continuite','Continuité']];return `<details class="ss-segment"><summary>💙 ${safeText(seg.libelle||('Tome '+(seg.numero||'')))} ${seg.oeuvres?.titre?'· '+safeText(seg.oeuvres.titre):''}</summary><div class="ss-segment-body">${fields.map(([k,l])=>`<details><summary>▸ ${l}</summary><div class="ss-rich" contenteditable="true" onblur="saveSsSegmentField('${seg.id}','${k}',this.innerHTML)">${seg[k]||''}</div></details>`).join('')}<button class="btn-secondary" onclick="deleteSsSegment('${seg.id}')">Supprimer ce segment</button></div></details>`}
  async function addSousSagaSegment(){const r=await db().from('sous_saga_segments').select('ordre').eq('sous_saga_id',currentSousSagaId).order('ordre',{ascending:false}).limit(1);const ord=(Number(r.data?.[0]?.ordre)||0)+1;const {error}=await db().from('sous_saga_segments').insert({user_id:currentUser.id,sous_saga_id:currentSousSagaId,libelle:'Tome '+ord,numero:ord,ordre:ord});if(error)return alert(error.message);renderSousSagaPlanGlobal(document.getElementById('soussaga-tab-content'))}

  async function deleteSsSegment(id){if(!confirm('Supprimer ce segment du plan global ?'))return;await db().from('sous_saga_segments').delete().eq('id',id);renderSousSagaPlanGlobal(document.getElementById('soussaga-tab-content'))}


  async function renderSousSagaCodex(zone){
    const [pagesR,ssR]=await Promise.all([db().from('codex_pages').select('*').eq('sous_saga_id',currentSousSagaId).order('ordre'),db().from('sous_sagas').select('page_color,accent_color').eq('id',currentSousSagaId).single()]);

  async function renderOeuvreEcriture(zone){
    zone.innerHTML = `<div class="status-line">Chargement…</div>`;
    const [{ data: chaps }, { data: sessions }] = await Promise.all([
      db().from('chapitres').select('*').eq('oeuvre_id', currentOeuvreId).order('ordre'),
      db().from('sessions_ecriture').select('mots_ecrits, date').eq('oeuvre_id', currentOeuvreId).order('date', { ascending:false }).limit(30),
    ]);
    ecritureChapitres = chaps || [];

    const ecrits = ecritureChapitres.filter(c => (c.nb_mots||0) > 0).length;
    const aEcrire = ecritureChapitres.length - ecrits;
    const totalMots = ecritureChapitres.reduce((s,c)=>s+(c.nb_mots||0), 0);
    const povCounts = {};
    ecritureChapitres.forEach(c => { if (c.pov) povCounts[c.pov] = (povCounts[c.pov]||0)+1; });
    const moyMotsJour = sessions?.length ? Math.round(sessions.reduce((s,r)=>s+(r.mots_ecrits||0),0)/sessions.length) : null;
    const derniereSession = sessions?.[0]?.date;

    zone.innerHTML = `
      <div class="stat-cards-row">
        <div class="stat-card"><h3>Chapitres écrits</h3><div class="stat-big">${ecrits} / ${ecritureChapitres.length}</div><div style="font-size:12px; color:var(--text-dim);">${aEcrire} à écrire</div></div>
        <div class="stat-card"><h3>Total mots</h3><div class="stat-big">${totalMots.toLocaleString('fr-FR')}</div></div>
        <div class="stat-card"><h3>Mots / jour (moy.)</h3><div class="stat-big">${moyMotsJour ?? '—'}</div><div style="font-size:12px; color:var(--text-dim);">${derniereSession ? 'Dernière session : '+derniereSession : 'Aucune session enregistrée'}</div></div>
        <div class="stat-card"><h3>POV utilisés</h3>${Object.entries(povCounts).map(([k,v])=>`<div class="info-line" style="padding:3px 0; border:none;"><span>${k}</span><span>${v}</span></div>`).join('') || '<div style="font-size:12px; color:var(--text-dim);">—</div>'}</div>
      </div>

      <div class="head-row">
        <div class="row2" style="grid-template-columns:auto auto auto; gap:8px;">
          <button class="btn-secondary" id="ev-table" onclick="setEcritureView('table')">Table</button>

    const maxOrdre = ecritureChapitres.reduce((m,c)=>Math.max(m, c.ordre||0), 0);
    const payload = {
      titre: document.getElementById('cf-titre').value.trim()||'Sans titre',

      acte: document.getElementById('cf-acte').value.trim(),

      resume: document.getElementById('cf-resume').value.trim(),
      plan: document.getElementById('cf-plan').value.trim(),
    };
    let error;
    if (editingChapitreId) ({ error } = await db().from('chapitres').update(payload).eq('id', editingChapitreId));
    else { payload.user_id = currentUser.id; payload.oeuvre_id = currentOeuvreId; payload.ordre = maxOrdre + 1; ({ error } = await db().from('chapitres').insert(payload)); }

  async function savePersonnageOeuvre(){
    let personnageId = editingPoPersonnageId;
    if (!personnageId) {
      const selVal = document.getElementById('po-personnage-select').value;
      if (!selVal) { alert('Choisis un personnage.'); return; }
      if (selVal === '__new__') {
        const nom = document.getElementById('po-nouveau-nom').value.trim();
        if (!nom) { alert('Donne un nom au nouveau personnage.'); return; }
        const { data, error } = await db().from('personnages').insert({ user_id: currentUser.id, nom }).select('id').single();
        if (error) { alert('Erreur : ' + error.message); return; }
        personnageId = data.id;
      } else {
        personnageId = selVal;
      }
    }
    const linkPayload = {
      role: document.getElementById('po-role').value.trim(),
      importance: document.getElementById('po-importance').value || null,
      pov: document.getElementById('po-pov').value || null,
      faction: document.getElementById('po-faction').value.trim(),
      etat: document.getElementById('po-etat').value.trim(),
    };
    let error;
    if (editingPoPersonnageId) {
      ({ error } = await db().from('personnages_oeuvres').update(linkPayload).eq('oeuvre_id', currentOeuvreId).eq('personnage_id', personnageId));
    } else {
      ({ error } = await db().from('personnages_oeuvres').insert({ oeuvre_id: currentOeuvreId, personnage_id: personnageId, ...linkPayload }));
    }
    if (error) { alert('Erreur : ' + error.message); return; }
    closePersonnageOeuvreModal();
    await renderOeuvrePersonnages(document.getElementById('oeuvre-tab-content'));
  }

    const { error } = await db().from('personnages_oeuvres').delete().eq('oeuvre_id', currentOeuvreId).eq('personnage_id', editingPoPersonnageId);
    if (error) { alert('Erreur : ' + error.message); return; }
    closePersonnageOeuvreModal();
    await renderOeuvrePersonnages(document.getElementById('oeuvre-tab-content'));
  }

      db().from('plans').select('*').eq('oeuvre_id', currentOeuvreId).order('ordre'),
      db().from('oeuvre_notes').select('*').eq('oeuvre_id', currentOeuvreId).order('created_at', { ascending:false }),
    ]);
    if (error) { zone.innerHTML = `<div class="empty">Erreur : ${error.message}</div>`; return; }

    zone.innerHTML = `
      <div class="row2" style="grid-template-columns:2fr 1fr; gap:20px; align-items:start;">
        <div>
          <div class="head-row">
            <div class="row2" style="grid-template-columns:auto auto auto; gap:8px;">
              <button class="btn-secondary" id="pv-table" onclick="setPlansView('table')">Table</button>
              <button class="btn-secondary" id="pv-kanban" onclick="setPlansView('kanban')">Kanban</button>
              <select class="search-input" id="plans-groupby" onchange="onPlansGroupByChange()">
                <option value="acte" ${plansGroupBy==='acte'?'selected':''}>Grouper par acte</option>
                <option value="type" ${plansGroupBy==='type'?'selected':''}>Grouper par type</option>
                <option value="statut" ${plansGroupBy==='statut'?'selected':''}>Grouper par statut</option>
              </select>
            </div>
            <button class="btn-primary" onclick="openPlanModal()">+ Nouveau plan</button>
          </div>
          <div id="plans-view-zone"></div>
        </div>
        <div>
          <div class="panel">
            <h2>Notes de l'autrice</h2>

            <button class="btn-primary" style="margin-top:8px; width:100%;" onclick="addOeuvreNote()">Ajouter</button>
            <div style="margin-top:14px;">${(notes||[]).map(n => `<div class="memo-item"><div class="memo-date">${new Date(n.created_at).toLocaleDateString('fr-FR')}</div>${n.contenu}</div>`).join('') || '<div style="font-size:12px; color:var(--text-dim);">Aucune note pour le moment.</div>'}</div>
          </div>
        </div>

    `;
    setPlansView(plansView);
  }

  function onPlansGroupByChange(){ plansGroupBy = document.getElementById('plans-groupby').value; setPlansView(plansView); }
  function setPlansView(mode){
    plansView = mode;
    ['table','kanban'].forEach(m => { const b = document.getElementById('pv-'+m); if (b) { b.style.background = (m===mode)?'var(--accent)':'var(--bg-2)'; b.style.color = (m===mode)?'var(--bg)':'var(--text)'; } });
    const zone = document.getElementById('plans-view-zone');
    if (!zone) return;
    zone.innerHTML = mode === 'table' ? renderPlansTable(plansData) : renderPlansKanban(plansData, plansGroupBy);
  }
  function renderPlansTable(plans){
    if (!plans.length) return `<div class="empty">Aucun plan pour l'instant.</div>`;
    return `<table class="ch-table"><thead><tr><th>Type</th><th>Titre</th><th>Acte</th><th>Statut</th></tr></thead><tbody>
      ${plans.map(p => `<tr onclick="openPlanModal('${p.id}')"><td>${p.type}</td><td>${p.titre}</td><td>${p.acte||'—'}</td><td><span class="etat-pill">${p.statut||'—'}</span></td></tr>`).join('')}
    </tbody></table>`;
  }
  function renderPlansKanban(plans, groupBy){
    const groupes = [...new Set(plans.map(p=>p[groupBy]).filter(Boolean))];
    if (!groupes.length) return `<div class="empty">Aucun plan pour l'instant.</div>`;
    return `<div class="kanban-row">${groupes.map(g => `
      <div class="kanban-col"><h4>${g} (${plans.filter(p=>p[groupBy]===g).length})</h4>
        ${plans.filter(p=>p[groupBy]===g).map(p => `<div class="kanban-card" onclick="openPlanModal('${p.id}')"><div style="font-size:11px; color:var(--text-dim);">${p.type}</div>${p.titre}</div>`).join('')}
      </div>`).join('')}</div>`;
  }

  function planModalHtml(){
    return `
      <div class="modal-overlay" id="modal-plan-overlay" onclick="if(event.target===this) closePlanModal()">
        <div class="modal-box">
          <div class="modal-head"><h2 id="modal-plan-title">Nouveau plan</h2><button onclick="closePlanModal()">✕</button></div>
          <div class="modal-body">
            <div><label>Type</label><select id="pf-type"><option>Intrigue principale</option><option>Arc personnage</option><option>Sous-intrigue</option><option>Romance</option></select></div>
            <div><label>Titre</label><input id="pf-titre"></div>
            <div class="row2">
              <div><label>Acte</label><input id="pf-acte"></div>
              <div><label>Statut</label><input id="pf-statut" placeholder="En cours, À venir..."></div>
            </div>
            <div><label>Transformation / résumé</label><textarea id="pf-transformation"></textarea></div>
          </div>
          <div class="modal-foot">

            <button class="btn-primary" onclick="savePlan()">Enregistrer</button>

  let editingPlanId = null;
  function openPlanModal(id){
    editingPlanId = id || null;
    document.getElementById('modal-plan-title').textContent = id ? 'Modifier le plan' : 'Nouveau plan';
    document.getElementById('pf-delete').style.display = id ? 'block' : 'none';
    document.getElementById('pf-type').value='Intrigue principale'; document.getElementById('pf-titre').value='';
    document.getElementById('pf-acte').value=''; document.getElementById('pf-statut').value=''; document.getElementById('pf-transformation').value='';
    if (id) {
      const p = plansData.find(x=>x.id===id);
      if (p) { document.getElementById('pf-type').value=p.type; document.getElementById('pf-titre').value=p.titre||''; document.getElementById('pf-acte').value=p.acte||''; document.getElementById('pf-statut').value=p.statut||''; document.getElementById('pf-transformation').value=p.transformation||''; }
    }
    document.getElementById('modal-plan-overlay').classList.add('open');
  }
  function closePlanModal(){ document.getElementById('modal-plan-overlay').classList.remove('open'); }
  async function savePlan(){
    const payload = { type: document.getElementById('pf-type').value, titre: document.getElementById('pf-titre').value.trim()||'Sans titre', acte: document.getElementById('pf-acte').value.trim(), statut: document.getElementById('pf-statut').value.trim(), transformation: document.getElementById('pf-transformation').value.trim() };
    let error;
    if (editingPlanId) ({ error } = await db().from('plans').update(payload).eq('id', editingPlanId));
    else { payload.user_id = currentUser.id; payload.oeuvre_id = currentOeuvreId; ({ error } = await db().from('plans').insert(payload)); }
    if (error) { alert('Erreur : ' + error.message); return; }
    closePlanModal();
    await renderOeuvrePlans(document.getElementById('oeuvre-tab-content'));
  }
  async function deletePlan(){
    if (!confirm('Supprimer ce plan ?')) return;
    const { error } = await db().from('plans').delete().eq('id', editingPlanId);
    if (error) { alert('Erreur : ' + error.message); return; }
    closePlanModal();
    await renderOeuvrePlans(document.getElementById('oeuvre-tab-content'));
  }
  async function addOeuvreNote(){
    const val = document.getElementById('on-new').value.trim();
    if (!val) return;
    const { error } = await db().from('oeuvre_notes').insert({ oeuvre_id: currentOeuvreId, contenu: val });
    if (error) { alert('Erreur : ' + error.message); return; }
    await renderOeuvrePlans(document.getElementById('oeuvre-tab-content'));
  }

  // ============================================================
  // Onglet Relecture d'une œuvre
  // ============================================================
  let currentRelectureId = null;
  let relectureChapitres = [];

  let currentRelectureV2=null; let relectureView='table';
  async function renderOeuvreRelectureV2(zone){
    zone.innerHTML=`<div class="status-line">Chargement…</div>`;
    let {data:rs}=await db().from('relectures').select('*').eq('oeuvre_id',currentOeuvreId).order('created_at',{ascending:false}).limit(1);
    if(!rs?.length){const {data:manuscriptChaps}=await db().from('chapitres').select('id,nb_mots').eq('oeuvre_id',currentOeuvreId);const hasManuscript=(manuscriptChaps||[]).some(c=>(c.nb_mots||0)>0);zone.innerHTML=hasManuscript?`<div class="empty">Aucune relecture en cours.<br><br><button class="btn-primary" onclick="startRelecture();setTimeout(()=>showOeuvreTab('relecture'),400)">Démarrer une relecture</button></div>`:`<div class="empty"><strong>Aucune relecture en cours.</strong><br><br>La relecture apparaîtra ici quand le manuscrit contiendra des chapitres écrits.</div>`;return;}
    currentRelectureV2=rs[0];
    const [{data:chaps},{data:states},{data:checks},{data:links}]=await Promise.all([
      db().from('chapitres').select('*').eq('oeuvre_id',currentOeuvreId).order('ordre'),
      db().from('relecture_chapitres').select('*').eq('relecture_id',currentRelectureV2.id),
      db().from('relecture_checklist').select('*').eq('relecture_id',currentRelectureV2.id).order('ordre'),
      db().from('notes_liees').select('*').or(`oeuvre_cible_id.eq.${currentOeuvreId},oeuvre_source_id.eq.${currentOeuvreId}`).order('created_at',{ascending:false})
    ]);
    const sm=Object.fromEntries((states||[]).map(x=>[x.chapitre_id,x])); const cm={};(checks||[]).forEach(x=>(cm[x.chapitre_id]??=[]).push(x));
    const rows=(chaps||[]).filter(c=>(c.nb_mots||0)>0 || sm[c.id]); const relus=rows.filter(c=>(sm[c.id]?.statut||'à relire')==='relu').length; const pct=rows.length?Math.round(relus/rows.length*100):0;
    const milestones=[currentRelectureV2.date_debut&&`Relecture démarrée · ${currentRelectureV2.date_debut}`,currentOeuvre?.statut&&`Manuscrit · ${currentOeuvre.statut}`,currentOeuvre?.publication_envisagee&&`Objectif · ${currentOeuvre.publication_envisagee}`].filter(Boolean);
    const rowHtml=c=>{const st=sm[c.id]||{};const cl=cm[c.id]||[];const done=cl.filter(x=>x.fait).length;return `<tr><td><button style="border:0;background:none;cursor:pointer;font-weight:600;color:var(--text);padding:0" onclick="openRelectureDrawer('${c.id}','${safeText((c.titre||'Chapitre').replace(/'/g,"\'"))}')">${safeText(c.titre||'Chapitre '+(c.numero??''))}</button></td><td><select class="status-select" onchange="saveRelectureStatus('${c.id}',this.value)">${['à écrire','à relire','en cours','bloqué','relu'].map(x=>`<option ${x===(st.statut||'à relire')?'selected':''}>${x}</option>`).join('')}</select></td><td>${cl.length?`${done}/${cl.length}`:'—'}</td><td>${st.updated_at?`${st.statut==='relu'?'✓ ':''}${new Date(st.updated_at).toLocaleDateString('fr-FR')}`:'—'}</td><td>${st.notes_html?'📝':'—'}</td></tr>`};
    const statuses=['à écrire','à relire','en cours','bloqué','relu'];
    zone.innerHTML=`<div class="panel"><h2>Jalons</h2><div style="display:flex;gap:10px;flex-wrap:wrap">${milestones.map(x=>`<span class="keyword-chip">${safeText(x)}</span>`).join('')||'<span style="color:var(--text-dim);font-size:12px">Aucun jalon.</span>'}</div><h2 style="margin-top:18px">Progression</h2><strong>${relus} / ${rows.length} chapitres relus · ${pct}%</strong><div class="progress-bar-outer" style="max-width:none;margin-top:8px"><div class="progress-bar-inner" style="width:${pct}%"></div></div></div><div class="relecture-grid"><section class="panel"><div class="work-toolbar"><h2 style="margin:0">Suivi des chapitres</h2><div class="segmented"><button class="btn-secondary ${relectureView==='table'?'active':''}" onclick="relectureView='table';renderOeuvreRelectureV2(document.getElementById('oeuvre-tab-content'))">Tableau</button><button class="btn-secondary ${relectureView==='kanban'?'active':''}" onclick="relectureView='kanban';renderOeuvreRelectureV2(document.getElementById('oeuvre-tab-content'))">Kanban</button></div></div>${relectureView==='table'?`<table class="ch-table"><thead><tr><th>Chapitre</th><th>Statut</th><th>Progression</th><th>Dernière mise à jour</th><th>Notes</th></tr></thead><tbody>${rows.map(rowHtml).join('')}</tbody></table>`:`<div style="display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:10px;overflow:auto">${statuses.map(status=>`<div style="background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:10px"><strong style="text-transform:capitalize">${status}</strong>${rows.filter(c=>(sm[c.id]?.statut||'à relire')===status).map(c=>`<div class="memo-item" style="margin-top:9px;cursor:pointer" onclick="openRelectureDrawer('${c.id}','${safeText((c.titre||'Chapitre').replace(/'/g,"\'"))}')">${safeText(c.titre||'Chapitre')}</div>`).join('')||'<small style="color:var(--text-dim)">Vide</small>'}</div>`).join('')}</div>`}</section><aside class="panel"><h2>🔗 Notes liées</h2>${links?.length?links.map(n=>`<div class="linked-note"><small>${n.oeuvre_source_id===currentOeuvreId?'↗ Créée ici':'↙ Reçue'}</small><div>${n.contenu_html||'Note liée'}</div></div>`).join(''):`<div class="walter-empty"><div class="walter-placeholder">🐈‍⬛</div><strong>Walter garde la continuité.</strong><div>Aucune note liée pour le moment.</div></div>`}</aside></div>`;
  }
  async function ensureRelectureState(chapitreId){let {data}=await db().from('relecture_chapitres').select('*').eq('relecture_id',currentRelectureV2.id).eq('chapitre_id',chapitreId).maybeSingle();if(!data){const r=await db().from('relecture_chapitres').insert({user_id:currentUser.id,relecture_id:currentRelectureV2.id,chapitre_id:chapitreId,statut:'à relire'}).select().single();data=r.data;}return data;}
  async function saveRelectureStatus(chapitreId,statut){const st=await ensureRelectureState(chapitreId);await db().from('relecture_chapitres').update({statut,updated_at:new Date().toISOString()}).eq('id',st.id);renderOeuvreRelectureV2(document.getElementById('oeuvre-tab-content'));}
  async function openRelectureDrawer(chapitreId,title){const st=await ensureRelectureState(chapitreId);const {data:checks}=await db().from('relecture_checklist').select('*').eq('relecture_id',currentRelectureV2.id).eq('chapitre_id',chapitreId).order('ordre');openDrawer(title,`<h3>Checklist</h3><div id="checklist-box">${(checks||[]).map(x=>`<label class="check-item"><input type="checkbox" ${x.fait?'checked':''} onchange="toggleCheck('${x.id}',this.checked)"><span>${safeText(x.libelle)}</span></label>`).join('')||'<div style="font-size:12px;color:var(--text-dim)">Aucun contrôle pour ce chapitre.</div>'}</div><div class="check-add"><input id="new-check-label" placeholder="Ajouter un contrôle…"><button class="btn-secondary" onclick="addCheck('${chapitreId}')">Ajouter</button></div><h3 style="margin-top:22px">Retour bêta-lecture</h3><div class="rich-editor" id="beta-editor" contenteditable="true" style="min-height:140px">${st.retour_beta_html||''}</div><h3 style="margin-top:22px">Notes de relecture</h3><div class="rich-toolbar"><button onclick="document.execCommand('bold')"><b>B</b></button><button onclick="document.execCommand('italic')"><i>I</i></button><button onclick="document.execCommand('underline')"><u>U</u></button><button onclick="document.execCommand('hiliteColor',false,'#fff1a8')">Surligner</button><button onclick="insertRichImage()">🖼 Image</button></div><div id="relecture-note-editor" class="rich-editor" contenteditable="true">${st.notes_html||''}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn-primary" onclick="saveRelectureDrawer('${st.id}')">Enregistrer</button><button class="btn-secondary" onclick="linkCurrentRelectureNote('${chapitreId}')">🔗 Lier cette note</button></div>`);}
  async function toggleCheck(id,fait){await db().from('relecture_checklist').update({fait}).eq('id',id);}
  async function addCheck(chapitreId){const libelle=document.getElementById('new-check-label').value.trim();if(!libelle)return;await db().from('relecture_checklist').insert({user_id:currentUser.id,relecture_id:currentRelectureV2.id,chapitre_id:chapitreId,libelle,ordre:Date.now()%100000});openRelectureDrawer(chapitreId,'Chapitre');}
  async function saveRelectureDrawer(id){await db().from('relecture_chapitres').update({notes_html:document.getElementById('relecture-note-editor').innerHTML,retour_beta_html:document.getElementById('beta-editor').innerHTML,updated_at:new Date().toISOString()}).eq('id',id);closeDrawer();renderOeuvreRelectureV2(document.getElementById('oeuvre-tab-content'));}
  async function linkCurrentRelectureNote(chapitreId){const target=prompt('ID de l’œuvre cible (on remplacera ce prompt par le sélecteur visuel) :');if(!target)return;const html=document.getElementById('relecture-note-editor').innerHTML;await db().from('notes_liees').insert({user_id:currentUser.id,oeuvre_source_id:currentOeuvreId,chapitre_source_id:chapitreId,oeuvre_cible_id:target,contenu_html:html});alert('Note liée.');}
  async function renderOeuvreRelecture(zone){
    zone.innerHTML = `<div class="status-line">Chargement…</div>`;
    let { data: relectures } = await db().from('relectures').select('*').eq('oeuvre_id', currentOeuvreId).order('created_at', { ascending:false });
    if (!relectures || !relectures.length) {
      const {data:manuscriptChaps}=await db().from('chapitres').select('id,nb_mots').eq('oeuvre_id',currentOeuvreId);
      const hasManuscript=(manuscriptChaps||[]).some(c=>(c.nb_mots||0)>0);
      zone.innerHTML = hasManuscript ? `<div class="empty">Aucune relecture en cours.<br><br><button class="btn-primary" onclick="startRelecture()">Démarrer une relecture</button></div>` : `<div class="empty"><strong>Aucune relecture en cours.</strong><br><br>La relecture apparaîtra ici quand le manuscrit contiendra des chapitres écrits.</div>`;
      return;
    }
    const relecture = relectures[0];
    currentRelectureId = relecture.id;

    const [{ data: chaps }, { data: corrections }] = await Promise.all([
      db().from('chapitres').select('id, numero, titre').eq('oeuvre_id', currentOeuvreId).order('ordre'),
      db().from('corrections').select('*').eq('relecture_id', currentRelectureId).order('created_at', { ascending:false }),
    ]);
    relectureChapitres = chaps || [];

    const corrByChapitre = {};
    (corrections||[]).forEach(c => { if (c.chapitre_id) corrByChapitre[c.chapitre_id] = c; });
    const relus = (corrections||[]).filter(c=>c.resolu).length;
    const enCours = (corrections||[]).filter(c=>!c.resolu && c.etat==='en cours').length;
    const bloque = (corrections||[]).filter(c=>c.etat==='bloqué').length;
    const total = relectureChapitres.length;
    const pct = total ? Math.round(relus/total*100) : 0;

    zone.innerHTML = `
      <div class="stat-cards-row">
        <div class="stat-card"><h3>Type de relecture</h3><div class="stat-big" style="font-size:1.3rem;">${relecture.type||'—'}</div><div style="font-size:12px; color:var(--text-dim);">${relecture.statut||''}</div></div>
        <div class="stat-card"><h3>Chapitres relus</h3><div class="stat-big">${relus} / ${total}</div></div>
        <div class="stat-card"><h3>En cours</h3><div class="stat-big">${enCours}</div></div>
        <div class="stat-card"><h3>Bloqués</h3><div class="stat-big">${bloque}</div></div>
      </div>
      <div class="panel">
        <h2>Avancement</h2>
        <div class="progress-bar-outer" style="max-width:none;"><div class="progress-bar-inner" style="width:${pct}%;"></div></div>
        <div style="font-size:12px; color:var(--text-dim); margin-top:6px;">${pct}%</div>
      </div>

      <div class="row2" style="grid-template-columns:1.4fr 1fr; gap:20px; align-items:start;">
        <div class="panel">
          <h2>Suivi des chapitres</h2>
          <table class="ch-table"><thead><tr><th>N°</th><th>Titre</th><th>Statut</th><th></th></tr></thead><tbody>
            ${relectureChapitres.map(c => {
              const cor = corrByChapitre[c.id];
              return `<tr onclick="openCorrectionModal('${c.id}', '${(c.titre||'').replace(/'/g,"\\'")}')">
                <td>${c.numero ?? '—'}</td><td>${c.titre}</td>
                <td><span class="etat-pill">${cor ? (cor.resolu?'Relu':cor.etat||'—') : 'À relire'}</span></td>
                <td style="color:var(--text-dim);">${cor?.point_a_corriger ? '📝' : ''}</td>
              </tr>`;
            }).join('')}
          </tbody></table>
        </div>
        <div class="panel">
          <h2>Journal des corrections</h2>
          ${(corrections||[]).length ? corrections.slice(0,10).map(c => `
            <div class="memo-item">
              <div class="memo-date">${new Date(c.created_at).toLocaleDateString('fr-FR')} — ${c.resolu?'✅ Résolu':'⚠️ '+ (c.etat||'à traiter')}</div>
              ${c.point_a_corriger || '—'}
            </div>`).join('') : '<div style="font-size:12px; color:var(--text-dim);">Aucune correction enregistrée.</div>'}
        </div>
      </div>
    `;
  }

  async function startRelecture(){
    const type = prompt('Type de relecture (ex : Structurelle, Orthographe & grammaire) ?', 'Structurelle');
    if (!type) return;
    const { error } = await db().from('relectures').insert({ user_id: currentUser.id, oeuvre_id: currentOeuvreId, type, statut: 'en cours', date_debut: new Date().toISOString().slice(0,10) });
    if (error) { alert('Erreur : ' + error.message); return; }
    await renderOeuvreRelecture(document.getElementById('oeuvre-tab-content'));
  }

    return `
      <div class="modal-overlay" id="modal-correction-overlay" onclick="if(event.target===this) closeCorrectionModal()">
        <div class="modal-box">
          <div class="modal-head"><h2 id="modal-correction-title">Correction</h2><button onclick="closeCorrectionModal()">✕</button></div>

  function renderSimpleRichText(value){
    const escaped = safeText(value || '');
    return escaped
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/__(.+?)__/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/_(.+?)_/g, '<em>$1</em>')
      .replace(/\n/g, '<br>');
  }

  function captureIdeeFormDraft(){const i=currentIdeeDraft();const get=id=>document.getElementById(id);const note=get('if-note'),title=get('if-titre'),img=get('if-image'),color=get('if-page-color'),fav=get('if-favori'),type=get('if-type'),genre=get('if-genre'),amb=get('if-ambiance'),notes=get('if-notes-rich');if(note)ideaDraftState.note=note.value;if(title)ideaDraftState.titre=title.value;if(img)ideaDraftState.image_url=img.value;if(color)ideaDraftState.page_color=color.value;if(fav)ideaDraftState.favori=fav.checked;if(type)ideaDraftState.type=type.value;if(genre)ideaDraftState.genre=genre.value;if(amb)ideaDraftState.ambiance=amb.value.split(',').map(x=>x.trim()).filter(Boolean);if(notes)ideaDraftState.notes_pelemele=notes.innerHTML;ideaDraftState.statut=window._ideeFormStatus||i.statut||'Graine';}

  function renderIdeeDrawerHeader(){const i=currentIdeeDraft(),status=i.statut==='Abandonnée'?'Abandonnée':(window._ideeFormStatus||i.statut||'Graine');document.getElementById('if-status-badge').innerHTML=ideaStatusBadge(status);document.getElementById('modal-idee-title').textContent=editingIdeeId?ideaDisplayTitle(i):'Nouvelle idée';const tabs=document.querySelectorAll('#if-tabs button');tabs.forEach(b=>{const tab=b.dataset.tab;b.style.display=(tab==='details'||status==='À creuser'||status==='Prometteuse')?'':'none';if(tab==='personnages'&&status!=='Prometteuse')b.style.display='none';b.classList.toggle('active',tab===ideeDrawerTab)});}
  function renderIdeeDrawerBody(){
    const body=document.getElementById('if-body');if(!body)return;const i=currentIdeeDraft(),status=window._ideeFormStatus||(i.statut==='En sommeil'?'À creuser':i.statut)||'Graine';renderIdeeDrawerHeader();
    if(ideeDrawerTab==='notes'){body.innerHTML=`<div class="idea-form-section"><div><label>🗒️ Notes pêle-mêle</label><div id="if-notes-rich" class="idea-rich" contenteditable="true">${i.notes_pelemele||''}</div><small style="color:var(--text-dim)">Ici, pas besoin de ranger les idées. Scènes, questions, fragments, contradictions : tout peut cohabiter.</small></div></div>`;return;}
    if(ideeDrawerTab==='personnages'){body.innerHTML=`<div class="idea-form-section"><div style="display:flex;justify-content:space-between;align-items:center"><div><strong>👥 Idées de personnages</strong><div style="font-size:10px;color:var(--text-dim)">Des embryons seulement. Ils ne deviennent pas encore des personnages canoniques.</div></div><button class="tiny-btn" onclick="addIdeeCharacter()">+ Ajouter</button></div><div id="if-char-list" class="idea-char-list"></div></div>`;drawIdeeCharacters();return;}
    const advanced=status!=='Graine'&&status!=='Abandonnée';
    body.innerHTML=`<div class="idea-form-section"><div><label>Niveau de maturité</label><div class="idea-status-picker"><button data-status="Graine" class="${status==='Graine'?'active':''}" onclick="changeIdeeStatusForm('Graine')">🌱 Graine</button><button data-status="À creuser" class="${status==='À creuser'?'active':''}" onclick="changeIdeeStatusForm('À creuser')">🔎 À creuser</button><button data-status="Prometteuse" class="${status==='Prometteuse'?'active':''}" onclick="changeIdeeStatusForm('Prometteuse')">⭐ Prometteuse</button></div></div>${advanced?`<div><label>Titre <span style="color:var(--text-dim)">(facultatif)</span></label><input id="if-titre" value="${safeText((i.titre&&i.titre!=='Sans titre'&&i.titre!=='Idée')?i.titre:'')}" placeholder="Laisser vide pour garder ${safeText(ideaDisplayTitle(i))}"></div>`:''}<div><label>💡 L’idée</label><textarea id="if-note" style="min-height:150px" placeholder="Un homme reçoit les lettres d’amour destinées à l’ancien locataire…">${safeText(i.note||'')}</textarea></div><div class="row2"><div><label>🖼️ Image d’inspiration (URL)</label><input id="if-image" value="${safeText(i.image_url||'')}" placeholder="https://…" oninput="previewIdeeImage()"></div><div><label>🎨 Couleur de page</label><input type="color" id="if-page-color" value="${safeText(i.page_color||'#44385F')}" oninput="previewIdeeImage()"></div></div><div id="if-image-preview" class="idea-image-preview"></div>${advanced?`<div class="row2"><div><label>📝 Type</label><input id="if-type" value="${safeText(i.type||'')}" placeholder="Roman, nouvelle…"></div><div><label>📚 Genre</label><input id="if-genre" value="${safeText(i.genre||'')}" placeholder="Romance, fantasy…"></div></div><div><label>✨ Ambiance <span style="color:var(--text-dim)">(séparée par des virgules)</span></label><input id="if-ambiance" value="${safeText((i.ambiance||[]).join(', '))}" placeholder="Doux, intime, mélancolique"></div>`:''}<label style="display:flex;align-items:center;gap:7px"><input type="checkbox" id="if-favori" style="width:auto" ${i.favori?'checked':''}> ⭐ Garder dans mes favorites</label>${status==='Prometteuse'&&!i.transforme_en_type?`<div style="border-top:1px solid var(--line);padding-top:12px"><strong>🌿 Prête à devenir un projet ?</strong><p style="font-size:10px;color:var(--text-dim)">La transformation réutilisera cette idée au lieu de recréer les informations.</p><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="tiny-btn" onclick="transformerIdee('oeuvre')">→ Œuvre</button><button class="tiny-btn" onclick="transformerIdee('saga')">→ Saga</button><button class="tiny-btn" onclick="transformerIdee('recueil')">→ Recueil</button></div></div>`:''}</div>`;previewIdeeImage();}
  function previewIdeeImage(){const z=document.getElementById('if-image-preview');if(!z)return;const url=document.getElementById('if-image')?.value.trim();const color=document.getElementById('if-page-color')?.value||'#44385F';z.style.background=color;z.innerHTML=url?`<img src="${safeText(url)}" alt="Aperçu" onerror="this.remove();this.parentElement.textContent='Lien conservé · aperçu indisponible'">`:'Fond par défaut automatique · aucune carte ne restera vide 🌿';}
  function changeIdeeStatusForm(status){captureIdeeFormDraft();window._ideeFormStatus=status;ideaDraftState.statut=status;if(status==='Graine')ideeDrawerTab='details';renderIdeeDrawerBody();}
  function drawIdeeCharacters(){const z=document.getElementById('if-char-list');if(!z)return;z.innerHTML=editingIdeeChars.length?editingIdeeChars.map((c,idx)=>`<div class="idea-char-card"><div class="idea-char-card-row"><input value="${safeText(c.nom||'')}" placeholder="Nom / rôle provisoire" oninput="editingIdeeChars[${idx}].nom=this.value"><textarea placeholder="Quelques mots…" oninput="editingIdeeChars[${idx}].note=this.value">${safeText(c.note||'')}</textarea><button class="tiny-btn danger-btn" onclick="editingIdeeChars.splice(${idx},1);drawIdeeCharacters()">✕</button></div></div>`).join(''):'<div class="idea-empty-plant">👤 Aucun personnage encore. Et c’est parfaitement permis.</div>';}
  function addIdeeCharacter(){editingIdeeChars.push({nom:'',note:''});drawIdeeCharacters();}

  async function openIdeeModal(id){
    editingIdeeId=id||null;ideeDrawerTab='details';ideaDraftState={};const i=id?(ideesData.find(x=>x.id===id)||(await db().from('idees').select('*').eq('id',id).single()).data):{};editingIdeeChars=Array.isArray(i?.personnages_idees)?JSON.parse(JSON.stringify(i.personnages_idees)):[];window._ideeFormStatus=(i?.statut==='En sommeil'?'À creuser':i?.statut)||'Graine';document.getElementById('if-abandon').style.display=id&&i?.statut!=='Abandonnée'?'inline-flex':'none';document.getElementById('modal-idee-overlay').classList.add('open');renderIdeeDrawerBody();
  }
  function closeIdeeModal(){document.getElementById('modal-idee-overlay')?.classList.remove('open');editingIdeeId=null;ideaDraftState={};window._ideeFormStatus=null;}
  async function saveIdee(){
    captureIdeeFormDraft();
    const i=currentIdeeDraft(),status=window._ideeFormStatus||i.statut||'Graine';if(status==='Abandonnée'){closeIdeeModal();return;}
    const titleEl=document.getElementById('if-titre'),noteEl=document.getElementById('if-note'),imageEl=document.getElementById('if-image'),colorEl=document.getElementById('if-page-color'),favEl=document.getElementById('if-favori'),typeEl=document.getElementById('if-type'),genreEl=document.getElementById('if-genre'),ambEl=document.getElementById('if-ambiance'),notesEl=document.getElementById('if-notes-rich');
    const payload={statut:status,note:noteEl?noteEl.value.trim():(i.note||''),image_url:imageEl?imageEl.value.trim()||null:(i.image_url||null),page_color:colorEl?colorEl.value:(i.page_color||'#44385F'),favori:favEl?favEl.checked:!!i.favori,updated_at:new Date().toISOString()};
    if(status!=='Graine'){payload.titre=titleEl?.value.trim()||i.titre||'Idée';payload.type=typeEl?.value.trim()||null;payload.genre=genreEl?.value.trim()||null;const a=ambEl?.value.trim();payload.ambiance=a?a.split(',').map(x=>x.trim()).filter(Boolean):null;}else if(!editingIdeeId){payload.titre='Idée';}
    if(notesEl)payload.notes_pelemele=notesEl.innerHTML;else if(i.notes_pelemele)payload.notes_pelemele=i.notes_pelemele;
    if(status==='Prometteuse'||editingIdeeChars.length)payload.personnages_idees=editingIdeeChars.filter(c=>c.nom?.trim()||c.note?.trim());
    let error;if(editingIdeeId)({error}=await db().from('idees').update(payload).eq('id',editingIdeeId));else{payload.user_id=currentUser.id;({error}=await db().from('idees').insert(payload));}
    if(error){alert('Erreur : '+error.message);return;}closeIdeeModal();await renderIdees();
  }
  async function abandonnerIdee(){if(!editingIdeeId||!confirm('Déplacer cette idée dans Abandonnées ? Elle pourra être réactivée plus tard.'))return;const {error}=await db().from('idees').update({statut:'Abandonnée',abandoned_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',editingIdeeId);if(error){alert(error.message);return;}closeIdeeModal();pepiniereView='abandoned';renderIdees();}
  async function reactiverIdee(id){const {error}=await db().from('idees').update({statut:'À creuser',abandoned_at:null,updated_at:new Date().toISOString()}).eq('id',id);if(error){alert(error.message);return;}pepiniereView='active';renderIdees();}
  async function transformerIdee(type){
    if(!editingIdeeId)return;
    captureIdeeFormDraft();
    const idee=currentIdeeDraft();
    const display=ideaDisplayTitle(idee);
    if(!confirm(`Transformer « ${display} » en ${type} ?`))return;
    const title=(idee.titre&&idee.titre!=='Idée'&&idee.titre!=='Sans titre')?idee.titre:display;
    let newId,updatePayload={transforme_en_type:type};
    if(type==='oeuvre'){
      const {data,error}=await db().from('oeuvres').insert({titre:title,resume:idee.note||'',user_id:currentUser.id}).select('id').single();
      if(error){alert('Erreur : '+error.message);return;}newId=data.id;updatePayload.transforme_en_oeuvre_id=newId;
    }else if(type==='saga'){
      const {data,error}=await db().from('sagas').insert({nom:title,description:idee.note||'',user_id:currentUser.id}).select('id').single();
      if(error){alert('Erreur : '+error.message);return;}newId=data.id;updatePayload.transforme_en_saga_id=newId;
    }else if(type==='recueil'){
      const {data,error}=await db().from('recueils').insert({titre:title,resume:idee.note||'',user_id:currentUser.id}).select('id').single();
      if(error){alert('Erreur : '+error.message);return;}newId=data.id;updatePayload.transforme_en_recueil_id=newId;
    }
    await db().from('idees').update(updatePayload).eq('id',editingIdeeId);
    closeIdeeModal();
    if(type==='oeuvre')openOeuvreDetail(newId);else if(type==='saga')openSagaDetail(newId);else if(type==='recueil')openRecueilDetail(newId);
  }

  async function savePoeme(){
    const motsClesRaw = document.getElementById('pmf-motscles').value.trim();
    const maxOrdre = recueilPoemesData.reduce((m,p)=>Math.max(m, p.ordre||0), 0);
    const payload = {
      titre: document.getElementById('pmf-titre').value.trim()||'Sans titre',

      statut_selection: document.getElementById('pmf-selection').value || null,
      theme_principal: document.getElementById('pmf-theme').value.trim(),
      date_ecriture: document.getElementById('pmf-date').value || null,
      mots_cles: motsClesRaw ? motsClesRaw.split(',').map(t=>t.trim()).filter(Boolean) : null,
      extrait: document.getElementById('pmf-extrait').value.trim(),
      texte: document.getElementById('pmf-texte').value.trim(),
      section_id: document.getElementById('pmf-section').value || null,
    };
    if (currentRecueilType === 'anthologie') {
      payload.recueil_origine_id = document.getElementById('pmf-recueil-origine').value || null;
      payload.emplacement = document.getElementById('pmf-emplacement').value || null;
      const action = document.getElementById('pmf-action').value;
      payload.actions = action ? [action] : null;
      payload.remarque = document.getElementById('pmf-remarque').value.trim();
    }
    let error;
    if (editingPoemeId) ({ error } = await db().from('poemes').update(payload).eq('id', editingPoemeId));
    else { payload.user_id = currentUser.id; payload.recueil_id = currentRecueilId; payload.ordre = maxOrdre + 1; ({ error } = await db().from('poemes').insert(payload)); }

  function initials(str){ return (str||'').split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase(); }

  // ============================================================
  // Apparence : thème global + couleurs locales des objets
  // ============================================================
  const DEFAULT_ACCENT = '#7C5CBF';
  let globalAppearance={mode:'clair',themeColor:'#F6F3FB',accent:DEFAULT_ACCENT};
  function hexToRgb(hex){const h=(hex||'').replace('#','');if(!/^[0-9a-fA-F]{6}$/.test(h))return null;return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}
  function rgbToHex({r,g,b}){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
  function mixHex(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);if(!A||!B)return a||b;return rgbToHex({r:A.r+(B.r-A.r)*t,g:A.g+(B.g-A.g)*t,b:A.b+(B.b-A.b)*t});}
  function luminance(hex){const c=hexToRgb(hex);if(!c)return 1;return (0.2126*c.r+0.7152*c.g+0.0722*c.b)/255;}
  function makePalette(mode,themeColor){const base=themeColor||(mode==='sombre'?'#24202B':'#F6F3FB');if(mode==='sombre'){return {'--bg':mixHex(base,'#0D0D0F',.72),'--bg-2':mixHex(base,'#121116',.58),'--card':mixHex(base,'#111014',.66),'--line':'rgba(255,255,255,0.10)','--text':'#F5F1F8','--text-dim':'#AAA3B3'};}return {'--bg':mixHex(base,'#FFFFFF',.90),'--bg-2':mixHex(base,'#FFFFFF',.72),'--card':mixHex(base,'#FFFFFF',.94),'--line':'rgba(90,70,125,0.18)','--text':'#2B2140','--text-dim':'#7A7290'};}
  function setRootPalette(palette,accent){Object.entries(palette).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));document.documentElement.style.setProperty('--accent',accent||DEFAULT_ACCENT);}
  async function loadGlobalAppearance(){try{const {data,error}=await db().from('configuration_utilisateur').select('theme_mode,theme_color,accent_color').eq('user_id',currentUser.id).maybeSingle();if(!error&&data)globalAppearance={mode:data.theme_mode||'clair',themeColor:data.theme_color||'#F6F3FB',accent:data.accent_color||DEFAULT_ACCENT};}catch(e){console.warn('Configuration globale indisponible',e);}applyGlobalTheme();}
  function applyGlobalTheme(){const p=makePalette(globalAppearance.mode,globalAppearance.themeColor);setRootPalette(p,globalAppearance.accent);Object.entries(p).forEach(([k,v])=>document.documentElement.style.setProperty('--global'+k.slice(1),v));document.documentElement.style.setProperty('--global-accent',globalAppearance.accent||DEFAULT_ACCENT);}
  function applyObjectTheme(pageColor,accentColor){const c=pageColor||globalAppearance.themeColor;const mode=luminance(c)<.45?'sombre':'clair';const p=makePalette(mode,c);setRootPalette(p,accentColor||globalAppearance.accent);}
  function applyTheme(themeBase,accentColor){globalAppearance.mode=themeBase==='sombre'?'sombre':'clair';globalAppearance.accent=accentColor||globalAppearance.accent;applyGlobalTheme();}
  function resetTheme(){applyGlobalTheme();}

    if(!root) return;
    const topbar=root.querySelector('.admin-work-topbar');
    const layout=root.querySelector('.admin-work-layout');
    if(!topbar||!layout) return;

    const groups=[
      {key:'identity',label:'Identité',titles:['Identité & hiérarchie']},
      {key:'presentation',label:'Présentation',titles:['Présentation de l’œuvre']},
      {key:'narrative',label:'Narratif',titles:['Informations narratives']},
      {key:'manuscript',label:'Manuscrit & Atelier',titles:['Manuscrit & Atelier']},
      {key:'editorial',label:'Éditorial',titles:['Pilotage éditorial']},
      {key:'configuration',label:'Configuration',titles:['Couverture canonique','Modules de la fiche','Apparence de la page']},
      {key:'archive',label:'Archivage',titles:['Archivage']}
    ];

    const allSections=[...layout.querySelectorAll('.admin-section')];
    const byTitle=new Map(allSections.map(section=>[section.querySelector('h2')?.textContent?.trim()||'',section]));
    const tabs=document.createElement('div');
    tabs.className='admin-editor-tabs';
    const panels=document.createElement('div');
    panels.className='admin-editor-panels';

    const activate=(key)=>{
      tabs.querySelectorAll('button').forEach(btn=>btn.classList.toggle('active',btn.dataset.key===key));
      panels.querySelectorAll('.admin-editor-panel').forEach(panel=>panel.style.display=panel.dataset.key===key?'block':'none');
    };

    groups.forEach((group,index)=>{
      const sections=group.titles.map(t=>byTitle.get(t)).filter(Boolean);
      if(!sections.length) return;
      const button=document.createElement('button');
      button.type='button';
      button.dataset.key=group.key;
      button.textContent=group.label;
      button.onclick=()=>activate(group.key);
      tabs.appendChild(button);

      const panel=document.createElement('div');
      panel.className='admin-editor-panel';
      panel.dataset.key=group.key;
      panel.style.display='none';
      sections.forEach(section=>panel.appendChild(section));
      panels.appendChild(panel);
    });

    const saveStatus=layout.querySelector('#aow-save-status');
    layout.remove();
    topbar.insertAdjacentElement('afterend',tabs);
    tabs.insertAdjacentElement('afterend',panels);
    if(saveStatus){
      const statusWrap=document.createElement('div');
      statusWrap.style.marginTop='10px';
      statusWrap.appendChild(saveStatus);
      panels.insertAdjacentElement('afterend',statusWrap);
    }else if(!document.getElementById('aow-save-status')){
      const status=document.createElement('div');
      status.id='aow-save-status';
      status.className='admin-inline-status';
      panels.insertAdjacentElement('afterend',status);
    }
    const first=tabs.querySelector('button');
    if(first) activate(first.dataset.key);
  }

  function activateAdminConfigurationTabs(zone){
    if(!zone) return;
    const sections=[...zone.querySelectorAll(':scope > .admin-section')];
    if(sections.length<2) return;
    const tabs=document.createElement('div');
    tabs.className='admin-editor-tabs';
    const panels=document.createElement('div');
    panels.className='admin-editor-panels';
    const cleanLabel=(txt)=>String(txt||'').replace(/^[^\p{L}\p{N}]+/u,'').trim();
    sections.forEach((section,index)=>{
      const key='cfg-'+index;
      const label=cleanLabel(section.querySelector('h2')?.textContent)||`Réglage ${index+1}`;
      const button=document.createElement('button');
      button.type='button'; button.dataset.key=key; button.textContent=label;
      const panel=document.createElement('div');
      panel.className='admin-editor-panel'; panel.dataset.key=key; panel.style.display=index===0?'block':'none';
      panel.appendChild(section); panels.appendChild(panel);
      button.classList.toggle('active',index===0);
      button.onclick=()=>{
        tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===button));
        panels.querySelectorAll('.admin-editor-panel').forEach(p=>p.style.display=p===panel?'block':'none');
      };
      tabs.appendChild(button);
    });
    const head=zone.querySelector('.admin-catalog-head');
    if(head) head.insertAdjacentElement('afterend',tabs); else zone.prepend(tabs);
    tabs.insertAdjacentElement('afterend',panels);
  }
  async function distributeWorkWordTarget(){
    const total=Number(document.getElementById('aow-objectif')?.value||0);
    if(!total||!adminEditingOeuvreId) return alert('Renseigne d’abord un objectif global de mots.');
    const {data,error}=await db().from('chapitres').select('id,ordre').eq('oeuvre_id',adminEditingOeuvreId).order('ordre');
    if(error) return alert('Erreur : '+error.message);
    if(!data?.length) return alert('Aucun chapitre dans le Plan.');
    const base=Math.floor(total/data.length), reste=total-(base*data.length);
    const results=await Promise.all(data.map((chapitre,i)=>db().from('chapitres').update({objectif_mots:base+(i<reste?1:0)}).eq('id',chapitre.id)));
    const failed=results.find(r=>r.error);
    if(failed?.error) return alert('Erreur pendant la répartition : '+failed.error.message);
    alert(`Objectif de ${total.toLocaleString('fr-FR')} mots réparti sur ${data.length} chapitres.`);
  }

  async function openAdminSousSagaEditor(id){
    currentSousSagaId=id;
    const content=document.getElementById('content');content.innerHTML='<div class="status-line">Chargement…</div>';
    const [sr,wr]=await Promise.all([db().from('sous_sagas').select('*,sagas(nom)').eq('id',id).single(),db().from('oeuvres').select('id,titre,numero_sous_saga').eq('sous_saga_id',id).order('ordre_sous_saga')]);const ss=sr.data;if(!ss){content.innerHTML='<div class="empty">Sous-saga introuvable.</div>';return}
    const [md,selmd]=await Promise.all([db().from('saga_metadonnees').select('*').eq('saga_id',ss.saga_id).order('ordre'),db().from('sous_saga_metadonnees').select('metadata_id').eq('sous_saga_id',id)]);window._assMetaDefs=md.data||[];window._assMetaSelected=new Set((selmd.data||[]).map(x=>x.metadata_id));
    content.innerHTML=`<div class="admin-work-editor"><div class="admin-work-topbar"><div><div class="admin-work-kicker">Administration · Sous-sagas</div><h1>${safeText(ss.nom)}</h1></div><div class="admin-work-top-actions"><button class="btn-secondary" onclick="renderAdminSousSagasPage()">← Catalogue</button><button class="btn-secondary" onclick="openSousSagaDetail('${id}')">Ouvrir dans Passerelle ↗</button><button class="btn-primary" onclick="saveAdminSousSagaEditor('${id}')">Enregistrer</button></div></div><div class="admin-editor-tabs"><button class="active" onclick="adminSsTab(this,'info')">Informations</button><button onclick="adminSsTab(this,'plan')">Plan global</button><button onclick="adminSsTab(this,'appearance')">Apparence</button><button onclick="adminSsTab(this,'archive')">Archivage</button></div>
    <div id="ass-info"><section class="admin-section"><h2>Informations</h2><div class="admin-section-grid"><div class="admin-field-full"><label>Nom</label><input id="ass-nom" value="${safeText(ss.nom||'')}"></div><div><label>Saga parente</label><input value="${safeText(ss.sagas?.nom||'')}" disabled></div><div><label>Genre dominant</label><input id="ass-genre" value="${safeText(ss.genre||'')}"></div><div><label>Temporalité</label><input id="ass-temporalite" value="${safeText(ss.temporalite||'')}"></div><div><label>Cadre</label><input id="ass-lieu" value="${safeText(ss.lieu_principal||'')}" placeholder="Sélection parent Codex à brancher"></div><div><label>Trame principale</label><div class="admin-check-row"><input type="checkbox" id="ass-trame" ${ss.trame_principale?'checked':''}><div><strong>Trame principale de la saga</strong><small>Affichée en premier avec une pastille 👑.</small></div></div></div><div class="admin-field-full"><label>Mots-clés</label><input id="ass-tags" value="${safeText((ss.mots_cles||[]).join(', '))}"></div><div class="admin-field-full"><label>Métadonnées héritées de la saga</label><div style="display:flex;gap:7px;flex-wrap:wrap">${window._assMetaDefs.map(m=>`<label class="tag" style="cursor:pointer"><input type="checkbox" class="ass-meta-check" value="${m.id}" style="width:auto" ${window._assMetaSelected.has(m.id)?'checked':''}> ${safeText((m.emoji?m.emoji+' ':'')+m.nom)}</label>`).join('')||'<small>Aucune métadonnée définie dans la saga.</small>'}</div></div></div><label>À propos / résumé canonique</label>${adminRichFieldV567('ass-description',ss.description||'',160)}<label>Citation</label>${adminRichFieldV567('ass-citation',ss.citation||'',90)}</section></div>
    <div id="ass-plan" style="display:none"><section class="admin-section"><h2>Plan global</h2><p class="admin-section-sub">Les tomes/segments sont dynamiques. Ils peuvent exister avant d’être liés à une œuvre.</p><button class="btn-primary" onclick="addAdminSousSagaSegment('${id}')">+ Ajouter un tome</button><div id="ass-plan-list" style="margin-top:12px"></div></section></div>
    <div id="ass-appearance" style="display:none"><section class="admin-section"><h2>Apparence</h2><label>Couleur de page</label><input type="color" id="ass-page-color" value="${safeText(ss.page_color||globalAppearance.themeColor)}"><label>Couleur d’accent</label><input type="color" id="ass-accent" value="${safeText(ss.accent_color||globalAppearance.accent)}"><label>Bannière</label><input id="ass-banniere" value="${safeText(ss.banniere||'')}"><label class="btn-secondary upload-file-btn" style="margin-top:7px">⇧ Téléverser une bannière<input type="file" accept="image/*" onchange="uploadEntityBanner('sous_sagas','${id}',this,'ass-banniere')"></label></section></div>
    <div id="ass-archive" style="display:none"><section class="admin-section admin-danger"><h2>Archivage</h2><div class="admin-check-row"><input type="checkbox" id="ass-archive-check" ${ss.archive?'checked':''}><div><strong>Sous-saga archivée</strong><small>Masquée sans suppression.</small></div></div></section></div></div>`;
    const seg=await db().from('sous_saga_segments').select('*').eq('sous_saga_id',id).order('ordre');const z=document.getElementById('ass-plan-list');if(z)z.innerHTML=(seg.data||[]).map(renderSsSegment).join('')||'<div class="empty">Aucun tome/segment.</div>';
  }
  async function addAdminSousSagaSegment(id){
    currentSousSagaId=id;
    const r=await db().from('sous_saga_segments').select('ordre').eq('sous_saga_id',id).order('ordre',{ascending:false}).limit(1);
    if(r.error) return alert('Erreur : '+r.error.message);
    const ord=(Number(r.data?.[0]?.ordre)||0)+1;
    const {error}=await db().from('sous_saga_segments').insert({user_id:currentUser.id,sous_saga_id:id,libelle:'Tome '+ord,numero:ord,ordre:ord});
    if(error) return alert('Erreur : '+error.message);
    openAdminSousSagaEditor(id);
  }
  function adminSsTab(btn,key){document.querySelectorAll('.admin-editor-tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');['info','plan','appearance','archive'].forEach(k=>{const e=document.getElementById('ass-'+k);if(e)e.style.display=k===key?'block':'none'})}
  async function saveAdminSousSagaEditor(id){const payload={nom:document.getElementById('ass-nom').value.trim()||'Sans titre',genre:document.getElementById('ass-genre').value.trim(),temporalite:document.getElementById('ass-temporalite').value.trim(),lieu_principal:document.getElementById('ass-lieu').value.trim(),trame_principale:document.getElementById('ass-trame')?.checked||false,mots_cles:document.getElementById('ass-tags').value.split(',').map(x=>x.trim()).filter(Boolean),description:adminRichHtmlV567('ass-description'),citation:adminRichHtmlV567('ass-citation'),page_color:document.getElementById('ass-page-color').value,accent_color:document.getElementById('ass-accent').value,banniere:document.getElementById('ass-banniere').value.trim()||null,archive:document.getElementById('ass-archive-check').checked};const {error}=await db().from('sous_sagas').update(payload).eq('id',id);if(error)return alert(error.message);await db().from('sous_saga_metadonnees').delete().eq('sous_saga_id',id);const mids=[...document.querySelectorAll('.ass-meta-check:checked')].map(x=>x.value);if(mids.length){const ins=await db().from('sous_saga_metadonnees').insert(mids.map(metadata_id=>({sous_saga_id:id,metadata_id})));if(ins.error)return alert(ins.error.message)}alert('Sous-saga enregistrée ✨')}

  init();
</script>
