<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passerelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #FFFFFF; --bg-2: #F6F3FB; --card: #FFFFFF;
    --line: rgba(124,92,191,0.18);
    --text: #2B2140; --text-dim: #7A7290;
    --lavender: #8C7FB0; --lavender-deep: #5E5286;
    --wine: #7A3B4A;
    --accent: #7C5CBF;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Lora', serif; line-height:1.6; }
  h1,h2,h3,h4{ font-family:'Cormorant Garamond', serif; font-weight:600; letter-spacing:0.02em; margin:0; }
  .quote-hand{ font-family:'Caveat', cursive; font-size:1.4rem; color:var(--accent); }
  a{ color:inherit; text-decoration:none; cursor:pointer; }

  /* ---- structure générale : sidebar + contenu ---- */
  .shell{ display:flex; min-height:100vh; }
  .sidebar{ width:230px; flex-shrink:0; background:var(--bg-2); border-right:1px solid var(--line); padding:0 0 18px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .sidebar::-webkit-scrollbar{ width:7px; }
  .sidebar::-webkit-scrollbar-thumb{ background:var(--line); border-radius:10px; }
  .sidebar-brand-wrap{ position:sticky; top:0; z-index:20; background:var(--bg-2); border-bottom:1px solid var(--line); margin-bottom:10px; padding:14px 12px 10px; }
  .sidebar-brand{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; font-family:'Cormorant Garamond',serif; font-size:1.35rem; padding:8px 10px; border:none; border-radius:7px; background:transparent; color:var(--text); cursor:pointer; text-align:left; }
  .sidebar-brand:hover{ background:rgba(124,92,191,.07); }
  .sidebar-brand-chevron{ font-family:'Lora',serif; font-size:12px; color:var(--text-dim); transition:transform .15s ease; }
  .sidebar-brand-chevron.open{ transform:rotate(180deg); }
  .space-menu{ display:none; margin:6px 4px 0; padding:5px; border:1px solid var(--line); border-radius:7px; background:var(--card); box-shadow:0 8px 24px rgba(0,0,0,.08); }
  .space-menu.open{ display:block; }
  .space-menu-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 9px; border-radius:5px; font-size:12px; color:var(--text-dim); cursor:pointer; }
  .space-menu-item:hover{ background:rgba(124,92,191,.07); color:var(--text); }
  .space-menu-item.active{ color:var(--accent); font-weight:500; }
  .nav-group{ font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-dim); padding:16px 22px 6px; }
  .nav-link{ display:block; padding:9px 22px; font-size:14px; color:var(--text-dim); cursor:pointer; border-left:3px solid transparent; }
  .nav-link:hover{ color:var(--text); background:rgba(255,255,255,0.03); }
  .nav-link.active{ color:var(--accent); border-left-color:var(--accent); background:rgba(201,162,39,0.08); font-weight:500; }
  .sidebar-foot{ margin-top:auto; padding:16px 22px; border-top:1px solid var(--line); font-size:12px; color:var(--text-dim); }
  .sidebar-foot button{ background:none; border:1px solid var(--line); color:var(--text-dim); padding:6px 12px; border-radius:16px; cursor:pointer; font-family:'Lora',serif; font-size:11px; margin-top:8px; }

  .main{ flex:1; min-width:0; }
  .wrap{ max-width:1080px; margin:0 auto; padding:36px 32px 100px; }

  /* ---- bannière décorative ---- */
  .banner{ position:relative; border:1px solid var(--line); background:var(--bg-2); border-radius:6px; padding:36px 40px; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:28px; }
  .banner::before, .banner::after{ content:"✦"; position:absolute; color:var(--accent); opacity:0.5; font-size:14px; }
  .banner::before{ top:16px; left:28px; } .banner::after{ bottom:16px; right:30px; }
  .banner h1{ font-size:2rem; text-align:center; }
  .banner .sub{ text-align:center; color:var(--text-dim); font-size:14px; margin-top:6px; font-style:italic; }

  /* ---- en-tête d'une fiche (œuvre, saga...) ---- */
  .oeuvre-head{ display:flex; gap:24px; margin-bottom:24px; align-items:flex-start; }
  .cover-block{ width:100px; height:130px; flex-shrink:0; border-radius:4px; background:linear-gradient(160deg, var(--lavender)33, var(--bg-2)); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond',serif; font-size:1.6rem; color:var(--text-dim); }
  .oeuvre-info{ flex:1; }
  .oeuvre-info h1{ font-size:1.9rem; margin-bottom:4px; }
  .oeuvre-sub{ color:var(--lavender); font-size:14px; margin-bottom:12px; }
  .status-badge{ display:inline-block; font-size:11px; padding:4px 12px; border-radius:20px; background:var(--accent); color:var(--bg); font-weight:500; margin-bottom:10px; }
  .progress-bar-outer{ width:100%; max-width:340px; height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin:8px 0; }
  .progress-bar-inner{ height:100%; background:var(--accent); }
  .oeuvre-meta-line{ font-size:13px; color:var(--text-dim); }

  /* ---- cartes de stats ---- */
  .stat-cards-row{ display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; margin-bottom:26px; }
  @media (max-width:800px){ .stat-cards-row{ grid-template-columns:repeat(2,1fr); } }
  .stat-card{ background:var(--card); border:1px solid var(--line); border-radius:6px; padding:20px; }
  .stat-card h3{ font-size:13px; color:var(--text-dim); font-weight:400; margin-bottom:10px; font-family:'Lora',serif; }
  .stat-big{ font-family:'Cormorant Garamond',serif; font-size:1.9rem; color:var(--accent); font-weight:600; }

  .panel{ background:var(--card); border:1px solid var(--line); border-radius:6px; padding:22px 24px; margin-bottom:20px; }
  .panel h2{ font-size:1.1rem; color:var(--lavender); margin-bottom:14px; font-family:'Lora',serif; font-weight:500; }
  .info-line{ display:flex; justify-content:space-between; font-size:13px; padding:8px 0; border-bottom:1px solid var(--line); }
  .info-line:last-child{ border-bottom:none; }

  .head-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; flex-wrap:wrap; gap:10px; }
  .btn-primary{ background:var(--accent); color:var(--bg); border:none; padding:10px 18px; border-radius:5px; cursor:pointer; font-family:'Lora',serif; font-size:13px; font-weight:500; }
  .btn-secondary{ background:var(--bg-2); border:1px solid var(--line); color:var(--text); padding:10px 18px; border-radius:5px; cursor:pointer; font-family:'Lora',serif; font-size:13px; }
  .search-input{ background:var(--bg-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:9px 14px; font-size:13px; font-family:'Lora',serif; min-width:220px; }

  /* ---- galerie de cartes (sagas, œuvres, personnages, idées) ---- */
  .gallery{ display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
  @media (max-width:820px){ .gallery{ grid-template-columns:repeat(2,1fr); } }
  .char-card{ position:relative; cursor:pointer; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--bg-2); transition:transform 0.15s ease, border-color 0.15s ease; }
  .char-card:hover{ transform:translateY(-3px); border-color:var(--accent); }
  .char-portrait{ height:100px; display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond',serif; font-size:1.7rem; color:var(--text); opacity:0.9; position:relative; }
  .fav-heart{ position:absolute; top:8px; right:10px; font-size:15px; color:var(--accent); }
  .char-name{ padding:12px 14px 3px; font-size:15px; font-weight:500; }
  .char-role{ padding:0 14px 14px; font-size:12px; color:var(--text-dim); }

  .empty{ text-align:center; padding:60px 24px; color:var(--text-dim); border:1px dashed var(--line); border-radius:6px; font-size:14px; }
  .status-line{ text-align:center; color:var(--text-dim); font-size:13px; padding:50px; }

  /* ---- auth ---- */
  .auth-box{ max-width:380px; margin:100px auto; background:var(--bg-2); border:1px solid var(--line); border-radius:8px; padding:36px; }
  .auth-box h1{ font-size:1.8rem; margin-bottom:6px; text-align:center; }
  .auth-box .sub{ text-align:center; color:var(--text-dim); font-size:13px; margin-bottom:26px; font-style:italic; }
  .auth-tabs{ display:flex; gap:4px; margin-bottom:22px; border:1px solid var(--line); border-radius:20px; padding:3px; }
  .auth-tabs button{ flex:1; background:none; border:none; color:var(--text-dim); padding:8px; border-radius:16px; cursor:pointer; font-family:'Lora',serif; font-size:13px; }
  .auth-tabs button.active{ background:var(--accent); color:var(--bg); font-weight:500; }
  label{ display:block; font-size:12px; color:var(--text-dim); margin:14px 0 5px; }
  input, select, textarea{ width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:5px; padding:10px 12px; font-family:'Lora',serif; font-size:14px; }
  textarea{ min-height:80px; resize:vertical; }
  .auth-submit{ width:100%; margin-top:22px; background:var(--accent); color:var(--bg); border:none; padding:12px; border-radius:5px; font-weight:500; cursor:pointer; font-family:'Lora',serif; font-size:14px; }
  .auth-msg{ font-size:12px; margin-top:14px; text-align:center; min-height:16px; }
  .auth-msg.error{ color:#e88; }
  .auth-msg.ok{ color:#8fc95a; }

  /* ---- modal ---- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:40px 20px; overflow-y:auto; }
  .modal-overlay.open{ display:flex; }
  .modal-box{ background:var(--card); border:1px solid var(--line); border-radius:6px; width:100%; max-width:560px; }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; padding:20px 26px; border-bottom:1px solid var(--line); }
  .modal-head h2{ font-size:1.3rem; }
  .modal-head button{ background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; }
  .modal-body{ padding:22px 26px; display:flex; flex-direction:column; gap:14px; max-height:65vh; overflow-y:auto; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:18px 26px; border-top:1px solid var(--line); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  table.ch-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.ch-table th{ text-align:left; color:var(--text-dim); font-weight:400; padding:8px 10px; border-bottom:1px solid var(--line); font-size:12px; }
  table.ch-table td{ padding:10px 10px; border-bottom:1px solid var(--line); }
  table.ch-table tbody tr{ cursor:pointer; }
  table.ch-table tbody tr:hover{ background:var(--bg-2); }
  .etat-pill{ font-size:11px; padding:3px 10px; border-radius:20px; display:inline-block; background:var(--line); color:var(--text-dim); }
  .cards-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .ch-card{ cursor:pointer; border:1px solid var(--line); border-radius:6px; padding:14px; background:var(--bg-2); }
  .ch-card:hover{ border-color:var(--accent); }
  .kanban-row{ display:flex; gap:14px; overflow-x:auto; padding-bottom:8px; }
  .kanban-col{ min-width:200px; flex:1; background:var(--bg-2); border:1px solid var(--line); border-radius:6px; padding:12px; }
  .kanban-col h4{ font-size:12px; color:var(--text-dim); text-transform:uppercase; margin-bottom:10px; }
  .kanban-card{ cursor:pointer; background:var(--card); border:1px solid var(--line); border-radius:5px; padding:10px 12px; margin-bottom:8px; font-size:13px; }
  .kanban-card:hover{ border-color:var(--accent); }

  .side-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; z-index:150; }
  .side-overlay.open{ display:block; }
  .side-panel{ position:fixed; top:0; right:-380px; width:360px; max-width:90vw; height:100%; background:var(--card); border-left:1px solid var(--line); z-index:151; transition:right .25s ease; padding:22px; overflow-y:auto; }
  .side-panel.open{ right:0; }
  .memo-item{ border:1px solid var(--line); border-radius:5px; padding:10px 12px; margin-bottom:10px; font-size:13px; }
  .memo-date{ font-size:11px; color:var(--text-dim); margin-bottom:4px; }


  /* ---- Accueil Passerelle : grille de cockpit ---- */
  .home-two-col{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; align-items:start; }
  .home-two-col > .panel{ margin-bottom:20px; height:calc(100% - 20px); box-sizing:border-box; }
  .home-stats-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .home-stats-grid .stat-card{ padding:16px; }
  .home-horizon-list{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .home-horizon-item{ border:1px solid var(--line); border-radius:6px; background:var(--bg-2); padding:12px; cursor:pointer; transition:border-color .15s ease, transform .15s ease; }
  .home-horizon-item:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .home-horizon-item strong{ display:block; font-size:13px; margin-bottom:3px; }
  .home-horizon-item span{ font-size:11px; color:var(--text-dim); }
  .home-quick-list{ display:grid; gap:8px; }
  .home-quick-link{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:var(--bg-2); font-size:12px; color:var(--text-dim); }
  .home-quick-link:hover{ border-color:var(--accent); color:var(--text); }
  .home-quick-link-left{ display:flex; align-items:center; gap:9px; min-width:0; }
  .home-quick-link-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  @media(max-width:930px){ .home-two-col{ grid-template-columns:1fr; } .home-two-col > .panel{ height:auto; } }
  @media(max-width:560px){ .home-stats-grid,.home-horizon-list{ grid-template-columns:1fr; } }


  /* ---- Passerelle · Back-office V1 ---- */
  .sidebar-quick{ padding:14px 14px 8px; border-top:1px solid var(--line); margin-top:auto; }
  .sidebar-quick-title{ font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-dim); padding:0 8px 8px; }
  .quick-link{ display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:5px; color:var(--text-dim); font-size:12px; cursor:pointer; }
  .quick-link:hover{ background:rgba(124,92,191,.08); color:var(--accent); }
  .quick-link-empty{ padding:4px 8px 10px; font-size:11px; color:var(--text-dim); font-style:italic; }
  .switch-space{ margin:8px 14px 12px; padding:9px 11px; border:1px solid var(--line); border-radius:6px; text-align:center; font-size:12px; cursor:pointer; color:var(--lavender-deep); background:var(--card); }
  .switch-space:hover{ border-color:var(--accent); color:var(--accent); }
  .admin-hero{ display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:24px; }
  .admin-hero h1{ font-size:2rem; }
  .admin-hero p{ margin:6px 0 0; color:var(--text-dim); font-size:13px; }
  .admin-tabs{ display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:22px; flex-wrap:wrap; }
  .admin-tab{ border:none; background:none; color:var(--text-dim); font-family:'Lora',serif; padding:10px 14px; cursor:pointer; border-bottom:2px solid transparent; }
  .admin-tab.active{ color:var(--accent); border-bottom-color:var(--accent); font-weight:500; }
  .admin-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:24px; }
  @media(max-width:900px){ .admin-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media(max-width:620px){ .admin-grid{ grid-template-columns:1fr; } }
  .admin-card{ border:1px solid var(--line); background:var(--card); border-radius:7px; padding:18px; }
  .admin-card h3{ font-size:1.05rem; margin-bottom:5px; }
  .admin-card p{ font-size:12px; color:var(--text-dim); margin:0 0 14px; min-height:38px; }
  .admin-card-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .admin-section{ border:1px solid var(--line); border-radius:7px; background:var(--card); padding:20px; margin-bottom:18px; }
  .admin-section-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
  .admin-section-head h2{ font-size:1.15rem; color:var(--lavender-deep); }
  .admin-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .admin-table th{ text-align:left; font-weight:400; color:var(--text-dim); border-bottom:1px solid var(--line); padding:8px; }
  .admin-table td{ border-bottom:1px solid var(--line); padding:9px 8px; vertical-align:middle; }
  .admin-table tr:last-child td{ border-bottom:none; }
  .admin-inline-form{ display:grid; grid-template-columns:1fr 2fr 80px auto; gap:8px; align-items:end; margin-bottom:14px; }
  @media(max-width:780px){ .admin-inline-form{ grid-template-columns:1fr; } }
  .admin-inline-form label{ margin:0 0 4px; }
  .tiny-btn{ border:1px solid var(--line); background:var(--bg-2); color:var(--text); border-radius:4px; padding:6px 9px; cursor:pointer; font-family:'Lora',serif; font-size:11px; }
  .tiny-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .danger-btn{ color:#9b4554; }
  .admin-notice{ border:1px dashed var(--line); background:var(--bg-2); border-radius:6px; padding:12px 14px; color:var(--text-dim); font-size:12px; margin-bottom:16px; }


  /* ---- Back-office : mode administration dédié ---- */
  .admin-mode-sidebar{ background:#fbf9f4; }
  .admin-mode-brand{ padding:18px 18px 14px; border-bottom:1px solid var(--line); }
  .admin-mode-brand strong{ display:block; font-family:'Cormorant Garamond',serif; font-size:1.35rem; color:var(--text); }
  .admin-mode-brand span{ display:block; font-size:10px; color:var(--text-dim); margin-top:2px; }
  .admin-back-link{ margin:10px 14px 8px; padding:9px 10px; border:1px solid var(--line); border-radius:6px; cursor:pointer; font-size:12px; color:var(--lavender-deep); background:var(--card); }
  .admin-back-link:hover{ border-color:var(--accent); color:var(--accent); }
  .admin-mode-nav{ padding:4px 0 14px; }
  .admin-mode-nav .nav-link{ padding:10px 20px; }
  .admin-mode-footer{ margin-top:auto; border-top:1px solid var(--line); padding:14px 18px; font-size:11px; color:var(--text-dim); }
  .admin-catalog-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:18px; padding-bottom:22px; margin-bottom:24px; border-bottom:1px solid var(--line); }
  .admin-catalog-head h1{ font-size:2rem; }
  .admin-catalog-head p{ margin:3px 0 0; color:var(--text-dim); font-size:13px; }
  .admin-catalog-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .admin-filterbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
  .admin-filterbar .search-input{ flex:1 1 280px; }
  .admin-filterbar select{ width:auto; min-width:170px; }
  .admin-catalog-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
  .admin-catalog-card{ border:1px solid var(--line); border-radius:10px; background:var(--card); overflow:hidden; cursor:pointer; transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease; }
  .admin-catalog-card:hover{ transform:translateY(-2px); border-color:var(--accent); box-shadow:0 8px 24px rgba(80,57,120,.08); }
  .admin-catalog-visual{ height:150px; background:var(--bg-2); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .admin-catalog-visual img{ width:100%; height:100%; object-fit:contain; }
  .admin-catalog-placeholder{ font-family:'Cormorant Garamond',serif; font-size:2rem; color:var(--lavender-deep); }
  .admin-catalog-body{ padding:16px; }
  .admin-catalog-body h3{ font-size:1.25rem; margin-bottom:5px; }
  .admin-catalog-meta{ color:var(--text-dim); font-size:11px; line-height:1.55; min-height:34px; }
  .admin-catalog-card-actions{ display:flex; gap:8px; margin-top:13px; }
  .admin-catalog-card-actions button{ flex:1; }
  @media(max-width:900px){ .admin-catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media(max-width:620px){ .admin-catalog-grid{grid-template-columns:1fr;} .admin-catalog-head{align-items:flex-start;flex-direction:column;} }

  /* ---- Relecture : vue de pilotage par horizons ---- */
  .relecture-page{ position:relative; }
  .relecture-banner-slot{ min-height:118px; border:1px dashed var(--line); border-radius:8px; background:linear-gradient(135deg, rgba(124,92,191,.05), rgba(246,243,251,.7)); margin-bottom:24px; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--text-dim); padding:22px; }
  .relecture-banner-slot strong{ display:block; color:var(--lavender-deep); font-family:'Cormorant Garamond',serif; font-size:1.25rem; margin-bottom:3px; }
  .relecture-columns{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; align-items:start; }
  .relecture-column{ min-width:0; }

<body>

<div id="app"><div class="status-line">Chargement…</div></div>

<script>
  const supabaseUrl = 'https://ilhfzulwuuxyidhityoo.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsaGZ6dWx3dXV4eWlkaGl0eW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NDA5NTgsImV4cCI6MjEwMjQxNjk1OH0.nux1ehaes_1rPSQhaYJ3hdCcipYn3B5PQMokUzSuBl0';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);
  const db = () => sb.schema('passerelle');

  const app = document.getElementById('app');
  let currentUser = null;

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if (session) { currentUser = session.user; renderShell(); navigate('accueil'); }
    else renderAuth();
  }

  function renderAuth(mode){
    mode = mode || 'login';
    app.innerHTML = `
      <div class="auth-box">
        <h1>✒️ Passerelle</h1>
        <div class="sub">L'atelier de vos histoires</div>
        <div class="auth-tabs">
          <button class="${mode==='login'?'active':''}" onclick="renderAuth('login')">Se connecter</button>
          <button class="${mode==='signup'?'active':''}" onclick="renderAuth('signup')">Créer un compte</button>
        </div>
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="toi@exemple.com">
        <label>Mot de passe</label>
        <input type="password" id="auth-password" placeholder="••••••••">
        <button class="auth-submit" onclick="${mode==='login' ? 'doLogin()' : 'doSignup()'}">${mode==='login' ? 'Se connecter' : 'Créer mon compte'}</button>
        <div class="auth-msg" id="auth-msg"></div>
      </div>
    `;
  }

  async function doLogin(){
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const msg = document.getElementById('auth-msg');
    msg.textContent = 'Connexion…'; msg.className = 'auth-msg';
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { msg.textContent = error.message; msg.className = 'auth-msg error'; return; }
    currentUser = data.user;
    renderShell(); navigate('accueil');
  }

  async function doSignup(){
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const msg = document.getElementById('auth-msg');
    if (password.length < 6) { msg.textContent = 'Le mot de passe doit faire au moins 6 caractères.'; msg.className = 'auth-msg error'; return; }
    msg.textContent = 'Création du compte…'; msg.className = 'auth-msg';
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) { msg.textContent = error.message; msg.className = 'auth-msg error'; return; }
    if (data.session) { currentUser = data.user; renderShell(); navigate('accueil'); }
    else { msg.textContent = 'Compte créé — vérifie ta boîte mail, puis connecte-toi.'; msg.className = 'auth-msg ok'; }
  }

  async function doLogout(){ await sb.auth.signOut(); currentUser = null; renderAuth(); }

  const NAV = [
    { group: 'Passerelle', items: [
      { key:'accueil', label:'Accueil', real:true },
    ]},
    { group: 'Bibliothèque', items: [
      { key:'oeuvres', label:'Œuvres', real:true },
      { key:'sagas', label:'Sagas', real:true },
      { key:'poesie', label:'Recueils de poésie', real:true },
      { key:'personnages', label:'Personnages', real:true },
    ]},
    { group: 'Atelier', items: [
      { key:'relecture', label:'Relecture', real:true },
      { key:'planning', label:'Planning', real:true, special:'todum' },
      { key:'idees', label:'Pépinière', real:true },
    ]},
    { group: 'Pilotage', items: [
      { key:'bureau-editorial', label:'Bureau éditorial', real:true },
      { key:'archives', label:'Archives', real:false },
      { key:'administration', label:'⚙ Administration', real:true },
    ]}
  ];

  function renderShell(){
    app.innerHTML = `
      <div class="shell">
        <div class="sidebar">
          <div class="sidebar-brand-wrap">
            <button class="sidebar-brand" type="button" onclick="toggleSpaceMenu(event)" aria-expanded="false">
              <span>✒️ Passerelle</span><span class="sidebar-brand-chevron" id="space-chevron">⌄</span>
            </button>
            <div class="space-menu" id="space-menu">
              <div class="space-menu-item active" onclick="closeSpaceMenu();navigate('accueil')"><span>✒️ Passerelle</span><span>Actif</span></div>
              <div class="space-menu-item" onclick="closeSpaceMenu();openPasseAiles()"><span>🪽 Passe-Ailes</span><span>↗</span></div>
            </div>
          </div>
          ${NAV.map(g => `
            <div class="nav-group">${g.group}</div>
            ${g.items.map(it => `<div class="nav-link" id="nav-${it.key}" onclick="navigate('${it.key}')">${it.label}</div>`).join('')}
          `).join('')}
          <div class="sidebar-quick">
            <div class="sidebar-quick-title">Liens rapides</div>
            <div id="sidebar-quick-links"><div class="quick-link-empty">Chargement…</div></div>
          </div>
          <div class="sidebar-foot">
            ${currentUser.email}
            <button onclick="doLogout()">Déconnexion</button>
          </div>
        </div>
        <div class="main"><div class="wrap" id="content"></div></div>
      </div>
      ${sagaModalHtml()}
      ${sousSagaModalHtml()}
      ${oeuvreModalHtml()}
      ${personnageModalHtml()}
      ${ideeModalHtml()}
      ${chapitreModalHtml()}
      ${personnageOeuvreModalHtml()}
      ${planModalHtml()}
      ${correctionModalHtml()}
      ${luModalHtml()}
      ${chronoModalHtml()}
      ${ssPlanModalHtml()}
      ${recueilModalHtml()}
      ${poemeModalHtml()}
      <div class="side-overlay" id="memo-overlay" onclick="closeMemoPanel()"></div>
      <div class="side-panel" id="memo-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h2 id="memo-panel-title" style="font-size:1.1rem;">Notes</h2>
          <button onclick="closeMemoPanel()" style="background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer;">✕</button>
        </div>
        <div id="memo-list"></div>
        <textarea id="memo-new" placeholder="Ajouter une note..." style="margin-top:14px;"></textarea>
        <button class="btn-primary" style="width:100%; margin-top:8px;" onclick="addMemo()">Ajouter</button>
      </div>`;
    loadSidebarQuickLinks();
  }

  function toggleSpaceMenu(event){
    if (event) event.stopPropagation();
    const menu = document.getElementById('space-menu');
    const chevron = document.getElementById('space-chevron');
    if (!menu) return;
    const opening = !menu.classList.contains('open');
    menu.classList.toggle('open', opening);
    if (chevron) chevron.classList.toggle('open', opening);
    const button = document.querySelector('.sidebar-brand');
    if (button) button.setAttribute('aria-expanded', opening ? 'true' : 'false');
  }

  function closeSpaceMenu(){
    const menu = document.getElementById('space-menu');
    const chevron = document.getElementById('space-chevron');
    if (menu) menu.classList.remove('open');
    if (chevron) chevron.classList.remove('open');
    const button = document.querySelector('.sidebar-brand');
    if (button) button.setAttribute('aria-expanded','false');
  }

  document.addEventListener('click', (event) => {
    if (!event.target.closest('.sidebar-brand-wrap')) closeSpaceMenu();
  });

  function setActiveNav(key){
    document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
    const el = document.getElementById('nav-'+key);
    if (el) el.classList.add('active');
  }

  function navigate(key){
    resetTheme();
    setActiveNav(key);
    const item = NAV.flatMap(g=>g.items).find(i=>i.key===key);
    const content = document.getElementById('content');
    if (item && item.special === 'todum'){ openQuickLinkBySlug('todum'); return; }
    if (!item.real){
      content.innerHTML = `<h2 style="margin-bottom:20px;">${item.label}</h2><div class="empty">Cette page n'est pas encore branchée à Supabase.<br><span style="font-size:11px;">Le schéma existe déjà pour elle — on la construit dès qu'on y arrive dans l'ordre.</span></div>`;
      return;
    }
    if (key === 'accueil') renderAccueil();
    if (key === 'oeuvres') renderOeuvres();
    if (key === 'sagas') renderSagas();
    if (key === 'personnages') renderPersonnages();
    if (key === 'idees') renderIdees();
    if (key === 'relecture') renderRelecture();
    if (key === 'bureau-editorial') renderBureauEditorial();
    if (key === 'poesie') renderPoesie();
    if (key === 'administration') renderAdministration();
  }


  // ============================================================
  // LIENS RAPIDES + BASCULE PASSE-AILES
  // ============================================================
  function safeText(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function loadSidebarQuickLinks(){
    const zone = document.getElementById('sidebar-quick-links');
    if (!zone) return;
    const { data, error } = await db().from('liens_rapides').select('id, nom, url, icone, slug, ordre, actif').eq('actif', true).order('ordre', { ascending:true });
    if (error){
      zone.innerHTML = `<div class="quick-link-empty">À configurer dans Administration</div>`;
      return;
    }
    if (!data?.length){ zone.innerHTML = `<div class="quick-link-empty">Aucun lien configuré</div>`; return; }
    zone.innerHTML = data.map(l => `<a class="quick-link" href="${safeText(l.url)}" target="_blank" rel="noopener"><span>${safeText(l.icone||'↗')}</span><span>${safeText(l.nom)}</span></a>`).join('');
  }

  async function openQuickLinkBySlug(slug){
    const { data, error } = await db().from('liens_rapides').select('url').eq('slug',slug).eq('actif',true).maybeSingle();
    if (error || !data?.url){
      alert('Ce lien rapide n’est pas encore configuré. Va dans Administration → Liens rapides.');
      navigate('administration');
      return;
    }
    window.open(data.url, '_blank', 'noopener');
  }

  function openPasseAiles(){
    alert('Passe-Ailes sera branché ici pendant son propre audit. Le bouton est déjà réservé dans la navigation.');
  }

  // ============================================================
  // ADMINISTRATION / BACK-OFFICE — MODE DÉDIÉ
  // ============================================================
  let adminTab = 'collections';
  const ADMIN_NAV = [
    ['collections','Collections'], ['sagas','Sagas'], ['sous-sagas','Sous-sagas'],
    ['oeuvres','Œuvres'], ['recueils','Recueils de poésie'], ['personnages','Personnages'], ['medias','Médias'], ['modeles-personnages','Modèles de fiches Personnage'],
    ['pepiniere','Pépinière'], ['configuration','Configuration']
  ];

  function renderAdminSidebar(){
    const sidebar=document.querySelector('.sidebar'); if(!sidebar) return;
    sidebar.classList.add('admin-mode-sidebar');
    sidebar.innerHTML=`
      <div class="admin-mode-brand"><strong>⚙ Back-office</strong><span>Administration de Passerelle</span></div>
      <div class="admin-back-link" onclick="leaveAdministration()">← Retour à Passerelle</div>
      <div class="nav-group">Catalogue</div>
      <nav class="admin-mode-nav">
        ${ADMIN_NAV.filter(([k])=>k!=='configuration').map(([k,l])=>`<div class="nav-link admin-nav-link ${adminTab===k?'active':''}" data-admin-key="${k}" onclick="adminNavigate('${k}')">${l}</div>`).join('')}
      </nav>
      <div class="nav-group">Réglages</div>
      <nav class="admin-mode-nav">
        <div class="nav-link admin-nav-link ${adminTab==='configuration'?'active':''}" data-admin-key="configuration" onclick="adminNavigate('configuration')">Configuration</div>
      </nav>
      <div class="admin-mode-footer">${safeText(currentUser?.email||'')}<br><button class="tiny-btn" style="margin-top:8px" onclick="doLogout()">Déconnexion</button></div>`;
  }

  function leaveAdministration(){
    renderShell();
    navigate('accueil');
  }

  async function renderAdministration(tab){
    adminTab=tab || adminTab || 'collections';
    renderAdminSidebar();
    await adminNavigate(adminTab);
  }

  async function adminNavigate(tab){
    adminTab=tab;
    document.querySelectorAll('.admin-nav-link').forEach(el=>el.classList.toggle('active',el.dataset.adminKey===tab));
    const content=document.getElementById('content'); if(!content) return;
    content.innerHTML='<div class="status-line">Chargement du back-office…</div>';
    if(tab==='collections') return renderAdminCollectionsPage();
    if(tab==='sagas') return renderAdminSagasPage();
    if(tab==='sous-sagas') return renderAdminSousSagasPage();
    if(tab==='oeuvres') return renderAdminOeuvresPage();
    if(tab==='recueils') return renderAdminRecueilsPage();
    if(tab==='personnages') return renderAdminPersonnagesPage();

  async function saveQuickLink(){
    const nom=document.getElementById('ql-nom')?.value.trim(), url=document.getElementById('ql-url')?.value.trim(), icone=document.getElementById('ql-icone')?.value.trim()||'↗';
    if(!nom||!url){alert('Nom et URL sont nécessaires.');return;} let parsed; try{parsed=new URL(url)}catch(e){alert('L’URL doit commencer par http:// ou https://');return;}
    const slug=nom.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    const {data:maxRows}=await db().from('liens_rapides').select('ordre').order('ordre',{ascending:false}).limit(1); const ordre=(maxRows?.[0]?.ordre||0)+10;
    const {error}=await db().from('liens_rapides').insert({user_id:currentUser.id,nom,url:parsed.href,icone,slug,ordre,actif:true}); if(error){alert('Erreur : '+error.message);return;} adminNavigate('configuration');
  }

  async function renderAccueil(){
    const content = document.getElementById('content');
    content.innerHTML = `<div class="status-line">Chargement…</div>`;

    const now = new Date();
    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);
    const startOfYear = new Date(now.getFullYear(), 0, 1).toISOString().slice(0,10);

    // horizon_annee est ajouté par la migration Back-office V1. Si elle n'est pas encore
    // installée, l'accueil reste utilisable et affiche simplement une invitation à la configurer.
    const horizonQuery = await db().from('oeuvres').select('id,titre,statut,mots_ecrits,objectif_mots,horizon_annee').eq('archive',false).eq('horizon_annee',now.getFullYear()).order('titre',{ascending:true}).limit(6);

      db().from('oeuvres').select('id, titre, statut, mots_ecrits, objectif_mots').eq('statut','En écriture').order('updated_at', { ascending:false }).limit(3),
      db().from('idees').select('statut', { count:'exact' }).in('statut', ['À creuser','Prometteuse']),
      db().from('idees').select('titre, note').order('created_at', { ascending:false }).limit(1).maybeSingle(),
      Promise.all([
        db().from('oeuvres').select('*', { count:'exact', head:true }).eq('statut','En écriture'),
        db().from('chapitres').select('*', { count:'exact', head:true }).gte('date_ecriture', startOfMonth),
        db().from('relectures').select('*', { count:'exact', head:true }).is('date_terminee', null),
      ]),
      db().from('objectifs_annuels').select('objectif_mots').eq('annee', now.getFullYear()).maybeSingle(),
      db().from('sessions_ecriture').select('mots_ecrits').gte('date', startOfYear),
      db().from('liens_rapides').select('id,nom,url,icone,slug,ordre,actif').eq('actif',true).order('ordre',{ascending:true}).limit(6),
    ]);

    const objectifAnnee = objectifAnnuel.data?.objectif_mots;
    const pctAnnee = objectifAnnee ? Math.min(100, Math.round(motsAnnee/objectifAnnee*100)) : 0;

          </div>`;
        }).join('')}</div>`}
      </div>

        <div class="panel">
          <h2>L’atelier en un regard</h2>

            <div class="stat-card"><h3>Œuvres en écriture</h3><div class="stat-big">${nbEnEcriture ?? 0}</div></div>

  // BUREAU ÉDITORIAL
  // ============================================================
  const DESTINATIONS = ['Découverte','Exclusivité abonnement','Passerelle','Librairie'];
  const NIVEAUX = ['V1','V1.5','V2'];
  const STATUTS_EDITORIAUX = ['V1 à écrire','V1 en cours','V1 terminée','V1.5 à faire','V1.5 en cours','V1.5 terminée','V2 à écrire','V2 en cours','V2 terminée'];
  const BE_TABS = [
    { key:'catalogue', label:'Catalogue' },
    { key:'destinations', label:'Destinations' },
    { key:'niveau', label:'Cibles éditoriales' },
  ];

  let beSagas = [];
  let beUnivers = [];
  let beSousSagas = [];

  function horizonLabel(year){
    const y = new Date().getFullYear();
    if (!year) return 'N/A';
    if (Number(year) === y) return `Horizon Y · ${y}`;
    if (Number(year) === y + 1) return `Horizon Y+1 · ${y+1}`;
    return String(year);
  }

  function editorialObjective(o){
    const target = o.niveau_editorial_cible;
    const status = o.statut_editorial_actuel;
    if (!target || !status) return 'À définir';
    const stage = { 'V1 à écrire':0, 'V1 en cours':1, 'V1 terminée':2, 'V1.5 à faire':3, 'V1.5 en cours':4, 'V1.5 terminée':5, 'V2 à écrire':6, 'V2 en cours':7, 'V2 terminée':8 };
    const targetDone = { 'V1':2, 'V1.5':5, 'V2':8 }[target];
    const current = stage[status];
    if (current == null || targetDone == null) return 'À définir';
    if (current === targetDone) return '✅ Objectif atteint';
    if (current > targetDone) return '✨ Cible dépassée';
    if (target === 'V1.5' && current < 5) return current >= 3 ? '🟣 En progression' : '🌿 Prochaine cible : V1.5';
    if (target === 'V2' && current < 8) return current >= 6 ? '🟣 En progression' : '💎 Prochaine cible : V2';
    return '🟣 En progression';
  }

  function destinationKey(value){
    return value || 'Non définie';
  }

  function buildDestinationDonut(data){
    const labels = [...DESTINATIONS, 'Non définie'];
    const counts = Object.fromEntries(labels.map(x => [x,0]));
    data.forEach(o => counts[destinationKey(o.destination_editoriale)] = (counts[destinationKey(o.destination_editoriale)]||0)+1);
    const total = Math.max(1, data.length);
    const palette = ['#78b55b','#aa79d6','#d4a52b','#b95a67','#73798b'];
    let cursor = 0;
    const stops = labels.map((label,i)=>{
      const start = cursor;
      cursor += counts[label] / total * 100;
      return `${palette[i]} ${start.toFixed(2)}% ${cursor.toFixed(2)}%`;
    }).join(',');
    return `<div class="be-destination-card">
      <div class="be-donut" style="background:conic-gradient(${stops});"><div class="be-donut-hole"><strong>${data.length}</strong><span>œuvres</span></div></div>
      <div class="be-legend">${labels.map((label,i)=>`<div><span class="be-dot" style="background:${palette[i]}"></span><span>${label}</span><strong>${counts[label]}</strong></div>`).join('')}</div>
    </div>`;
  }

  function sagaName(id){ return beSagas.find(s=>s.id===id)?.nom || '—'; }
  function sousSagaName(id){ return beSousSagas.find(s=>s.id===id)?.nom || ''; }
  function collectionName(o){
    const saga = beSagas.find(s=>s.id===o.saga_id);
    if (!saga) return '—';
    const uid = saga.univers_id || saga.collection_id || null;
    return beUnivers.find(u=>u.id===uid)?.nom || '—';

        <select id="be-filter-cible" onchange="applyBeFilters()"><option value="">Toutes les cibles</option>${NIVEAUX.map(v=>`<option>${v}</option>`).join('')}<option value="__none">Non définie</option></select>

  function applyBeFilters(){
    const q=(document.getElementById('be-search')?.value||'').trim().toLowerCase();
    const saga=document.getElementById('be-filter-saga')?.value||'';
    const dest=document.getElementById('be-filter-dest')?.value||'';
    const cible=document.getElementById('be-filter-cible')?.value||'';
    const statut=document.getElementById('be-filter-statut')?.value||'';
    const horizon=document.getElementById('be-filter-horizon')?.value||'';
    const rows=beData.filter(o=>{
      if(q && !`${o.titre||''} ${sagaName(o.saga_id)} ${sousSagaName(o.sous_saga_id)} ${collectionName(o)}`.toLowerCase().includes(q)) return false;
      if(saga && o.saga_id!==saga) return false;
      if(dest && (dest==='__none' ? !!o.destination_editoriale : o.destination_editoriale!==dest)) return false;
      if(cible && (cible==='__none' ? !!o.niveau_editorial_cible : o.niveau_editorial_cible!==cible)) return false;
      if(statut && o.statut_editorial_actuel!==statut) return false;
      if(horizon && (horizon==='__none' ? !!o.horizon_annee : Number(o.horizon_annee)!==Number(horizon))) return false;
      return true;
    });
    drawBeRows(rows);
  }

  async function saveBeField(id,field,value){
    const payload = {}; payload[field] = value || null;
    const old = beData.find(o=>o.id===id);
    if (field === 'statut_editorial_actuel' && old?.statut_editorial_actuel !== (value||null)) payload.date_dernier_changement_editorial = new Date().toISOString();
    const { error } = await db().from('oeuvres').update(payload).eq('id',id);
    if(error){ alert('Erreur : '+error.message); return; }
    if(old) Object.assign(old,payload);
    if(field==='destination_editoriale') renderBureauEditorial();
    else if(field==='niveau_editorial_cible' || field==='statut_editorial_actuel') drawBeRows(beData);
  }

  async function saveBeHorizon(id,value){
    const year = value ? Number(value) : null;
    const { error } = await db().from('oeuvres').update({horizon_annee:year}).eq('id',id);
    if(error){ alert('Erreur : '+error.message); return; }
    const old=beData.find(o=>o.id===id); if(old) old.horizon_annee=year;
  }

    }).join('')}</div>`;
  }
  async function renderRelecture(){
    const content = document.getElementById('content');
    content.innerHTML = `<div class="status-line">Chargement…</div>`;

    const now = new Date();
    const yearY = now.getFullYear();
    const yearY1 = yearY + 1;

    // La page Relecture est une vue du Bureau éditorial :
    // l'œuvre reste la donnée canonique, Horizon + statut éditorial décident de la colonne.
    const worksResult = await db().from('oeuvres')
      .select('id,titre,couverture,horizon_annee,statut_editorial_actuel,niveau_editorial_cible,archive,sagas(nom),sous_sagas(nom)')
      .eq('archive', false)
      .order('titre', { ascending:true });

    if (worksResult.error) {
      const missingCover = String(worksResult.error.message||'').includes('couverture');
      content.innerHTML = `<div class="empty">Erreur : ${safeText(worksResult.error.message)}${missingCover ? '<br><br><strong>La petite migration Relecture V1 doit être exécutée dans Supabase pour ajouter la couverture canonique aux œuvres.</strong>' : ''}</div>`;
      return;
    }

    // La vue existante fournit la progression lorsqu'une relecture a déjà été créée.
    // Si elle n'est pas encore disponible, la page continue à fonctionner avec une progression à 0.
    let progressByWork = {};
    const progressResult = await db().from('relecture_file_travail').select('oeuvre_id,total_chapitres,chapitres_relus');
    if (!progressResult.error) {
      (progressResult.data||[]).forEach(r => { progressByWork[r.oeuvre_id] = r; });
    }

    const works = worksResult.data || [];
    const isInProgress = o => ['V1.5 en cours','V2 en cours'].includes(o.statut_editorial_actuel);
    const isPlanned = o => ['V1.5 à faire','V2 à écrire'].includes(o.statut_editorial_actuel);

    const enCours = works.filter(isInProgress);
    const horizonY = works.filter(o => !isInProgress(o) && isPlanned(o) && Number(o.horizon_annee) === yearY);
    const horizonY1 = works.filter(o => !isInProgress(o) && isPlanned(o) && Number(o.horizon_annee) === yearY1);

    function versionLabel(o){
      const statut = o.statut_editorial_actuel || '';
      if (statut.startsWith('V1.5')) return 'V1.5';
      if (statut.startsWith('V2')) return 'V2';
      return o.niveau_editorial_cible || 'Relecture';
    }

    function contextLabel(o){
      const bits = [];
      if (o.sagas?.nom) bits.push(o.sagas.nom);
      if (o.sous_sagas?.nom) bits.push(o.sous_sagas.nom);
      return bits.length ? bits.join(' · ') : 'Œuvre indépendante';
    }

    function card(o, current=false){
      const p = progressByWork[o.id] || {};
      const total = Number(p.total_chapitres||0);
      const done = Number(p.chapitres_relus||0);
      const pct = total ? Math.min(100, Math.round(done/total*100)) : 0;
      const cover = o.couverture
        ? `<img class="relecture-cover" src="${safeText(o.couverture)}" alt="Couverture de ${safeText(o.titre)}">`
        : `<div class="relecture-cover relecture-cover-fallback">${safeText(initials(o.titre))}</div>`;
      return `<article class="relecture-card" onclick="openOeuvreDetail('${o.id}')">
        ${cover}
        <div class="relecture-card-body">
          <div class="relecture-card-title">${safeText(o.titre)}</div>
          <div class="relecture-card-context">${safeText(contextLabel(o))}</div>
          <span class="relecture-version">${safeText(versionLabel(o))}</span>
          ${current ? `<div class="relecture-progress-row"><span>${done} / ${total || '—'} chapitres</span><span>${total ? pct+' %' : 'À démarrer'}</span></div><div class="progress-bar-outer"><div class="progress-bar-inner" style="width:${pct}%;"></div></div>` : `<div style="font-size:10px;color:var(--text-dim);margin-top:auto;margin-bottom:8px;">${safeText(o.statut_editorial_actuel||'À préparer')}</div>`}
          <button class="btn-secondary relecture-action" type="button">${current ? 'Continuer la relecture' : 'Ouvrir l’œuvre'}</button>
        </div>
      </article>`;
    }

    function column(title, subtitle, items, current=false){
      return `<section class="relecture-column">
        <div class="relecture-column-title"><h2>${title}</h2><span>${subtitle}</span></div>
        ${items.length ? items.map(o=>card(o,current)).join('') : `<div class="relecture-empty">Aucune œuvre dans cette colonne pour le moment.</div>`}
      </section>`;
    }

    content.innerHTML = `<div class="relecture-page">
      <div class="relecture-banner-slot">
        <div><strong>Emplacement de ta bannière Relecture</strong><span>La bannière graphique complète remplacera ce cadre, sans titre ni texte ajouté par Passerelle.</span></div>
      </div>
      <div class="relecture-columns">
        ${column('🔥 En cours', `${enCours.length} œuvre${enCours.length>1?'s':''}`, enCours, true)}
        ${column(`📅 Horizon ${yearY}`, `${horizonY.length} prévue${horizonY.length>1?'s':''}`, horizonY)}
        ${column(`🔭 Horizon ${yearY1}`, `${horizonY1.length} prévue${horizonY1.length>1?'s':''}`, horizonY1)}
      </div>
      <div class="walter-corner" aria-hidden="true" title="Walter supervise">🐈‍⬛</div>
    </div>`;
  }

    zone.innerHTML = `<div class="gallery">${data.map(s => `

  async function showOeuvreTab(key){

  // ============================================================
  // Onglet Écriture d'une œuvre
  // ============================================================
  let ecritureChapitres = [];
  let ecritureViewMode = 'table';

  async function renderOeuvreEcriture(zone){
    zone.innerHTML = `<div class="status-line">Chargement…</div>`;
    const [{ data: chaps }, { data: sessions }] = await Promise.all([
      db().from('chapitres').select('*').eq('oeuvre_id', currentOeuvreId).order('ordre'),
      db().from('sessions_ecriture').select('mots_ecrits, date').eq('oeuvre_id', currentOeuvreId).order('date', { ascending:false }).limit(30),
    ]);
    ecritureChapitres = chaps || [];

    const ecrits = ecritureChapitres.filter(c => (c.nb_mots||0) > 0).length;
    const aEcrire = ecritureChapitres.length - ecrits;
    const totalMots = ecritureChapitres.reduce((s,c)=>s+(c.nb_mots||0), 0);
    const povCounts = {};
    ecritureChapitres.forEach(c => { if (c.pov) povCounts[c.pov] = (povCounts[c.pov]||0)+1; });
    const moyMotsJour = sessions?.length ? Math.round(sessions.reduce((s,r)=>s+(r.mots_ecrits||0),0)/sessions.length) : null;
    const derniereSession = sessions?.[0]?.date;

    zone.innerHTML = `
      <div class="stat-cards-row">
        <div class="stat-card"><h3>Chapitres écrits</h3><div class="stat-big">${ecrits} / ${ecritureChapitres.length}</div><div style="font-size:12px; color:var(--text-dim);">${aEcrire} à écrire</div></div>
        <div class="stat-card"><h3>Total mots</h3><div class="stat-big">${totalMots.toLocaleString('fr-FR')}</div></div>
        <div class="stat-card"><h3>Mots / jour (moy.)</h3><div class="stat-big">${moyMotsJour ?? '—'}</div><div style="font-size:12px; color:var(--text-dim);">${derniereSession ? 'Dernière session : '+derniereSession : 'Aucune session enregistrée'}</div></div>
        <div class="stat-card"><h3>POV utilisés</h3>${Object.entries(povCounts).map(([k,v])=>`<div class="info-line" style="padding:3px 0; border:none;"><span>${k}</span><span>${v}</span></div>`).join('') || '<div style="font-size:12px; color:var(--text-dim);">—</div>'}</div>
      </div>

      <div class="head-row">
        <div class="row2" style="grid-template-columns:auto auto auto; gap:8px;">
          <button class="btn-secondary" id="ev-table" onclick="setEcritureView('table')">Table</button>
          <button class="btn-secondary" id="ev-cards" onclick="setEcritureView('cards')">Cartes</button>
          <button class="btn-secondary" id="ev-kanban" onclick="setEcritureView('kanban')">Kanban</button>
        </div>
        <button class="btn-primary" onclick="openChapitreModal()">+ Nouveau chapitre</button>
      </div>

      <div id="ecriture-view-zone"></div>
    `;
    setEcritureView(ecritureViewMode);
  }

  function setEcritureView(mode){
    ecritureViewMode = mode;
    ['table','cards','kanban'].forEach(m => { const b = document.getElementById('ev-'+m); if (b) b.style.background = (m===mode) ? 'var(--accent)' : 'var(--bg-2)'; if (b) b.style.color = (m===mode) ? 'var(--bg)' : 'var(--text)'; });
    const zone = document.getElementById('ecriture-view-zone');
    if (!zone) return;
    if (mode === 'table') zone.innerHTML = renderChapitresTable(ecritureChapitres);
    if (mode === 'cards') zone.innerHTML = renderChapitresCards(ecritureChapitres);
    if (mode === 'kanban') zone.innerHTML = renderChapitresKanban(ecritureChapitres);
  }

  function renderChapitresTable(chaps){
    if (!chaps.length) return `<div class="empty">Aucun chapitre pour l'instant.</div>`;
    return `<table class="ch-table"><thead><tr><th>N°</th><th>Titre</th><th>Acte</th><th>POV</th><th>Statut</th><th>Mots</th><th>Objectif</th><th></th></tr></thead><tbody>
      ${chaps.map(c => `<tr onclick="openChapitreModal('${c.id}')">
        <td>${c.numero ?? '—'}</td><td>${c.titre}</td><td>${c.acte||'—'}</td><td>${c.pov||'—'}</td>
        <td><span class="etat-pill">${c.etat||'—'}</span></td><td>${c.nb_mots||0}</td><td>${c.objectif_mots||'—'}</td>
        <td onclick="event.stopPropagation(); openMemoPanel('${c.id}','${(c.titre||'').replace(/'/g,"\\'")}')" style="color:var(--text-dim); cursor:pointer;">💬</td>
      </tr>`).join('')}
    </tbody></table>`;
  }
  function renderChapitresCards(chaps){
    if (!chaps.length) return `<div class="empty">Aucun chapitre pour l'instant.</div>`;
    return `<div class="cards-grid">${chaps.map(c => `
      <div class="ch-card" onclick="openChapitreModal('${c.id}')">
        <div style="font-size:11px; color:var(--text-dim);">N°${c.numero ?? '—'} · ${c.acte||'—'}</div>

      </div>`).join('')}</div>`;
  }
  function renderChapitresKanban(chaps){
    const etats = [...new Set(chaps.map(c=>c.etat).filter(Boolean))];
    if (!etats.length) return `<div class="empty">Aucun chapitre pour l'instant.</div>`;
    return `<div class="kanban-row">${etats.map(e => `
      <div class="kanban-col"><h4>${e} (${chaps.filter(c=>c.etat===e).length})</h4>
        ${chaps.filter(c=>c.etat===e).map(c => `<div class="kanban-card" onclick="openChapitreModal('${c.id}')">${c.titre}<div style="font-size:11px; color:var(--text-dim); margin-top:3px;">${c.acte||''} · ${c.nb_mots||0} mots</div></div>`).join('')}
      </div>`).join('')}</div>`;
  }

  let editingChapitreId = null;

  async function saveChapitre(){
    const maxOrdre = ecritureChapitres.reduce((m,c)=>Math.max(m, c.ordre||0), 0);
    const payload = {
      titre: document.getElementById('cf-titre').value.trim()||'Sans titre',
      numero: parseInt(document.getElementById('cf-numero').value)||null,
      acte: document.getElementById('cf-acte').value.trim(),
      pov: document.getElementById('cf-pov').value.trim(),
      etat: document.getElementById('cf-etat').value,
      nb_mots: parseInt(document.getElementById('cf-mots').value)||0,
      objectif_mots: parseInt(document.getElementById('cf-objectif').value)||null,
      resume: document.getElementById('cf-resume').value.trim(),
      plan: document.getElementById('cf-plan').value.trim(),
    };
    let error;
    if (editingChapitreId) ({ error } = await db().from('chapitres').update(payload).eq('id', editingChapitreId));
    else { payload.user_id = currentUser.id; payload.oeuvre_id = currentOeuvreId; payload.ordre = maxOrdre + 1; ({ error } = await db().from('chapitres').insert(payload)); }

    closeChapitreModal();
    await renderOeuvreEcriture(document.getElementById('oeuvre-tab-content'));
  }

  // ============================================================
  let opoLinks = [];

  async function renderOeuvrePersonnages(zone){
    zone.innerHTML = `<div class="status-line">Chargement…</div>`;
    const { data, error } = await db().from('personnages_oeuvres').select('personnage_id, role, importance, pov, faction, etat, personnages(id, nom, favori)').eq('oeuvre_id', currentOeuvreId);
    if (error) { zone.innerHTML = `<div class="empty">Erreur : ${error.message}</div>`; return; }
    opoLinks = data;

    const total = data.length;
    const principaux = data.filter(d=>d.importance==='principal').length;
    const secondaires = data.filter(d=>d.importance==='secondaire').length;
    const figurations = data.filter(d=>d.importance==='figuration').length;
    const povCount = data.filter(d=>d.pov).length;
    const parFaction = {};
    data.forEach(d => { if (d.faction) parFaction[d.faction] = (parFaction[d.faction]||0)+1; });

    let autresOeuvres = 0;
    if (data.length) {
      const ids = data.map(d=>d.personnage_id);
      const { data: ailleurs } = await db().from('personnages_oeuvres').select('personnage_id, oeuvre_id').in('personnage_id', ids).neq('oeuvre_id', currentOeuvreId);
      autresOeuvres = new Set((ailleurs||[]).map(a=>a.personnage_id)).size;
    }

    zone.innerHTML = `
      <div class="stat-cards-row">
        <div class="stat-card"><h3>Résumé</h3><div class="stat-big">${total}</div><div style="font-size:12px; color:var(--text-dim);">${principaux} principaux · ${secondaires} secondaires · ${figurations} figurations</div></div>
        <div class="stat-card"><h3>POV utilisés</h3><div class="stat-big">${povCount}</div></div>
        <div class="stat-card"><h3>Répartition par faction</h3>${Object.entries(parFaction).map(([k,v])=>`<div class="info-line" style="padding:3px 0; border:none;"><span>${k}</span><span>${v}</span></div>`).join('') || '<div style="font-size:12px; color:var(--text-dim);">—</div>'}</div>
        <div class="stat-card"><h3>Autres œuvres</h3><div class="stat-big">${autresOeuvres}</div><div style="font-size:12px; color:var(--text-dim);">personnages présents ailleurs</div></div>
      </div>

      <div class="head-row">
        <input class="search-input" placeholder="Rechercher..." style="max-width:240px;">
        <button class="btn-primary" onclick="openPersonnageOeuvreModal()">+ Ajouter un personnage</button>
      </div>

      ${!total ? `<div class="empty">Aucun personnage lié à cette œuvre pour l'instant.</div>` : `
      <div class="gallery">${data.map(d => `
        <div class="char-card" onclick="openPersonnageOeuvreModal('${d.personnage_id}')">
          ${d.personnages?.favori ? '<span class="fav-heart">♥</span>' : ''}
          ${d.pov ? `<span style="position:absolute; top:8px; left:10px; font-size:10px; padding:2px 8px; border-radius:20px; background:var(--accent); color:var(--bg);">POV ${d.pov}</span>` : ''}
          <div class="char-portrait" style="background:linear-gradient(160deg, var(--lavender)33, var(--bg-2));">${initials(d.personnages?.nom)}</div>
          <div class="char-name">${d.personnages?.nom || '—'}</div>
          <div class="char-role">${d.role || '—'}${d.faction ? ' · '+d.faction : ''}</div>
        </div>`).join('')}</div>`}
    `;
  }

  function personnageOeuvreModalHtml(){
    return `
      <div class="modal-overlay" id="modal-po-overlay" onclick="if(event.target===this) closePersonnageOeuvreModal()">
        <div class="modal-box">
          <div class="modal-head"><h2 id="modal-po-title">Ajouter un personnage</h2><button onclick="closePersonnageOeuvreModal()">✕</button></div>
          <div class="modal-body">
            <div id="po-select-zone">
              <label>Personnage</label>
              <select id="po-personnage-select"><option value="">— Sélectionner —</option><option value="__new__">+ Créer un nouveau personnage</option></select>
              <input id="po-nouveau-nom" placeholder="Nom du nouveau personnage" style="display:none; margin-top:8px;">
            </div>
            <div class="row2" style="margin-top:12px;">
              <div><label>Rôle narratif</label><input id="po-role" placeholder="Héroïne, Antagoniste..."></div>
              <div><label>Importance</label><select id="po-importance"><option value="">—</option><option value="principal">Principal</option><option value="secondaire">Secondaire</option><option value="figuration">Figuration</option></select></div>
            </div>
            <div class="row2" style="margin-top:12px;">
              <div><label>POV</label><select id="po-pov"><option value="">Aucun</option><option value="principal">Principal</option><option value="secondaire">Secondaire</option></select></div>
              <div><label>Faction</label><input id="po-faction"></div>
            </div>
            <div style="margin-top:12px;"><label>État (dans ce tome)</label><input id="po-etat" placeholder="vivant, mort, blessé..."></div>

          <div class="modal-foot">
            <button class="btn-secondary" id="po-delete" style="margin-right:auto; display:none; color:#e88;" onclick="removePersonnageOeuvre()">Retirer de cette œuvre</button>
            <button class="btn-secondary" onclick="closePersonnageOeuvreModal()">Annuler</button>
            <button class="btn-primary" onclick="savePersonnageOeuvre()">Enregistrer</button>
          </div>
        </div>
      </div>`;
  }
  let editingPoPersonnageId = null;
  async function openPersonnageOeuvreModal(personnageId){
    editingPoPersonnageId = personnageId || null;
    document.getElementById('modal-po-title').textContent = personnageId ? 'Modifier le lien' : 'Ajouter un personnage';
    document.getElementById('po-delete').style.display = personnageId ? 'block' : 'none';

    const { data: allPersonnages } = await db().from('personnages').select('id, nom').order('nom');
    const sel = document.getElementById('po-personnage-select');
    sel.innerHTML = '<option value="">— Sélectionner —</option>' + (allPersonnages||[]).map(p=>`<option value="${p.id}">${p.nom}</option>`).join('') + '<option value="__new__">+ Créer un nouveau personnage</option>';
    document.getElementById('po-nouveau-nom').style.display = 'none';
    document.getElementById('po-role').value=''; document.getElementById('po-importance').value='';
    document.getElementById('po-pov').value=''; document.getElementById('po-faction').value=''; document.getElementById('po-etat').value='';

    if (personnageId) {
      sel.value = personnageId; sel.disabled = true;
      document.getElementById('po-select-zone').style.opacity = '0.6';
      const link = opoLinks.find(l=>l.personnage_id===personnageId);
      if (link) {
        document.getElementById('po-role').value = link.role||'';
        document.getElementById('po-importance').value = link.importance||'';
        document.getElementById('po-pov').value = link.pov||'';
        document.getElementById('po-faction').value = link.faction||'';
        document.getElementById('po-etat').value = link.etat||'';
      }
    } else {
      sel.disabled = false;
      document.getElementById('po-select-zone').style.opacity = '1';
    }
    document.getElementById('modal-po-overlay').classList.add('open');
  }
  document.addEventListener('change', (e) => {
    if (e.target && e.target.id === 'po-personnage-select') {
      document.getElementById('po-nouveau-nom').style.display = (e.target.value === '__new__') ? 'block' : 'none';
    }
  });
  function closePersonnageOeuvreModal(){ document.getElementById('modal-po-overlay').classList.remove('open'); }
  async function savePersonnageOeuvre(){
    let personnageId = editingPoPersonnageId;
    if (!personnageId) {
      const selVal = document.getElementById('po-personnage-select').value;
      if (!selVal) { alert('Choisis un personnage.'); return; }
      if (selVal === '__new__') {
        const nom = document.getElementById('po-nouveau-nom').value.trim();
        if (!nom) { alert('Donne un nom au nouveau personnage.'); return; }
        const { data, error } = await db().from('personnages').insert({ user_id: currentUser.id, nom }).select('id').single();
        if (error) { alert('Erreur : ' + error.message); return; }
        personnageId = data.id;
      } else {
        personnageId = selVal;
      }
    }
    const linkPayload = {
      role: document.getElementById('po-role').value.trim(),
      importance: document.getElementById('po-importance').value || null,
      pov: document.getElementById('po-pov').value || null,
      faction: document.getElementById('po-faction').value.trim(),
      etat: document.getElementById('po-etat').value.trim(),
    };
    let error;
    if (editingPoPersonnageId) {
      ({ error } = await db().from('personnages_oeuvres').update(linkPayload).eq('oeuvre_id', currentOeuvreId).eq('personnage_id', personnageId));
    } else {
      ({ error } = await db().from('personnages_oeuvres').insert({ oeuvre_id: currentOeuvreId, personnage_id: personnageId, ...linkPayload }));
    }
    if (error) { alert('Erreur : ' + error.message); return; }
    closePersonnageOeuvreModal();
    await renderOeuvrePersonnages(document.getElementById('oeuvre-tab-content'));
  }
  async function removePersonnageOeuvre(){
    if (!confirm('Retirer ce personnage de cette œuvre ? (la fiche du personnage elle-même est conservée)')) return;
    const { error } = await db().from('personnages_oeuvres').delete().eq('oeuvre_id', currentOeuvreId).eq('personnage_id', editingPoPersonnageId);
    if (error) { alert('Erreur : ' + error.message); return; }
    closePersonnageOeuvreModal();
    await renderOeuvrePersonnages(document.getElementById('oeuvre-tab-content'));
  }

  // ============================================================
  // Onglet Plan V6
  // ============================================================
  let planChapitres=[], planView='table', memoChapterId=null;
  async function renderOeuvrePlans(zone){
    const {data,error}=await db().from('chapitres').select('id,numero,ordre,titre,pov,nb_mots,statut,acte,plan_initial,memo').eq('oeuvre_id',currentOeuvreId).order('ordre');
    if(error){zone.innerHTML=`<div class="empty">Erreur : ${safeText(error.message)}</div>`;return} planChapitres=data||[];
    zone.innerHTML=`<div class="work-toolbar"><button class="btn-primary" onclick="insertPlanChapter()">+ Insérer un chapitre</button><button class="btn-secondary" onclick="document.getElementById('plan-csv').click()">Importer CSV</button><input id="plan-csv" type="file" accept=".csv" hidden onchange="importPlanCsv(this.files[0])"><button class="btn-secondary" onclick="exportPlanCsv()">Exporter CSV</button><button class="btn-secondary" onclick="renumberPlan()">Réorganiser</button><span class="spacer"></span><div class="view-switch"><button class="${planView==='table'?'active':''}" onclick="planView='table';renderOeuvrePlans(document.getElementById('oeuvre-tab-content'))">Table</button><button class="${planView==='kanban'?'active':''}" onclick="planView='kanban';renderOeuvrePlans(document.getElementById('oeuvre-tab-content'))">Kanban par acte</button></div></div>${planView==='table'?planTable():planKanban()}${memoDrawer()}`;
  }
  function planTable(){return `<div class="panel" style="overflow:auto"><table class="ch-table editable-table"><thead><tr><th>Ordre</th><th>Chapitre</th><th>Acte</th><th>POV</th><th>Plan initial</th><th>État</th><th>Mots</th><th>Mémo</th><th></th></tr></thead><tbody>${planChapitres.map(c=>`<tr><td contenteditable=true onblur="planCell('${c.id}','ordre',this.innerText,true)">${c.ordre??''}</td><td contenteditable=true onblur="planCell('${c.id}','titre',this.innerText)">${safeText(c.titre||'')}</td><td contenteditable=true onblur="planCell('${c.id}','acte',this.innerText)">${safeText(c.acte||'')}</td><td contenteditable=true onblur="planCell('${c.id}','pov',this.innerText)">${safeText(c.pov||'')}</td><td contenteditable=true onblur="planCell('${c.id}','plan_initial',this.innerText)">${safeText(c.plan_initial||'')}</td><td contenteditable=true onblur="planCell('${c.id}','statut',this.innerText)">${safeText(c.statut||'À écrire')}</td><td>${Number(c.nb_mots||0).toLocaleString('fr-FR')}</td><td><span class="memo-dot" onclick="openMemo('${c.id}')">${c.memo?'📝':'＋'}</span></td><td><button class="tiny-btn" onclick="insertPlanChapter('${c.id}')">+ après</button></td></tr>`).join('')}</tbody></table></div>`}
  function planKanban(){let acts=[...new Set(planChapitres.map(c=>c.acte||'Sans acte'))];return `<div class="plan-kanban">${acts.map(act=>`<section class="plan-act" ondragover="event.preventDefault()" ondrop="dropPlan(event,'${String(act).replace(/'/g,"\\'")}')"><h3>${safeText(act)}</h3>${planChapitres.filter(c=>(c.acte||'Sans acte')===act).map(c=>`<article class="plan-card" draggable=true ondragstart="event.dataTransfer.setData('text/plain','${c.id}')"><strong>${c.numero?`Ch. ${c.numero} · `:''}${safeText(c.titre||'')}</strong><small>${safeText(c.pov||'')} · ${safeText(c.statut||'À écrire')}</small>${c.plan_initial?`<small>${safeText(c.plan_initial).slice(0,140)}</small>`:''}<small>${Number(c.nb_mots||0).toLocaleString('fr-FR')} mots · <span onclick="openMemo('${c.id}')">${c.memo?'📝 Mémo':'＋ Mémo'}</span></small></article>`).join('')}</section>`).join('')}</div>`}
  async function planCell(id,f,v,n=false){let value=n?Number(v):(v||'').trim();let {error}=await db().from('chapitres').update({[f]:value}).eq('id',id);if(error)alert(error.message)}
  async function insertPlanChapter(afterId=null){let after=afterId?planChapitres.find(c=>c.id===afterId):planChapitres.at(-1), title=prompt('Titre provisoire ?','Nouveau chapitre');if(title===null)return;let target=Number(after?.ordre||0)+1;for(const c of [...planChapitres].filter(x=>Number(x.ordre)>=target).sort((x,y)=>y.ordre-x.ordre))await db().from('chapitres').update({ordre:Number(c.ordre)+1,numero:Number(c.numero||c.ordre)+1}).eq('id',c.id);let {error}=await db().from('chapitres').insert({user_id:currentUser.id,oeuvre_id:currentOeuvreId,titre:title||'Nouveau chapitre',ordre:target,numero:target,statut:'À écrire',acte:after?.acte||null});if(error)alert(error.message);else renderOeuvrePlans(document.getElementById('oeuvre-tab-content'))}
  async function renumberPlan(){for(let [i,c] of [...planChapitres].sort((a,b)=>a.ordre-b.ordre).entries())await db().from('chapitres').update({ordre:i+1,numero:i+1}).eq('id',c.id);renderOeuvrePlans(document.getElementById('oeuvre-tab-content'))}
  async function dropPlan(e,act){let id=e.dataTransfer.getData('text/plain');await db().from('chapitres').update({acte:act==='Sans acte'?null:act}).eq('id',id);renderOeuvrePlans(document.getElementById('oeuvre-tab-content'))}
  function escCsv(v){v=String(v??'');return /[;"\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}
  function exportPlanCsv(){let rows=[['Ordre','Chapitre','Acte','POV','Plan initial','État','Nb de mots écrits'],...planChapitres.map(c=>[c.ordre,c.titre,c.acte,c.pov,c.plan_initial,c.statut,c.nb_mots])];let blob=new Blob(['\ufeff'+rows.map(r=>r.map(escCsv).join(';')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='plan.csv';a.click()}
  function csvLine(s,sep){let o=[],c='',q=false;for(let i=0;i<s.length;i++){let x=s[i];if(x==='"'){if(q&&s[i+1]==='"'){c+='"';i++}else q=!q}else if(x===sep&&!q){o.push(c);c=''}else c+=x}o.push(c);return o}
  async function importPlanCsv(file){if(!file)return;let text=await file.text(),lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean),sep=lines[0].includes(';')?';':',',head=csvLine(lines[0],sep).map(x=>x.trim().toLowerCase()),ix=(...n)=>head.findIndex(h=>n.includes(h));let rows=lines.slice(1).map((l,i)=>{let r=csvLine(l,sep),ord=Number(r[ix('ordre')]||i+1);return{user_id:currentUser.id,oeuvre_id:currentOeuvreId,ordre:ord,numero:ord,titre:r[ix('chapitre','titre')]||`Chapitre ${ord}`,acte:r[ix('acte')]||null,pov:r[ix('pov')]||null,plan_initial:r[ix('plan initial','résumé','resume')]||null,statut:r[ix('état','etat','statut')]||'À écrire',nb_mots:Number(r[ix('nb de mots écrits','nb de mots ecrits','mots')]||0)}});if(confirm(`Importer ${rows.length} lignes ?`)){let {error}=await db().from('chapitres').insert(rows);if(error)alert(error.message);else renderOeuvrePlans(document.getElementById('oeuvre-tab-content'))}}
  function memoDrawer(){return `<div class="drawer" id="memo-drawer" onclick="if(event.target===this)this.classList.remove('open')"><aside><div class="drawer-head"><h2>Mémo du chapitre</h2><button class="btn-secondary" onclick="document.getElementById('memo-drawer').classList.remove('open')">✕</button></div><textarea id="memo-text"></textarea><button class="btn-primary" onclick="saveMemo()">Enregistrer</button></aside></div>`}
  function openMemo(id){memoChapterId=id;let c=planChapitres.find(x=>x.id===id)||relectureChapitres.find(x=>x.id===id);document.getElementById('memo-text').value=c?.memo||'';document.getElementById('memo-drawer').classList.add('open')}
  async function saveMemo(){await db().from('chapitres').update({memo:document.getElementById('memo-text').value}).eq('id',memoChapterId);document.getElementById('memo-drawer').classList.remove('open')}
  // ============================================================
  // Onglet Relecture V6

  let currentRelectureId=null,relectureChapitres=[],relectureCorrections=[],currentRelecture=null,checkChapterId=null;
  async function renderOeuvreRelecture(zone){
    let {data:rs,error}=await db().from('relectures').select('*').eq('oeuvre_id',currentOeuvreId).order('created_at',{ascending:false});if(error){zone.innerHTML=`<div class="empty">${safeText(error.message)}</div>`;return}
    if(!rs?.length){zone.innerHTML=`<div class="empty">Aucune relecture.<br><br><button class="btn-primary" onclick="startRelecture()">Démarrer une relecture</button></div>`;return}
    currentRelecture=rs[0];currentRelectureId=currentRelecture.id;
    let [{data:ch},{data:co},{data:ck}]=await Promise.all([db().from('chapitres').select('id,numero,ordre,titre,pov,nb_mots,memo').eq('oeuvre_id',currentOeuvreId).order('ordre'),db().from('corrections').select('*').eq('relecture_id',currentRelectureId).order('created_at',{ascending:false}),db().from('relecture_checklist').select('*').eq('relecture_id',currentRelectureId).order('ordre')]);relectureChapitres=ch||[];relectureCorrections=co||[];let st={};relectureCorrections.filter(x=>x.chapitre_id).forEach(x=>st[x.chapitre_id]=x);let relus=relectureChapitres.filter(c=>st[c.id]?.resolu||st[c.id]?.etat==='Relu').length,pct=relectureChapitres.length?Math.round(relus/relectureChapitres.length*100):0;
    zone.innerHTML=`<div class="relecture-progress"><div style="display:flex;justify-content:space-between;gap:10px"><div><h2 style="margin:0">Progression</h2><strong>${relus}/${relectureChapitres.length} chapitres relus · ${pct}%</strong></div><button class="btn-secondary" onclick="insertRelectureChapter()">+ Chapitre à écrire</button></div><div class="progress-bar-outer" style="max-width:none;margin-top:12px"><div class="progress-bar-inner" style="width:${pct}%"></div></div><div class="relecture-meta"><span>${relectureChapitres.filter(c=>(st[c.id]?.etat||(!c.nb_mots?'À écrire':'À relire'))==='À écrire').length} à écrire</span><span>${relectureChapitres.filter(c=>st[c.id]?.etat==='En cours').length} en cours</span><span>${relectureChapitres.filter(c=>st[c.id]?.etat==='Bloqué').length} bloqué(s)</span></div></div>
    <div class="panel" style="overflow:auto;margin-bottom:18px"><h2>Suivi des chapitres</h2><table class="ch-table"><thead><tr><th>N°</th><th>Titre</th><th>POV</th><th>Mots</th><th>Statut</th><th>Contrôles</th><th>Retour bêta-lecture</th><th>Mémo</th></tr></thead><tbody>${relectureChapitres.map(c=>{let s=st[c.id],arr=(ck||[]).filter(x=>x.chapitre_id===c.id),status=s?.resolu?'Relu':(s?.etat||(!c.nb_mots?'À écrire':'À relire'));return`<tr><td>${c.numero??'—'}</td><td>${safeText(c.titre||'')}</td><td>${safeText(c.pov||'—')}</td><td>${Number(c.nb_mots||0).toLocaleString('fr-FR')}</td><td><select onchange="setRelStatus('${c.id}',this.value)">${['À écrire','À relire','En cours','Bloqué','Relu'].map(v=>`<option ${status===v?'selected':''}>${v}</option>`).join('')}</select></td><td><button class="tiny-btn" onclick="openChecklist('${c.id}')">${arr.length?`${arr.filter(x=>x.fait).length}/${arr.length}`:'Checklist'}</button></td><td><div style="font-size:12px;max-width:300px">${safeText(s?.retour_beta||'')}</div><button class="tiny-btn" onclick="editBeta('${c.id}')">${s?.retour_beta?'Modifier':'Ajouter'}</button></td><td><span class="memo-dot" onclick="openMemo('${c.id}')">${c.memo?'📝':'＋'}</span></td></tr>`}).join('')}</tbody></table></div>
    <div class="relecture-grid"><div class="panel"><div style="display:flex;justify-content:space-between"><h2>Journal des corrections</h2><button class="btn-primary" onclick="addCorrection()">+ Ajouter</button></div>${relectureCorrections.filter(x=>x.point_a_corriger).map(x=>`<div class="memo-item"><div class="memo-date">${safeText(x.categorie||'Correction')} · ${x.resolu?'✅ Résolu':safeText(x.etat||'À traiter')}</div>${safeText(x.point_a_corriger)}</div>`).join('')||'<div class="empty">Aucune correction.</div>'}</div><div><div class="panel" style="margin-bottom:18px"><div style="display:flex;justify-content:space-between"><h2>Rappels</h2><button class="tiny-btn" onclick="addReminder()">+ Ajouter</button></div>${(currentRelecture.rappels||[]).map((x,i)=>`<label class="check-row"><input type=checkbox ${x.fait?'checked':''} onchange="toggleReminder(${i},this.checked)"><span>${safeText(x.texte)}</span></label>`).join('')||'<small>Aucun rappel.</small>'}</div><div class="panel"><h2>Bloc-notes de relecture</h2><textarea id="rel-notes">${safeText(currentRelecture.notes||'')}</textarea><button class="btn-primary" onclick="saveRelNotes()">Enregistrer</button></div></div></div>${memoDrawer()}${checkDrawer()}`;

  async function saveOeuvreFicheDetaillee(){
    const tropesRaw = document.getElementById('ofd-tropes').value.trim();
    const enjeuxSecRaw = document.getElementById('ofd-enjeux-secondaires').value.trim();
    const ambiance = {};
    ['Sombre','Intense','Mystérieux','Romantique'].forEach(a => { ambiance[a] = parseInt(document.getElementById('ofd-amb-'+a).value) || 0; });
    const payload = {
      pitch: document.getElementById('ofd-pitch').value.trim(),
      a_propos: document.getElementById('ofd-a-propos').value.trim(),
      intentions: document.getElementById('ofd-intentions').value.trim(),

      genre: document.getElementById('ofd-genre').value.trim(),
      sous_genre: document.getElementById('ofd-sous-genre').value.trim(),
      tonalite: document.getElementById('ofd-tonalite').value.trim(),
      temporalite: document.getElementById('ofd-temporalite').value.trim(),
      lieu_principal: document.getElementById('ofd-lieu').value.trim(),
      public_cible: document.getElementById('ofd-public').value || null,
      tropes: tropesRaw ? tropesRaw.split(',').map(t=>t.trim()).filter(Boolean) : null,
      enjeu_principal: document.getElementById('ofd-enjeu').value.trim(),

    };
    const { error } = await db().from('oeuvres').update(payload).eq('id', currentOeuvreId);
    if (error) { alert('Erreur : ' + error.message); return; }
    alert('Enregistré.');
  }

  function joursDepuisGeneric(dateStr){

    return diff <= 0 ? "aujourd'hui" : `il y a ${diff} j`;
  }
  function renderIdeesGrid(){
    const q = (document.getElementById('idee-search').value||'').toLowerCase();

    if (genreFiltre) data = data.filter(i => i.genre === genreFiltre);
    const zone = document.getElementById('idees-grid');
    if (!data.length) { zone.innerHTML = `<div class="empty">Aucune idée ne correspond.</div>`; return; }
    zone.innerHTML = data.map(i => {
      const color = IDEE_STATUT_COLOR[i.statut] || 'var(--text-dim)';
      const tags = [i.genre, ...(i.ambiance||[]).slice(0,2)].filter(Boolean);
      return `
      <div class="char-card" onclick="openIdeeModal('${i.id}')" style="padding-bottom:2px;">
        <span onclick="event.stopPropagation(); toggleFavoriIdee('${i.id}', ${!!i.favori})" style="position:absolute; top:8px; right:10px; font-size:16px; cursor:pointer; color:${i.favori?'var(--accent)':'var(--text-dim)'};">${i.favori?'★':'☆'}</span>

        <div style="padding:6px 14px 0; font-size:12px; color:var(--text-dim); line-height:1.5;">${(i.note||'').slice(0,90)}${(i.note||'').length>90?'…':''}</div>
        <div style="padding:10px 14px 0;">${tags.map(t=>`<span class="etat-pill" style="margin:0 5px 5px 0; display:inline-block;">${t}</span>`).join('')}</div>
        <div style="padding:8px 14px 12px; font-size:11px; color:var(--text-dim);">${joursDepuisGeneric(i.created_at)}${i.potentiel ? ' · '+'★'.repeat(i.potentiel) : ''}</div>

    const { error } = await db().from('idee_notes').insert({ idee_id: editingIdeeId, contenu: val });

    document.getElementById('if-note-new').value = '';
