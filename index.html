    const content = document.getElementById('content');
    content.innerHTML = `<div class="status-line">Chargement…</div>`;
    const { data: o, error } = await db().from('oeuvres').select('*, sagas(nom)').eq('id', id).single();
    if (error) { content.innerHTML = `<div class="empty">Erreur : ${error.message}</div>`; return; }
    currentOeuvre = o;
    applyObjectTheme(o.page_color, o.accent_color);

    const pct = o.objectif_mots ? Math.min(100, Math.round((o.mots_ecrits||0)/o.objectif_mots*100)) : 0;
    content.innerHTML = `
      <div class="back-link" onclick="navigate('oeuvres')" style="cursor:pointer; color:var(--text-dim); font-size:13px; margin-bottom:14px;">← Retour aux œuvres</div>
      ${renderCatalogEntityBanner(o.banniere,o.titre)}
      <div class="oeuvre-head">
        ${o.couverture ? `<img src="${safeText(o.couverture)}" alt="Couverture de ${safeText(o.titre)}" style="width:100px;height:130px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex-shrink:0;">` : `<div class="cover-block">${initials(o.titre)}</div>`}
        <div class="oeuvre-info">
          <h1>${o.titre}</h1>
          <div class="oeuvre-sub">${o.sagas?.nom || 'Œuvre indépendante'}</div>
          <span class="status-badge">${o.statut || 'Sans statut'}</span>
          <div id="oeuvre-head-progress" style="margin-top:10px;max-width:620px;">
            ${o.objectif_mots ? `<div style="display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:14px;"><strong id="oeuvre-head-words">${(o.mots_ecrits||0).toLocaleString('fr-FR')} / ${o.objectif_mots.toLocaleString('fr-FR')} mots</strong><span id="oeuvre-head-chapters">Chapitres : synchronisation…</span></div><div class="progress-bar-outer" style="max-width:none;margin-top:8px;"><div id="oeuvre-head-progress-bar" class="progress-bar-inner" style="width:${pct}%;"></div></div>` : `<div id="oeuvre-head-chapters" style="font-size:14px;">Chapitres : synchronisation…</div>`}
          </div>
        </div>
      </div>
      <div class="tabbar" style="display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:24px; flex-wrap:wrap;">
        ${[...OEUVRE_TABS, ...(o.module_lore?[{key:'lore',label:'Univers & Lore'}]:[]), ...(o.module_chronologie?[{key:'chronologie',label:'Chronologie'}]:[])].map(t => `<button id="oeuvretab-${t.key}" onclick="showOeuvreTab('${t.key}')" style="background:none; border:none; font-family:'Lora',serif; font-size:14px; color:var(--text-dim); padding:10px 14px; cursor:pointer; border-bottom:2px solid transparent;">${t.label}</button>`).join('')}
      </div>
      <div id="oeuvre-tab-content"></div>
    `;
    showOeuvreTab('informations');
  }

  async function showOeuvreTab(key){
    document.querySelectorAll('[id^="oeuvretab-"]').forEach(b => { b.style.color='var(--text-dim)'; b.style.borderBottomColor='transparent'; b.style.fontWeight='400'; });
    const activeBtn = document.getElementById('oeuvretab-'+key);
    if (activeBtn) { activeBtn.style.color='var(--accent)'; activeBtn.style.borderBottomColor='var(--accent)'; activeBtn.style.fontWeight='500'; }
    const zone = document.getElementById('oeuvre-tab-content');
    if (key === 'informations') await renderOeuvreInformations(zone);
    else if (key === 'personnages') await renderOeuvrePersonnages(zone);
    else if (key === 'plans') await renderOeuvrePlans(zone);
    else if (key === 'manuscrit') await renderOeuvreManuscrit(zone);
    else if (key === 'relecture') await renderOeuvreRelectureV2(zone);
    else if (key === 'medias') await renderOeuvreMedias(zone);
    else if (key === 'lore' || key === 'chronologie') zone.innerHTML = `<div class="empty">Le module <strong>${key==='lore'?'Univers & Lore':'Chronologie'}</strong> est activé pour cette œuvre. Sa page dédiée sera figée dans son propre chantier.</div>`;
  }

  // ============================================================
  // Onglet Écriture d'une œuvre
  // ============================================================
  let ecritureChapitres = [];
  let ecritureViewMode = 'table';

  async function renderOeuvreEcriture(zone){
    zone.innerHTML = `<div class="status-line">Chargement…</div>`;
    const [{ data: chaps }, { data: sessions }] = await Promise.all([
      db().from('chapitres').select('*').eq('oeuvre_id', currentOeuvreId).order('ordre'),
      db().from('sessions_ecriture').select('mots_ecrits, date').eq('oeuvre_id', currentOeuvreId).order('date', { ascending:false }).limit(30),
    ]);
    ecritureChapitres = chaps || [];

    const ecrits = ecritureChapitres.filter(c => (c.nb_mots||0) > 0).length;
    const aEcrire = ecritureChapitres.length - ecrits;
    const totalMots = ecritureChapitres.reduce((s,c)=>s+(c.nb_mots||0), 0);
    const povCounts = {};
    ecritureChapitres.forEach(c => { if (c.pov) povCounts[c.pov] = (povCounts[c.pov]||0)+1; });
    const moyMotsJour = sessions?.length ? Math.round(sessions.reduce((s,r)=>s+(r.mots_ecrits||0),0)/sessions.length) : null;
    const derniereSession = sessions?.[0]?.date;

    zone.innerHTML = `
      <div class="stat-cards-row">
        <div class="stat-card"><h3>Chapitres écrits</h3><div class="stat-big">${ecrits} / ${ecritureChapitres.length}</div><div style="font-size:12px; color:var(--text-dim);">${aEcrire} à écrire</div></div>
        <div class="stat-card"><h3>Total mots</h3><div class="stat-big">${totalMots.toLocaleString('fr-FR')}</div></div>
        <div class="stat-card"><h3>Mots / jour (moy.)</h3><div class="stat-big">${moyMotsJour ?? '—'}</div><div style="font-size:12px; color:var(--text-dim);">${derniereSession ? 'Dernière session : '+derniereSession : 'Aucune session enregistrée'}</div></div>
        <div class="stat-card"><h3>POV utilisés</h3>${Object.entries(povCounts).map(([k,v])=>`<div class="info-line" style="padding:3px 0; border:none;"><span>${k}</span><span>${v}</span></div>`).join('') || '<div style="font-size:12px; color:var(--text-dim);">—</div>'}</div>
      </div>

      <div class="head-row">
        <div class="row2" style="grid-template-columns:auto auto auto; gap:8px;">
          <button class="btn-secondary" id="ev-table" onclick="setEcritureView('table')">Table</button>
          <button class="btn-secondary" id="ev-cards" onclick="setEcritureView('cards')">Cartes</button>
          <button class="btn-secondary" id="ev-kanban" onclick="setEcritureView('kanban')">Kanban</button>
        </div>
        <button class="btn-primary" onclick="openChapitreModal()">+ Nouveau chapitre</button>
      </div>

      <div id="ecriture-view-zone"></div>
    `;
    setEcritureView(ecritureViewMode);
  }

  function setEcritureView(mode){
    ecritureViewMode = mode;
    ['table','cards','kanban'].forEach(m => { const b = document.getElementById('ev-'+m); if (b) b.style.background = (m===mode) ? 'var(--accent)' : 'var(--bg-2)'; if (b) b.style.color = (m===mode) ? 'var(--bg)' : 'var(--text)'; });
    const zone = document.getElementById('ecriture-view-zone');
    if (!zone) return;
    if (mode === 'table') zone.innerHTML = renderChapitresTable(ecritureChapitres);
    if (mode === 'cards') zone.innerHTML = renderChapitresCards(ecritureChapitres);
    if (mode === 'kanban') zone.innerHTML = renderChapitresKanban(ecritureChapitres);
  }

  function renderChapitresTable(chaps){
    if (!chaps.length) return `<div class="empty">Aucun chapitre pour l'instant.</div>`;
    return `<table class="ch-table"><thead><tr><th>N°</th><th>Titre</th><th>Acte</th><th>POV</th><th>Statut</th><th>Mots</th><th>Objectif</th><th></th></tr></thead><tbody>
      ${chaps.map(c => `<tr onclick="openChapitreModal('${c.id}')">
        <td>${c.numero ?? '—'}</td><td>${c.titre}</td><td>${c.acte||'—'}</td><td>${c.pov||'—'}</td>
        <td><span class="etat-pill">${c.etat||'—'}</span></td><td>${c.nb_mots||0}</td><td>${c.objectif_mots||'—'}</td>
        <td onclick="event.stopPropagation(); openMemoPanel('${c.id}','${(c.titre||'').replace(/'/g,"\\'")}')" style="color:var(--text-dim); cursor:pointer;">💬</td>
      </tr>`).join('')}
    </tbody></table>`;
  }
  function renderChapitresCards(chaps){
    if (!chaps.length) return `<div class="empty">Aucun chapitre pour l'instant.</div>`;
    return `<div class="cards-grid">${chaps.map(c => `
      <div class="ch-card" onclick="openChapitreModal('${c.id}')">
        <div style="font-size:11px; color:var(--text-dim);">N°${c.numero ?? '—'} · ${c.acte||'—'}</div>
        <div style="font-size:14px; font-weight:500; margin:4px 0 8px;">${c.titre}</div>
        <span class="etat-pill">${c.etat||'—'}</span>
        <div style="font-size:12px; color:var(--text-dim); margin-top:8px;">POV ${c.pov||'—'} · ${c.nb_mots||0} mots</div>
      </div>`).join('')}</div>`;
  }
  function renderChapitresKanban(chaps){
    const etats = [...new Set(chaps.map(c=>c.etat).filter(Boolean))];
    if (!etats.length) return `<div class="empty">Aucun chapitre pour l'instant.</div>`;
    return `<div class="kanban-row">${etats.map(e => `
      <div class="kanban-col"><h4>${e} (${chaps.filter(c=>c.etat===e).length})</h4>
        ${chaps.filter(c=>c.etat===e).map(c => `<div class="kanban-card" onclick="openChapitreModal('${c.id}')">${c.titre}<div style="font-size:11px; color:var(--text-dim); margin-top:3px;">${c.acte||''} · ${c.nb_mots||0} mots</div></div>`).join('')}
      </div>`).join('')}</div>`;
  }

  function chapitreModalHtml(){
    return `
      <div class="modal-overlay" id="modal-chapitre-overlay" onclick="if(event.target===this) closeChapitreModal()">
        <div class="modal-box">
          <div class="modal-head"><h2 id="modal-chapitre-title">Nouveau chapitre</h2><button onclick="closeChapitreModal()">✕</button></div>
          <div class="modal-body">
            <div><label>Titre</label><input id="cf-titre"></div>
            <div class="row2">
              <div><label>Numéro</label><input type="number" id="cf-numero"></div>
              <div><label>Acte</label><input id="cf-acte"></div>
            </div>
            <div class="row2">
              <div><label>POV</label><input id="cf-pov"></div>
              <div><label>Statut</label><select id="cf-etat"><option>à écrire</option><option>en cours</option><option>à relire</option><option>relu</option><option>écrit</option></select></div>
            </div>
            <div class="row2">
              <div><label>Mots écrits</label><input type="number" id="cf-mots"></div>
              <div><label>Objectif de mots</label><input type="number" id="cf-objectif"></div>
            </div>
            <div><label>Résumé</label><textarea id="cf-resume"></textarea></div>
            <div><label>Plan</label><textarea id="cf-plan"></textarea></div>
          </div>
          <div class="modal-foot">
            ${'<button class="btn-secondary" id="cf-delete" style="margin-right:auto; display:none; color:#e88;" onclick="deleteChapitre()">Supprimer</button>'}
            <button class="btn-secondary" onclick="closeChapitreModal()">Annuler</button>
            <button class="btn-primary" onclick="saveChapitre()">Enregistrer</button>
          </div>
        </div>
      </div>`;
  }
  let editingChapitreId = null;
  async function openChapitreModal(id){
    editingChapitreId = id || null;
    document.getElementById('modal-chapitre-title').textContent = id ? 'Modifier le chapitre' : 'Nouveau chapitre';
    document.getElementById('cf-delete').style.display = id ? 'block' : 'none';
    document.getElementById('cf-titre').value=''; document.getElementById('cf-numero').value='';
    document.getElementById('cf-acte').value=''; document.getElementById('cf-pov').value='';
    document.getElementById('cf-etat').value='à écrire'; document.getElementById('cf-mots').value='';
    document.getElementById('cf-objectif').value=''; document.getElementById('cf-resume').value=''; document.getElementById('cf-plan').value='';
    if (id) {
      const c = ecritureChapitres.find(x=>x.id===id);
      if (c) {
        document.getElementById('cf-titre').value=c.titre||''; document.getElementById('cf-numero').value=c.numero||'';
        document.getElementById('cf-acte').value=c.acte||''; document.getElementById('cf-pov').value=c.pov||'';
        document.getElementById('cf-etat').value=c.etat||'à écrire'; document.getElementById('cf-mots').value=c.nb_mots||'';
        document.getElementById('cf-objectif').value=c.objectif_mots||''; document.getElementById('cf-resume').value=c.resume||''; document.getElementById('cf-plan').value=c.plan||'';
      }
    }
    document.getElementById('modal-chapitre-overlay').classList.add('open');
  }
  function closeChapitreModal(){ document.getElementById('modal-chapitre-overlay').classList.remove('open'); }
  async function saveChapitre(){
    const maxOrdre = ecritureChapitres.reduce((m,c)=>Math.max(m, c.ordre||0), 0);
    const payload = {
      titre: document.getElementById('cf-titre').value.trim()||'Sans titre',
      numero: parseInt(document.getElementById('cf-numero').value)||null,
      acte: document.getElementById('cf-acte').value.trim(),
      pov: document.getElementById('cf-pov').value.trim(),
      etat: document.getElementById('cf-etat').value,
      nb_mots: parseInt(document.getElementById('cf-mots').value)||0,
      objectif_mots: parseInt(document.getElementById('cf-objectif').value)||null,
      resume: document.getElementById('cf-resume').value.trim(),
      plan: document.getElementById('cf-plan').value.trim(),
    };
    let error;
    if (editingChapitreId) ({ error } = await db().from('chapitres').update(payload).eq('id', editingChapitreId));
    else { payload.user_id = currentUser.id; payload.oeuvre_id = currentOeuvreId; payload.ordre = maxOrdre + 1; ({ error } = await db().from('chapitres').insert(payload)); }
    if (error) { alert('Erreur : ' + error.message); return; }
    closeChapitreModal();
    await renderOeuvreEcriture(document.getElementById('oeuvre-tab-content'));
  }
  async function deleteChapitre(){
    if (!confirm('Supprimer ce chapitre ?')) return;
    const { error } = await db().from('chapitres').delete().eq('id', editingChapitreId);
    if (error) { alert('Erreur : ' + error.message); return; }
    closeChapitreModal();
    await renderOeuvreEcriture(document.getElementById('oeuvre-tab-content'));
  }

  // ---- Panneau de notes (chapitre_memos) ----
  let currentMemoChapitreId = null;
  async function openMemoPanel(chapitreId, titre){
    currentMemoChapitreId = chapitreId;
    document.getElementById('memo-panel-title').textContent = 'Notes — ' + titre;
    document.getElementById('memo-overlay').classList.add('open');
    document.getElementById('memo-panel').classList.add('open');
    await loadMemos();
  }
  function closeMemoPanel(){
    document.getElementById('memo-overlay').classList.remove('open');
    document.getElementById('memo-panel').classList.remove('open');
  }
  async function loadMemos(){
    const { data, error } = await db().from('chapitre_memos').select('*').eq('chapitre_id', currentMemoChapitreId).order('created_at', { ascending:false });
    const list = document.getElementById('memo-list');
    if (error) { list.innerHTML = `<div class="empty">Erreur : ${error.message}</div>`; return; }
    list.innerHTML = data.length ? data.map(m => `<div class="memo-item"><div class="memo-date">${new Date(m.created_at).toLocaleDateString('fr-FR')}</div>${m.contenu}</div>`).join('') : `<div style="font-size:13px; color:var(--text-dim);">Aucune note pour ce chapitre.</div>`;
  }
  async function addMemo(){
    const val = document.getElementById('memo-new').value.trim();
    if (!val) return;
    const { error } = await db().from('chapitre_memos').insert({ chapitre_id: currentMemoChapitreId, contenu: val });
    if (error) { alert('Erreur : ' + error.message); return; }
    document.getElementById('memo-new').value = '';
    await loadMemos();
  }

  async function renderOeuvreManuscrit(zone){
    zone.innerHTML=`<div class="status-line">Chargement…</div>`;
    const {data,error}=await db().from('chapitres').select('*').eq('oeuvre_id',currentOeuvreId).order('ordre');
    if(error){zone.innerHTML=`<div class="empty">Erreur : ${safeText(error.message)}</div>`;return;}
    const rows=(data||[]).filter(c=>(c.nb_mots||0)>0 || String(c.statut||'').toLowerCase().includes('écrit') || String(c.statut||'').toLowerCase().includes('redig'));
    const words=rows.reduce((a,c)=>a+(c.nb_mots||0),0);
    zone.innerHTML=`<div class="stat-cards-row" style="grid-template-columns:repeat(2,minmax(180px,1fr));max-width:600px"><div class="stat-card"><h3>Chapitres écrits</h3><div class="stat-big">${rows.length}</div></div><div class="stat-card"><h3>Total de mots</h3><div class="stat-big">${words.toLocaleString('fr-FR')}</div></div></div><div class="panel"><table class="ch-table manuscript-table"><thead><tr><th>N°</th><th>Titre du chapitre</th><th>Statut</th><th>Mots</th><th>Date d’écriture</th><th>Notes</th></tr></thead><tbody>${rows.map(c=>`<tr><td>${c.numero??c.ordre??'—'}</td><td><strong>${safeText(c.titre||'Sans titre')}</strong></td><td><span class="etat-pill">Écrit</span></td><td>${(c.nb_mots||0).toLocaleString('fr-FR')}</td><td>${safeText(c.date_ecriture||c.updated_at?.slice?.(0,10)||'—')}</td><td><button class="note-icon" onclick="openManuscriptDrawer('${c.id}','${safeText((c.titre||'Chapitre').replace(/'/g,"\'"))}')">📝</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Aucun chapitre écrit synchronisé pour le moment.</div></td></tr>'}</tbody></table></div>`;
  }
  async function openManuscriptDrawer(id,title){
    const {data:c}=await db().from('chapitres').select('memo').eq('id',id).single();
    openDrawer(title,`<div class="rich-toolbar"><select onchange="document.execCommand('fontSize',false,this.value)"><option value="3">Taille</option><option value="2">Petit</option><option value="3">Normal</option><option value="5">Grand</option></select><button onclick="document.execCommand('bold')"><b>B</b></button><button onclick="document.execCommand('italic')"><i>I</i></button><button onclick="document.execCommand('underline')"><u>U</u></button><button onclick="document.execCommand('hiliteColor',false,'#fff1a8')">Surligner</button><button onclick="insertRichImage()">🖼 Image</button></div><div id="rich-manuscript" class="rich-editor" contenteditable="true">${c?.memo||''}</div><button class="btn-primary" style="margin-top:14px" onclick="saveManuscriptNote('${id}')">Enregistrer</button>`);
  }
  async function saveManuscriptNote(id){const html=document.getElementById('rich-manuscript').innerHTML;const {error}=await db().from('chapitres').update({memo:html}).eq('id',id);if(error)alert('Erreur : '+error.message);else closeDrawer();}
  function insertRichImage(){const url=prompt('URL de l’image :');if(url)document.execCommand('insertImage',false,url);}
  // ============================================================
  // Onglet Personnages d'une œuvre
  // ============================================================
  let opoLinks = [];
  let personnageFilter = 'tous';
  let personnageView = 'gallery';
  async function renderOeuvrePersonnages(zone){
    zone.innerHTML = `<div class="status-line">Chargement…</div>`;
    const { data, error } = await db().from('personnages_oeuvres').select('personnage_id, role, importance, pov, faction, etat, personnages(id, nom, favori)').eq('oeuvre_id', currentOeuvreId);
    if (error) { zone.innerHTML = `<div class="empty">Erreur : ${safeText(error.message)}</div>`; return; }
    opoLinks = data || [];
    const filtered = opoLinks.filter(d => personnageFilter==='tous' || (d.importance||'').toLowerCase()===personnageFilter);
    zone.innerHTML = `<div class="work-toolbar"><div class="segmented">
      <button class="btn-secondary ${personnageFilter==='principal'?'active':''}" onclick="personnageFilter='principal';renderOeuvrePersonnages(document.getElementById('oeuvre-tab-content'))">Principaux</button>
      <button class="btn-secondary ${personnageFilter==='secondaire'?'active':''}" onclick="personnageFilter='secondaire';renderOeuvrePersonnages(document.getElementById('oeuvre-tab-content'))">Secondaires</button>
      <button class="btn-secondary ${personnageFilter==='tous'?'active':''}" onclick="personnageFilter='tous';renderOeuvrePersonnages(document.getElementById('oeuvre-tab-content'))">Tous</button>
      <span style="width:10px"></span>
      <button class="btn-secondary ${personnageView==='gallery'?'active':''}" onclick="personnageView='gallery';renderOeuvrePersonnages(document.getElementById('oeuvre-tab-content'))">Galerie</button>
      <button class="btn-secondary ${personnageView==='table'?'active':''}" onclick="personnageView='table';renderOeuvrePersonnages(document.getElementById('oeuvre-tab-content'))">Tableau</button>

s Personnage sera construit dans son chantier dédié.</div></div>`}`;

    document.getElementById('po-nouveau-nom').style.display = 'none';

    document.getElementById('po-pov').value=''; document.getElementById('po-faction').value=''; document.getElementById('po-etat').value='';

  document.addEventListener('change', (e) => {

  function closePersonnageOeuvreModal(){ document.getElementById('modal-po-overlay').classList.remove('open'); }
  async function savePersonnageOeuvre(){
    let personnageId = editingPoPersonnageId;
    if (!personnageId) {
      const selVal = document.getElementById('po-personnage-select').value;
      if (!selVal) { alert('Choisis un personnage.'); return; }
      if (selVal === '__new__') {
        const nom = document.getElementById('po-nouveau-nom').value.trim();
        if (!nom) { alert('Donne un nom au nouveau personnage.'); return; }
        const { data, error } = await db().from('personnages').insert({ user_id: currentUser.id, nom }).select('id').single();
        if (error) { alert('Erreur : ' + error.message); return; }
        personnageId = data.id;
      } else {
        personnageId = selVal;
      }
    }
    const linkPayload = {
      role: document.getElementById('po-role').value.trim(),
      importance: document.getElementById('po-importance').value || null,
      pov: document.getElementById('po-pov').value || null,
      faction: document.getElementById('po-faction').value.trim(),
      etat: document.getElementById('po-etat').value.trim(),
    };
    let error;
    if (editingPoPersonnageId) {
      ({ error } = await db().from('personnages_oeuvres').update(linkPayload).eq('oeuvre_id', currentOeuvreId).eq('personnage_id', personnageId));
    } else {
      ({ error } = await db().from('personnages_oeuvres').insert({ oeuvre_id: currentOeuvreId, personnage_id: personnageId, ...linkPayload }));
    }
    if (error) { alert('Erreur : ' + error.message); return; }
    closePersonnageOeuvreModal();
    await renderOeuvrePersonnages(document.getElementById('oeuvre-tab-content'));
  }
  async function removePersonnageOeuvre(){
    if (!confirm('Retirer ce personnage de cette œuvre ? (la fiche du personnage elle-même est conservée)')) return;
    const { error } = await db().from('personnages_oeuvres').delete().eq('oeuvre_id', currentOeuvreId).eq('personnage_id', editingPoPersonnageId);
    if (error) { alert('Erreur : ' + error.message); return; }
    closePersonnageOeuvreModal();
    await renderOeuvrePersonnages(document.getElementById('oeuvre-tab-content'));
  }

  // Onglet Plans d'une œuvre

  let plansData = [];
  let plansGroupBy = 'acte';
  let plansView = 'table';

  async function renderOeuvrePlans(zone){
    zone.innerHTML = `<div class="status-line">Chargement…</div>`;
    const [{ data: plans, error }, { data: notes }] = await Promise.all([
      db().from('plans').select('*').eq('oeuvre_id', currentOeuvreId).order('ordre'),
      db().from('oeuvre_notes').select('*').eq('oeuvre_id', currentOeuvreId).order('created_at', { ascending:false }),
    ]);
    if (error) { zone.innerHTML = `<div class="empty">Erreur : ${error.message}</div>`; return; }
    plansData = plans;

    zone.innerHTML = `
      <div class="row2" style="grid-template-columns:2fr 1fr; gap:20px; align-items:start;">
        <div>
          <div class="head-row">
            <div class="row2" style="grid-template-columns:auto auto auto; gap:8px;">
              <button class="btn-secondary" id="pv-table" onclick="setPlansView('table')">Table</button>
              <button class="btn-secondary" id="pv-kanban" onclick="setPlansView('kanban')">Kanban</button>
              <select class="search-input" id="plans-groupby" onchange="onPlansGroupByChange()">
                <option value="acte" ${plansGroupBy==='acte'?'selected':''}>Grouper par acte</option>
                <option value="type" ${plansGroupBy==='type'?'selected':''}>Grouper par type</option>
                <option value="statut" ${plansGroupBy==='statut'?'selected':''}>Grouper par statut</option>

          <div class="panel">
            <h2>Notes de l'autrice</h2>
            <textarea id="on-new" placeholder="Notes globales sur la structure, les thèmes, les enjeux..."></textarea>
            <button class="btn-primary" style="margin-top:8px; width:100%;" onclick="addOeuvreNote()">Ajouter</button>
            <div style="margin-top:14px;">${(notes||[]).map(n => `<div class="memo-item"><div class="memo-date">${new Date(n.created_at).toLocaleDateString('fr-FR')}</div>${n.contenu}</div>`).join('') || '<div style="font-size:12px; color:var(--text-dim);">Aucune note pour le moment.</div>'}</div>

    setPlansView(plansView);

  function onPlansGroupByChange(){ plansGroupBy = document.getElementById('plans-groupby').value; setPlansView(plansView); }
  function setPlansView(mode){
    plansView = mode;
    ['table','kanban'].forEach(m => { const b = document.getElementById('pv-'+m); if (b) { b.style.background = (m===mode)?'var(--accent)':'var(--bg-2)'; b.style.color = (m===mode)?'var(--bg)':'var(--text)'; } });
    const zone = document.getElementById('plans-view-zone');
    if (!zone) return;
    zone.innerHTML = mode === 'table' ? renderPlansTable(plansData) : renderPlansKanban(plansData, plansGroupBy);
  }
  function renderPlansTable(plans){
    if (!plans.length) return `<div class="empty">Aucun plan pour l'instant.</div>`;
    return `<table class="ch-table"><thead><tr><th>Type</th><th>Titre</th><th>Acte</th><th>Statut</th></tr></thead><tbody>
      ${plans.map(p => `<tr onclick="openPlanModal('${p.id}')"><td>${p.type}</td><td>${p.titre}</td><td>${p.acte||'—'}</td><td><span class="etat-pill">${p.statut||'—'}</span></td></tr>`).join('')}
    </tbody></table>`;
  }
  function renderPlansKanban(plans, groupBy){
    const groupes = [...new Set(plans.map(p=>p[groupBy]).filter(Boolean))];
    if (!groupes.length) return `<div class="empty">Aucun plan pour l'instant.</div>`;
    return `<div class="kanban-row">${groupes.map(g => `
      <div class="kanban-col"><h4>${g} (${plans.filter(p=>p[groupBy]===g).length})</h4>
        ${plans.filter(p=>p[groupBy]===g).map(p => `<div class="kanban-card" onclick="openPlanModal('${p.id}')"><div style="font-size:11px; color:var(--text-dim);">${p.type}</div>${p.titre}</div>`).join('')}
      </div>`).join('')}</div>`;
  }

  function planModalHtml(){
    return `
      <div class="modal-overlay" id="modal-plan-overlay" onclick="if(event.target===this) closePlanModal()">
        <div class="modal-box">
          <div class="modal-head"><h2 id="modal-plan-title">Nouveau plan</h2><button onclick="closePlanModal()">✕</button></div>
          <div class="modal-body">
            <div><label>Type</label><select id="pf-type"><option>Intrigue principale</option><option>Arc personnage</option><option>Sous-intrigue</option><option>Romance</option></select></div>

  let editingPlanId = null;
  function openPlanModal(id){
    editingPlanId = id || null;
    document.getElementById('modal-plan-title').textContent = id ? 'Modifier le plan' : 'Nouveau plan';

    document.getElementById('pf-acte').value=''; document.getElementById('pf-statut').value=''; document.getElementById('pf-transformation').value='';

    }
    document.getElementById('modal-plan-overlay').classList.add('open');
  }
  function closePlanModal(){ document.getElementById('modal-plan-overlay').classList.remove('open'); }
  async function savePlan(){
    const payload = { type: document.getElementById('pf-type').value, titre: document.getElementById('pf-titre').value.trim()||'Sans titre', acte: document.getElementById('pf-acte').value.trim(), statut: document.getElementById('pf-statut').value.trim(), transformation: document.getElementById('pf-transformation').value.trim() };
    let error;
    if (editingPlanId) ({ error } = await db().from('plans').update(payload).eq('id', editingPlanId));
    else { payload.user_id = currentUser.id; payload.oeuvre_id = currentOeuvreId; ({ error } = await db().from('plans').insert(payload)); }
    if (error) { alert('Erreur : ' + error.message); return; }
    closePlanModal();
    await renderOeuvrePlans(document.getElementById('oeuvre-tab-content'));
  }
  async function deletePlan(){

  async function addOeuvreNote(){
    const val = document.getElementById('on-new').value.trim();
    if (!val) return;
    const { error } = await db().from('oeuvre_notes').insert({ oeuvre_id: currentOeuvreId, contenu: val });
    if (error) { alert('Erreur : ' + error.message); return; }
    await renderOeuvrePlans(document.getElementById('oeuvre-tab-content'));
  }

  // ============================================================
  // Onglet Relecture d'une œuvre
  // ============================================================
  let currentRelectureId = null;
  let relectureChapitres = [];

  let currentRelectureV2=null; let relectureView='table';
  async function renderOeuvreRelectureV2(zone){
    zone.innerHTML=`<div class="status-line">Chargement…</div>`;
    let {data:rs}=await db().from('relectures').select('*').eq('oeuvre_id',currentOeuvreId).order('created_at',{ascending:false}).limit(1);
    if(!rs?.length){zone.innerHTML=`<div class="empty">Aucune relecture démarrée.<br><br><button class="btn-primary" onclick="startRelecture();setTimeout(()=>showOeuvreTab('relecture'),400)">Démarrer une relecture</button></div>`;return;}
    currentRelectureV2=rs[0];
    const [{data:chaps},{data:states},{data:checks},{data:links}]=await Promise.all([
      db().from('chapitres').select('*').eq('oeuvre_id',currentOeuvreId).order('ordre'),
      db().from('relecture_chapitres').select('*').eq('relecture_id',currentRelectureV2.id),
      db().from('relecture_checklist').select('*').eq('relecture_id',currentRelectureV2.id).order('ordre'),
      db().from('notes_liees').select('*').or(`oeuvre_cible_id.eq.${currentOeuvreId},oeuvre_source_id.eq.${currentOeuvreId}`).order('created_at',{ascending:false})
    ]);
    const sm=Object.fromEntries((states||[]).map(x=>[x.chapitre_id,x])); const cm={};(checks||[]).forEach(x=>(cm[x.chapitre_id]??=[]).push(x));
    const rows=(chaps||[]).filter(c=>(c.nb_mots||0)>0 || sm[c.id]); const relus=rows.filter(c=>(sm[c.id]?.statut||'à relire')==='relu').length; const pct=rows.length?Math.round(relus/rows.length*100):0;
    const milestones=[currentRelectureV2.date_debut&&`Relecture démarrée · ${currentRelectureV2.date_debut}`,currentOeuvre?.statut&&`Manuscrit · ${currentOeuvre.statut}`,currentOeuvre?.publication_envisagee&&`Objectif · ${currentOeuvre.publication_envisagee}`].filter(Boolean);
    const rowHtml=c=>{const st=sm[c.id]||{};const cl=cm[c.id]||[];const done=cl.filter(x=>x.fait).length;return `<tr><td><button style="border:0;background:none;cursor:pointer;font-weight:600;color:var(--text);padding:0" onclick="openRelectureDrawer('${c.id}','${safeText((c.titre||'Chapitre').replace(/'/g,"\'"))}')">${safeText(c.titre||'Chapitre '+(c.numero??''))}</button></td><td><select class="status-select" onchange="saveRelectureStatus('${c.id}',this.value)">${['à écrire','à relire','en cours','bloqué','relu'].map(x=>`<option ${x===(st.statut||'à relire')?'selected':''}>${x}</option>`).join('')}</select></td><td>${cl.length?`${done}/${cl.length}`:'—'}</td><td>${st.updated_at?`${st.statut==='relu'?'✓ ':''}${new Date(st.updated_at).toLocaleDateString('fr-FR')}`:'—'}</td><td>${st.notes_html?'📝':'—'}</td></tr>`};
    const statuses=['à écrire','à relire','en cours','bloqué','relu'];
    zone.innerHTML=`<div class="panel"><h2>Jalons</h2><div style="display:flex;gap:10px;flex-wrap:wrap">${milestones.map(x=>`<span class="keyword-chip">${safeText(x)}</span>`).join('')||'<span style="color:var(--text-dim);font-size:12px">Aucun jalon.</span>'}</div><h2 style="margin-top:18px">Progression</h2><strong>${relus} / ${rows.length} chapitres relus · ${pct}%</strong><div class="progress-bar-outer" style="max-width:none;margin-top:8px"><div class="progress-bar-inner" style="width:${pct}%"></div></div></div><div class="relecture-grid"><section class="panel"><div class="work-toolbar"><h2 style="margin:0">Suivi des chapitres</h2><div class="segmented"><button class="btn-secondary ${relectureView==='table'?'active':''}" onclick="relectureView='table';renderOeuvreRelectureV2(document.getElementById('oeuvre-tab-content'))">Tableau</button><button class="btn-secondary ${relectureView==='kanban'?'active':''}" onclick="relectureView='kanban';renderOeuvreRelectureV2(document.getElementById('oeuvre-tab-content'))">Kanban</button></div></div>${relectureView==='table'?`<table class="ch-table"><thead><tr><th>Chapitre</th><th>Statut</th><th>Progression</th><th>Dernière mise à jour</th><th>Notes</th></tr></thead><tbody>${rows.map(rowHtml).join('')}</tbody></table>`:`<div style="display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:10px;overflow:auto">${statuses.map(status=>`<div style="background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:10px"><strong style="text-transform:capitalize">${status}</strong>${rows.filter(c=>(sm[c.id]?.statut||'à relire')===status).map(c=>`<div class="memo-item" style="margin-top:9px;cursor:pointer" onclick="openRelectureDrawer('${c.id}','${safeText((c.titre||'Chapitre').replace(/'/g,"\'"))}')">${safeText(c.titre||'Chapitre')}</div>`).join('')||'<small style="color:var(--text-dim)">Vide</small>'}</div>`).join('')}</div>`}</section><aside class="panel"><h2>🔗 Notes liées</h2>${links?.length?links.map(n=>`<div class="linked-note"><small>${n.oeuvre_source_id===currentOeuvreId?'↗ Créée ici':'↙ Reçue'}</small><div>${n.contenu_html||'Note liée'}</div></div>`).join(''):`<div class="walter-empty"><div class="walter-placeholder">🐈‍⬛</div><strong>Walter garde la continuité.</strong><div>Aucune note liée pour le moment.</div></div>`}</aside></div>`;
  }

  async function renderOeuvreRelecture(zone){
    zone.innerHTML = `<div class="status-line">Chargement…</div>`;
    let { data: relectures } = await db().from('relectures').select('*').eq('oeuvre_id', currentOeuvreId).order('created_at', { ascending:false });
    if (!relectures || !relectures.length) {
      zone.innerHTML = `<div class="empty">Aucune relecture démarrée pour cette œuvre.<br><br><button class="btn-primary" onclick="startRelecture()">Démarrer une relecture</button></div>`;
      return;
    }
    const relecture = relectures[0];
    currentRelectureId = relecture.id;

    const [{ data: chaps }, { data: corrections }] = await Promise.all([
      db().from('chapitres').select('id, numero, titre').eq('oeuvre_id', currentOeuvreId).order('ordre'),
      db().from('corrections').select('*').eq('relecture_id', currentRelectureId).order('created_at', { ascending:false }),
    ]);
    relectureChapitres = chaps || [];

    const corrByChapitre = {};
    (corrections||[]).forEach(c => { if (c.chapitre_id) corrByChapitre[c.chapitre_id] = c; });
    const relus = (corrections||[]).filter(c=>c.resolu).length;
    const enCours = (corrections||[]).filter(c=>!c.resolu && c.etat==='en cours').length;
    const bloque = (corrections||[]).filter(c=>c.etat==='bloqué').length;
    const total = relectureChapitres.length;
    const pct = total ? Math.round(relus/total*100) : 0;

    zone.innerHTML = `
      <div class="stat-cards-row">
        <div class="stat-card"><h3>Type de relecture</h3><div class="stat-big" style="font-size:1.3rem;">${relecture.type||'—'}</div><div style="font-size:12px; color:var(--text-dim);">${relecture.statut||''}</div></div>
        <div class="stat-card"><h3>Chapitres relus</h3><div class="stat-big">${relus} / ${total}</div></div>
        <div class="stat-card"><h3>En cours</h3><div class="stat-big">${enCours}</div></div>
        <div class="stat-card"><h3>Bloqués</h3><div class="stat-big">${bloque}</div></div>
      </div>
      <div class="panel">
        <h2>Avancement</h2>
        <div class="progress-bar-outer" style="max-width:none;"><div class="progress-bar-inner" style="width:${pct}%;"></div></div>
        <div style="font-size:12px; color:var(--text-dim); margin-top:6px;">${pct}%</div>
      </div>

      <div class="row2" style="grid-template-columns:1.4fr 1fr; gap:20px; align-items:start;">
        <div class="panel">
          <h2>Suivi des chapitres</h2>
          <table class="ch-table"><thead><tr><th>N°</th><th>Titre</th><th>Statut</th><th></th></tr></thead><tbody>
            ${relectureChapitres.map(c => {
              const cor = corrByChapitre[c.id];
              return `<tr onclick="openCorrectionModal('${c.id}', '${(c.titre||'').replace(/'/g,"\\'")}')">
                <td>${c.numero ?? '—'}</td><td>${c.titre}</td>
                <td><span class="etat-pill">${cor ? (cor.resolu?'Relu':cor.etat||'—') : 'À relire'}</span></td>
                <td style="color:var(--text-dim);">${cor?.point_a_corriger ? '📝' : ''}</td>
              </tr>`;
            }).join('')}
          </tbody></table>
        </div>
        <div class="panel">
          <h2>Journal des corrections</h2>
          ${(corrections||[]).length ? corrections.slice(0,10).map(c => `
            <div class="memo-item">
              <div class="memo-date">${new Date(c.created_at).toLocaleDateString('fr-FR')} — ${c.resolu?'✅ Résolu':'⚠️ '+ (c.etat||'à traiter')}</div>
              ${c.point_a_corriger || '—'}
            </div>`).join('') : '<div style="font-size:12px; color:var(--text-dim);">Aucune correction enregistrée.</div>'}
        </div>
      </div>
    `;
  }

  async function saveCorrection(){
    const payload = {

      chapitre_id: currentCorrectionChapitreId,

  function renderSimpleRichText(value){
    const escaped = safeText(value || '');
    return escaped
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/__(.+?)__/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/_(.+?)_/g, '<em>$1</em>')
      .replace(/\n/g, '<br>');
  }

  function joursDepuisGeneric(dateStr){
    const diff = Math.floor((new Date() - new Date(dateStr)) / 86400000);
    return diff <= 0 ? "aujourd'hui" : `il y a ${diff} j`;
  }
  function renderIdeesGrid(){
    const q = (document.getElementById('idee-search').value||'').toLowerCase();
    const statutFiltre = document.getElementById('idee-filtre-statut').value;
    const typeFiltre = document.getElementById('idee-filtre-type').value;
    const genreFiltre = document.getElementById('idee-filtre-genre').value;
    let data = ideesData.filter(i => i.titre.toLowerCase().includes(q));
    if (statutFiltre) data = data.filter(i => i.statut === statutFiltre);
    if (typeFiltre) data = data.filter(i => i.type === typeFiltre);
    if (genreFiltre) data = data.filter(i => i.genre === genreFiltre);
    const zone = document.getElementById('idees-grid');
    if (!data.length) { zone.innerHTML = `<div class="empty">Aucune idée ne correspond.</div>`; return; }
    zone.innerHTML = data.map(i => {
      const color = IDEE_STATUT_COLOR[i.statut] || 'var(--text-dim)';
      const tags = [i.genre, ...(i.ambiance||[]).slice(0,2)].filter(Boolean);
      return `
      <div class="char-card" onclick="openIdeeModal('${i.id}')" style="padding-bottom:2px;">
        <span onclick="event.stopPropagation(); toggleFavoriIdee('${i.id}', ${!!i.favori})" style="position:absolute; top:8px; right:10px; font-size:16px; cursor:pointer; color:${i.favori?'var(--accent)':'var(--text-dim)'};">${i.favori?'★':'☆'}</span>
        <div style="padding:12px 14px 0;">
          <span style="font-size:10px; padding:3px 10px; border-radius:20px; background:${color}22; color:${color}; font-weight:600; text-transform:uppercase; letter-spacing:0.03em;">${i.statut||'Graine'}</span>
        </div>
        <div style="padding:10px 14px 0; font-size:15px; font-weight:500;">${i.titre}</div>
        <div style="padding:6px 14px 0; font-size:12px; color:var(--text-dim); line-height:1.5;">${(i.note||'').slice(0,90)}${(i.note||'').length>90?'…':''}</div>
        <div style="padding:10px 14px 0;">${tags.map(t=>`<span class="etat-pill" style="margin:0 5px 5px 0; display:inline-block;">${t}</span>`).join('')}</div>
        <div style="padding:8px 14px 12px; font-size:11px; color:var(--text-dim);">${joursDepuisGeneric(i.created_at)}${i.potentiel ? ' · '+'★'.repeat(i.potentiel) : ''}</div>
      </div>`;
    }).join('');
  }
  async function toggleFavoriIdee(id, currentlyFavori){
    const { error } = await db().from('idees').update({ favori: !currentlyFavori }).eq('id', id);
    if (error) { alert('Erreur : ' + error.message); return; }
    const idx = ideesData.findIndex(i=>i.id===id);
    if (idx>-1) ideesData[idx].favori = !currentlyFavori;
    renderIdeesGrid();
  }

  let editingIdeeId = null;
  async function openIdeeModal(id){
    editingIdeeId = id || null;
    document.getElementById('modal-idee-title').textContent = id ? "Modifier l'idée" : 'Nouvelle idée';
    document.getElementById('if-titre').value=''; document.getElementById('if-note').value='';
    document.getElementById('if-type').value=''; document.getElementById('if-genre').value='';
    document.getElementById('if-statut').value='Graine'; document.getElementById('if-potentiel').value='';
    document.getElementById('if-ambiance').value=''; document.getElementById('if-favori').checked=false;
    document.getElementById('if-abandon').style.display = id ? 'block' : 'none';
    document.getElementById('if-notes-zone').style.display = id ? 'block' : 'none';
    document.getElementById('if-transform-zone').style.display = 'none';
    document.getElementById('if-transform-actions').style.display = 'none';

    if (id) {
      const idee = ideesData.find(x=>x.id===id) || (await db().from('idees').select('*').eq('id', id).single()).data;
      if (idee) {
        document.getElementById('if-titre').value=idee.titre||''; document.getElementById('if-note').value=idee.note||'';
        document.getElementById('if-type').value=idee.type||''; document.getElementById('if-genre').value=idee.genre||'';
        document.getElementById('if-statut').value=idee.statut||'Graine'; document.getElementById('if-potentiel').value=idee.potentiel||'';
        document.getElementById('if-ambiance').value=(idee.ambiance||[]).join(', '); document.getElementById('if-favori').checked=!!idee.favori;
        if (idee.transforme_en_type) {
          document.getElementById('if-transform-zone').style.display = 'block';
          document.getElementById('if-transform-info').textContent = 'Transformée en ' + idee.transforme_en_type;
        } else {
          document.getElementById('if-transform-actions').style.display = 'block';

      }
      await loadIdeeNotes(id);
    }
    document.getElementById('modal-idee-overlay').classList.add('open');

  function closeIdeeModal(){ document.getElementById('modal-idee-overlay').classList.remove('open'); }
  async function saveIdee(){
    const ambianceRaw = document.getElementById('if-ambiance').value.trim();
    const payload = {
      titre: document.getElementById('if-titre').value.trim()||'Sans titre',
      note: document.getElementById('if-note').value.trim(),
      type: document.getElementById('if-type').value.trim(),
      genre: document.getElementById('if-genre').value.trim(),
      statut: document.getElementById('if-statut').value,
      potentiel: parseInt(document.getElementById('if-potentiel').value)||null,
      ambiance: ambianceRaw ? ambianceRaw.split(',').map(t=>t.trim()).filter(Boolean) : null,
      favori: document.getElementById('if-favori').checked,
    };
    let error;
    if (editingIdeeId) ({ error } = await db().from('idees').update(payload).eq('id', editingIdeeId));
    else { payload.user_id = currentUser.id; ({ error } = await db().from('idees').insert(payload)); }
    if (error) { alert('Erreur : ' + error.message); return; }
    closeIdeeModal(); await renderIdees();
  }
  async function abandonnerIdee(){
    if (!confirm('Marquer cette idée comme abandonnée ?')) return;
    const { error } = await db().from('idees').update({ statut: 'Abandonnée' }).eq('id', editingIdeeId);
    if (error) { alert('Erreur : ' + error.message); return; }
    closeIdeeModal(); await renderIdees();
  }
  async function loadIdeeNotes(ideeId){
    const { data } = await db().from('idee_notes').select('*').eq('idee_id', ideeId).order('created_at', { ascending:false });
    document.getElementById('if-notes-list').innerHTML = (data||[]).length ? data.map(n=>`<div class="memo-item"><div class="memo-date">${new Date(n.created_at).toLocaleDateString('fr-FR')}</div>${n.contenu}</div>`).join('') : '<div style="font-size:12px; color:var(--text-dim);">Aucune note.</div>';
  }
  async function addIdeeNote(){
    const val = document.getElementById('if-note-new').value.trim();
    if (!val || !editingIdeeId) return;
    const { error } = await db().from('idee_notes').insert({ idee_id: editingIdeeId, contenu: val });
    if (error) { alert('Erreur : ' + error.message); return; }
    document.getElementById('if-note-new').value = '';
    await loadIdeeNotes(editingIdeeId);
  }
  async function transformerIdee(type){
    const idee = ideesData.find(x=>x.id===editingIdeeId);
    if (!idee) return;
    if (!confirm(`Transformer « ${idee.titre} » en ${type} ?`)) return;
    let newId, tableName, updatePayload = { transforme_en_type: type };
    if (type === 'oeuvre') {
      tableName = 'oeuvres';
      const { data, error } = await db().from('oeuvres').insert({ titre: idee.titre, resume: idee.note, user_id: currentUser.id }).select('id').single();
      if (error) { alert('Erreur : ' + error.message); return; }
      newId = data.id; updatePayload.transforme_en_oeuvre_id = newId;
    } else if (type === 'saga') {
      const { data, error } = await db().from('sagas').insert({ nom: idee.titre, description: idee.note, user_id: currentUser.id }).select('id').single();
      if (error) { alert('Erreur : ' + error.message); return; }
      newId = data.id; updatePayload.transforme_en_saga_id = newId;
    } else if (type === 'recueil') {
      const { data, error } = await db().from('recueils').insert({ titre: idee.titre, resume: idee.note, user_id: currentUser.id }).select('id').single();
      if (error) { alert('Erreur : ' + error.message); return; }
      newId = data.id; updatePayload.transforme_en_recueil_id = newId;
    }
    await db().from('idees').update(updatePayload).eq('id', editingIdeeId);
    closeIdeeModal();
    if (type === 'oeuvre') openOeuvreDetail(newId);
    else if (type === 'saga') openSagaDetail(newId);
    else if (type === 'recueil') openRecueilDetail(newId);
  }

    const [{ data, error }, { data: r }] = await Promise.all([
      db().from('poemes').select('*').eq('recueil_id', currentRecueilId).order('ordre'),
      db().from('recueils').select('type_recueil').eq('id', currentRecueilId).single(),
    ]);
    if (error) { zone.innerHTML = `<div class="empty">Erreur : ${error.message}</div>`; return; }
    recueilPoemesData = data;
    currentRecueilType = r?.type_recueil || 'original';
    zone.innerHTML = `
      <div class="head-row">
        <input class="search-input" id="poeme-search" placeholder="Rechercher un poème..." oninput="renderPoemesTable()">
        <button class="btn-primary" onclick="openPoemeModal()">+ ${currentRecueilType==='anthologie' ? 'Compiler un poème' : 'Nouveau poème'}</button>
      </div>
      <div id="poemes-table-zone"></div>
    `;
    renderPoemesTable();
  }
  function renderPoemesTable(){
    const q = (document.getElementById('poeme-search').value||'').toLowerCase();
    const data = recueilPoemesData.filter(p=>p.titre.toLowerCase().includes(q));
    const isAnth = currentRecueilType === 'anthologie';
    document.getElementById('poemes-table-zone').innerHTML = data.length ? `<table class="ch-table"><thead><tr><th>#</th><th>Titre</th><th>Statut</th><th>Thème</th>${isAnth ? '<th>Emplacement</th>' : `<th>Date d'écriture</th>`}</tr></thead><tbody>
      ${data.map(p => `<tr onclick="openPoemeModal('${p.id}')"><td>${p.numero??'—'}</td><td>${p.titre}</td><td><span class="etat-pill">${p.statut||'—'}</span></td><td>${p.theme_principal||'—'}</td><td>${isAnth ? (p.emplacement||'—') : (p.date_ecriture||'—')}</td></tr>`).join('')}
    </tbody></table>` : `<div class="empty">Aucun poème pour l'instant.</div>`;
  }

  function poemeModalHtml(){
    return `
      <div class="modal-overlay" id="modal-poeme-overlay" onclick="if(event.target===this) closePoemeModal()">
        <div class="modal-box">
          <div class="modal-head"><h2 id="modal-poeme-title">Nouveau poème</h2><button onclick="closePoemeModal()">✕</button></div>
          <div class="modal-body">
            <div><label>Titre</label><input id="pmf-titre"></div>
            <div class="row2">
              <div><label>Statut</label><select id="pmf-statut"><option value="à écrire">À écrire</option><option value="brouillon">Brouillon</option><option value="terminé">Terminé</option></select></div>
              <div><label>Sélection</label><select id="pmf-selection"><option value="">—</option><option value="sélectionné">Sélectionné</option><option value="non sélectionné">Non sélectionné</option></select></div>
            </div>
            <div class="row2">
              <div><label>Thème principal</label><input id="pmf-theme"></div>
              <div><label>Date d'écriture</label><input type="date" id="pmf-date"></div>
            </div>
            <div><label>Mots-clés (séparés par des virgules)</label><input id="pmf-motscles"></div>
            <div><label>Section</label><select id="pmf-section"><option value="">— Sans section —</option></select></div>
            <div id="pmf-anthologie-zone" style="display:none; border-top:1px solid var(--line); padding-top:12px; margin-top:6px;">
              <div style="font-size:12px; color:var(--lavender); margin-bottom:8px;">Compilation (anthologie)</div>
              <label>Recueil d'origine</label><select id="pmf-recueil-origine"><option value="">—</option></select>
              <div class="row2" style="margin-top:10px;">
                <div><label>Emplacement</label><select id="pmf-emplacement"><option value="">—</option><option>Début</option><option>Fin</option></select></div>
                <div><label>Action</label><select id="pmf-action"><option value="">—</option><option>À corriger</option></select></div>
              </div>
              <label style="margin-top:10px;">Remarque</label><textarea id="pmf-remarque"></textarea>
            </div>
            <div><label>Extrait</label><textarea id="pmf-extrait"></textarea></div>
            <div><label>Texte complet</label><textarea id="pmf-texte" style="min-height:140px;"></textarea></div>
          </div>
          <div class="modal-foot">
            <button class="btn-secondary" id="pmf-delete" style="margin-right:auto; display:none; color:#e88;" onclick="deletePoeme()">Supprimer</button>
            <button class="btn-secondary" onclick="closePoemeModal()">Annuler</button>
            <button class="btn-primary" onclick="savePoeme()">Enregistrer</button>
          </div>
        </div>
      </div>`;
  }
  let editingPoemeId = null;
  async function openPoemeModal(id){
    editingPoemeId = id || null;
    document.getElementById('modal-poeme-title').textContent = id ? 'Modifier le poème' : (currentRecueilType==='anthologie' ? 'Compiler un poème' : 'Nouveau poème');
    document.getElementById('pmf-delete').style.display = id ? 'block' : 'none';
    document.getElementById('pmf-titre').value=''; document.getElementById('pmf-statut').value='à écrire';
    document.getElementById('pmf-selection').value=''; document.getElementById('pmf-theme').value='';
    document.getElementById('pmf-date').value=''; document.getElementById('pmf-motscles').value='';
    document.getElementById('pmf-extrait').value=''; document.getElementById('pmf-texte').value='';
    document.getElementById('pmf-emplacement').value=''; document.getElementById('pmf-action').value=''; document.getElementById('pmf-remarque').value='';

    const { data: sectionsList } = await db().from('sections_recueil').select('id, nom').eq('recueil_id', currentRecueilId).order('ordre');
    document.getElementById('pmf-section').innerHTML = '<option value="">— Sans section —</option>' + (sectionsList||[]).map(s=>`<option value="${s.id}">${s.nom}</option>`).join('');

    const anthZone = document.getElementById('pmf-anthologie-zone');
    anthZone.style.display = currentRecueilType === 'anthologie' ? 'block' : 'none';
    if (currentRecueilType === 'anthologie') {
      const { data: autresRecueils } = await db().from('recueils').select('id, titre').neq('id', currentRecueilId).order('titre');
      document.getElementById('pmf-recueil-origine').innerHTML = '<option value="">—</option>' + (autresRecueils||[]).map(r=>`<option value="${r.id}">${r.titre}</option>`).join('');
    }

    if (id) {
      const p = recueilPoemesData.find(x=>x.id===id);
      if (p) {
        document.getElementById('pmf-titre').value=p.titre||''; document.getElementById('pmf-statut').value=p.statut||'à écrire';
        document.getElementById('pmf-selection').value=p.statut_selection||''; document.getElementById('pmf-theme').value=p.theme_principal||'';
        document.getElementById('pmf-date').value=p.date_ecriture||''; document.getElementById('pmf-motscles').value=(p.mots_cles||[]).join(', ');
        document.getElementById('pmf-extrait').value=p.extrait||''; document.getElementById('pmf-texte').value=p.texte||'';
        document.getElementById('pmf-recueil-origine').value = p.recueil_origine_id || '';
        document.getElementById('pmf-emplacement').value = p.emplacement || '';
        document.getElementById('pmf-action').value = (p.actions||[])[0] || '';
        document.getElementById('pmf-remarque').value = p.remarque || '';
        document.getElementById('pmf-section').value = p.section_id || '';
      }
    }
    document.getElementById('modal-poeme-overlay').classList.add('open');
  }
  function closePoemeModal(){ document.getElementById('modal-poeme-overlay').classList.remove('open'); }
  async function savePoeme(){
    const motsClesRaw = document.getElementById('pmf-motscles').value.trim();
    const maxOrdre = recueilPoemesData.reduce((m,p)=>Math.max(m, p.ordre||0), 0);
    const payload = {
      titre: document.getElementById('pmf-titre').value.trim()||'Sans titre',
      statut: document.getElementById('pmf-statut').value,
      statut_selection: document.getElementById('pmf-selection').value || null,
      theme_principal: document.getElementById('pmf-theme').value.trim(),
      date_ecriture: document.getElementById('pmf-date').value || null,
      mots_cles: motsClesRaw ? motsClesRaw.split(',').map(t=>t.trim()).filter(Boolean) : null,
      extrait: document.getElementById('pmf-extrait').value.trim(),
      texte: document.getElementById('pmf-texte').value.trim(),
      section_id: document.getElementById('pmf-section').value || null,
    };
    if (currentRecueilType === 'anthologie') {
      payload.recueil_origine_id = document.getElementById('pmf-recueil-origine').value || null;
      payload.emplacement = document.getElementById('pmf-emplacement').value || null;
      const action = document.getElementById('pmf-action').value;
      payload.actions = action ? [action] : null;
      payload.remarque = document.getElementById('pmf-remarque').value.trim();
    }
    let error;
    if (editingPoemeId) ({ error } = await db().from('poemes').update(payload).eq('id', editingPoemeId));
    else { payload.user_id = currentUser.id; payload.recueil_id = currentRecueilId; payload.ordre = maxOrdre + 1; ({ error } = await db().from('poemes').insert(payload)); }
    if (error) { alert('Erreur : ' + error.message); return; }
    closePoemeModal();
    const zone = document.getElementById('recueil-tab-content');
    if (activeRecueilTab === 'structure') await renderRecueilStructure(zone); else await renderRecueilPoemes(zone);
  }
  async function deletePoeme(){
    if (!confirm('Supprimer ce poème ?')) return;
    const { error } = await db().from('poemes').delete().eq('id', editingPoemeId);
    if (error) { alert('Erreur : ' + error.message); return; }
    closePoemeModal();
    const zone = document.getElementById('recueil-tab-content');
    if (activeRecueilTab === 'structure') await renderRecueilStructure(zone); else await renderRecueilPoemes(zone);
  }

  // ---- Structure du recueil ----
  let structureSections = [];
  let structurePoemesBySection = {};

  async function renderRecueilStructure(zone){
    zone.innerHTML = `<div class="status-line">Chargement…</div>`;
    const { data: rInfo } = await db().from('recueils').select('type_recueil').eq('id', currentRecueilId).single();
    currentRecueilType = rInfo?.type_recueil || 'original';
    const [{ data: sections, error }, { data: poemes }] = await Promise.all([
      db().from('sections_recueil').select('*').eq('recueil_id', currentRecueilId).order('ordre'),
      db().from('poemes').select('*').eq('recueil_id', currentRecueilId).order('ordre'),
    ]);
    if (error) { zone.innerHTML = `<div class="empty">Erreur : ${error.message}</div>`; return; }
    structureSections = sections;
    recueilPoemesData = poemes || [];
    structurePoemesBySection = {};
    (poemes||[]).forEach(p => { const k = p.section_id||'__sans__'; (structurePoemesBySection[k] = structurePoemesBySection[k]||[]).push(p); });

    const totalEcrits = (poemes||[]).filter(p=>p.statut!=='à écrire').length;
    const totalTermines = (poemes||[]).filter(p=>p.statut==='terminé').length;
    const romain = (n) => ['','I','II','III','IV','V','VI','VII','VIII','IX','X'][n] || n;

    zone.innerHTML = `
      <div class="row2" style="grid-template-columns:1fr 2fr 1fr; gap:20px; align-items:start;">
        <div class="panel">
          <h2>Sections du recueil</h2>
          ${structureSections.length ? structureSections.map((s,i) => `
            <div class="info-line" style="cursor:pointer;" onclick="scrollToSection('${s.id}')">
              <span>${romain(i+1)} · ${s.nom}</span>
              <span style="color:var(--text-dim);">${(structurePoemesBySection[s.id]||[]).length} poème(s)</span>
            </div>`).join('') : '<div style="font-size:12px; color:var(--text-dim);">Aucune section pour l\u2019instant.</div>'}
          <button class="btn-secondary" style="margin-top:12px; width:100%;" onclick="openSectionModal()">+ Ajouter une section</button>
        </div>

        <div id="structure-sections-zone">
          ${structureSections.map((s,i) => `
            <div class="panel" id="section-${s.id}">
              <div class="head-row" style="margin-bottom:10px;">
                <h2 style="margin:0;">SECTION ${romain(i+1)} · ${s.nom.toUpperCase()}</h2>
                <span style="font-size:12px; color:var(--text-dim);">${(structurePoemesBySection[s.id]||[]).length}${s.objectif_poemes ? ' / '+s.objectif_poemes : ''} poèmes</span>
              </div>
              ${(structurePoemesBySection[s.id]||[]).length ? `<table class="ch-table"><thead><tr><th>Ordre</th><th>Titre</th><th>Statut</th><th>Date</th><th>Mots-clés</th></tr></thead><tbody>
                ${(structurePoemesBySection[s.id]||[]).map(p => `<tr onclick="openPoemeModal('${p.id}')"><td>${p.numero??'—'}</td><td>${p.titre}</td><td><span class="etat-pill">${p.statut||'—'}</span></td><td>${p.date_ecriture||'—'}</td><td>${(p.mots_cles||[]).join(', ')||'—'}</td></tr>`).join('')}
              </tbody></table>` : '<div class="empty">Aucun poème dans cette section.</div>'}
              <button class="btn-secondary" style="margin-top:10px; width:100%;" onclick="openPoemeModalForSection('${s.id}')">+ Ajouter un poème à cette section</button>
            </div>`).join('')}
          ${(structurePoemesBySection['__sans__']||[]).length ? `
            <div class="panel">
              <h2>Sans section</h2>
              <table class="ch-table"><thead><tr><th>Titre</th><th>Statut</th></tr></thead><tbody>
                ${structurePoemesBySection['__sans__'].map(p => `<tr onclick="openPoemeModal('${p.id}')"><td>${p.titre}</td><td><span class="etat-pill">${p.statut||'—'}</span></td></tr>`).join('')}
              </tbody></table>
            </div>` : ''}
        </div>

        <div>
          <div class="panel">
            <h2>Résumé de la structure</h2>
            <div class="info-line"><span>Sections</span><span>${structureSections.length}</span></div>
            <div class="info-line"><span>Poèmes écrits</span><span>${totalEcrits}</span></div>
            <div class="info-line"><span>Poèmes terminés</span><span>${totalTermines}</span></div>
          </div>
          <div class="panel">
            <h2>Conseils d'organisation</h2>
            <div style="font-size:13px; color:var(--text-dim); line-height:1.8;">
              • Commence par les poèmes qui posent l'ambiance.<br>
              • Place les plus marquants au cœur du recueil.<br>
              • Termine sur une montée ou une ouverture.<br>
              • Relis l'ensemble pour vérifier le rythme.
            </div>
          </div>
        </div>
      </div>
    `;
  }
  function scrollToSection(id){ document.getElementById('section-'+id)?.scrollIntoView({ behavior:'smooth' }); }
  function openPoemeModalForSection(sectionId){
    openPoemeModal();
    setTimeout(() => { const sel = document.getElementById('pmf-section'); if (sel) sel.value = sectionId; }, 0);
  }

  function sectionModalHtml(){
    return `
      <div class="modal-overlay" id="modal-section-overlay" onclick="if(event.target===this) closeSectionModal()">
        <div class="modal-box">
          <div class="modal-head"><h2>Nouvelle section</h2><button onclick="closeSectionModal()">✕</button></div>
          <div class="modal-body">
            <div><label>Nom de la section</label><input id="sef-nom" placeholder="ex : Les fêlures"></div>
            <div><label>Objectif de poèmes pour cette section</label><input type="number" id="sef-objectif"></div>
          </div>
          <div class="modal-foot"><button class="btn-secondary" onclick="closeSectionModal()">Annuler</button><button class="btn-primary" onclick="saveSection()">Enregistrer</button></div>
        </div>
      </div>`;
  }
  function openSectionModal(){ document.getElementById('sef-nom').value=''; document.getElementById('sef-objectif').value=''; document.getElementById('modal-section-overlay').classList.add('open'); }
  function closeSectionModal(){ document.getElementById('modal-section-overlay').classList.remove('open'); }
  async function saveSection(){
    const maxOrdre = structureSections.reduce((m,s)=>Math.max(m, s.ordre||0), 0);
    const payload = { recueil_id: currentRecueilId, nom: document.getElementById('sef-nom').value.trim()||'Sans titre', objectif_poemes: parseInt(document.getElementById('sef-objectif').value)||null, ordre: maxOrdre+1 };
    const { error } = await db().from('sections_recueil').insert(payload);
    if (error) { alert('Erreur : ' + error.message); return; }
    closeSectionModal();
    await renderRecueilStructure(document.getElementById('recueil-tab-content'));
  }

  async function renderRecueilParametres(zone){
    const { data: r } = await db().from('recueils').select('*').eq('id', currentRecueilId).single();
    zone.innerHTML = `
      <div class="panel">
        <h2>Informations générales</h2>
        <label>Titre</label><input id="rp-titre" value="${r.titre||''}">
        <div class="row2" style="margin-top:12px;">
          <div><label>Type</label><select id="rp-type"><option value="original" ${r.type_recueil==='original'?'selected':''}>Recueil original</option><option value="anthologie" ${r.type_recueil==='anthologie'?'selected':''}>Anthologie</option></select></div>
          <div><label>Statut</label><input id="rp-statut" value="${r.statut||''}"></div>
        </div>
        <label style="margin-top:12px;">Objectif de poèmes</label><input type="number" id="rp-objectif" value="${r.objectif_poemes||''}">
        <label style="margin-top:12px;">Résumé</label><textarea id="rp-resume">${r.resume||''}</textarea>
        <button class="btn-primary" style="margin-top:16px;" onclick="saveRecueilParametres()">Enregistrer</button>
      </div>
      <div class="panel">
        <h2>Images</h2>
        <p style="font-size:12px; color:var(--text-dim); margin-bottom:10px;">Colle l'URL d'une image déjà hébergée quelque part (pas encore d'upload direct).</p>
        <label>URL de la couverture</label><input id="rp-couverture" value="${r.couverture||''}" placeholder="https://...">
        <label style="margin-top:10px;">URL de la bannière</label><input id="rp-banniere" value="${r.banniere||''}" placeholder="https://...">
        <button class="btn-primary" style="margin-top:16px;" onclick="saveRecueilImages()">Enregistrer les images</button>
      </div>
      <div class="panel"><h2>Apparence</h2><p style="font-size:12px;color:var(--text-dim);margin-bottom:12px">Le mode clair/sombre reste global. Le recueil personnalise son fond et son accent.</p><div class="row2"><div><label>Couleur de page</label><input type="color" id="rp-page-color" value="${r.page_color||globalAppearance.themeColor}" style="height:42px;padding:4px"></div><div><label>Couleur d’accent</label><input type="color" id="rp-accent" value="${r.couleur_accent||globalAppearance.accent}" style="height:42px;padding:4px"></div></div><button class="btn-primary" style="margin-top:16px" onclick="saveRecueilApparence()">Appliquer</button></div>
      <div class="panel">
        <h2>Archivage</h2>
        <button class="btn-secondary" onclick="toggleArchiveRecueil(${r.archive})">${r.archive?'Désarchiver':'Archiver ce recueil'}</button>
      </div>
    `;
  }
  async function saveRecueilApparence(){
    const payload={page_color:document.getElementById('rp-page-color').value,couleur_accent:document.getElementById('rp-accent').value};
    const {error}=await db().from('recueils').update(payload).eq('id',currentRecueilId);
    if(error){alert('Erreur : '+error.message);return;} applyObjectTheme(payload.page_color,payload.couleur_accent);
  }
  async function saveRecueilImages(){
    const payload = { couverture: document.getElementById('rp-couverture').value.trim()||null, banniere: document.getElementById('rp-banniere').value.trim()||null };
    const { error } = await db().from('recueils').update(payload).eq('id', currentRecueilId);
    if (error) { alert('Erreur : ' + error.message); return; }
    openRecueilDetail(currentRecueilId);
  }
  async function saveRecueilParametres(){
    const payload = { titre: document.getElementById('rp-titre').value.trim()||'Sans titre', type_recueil: document.getElementById('rp-type').value, statut: document.getElementById('rp-statut').value.trim(), objectif_poemes: parseInt(document.getElementById('rp-objectif').value)||null, resume: document.getElementById('rp-resume').value.trim() };
    const { error } = await db().from('recueils').update(payload).eq('id', currentRecueilId);
    if (error) { alert('Erreur : ' + error.message); return; }
    openRecueilDetail(currentRecueilId);
  }
  async function toggleArchiveRecueil(currentlyArchived){
    const { error } = await db().from('recueils').update({ archive: !currentlyArchived }).eq('id', currentRecueilId);
    if (error) { alert('Erreur : ' + error.message); return; }
    navigate('poesie');
  }

  function initials(str){ return (str||'').split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase(); }

  // ============================================================
  // Apparence : thème global + couleurs locales des objets
  // ============================================================
  const DEFAULT_ACCENT = '#7C5CBF';
  let globalAppearance={mode:'clair',themeColor:'#F6F3FB',accent:DEFAULT_ACCENT};
  function hexToRgb(hex){const h=(hex||'').replace('#','');if(!/^[0-9a-fA-F]{6}$/.test(h))return null;return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}
  function rgbToHex({r,g,b}){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
  function mixHex(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);if(!A||!B)return a||b;return rgbToHex({r:A.r+(B.r-A.r)*t,g:A.g+(B.g-A.g)*t,b:A.b+(B.b-A.b)*t});}
  function luminance(hex){const c=hexToRgb(hex);if(!c)return 1;return (0.2126*c.r+0.7152*c.g+0.0722*c.b)/255;}
  function makePalette(mode,themeColor){const base=themeColor||(mode==='sombre'?'#24202B':'#F6F3FB');if(mode==='sombre'){return {'--bg':mixHex(base,'#0D0D0F',.72),'--bg-2':mixHex(base,'#121116',.58),'--card':mixHex(base,'#111014',.66),'--line':'rgba(255,255,255,0.10)','--text':'#F5F1F8','--text-dim':'#AAA3B3'};}return {'--bg':mixHex(base,'#FFFFFF',.90),'--bg-2':mixHex(base,'#FFFFFF',.72),'--card':mixHex(base,'#FFFFFF',.94),'--line':'rgba(90,70,125,0.18)','--text':'#2B2140','--text-dim':'#7A7290'};}
  function setRootPalette(palette,accent){Object.entries(palette).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));document.documentElement.style.setProperty('--accent',accent||DEFAULT_ACCENT);}
  async function loadGlobalAppearance(){try{const {data,error}=await db().from('configuration_utilisateur').select('theme_mode,theme_color,accent_color').eq('user_id',currentUser.id).maybeSingle();if(!error&&data)globalAppearance={mode:data.theme_mode||'clair',themeColor:data.theme_color||'#F6F3FB',accent:data.accent_color||DEFAULT_ACCENT};}catch(e){console.warn('Configuration globale indisponible',e);}applyGlobalTheme();}
  function applyGlobalTheme(){const p=makePalette(globalAppearance.mode,globalAppearance.themeColor);setRootPalette(p,globalAppearance.accent);Object.entries(p).forEach(([k,v])=>document.documentElement.style.setProperty('--global'+k.slice(1),v));document.documentElement.style.setProperty('--global-accent',globalAppearance.accent||DEFAULT_ACCENT);}
  function applyObjectTheme(pageColor,accentColor){const c=pageColor||globalAppearance.themeColor;const mode=luminance(c)<.45?'sombre':'clair';const p=makePalette(mode,c);setRootPalette(p,accentColor||globalAppearance.accent);}
  function applyTheme(themeBase,accentColor){globalAppearance.mode=themeBase==='sombre'?'sombre':'clair';globalAppearance.accent=accentColor||globalAppearance.accent;applyGlobalTheme();}
  function resetTheme(){applyGlobalTheme();}

  init();
</script>
</body>
</html>
