<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passerelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #FFFFFF; --bg-2: #F6F3FB; --card: #FFFFFF;
    --line: rgba(124,92,191,0.18);
    --text: #2B2140; --text-dim: #7A7290;
    --lavender: #8C7FB0; --lavender-deep: #5E5286;
    --wine: #7A3B4A;
    --accent: #7C5CBF;
    --global-bg:#FFFFFF; --global-bg-2:#F6F3FB; --global-card:#FFFFFF;
    --global-line:rgba(124,92,191,0.18); --global-text:#2B2140; --global-text-dim:#7A7290; --global-accent:#7C5CBF;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Lora', serif; line-height:1.6; }
  h1,h2,h3,h4{ font-family:'Cormorant Garamond', serif; font-weight:600; letter-spacing:0.02em; margin:0; }
  .quote-hand{ font-family:'Caveat', cursive; font-size:1.4rem; color:var(--accent); }
  a{ color:inherit; text-decoration:none; cursor:pointer; }

  /* ---- structure générale : sidebar + contenu ---- */
  .shell{ display:flex; min-height:100vh; }
  .sidebar{ --bg:var(--global-bg); --bg-2:var(--global-bg-2); --card:var(--global-card); --line:var(--global-line); --text:var(--global-text); --text-dim:var(--global-text-dim); --accent:var(--global-accent); width:230px; flex-shrink:0; background:var(--bg-2); border-right:1px solid var(--line); padding:0 0 18px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .sidebar::-webkit-scrollbar{ width:7px; }
  .sidebar::-webkit-scrollbar-thumb{ background:var(--line); border-radius:10px; }
  .sidebar-brand-wrap{ position:sticky; top:0; z-index:20; background:var(--bg-2); border-bottom:1px solid var(--line); margin-bottom:10px; padding:14px 12px 10px; }
  .sidebar-brand{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; font-family:'Cormorant Garamond',serif; font-size:1.35rem; padding:8px 10px; border:none; border-radius:7px; background:transparent; color:var(--text); cursor:pointer; text-align:left; }
  .sidebar-brand:hover{ background:rgba(124,92,191,.07); }
  .sidebar-brand-chevron{ font-family:'Lora',serif; font-size:12px; color:var(--text-dim); transition:transform .15s ease; }
  .sidebar-brand-chevron.open{ transform:rotate(180deg); }
  .space-menu{ display:none; margin:6px 4px 0; padding:5px; border:1px solid var(--line); border-radius:7px; background:var(--card); box-shadow:0 8px 24px rgba(0,0,0,.08); }
  .space-menu.open{ display:block; }
  .space-menu-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 9px; border-radius:5px; font-size:12px; color:var(--text-dim); cursor:pointer; }
  .space-menu-item:hover{ background:rgba(124,92,191,.07); color:var(--text); }
  .space-menu-item.active{ color:var(--accent); font-weight:500; }
  .nav-group{ font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-dim); padding:16px 22px 6px; }
  .nav-link{ display:block; padding:9px 22px; font-size:14px; color:var(--text-dim); cursor:pointer; border-left:3px solid transparent; }
  .nav-link:hover{ color:var(--text); background:rgba(255,255,255,0.03); }
  .nav-link.active{ color:var(--accent); border-left-color:var(--accent); background:rgba(201,162,39,0.08); font-weight:500; }
  .sidebar-foot{ margin-top:auto; padding:16px 22px; border-top:1px solid var(--line); font-size:12px; color:var(--text-dim); }
  .sidebar-foot button{ background:none; border:1px solid var(--line); color:var(--text-dim); padding:6px 12px; border-radius:16px; cursor:pointer; font-family:'Lora',serif; font-size:11px; margin-top:8px; }

  .main{ flex:1; min-width:0; }
  .wrap{ max-width:1080px; margin:0 auto; padding:36px 32px 100px; }

  /* ---- bannière décorative ---- */
  /* ---- bannières des fiches catalogue ---- */
  .catalog-entity-banner{width:100%;height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block;margin:0 0 18px;box-shadow:0 8px 24px rgba(0,0,0,.08);}
  .catalog-entity-banner.empty{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bg-2),color-mix(in srgb,var(--accent) 16%,var(--bg-2)));color:var(--accent);font-family:'Cormorant Garamond',serif;font-size:1.6rem;text-align:center;padding:20px;}
  @media (max-width:800px){.catalog-entity-banner{height:150px;border-radius:9px;}}

  .banner{ position:relative; border:1px solid var(--line); background:var(--bg-2); border-radius:6px; padding:36px 40px; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:28px; }
  .banner::before, .banner::after{ content:"✦"; position:absolute; color:var(--accent); opacity:0.5; font-size:14px; }
  .banner::before{ top:16px; left:28px; } .banner::after{ bottom:16px; right:30px; }
  .banner h1{ font-size:2rem; text-align:center; }
  .banner .sub{ text-align:center; color:var(--text-dim); font-size:14px; margin-top:6px; font-style:italic; }

  /* ---- en-tête d'une fiche (œuvre, saga...) ---- */
  .oeuvre-head{ display:flex; gap:24px; margin-bottom:24px; align-items:flex-start; }
  .cover-block{ width:100px; height:130px; flex-shrink:0; border-radius:4px; background:linear-gradient(160deg, var(--lavender)33, var(--bg-2)); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond',serif; font-size:1.6rem; color:var(--text-dim); }
  .oeuvre-info{ flex:1; }
  .oeuvre-info h1{ font-size:1.9rem; margin-bottom:4px; color:var(--accent); }
  .oeuvre-sub{ color:var(--accent); font-size:14px; margin-bottom:12px; }
  .status-badge{ display:inline-block; font-size:11px; padding:4px 12px; border-radius:20px; background:var(--accent); color:var(--bg); font-weight:500; margin-bottom:10px; }
  .progress-bar-outer{ width:100%; max-width:340px; height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin:8px 0; }
  .progress-bar-inner{ height:100%; background:var(--accent); }
  .oeuvre-meta-line{ font-size:13px; color:var(--text-dim); }

  /* ---- cartes de stats ---- */
  .stat-cards-row{ display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; margin-bottom:26px; }
  @media (max-width:800px){ .stat-cards-row{ grid-template-columns:repeat(2,1fr); } }
  .stat-card{ background:var(--card); border:1px solid var(--line); border-radius:6px; padding:20px; }
  .stat-card h3{ font-size:13px; color:var(--text-dim); font-weight:400; margin-bottom:10px; font-family:'Lora',serif; }
  .stat-big{ font-family:'Cormorant Garamond',serif; font-size:1.9rem; color:var(--accent); font-weight:600; }

  .panel{ background:var(--card); border:1px solid var(--line); border-radius:6px; padding:22px 24px; margin-bottom:20px; }
  .panel h2{ font-size:1.1rem; color:var(--accent); margin-bottom:14px; font-family:'Lora',serif; font-weight:500; }
  .info-line{ display:flex; justify-content:space-between; font-size:13px; padding:8px 0; border-bottom:1px solid var(--line); }
  .info-line:last-child{ border-bottom:none; }

  .head-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; flex-wrap:wrap; gap:10px; }
  .btn-primary{ background:var(--accent); color:var(--bg); border:none; padding:10px 18px; border-radius:5px; cursor:pointer; font-family:'Lora',serif; font-size:13px; font-weight:500; }
  .btn-secondary{ background:var(--bg-2); border:1px solid var(--line); color:var(--text); padding:10px 18px; border-radius:5px; cursor:pointer; font-family:'Lora',serif; font-size:13px; }
  .search-input{ background:var(--bg-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:9px 14px; font-size:13px; font-family:'Lora',serif; min-width:220px; }

  /* ---- galerie de cartes (sagas, œuvres, personnages, idées) ---- */
  .gallery{ display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
  @media (max-width:820px){ .gallery{ grid-template-columns:repeat(2,1fr); } }
  .char-card{ position:relative; cursor:pointer; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--bg-2); transition:transform 0.15s ease, border-color 0.15s ease; }
  .char-card:hover{ transform:translateY(-3px); border-color:var(--accent); }
  .char-portrait{ height:100px; display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond',serif; font-size:1.7rem; color:var(--text); opacity:0.9; position:relative; }
  .fav-heart{ position:absolute; top:8px; right:10px; font-size:15px; color:var(--accent); }
  .char-name{ padding:12px 14px 3px; font-size:15px; font-weight:500; }
  .char-role{ padding:0 14px 14px; font-size:12px; color:var(--text-dim); }

  .empty{ text-align:center; padding:60px 24px; color:var(--text-dim); border:1px dashed var(--line); border-radius:6px; font-size:14px; }
  .status-line{ text-align:center; color:var(--text-dim); font-size:13px; padding:50px; }

  /* ---- auth ---- */
  .auth-box{ max-width:380px; margin:100px auto; background:var(--bg-2); border:1px solid var(--line); border-radius:8px; padding:36px; }
  .auth-box h1{ font-size:1.8rem; margin-bottom:6px; text-align:center; }
  .auth-box .sub{ text-align:center; color:var(--text-dim); font-size:13px; margin-bottom:26px; font-style:italic; }
  .auth-tabs{ display:flex; gap:4px; margin-bottom:22px; border:1px solid var(--line); border-radius:20px; padding:3px; }
  .auth-tabs button{ flex:1; background:none; border:none; color:var(--text-dim); padding:8px; border-radius:16px; cursor:pointer; font-family:'Lora',serif; font-size:13px; }
  .auth-tabs button.active{ background:var(--accent); color:var(--bg); font-weight:500; }
  label{ display:block; font-size:12px; color:var(--text-dim); margin:14px 0 5px; }
  input, select, textarea{ width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:5px; padding:10px 12px; font-family:'Lora',serif; font-size:14px; }
  textarea{ min-height:80px; resize:vertical; }
  .auth-submit{ width:100%; margin-top:22px; background:var(--accent); color:var(--bg); border:none; padding:12px; border-radius:5px; font-weight:500; cursor:pointer; font-family:'Lora',serif; font-size:14px; }
  .auth-msg{ font-size:12px; margin-top:14px; text-align:center; min-height:16px; }
  .auth-msg.error{ color:#e88; }
  .auth-msg.ok{ color:#8fc95a; }

  /* ---- modal ---- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:40px 20px; overflow-y:auto; }
  .modal-overlay.open{ display:flex; }
  .modal-box{ background:var(--card); border:1px solid var(--line); border-radius:6px; width:100%; max-width:560px; }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; padding:20px 26px; border-bottom:1px solid var(--line); }
  .modal-head h2{ font-size:1.3rem; }
  .modal-head button{ background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; }
  .modal-body{ padding:22px 26px; display:flex; flex-direction:column; gap:14px; max-height:65vh; overflow-y:auto; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:18px 26px; border-top:1px solid var(--line); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  table.ch-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.ch-table th{ text-align:left; color:var(--text-dim); font-weight:400; padding:8px 10px; border-bottom:1px solid var(--line); font-size:12px; }
  table.ch-table td{ padding:10px 10px; border-bottom:1px solid var(--line); }
  table.ch-table tbody tr{ cursor:pointer; }
  table.ch-table tbody tr:hover{ background:var(--bg-2); }
  .etat-pill{ font-size:11px; padding:3px 10px; border-radius:20px; display:inline-block; background:var(--line); color:var(--text-dim); }
  .cards-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .ch-card{ cursor:pointer; border:1px solid var(--line); border-radius:6px; padding:14px; background:var(--bg-2); }
  .ch-card:hover{ border-color:var(--accent); }
  .kanban-row{ display:flex; gap:14px; overflow-x:auto; padding-bottom:8px; }
  .kanban-col{ min-width:200px; flex:1; background:var(--bg-2); border:1px solid var(--line); border-radius:6px; padding:12px; }
  .kanban-col h4{ font-size:12px; color:var(--text-dim); text-transform:uppercase; margin-bottom:10px; }
  .kanban-card{ cursor:pointer; background:var(--card); border:1px solid var(--line); border-radius:5px; padding:10px 12px; margin-bottom:8px; font-size:13px; }
  .kanban-card:hover{ border-color:var(--accent); }

  .side-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; z-index:150; }
  .side-overlay.open{ display:block; }
  .side-panel{ position:fixed; top:0; right:-380px; width:360px; max-width:90vw; height:100%; background:var(--card); border-left:1px solid var(--line); z-index:151; transition:right .25s ease; padding:22px; overflow-y:auto; }
  .side-panel.open{ right:0; }
  .memo-item{ border:1px solid var(--line); border-radius:5px; padding:10px 12px; margin-bottom:10px; font-size:13px; }
  .memo-date{ font-size:11px; color:var(--text-dim); margin-bottom:4px; }


  /* ---- Accueil Passerelle : grille de cockpit ---- */
  .home-two-col{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; align-items:start; }
  .home-two-col > .panel{ margin-bottom:20px; height:calc(100% - 20px); box-sizing:border-box; }
  .home-stats-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .home-stats-grid .stat-card{ padding:16px; }
  .home-horizon-list{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .home-horizon-item{ border:1px solid var(--line); border-radius:6px; background:var(--bg-2); padding:12px; cursor:pointer; transition:border-color .15s ease, transform .15s ease; }
  .home-horizon-item:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .home-horizon-item strong{ display:block; font-size:13px; margin-bottom:3px; }
  .home-horizon-item span{ font-size:11px; color:var(--text-dim); }
  .home-quick-list{ display:grid; gap:8px; }
  .home-quick-link{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:var(--bg-2); font-size:12px; color:var(--text-dim); }
  .home-quick-link:hover{ border-color:var(--accent); color:var(--text); }
  .home-quick-link-left{ display:flex; align-items:center; gap:9px; min-width:0; }
  .home-quick-link-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  @media(max-width:930px){ .home-two-col{ grid-template-columns:1fr; } .home-two-col > .panel{ height:auto; } }
  @media(max-width:560px){ .home-stats-grid,.home-horizon-list{ grid-template-columns:1fr; } }


  /* ---- Passerelle · Back-office V1 ---- */
  .sidebar-quick{ padding:14px 14px 8px; border-top:1px solid var(--line); margin-top:auto; }
  .sidebar-quick-title{ font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-dim); padding:0 8px 8px; }
  .quick-link{ display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:5px; color:var(--text-dim); font-size:12px; cursor:pointer; }
  .quick-link:hover{ background:rgba(124,92,191,.08); color:var(--accent); }
  .quick-link-empty{ padding:4px 8px 10px; font-size:11px; color:var(--text-dim); font-style:italic; }
  .switch-space{ margin:8px 14px 12px; padding:9px 11px; border:1px solid var(--line); border-radius:6px; text-align:center; font-size:12px; cursor:pointer; color:var(--lavender-deep); background:var(--card); }
  .switch-space:hover{ border-color:var(--accent); color:var(--accent); }
  .admin-hero{ display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:24px; }
  .admin-hero h1{ font-size:2rem; }
  .admin-hero p{ margin:6px 0 0; color:var(--text-dim); font-size:13px; }
  .admin-tabs{ display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:22px; flex-wrap:wrap; }
  .admin-tab{ border:none; background:none; color:var(--text-dim); font-family:'Lora',serif; padding:10px 14px; cursor:pointer; border-bottom:2px solid transparent; }
  .admin-tab.active{ color:var(--accent); border-bottom-color:var(--accent); font-weight:500; }
  .admin-editor-tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:14px 0 22px;flex-wrap:wrap;}
  .admin-editor-tabs button{border:0;background:transparent;color:var(--text-dim);font-family:'Lora',serif;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;}
  .admin-editor-tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
  .admin-editor-panel>.admin-section{margin-bottom:16px;}
  .admin-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:24px; }
  @media(max-width:900px){ .admin-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media(max-width:620px){ .admin-grid{ grid-template-columns:1fr; } }
  .admin-card{ border:1px solid var(--line); background:var(--card); border-radius:7px; padding:18px; }
  .admin-card h3{ font-size:1.05rem; margin-bottom:5px; }
  .admin-card p{ font-size:12px; color:var(--text-dim); margin:0 0 14px; min-height:38px; }
  .admin-card-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .admin-section{ border:1px solid var(--line); border-radius:7px; background:var(--card); padding:20px; margin-bottom:18px; }
  .admin-section-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
  .admin-section-head h2{ font-size:1.15rem; color:var(--lavender-deep); }
  .admin-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .admin-table th{ text-align:left; font-weight:400; color:var(--text-dim); border-bottom:1px solid var(--line); padding:8px; }
  .admin-table td{ border-bottom:1px solid var(--line); padding:9px 8px; vertical-align:middle; }
  .admin-table tr:last-child td{ border-bottom:none; }
  .admin-inline-form{ display:grid; grid-template-columns:1fr 2fr 80px auto; gap:8px; align-items:end; margin-bottom:14px; }
  @media(max-width:780px){ .admin-inline-form{ grid-template-columns:1fr; } }
  .admin-inline-form label{ margin:0 0 4px; }
  .tiny-btn{ border:1px solid var(--line); background:var(--bg-2); color:var(--text); border-radius:4px; padding:6px 9px; cursor:pointer; font-family:'Lora',serif; font-size:11px; }
  .tiny-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .danger-btn{ color:#9b4554; }
  .admin-notice{ border:1px dashed var(--line); background:var(--bg-2); border-radius:6px; padding:12px 14px; color:var(--text-dim); font-size:12px; margin-bottom:16px; }


  /* ---- Back-office : mode administration dédié ---- */
  .admin-mode-sidebar{ background:#fbf9f4; }
  .admin-mode-brand{ padding:18px 18px 14px; border-bottom:1px solid var(--line); }
  .admin-mode-brand strong{ display:block; font-family:'Cormorant Garamond',serif; font-size:1.35rem; color:var(--text); }
  .admin-mode-brand span{ display:block; font-size:10px; color:var(--text-dim); margin-top:2px; }
  .admin-back-link{ margin:10px 14px 8px; padding:9px 10px; border:1px solid var(--line); border-radius:6px; cursor:pointer; font-size:12px; color:var(--lavender-deep); background:var(--card); }
  .admin-back-link:hover{ border-color:var(--accent); color:var(--accent); }
  .admin-mode-nav{ padding:4px 0 14px; }
  .admin-mode-nav .nav-link{ padding:10px 20px; }
  .admin-mode-footer{ margin-top:auto; border-top:1px solid var(--line); padding:14px 18px; font-size:11px; color:var(--text-dim); }
  .admin-catalog-head{ display:flex; justify-content:space-between; align-items:flex-end; gap:18px; padding-bottom:22px; margin-bottom:24px; border-bottom:1px solid var(--line); }
  .admin-catalog-head h1{ font-size:2rem; }
  .admin-catalog-head p{ margin:3px 0 0; color:var(--text-dim); font-size:13px; }
  .admin-catalog-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .admin-filterbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
  .admin-filterbar .search-input{ flex:1 1 280px; }
  .admin-filterbar select{ width:auto; min-width:170px; }
  .admin-catalog-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
  .admin-catalog-card{ border:1px solid var(--line); border-radius:10px; background:var(--card); overflow:hidden; cursor:pointer; transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease; }
  .admin-catalog-card:hover{ transform:translateY(-2px); border-color:var(--accent); box-shadow:0 8px 24px rgba(80,57,120,.08); }

  function safeText(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function formatBytesV573b(bytes){
    const n=Number(bytes)||0;if(n<1024)return `${n} o`;if(n<1024*1024)return `${(n/1024).toFixed(n<10240?1:0)} Ko`;return `${(n/1024/1024).toFixed(2)} Mo`;
  }
  function mediaProfileV573b(folder='',opts={}){
    if(opts.profile)return opts.profile;
    const f=String(folder||'').toLowerCase();
    if(f.includes('banner'))return {maxW:1600,maxH:900,quality:.84,label:'Bannière'};
    if(f.includes('avatar'))return {maxW:600,maxH:600,quality:.84,label:'Avatar'};
    if(opts.kind==='cover')return {maxW:1200,maxH:1800,quality:.86,label:'Couverture'};
    return {maxW:1600,maxH:1600,quality:.82,label:'Image'};
  }
  async function optimizeImageForUploadV573b(file,folder='',opts={}){
    if(!file||!file.type?.startsWith('image/'))return {file,originalSize:file?.size||0,optimizedSize:file?.size||0,converted:false};
    if(['image/svg+xml','image/gif'].includes(file.type))return {file,originalSize:file.size,optimizedSize:file.size,converted:false,skipped:true};
    const profile=mediaProfileV573b(folder,opts);
    const bitmap=await createImageBitmap(file);
    const sourceWidth=bitmap.width,sourceHeight=bitmap.height;
    const scale=Math.min(1,profile.maxW/sourceWidth,profile.maxH/sourceHeight);
    const width=Math.max(1,Math.round(sourceWidth*scale)),height=Math.max(1,Math.round(sourceHeight*scale));
    const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
    const ctx=canvas.getContext('2d',{alpha:true});ctx.drawImage(bitmap,0,0,width,height);bitmap.close?.();
    const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Conversion WebP impossible.')),'image/webp',profile.quality));
    const stem=(file.name||'image').replace(/\.[^.]+$/,'').replace(/[^a-zA-Z0-9À-ÿ _.-]+/g,'').trim()||'image';
    const optimized=new File([blob],`${stem}.webp`,{type:'image/webp',lastModified:Date.now()});
    return {file:optimized,originalSize:file.size,optimizedSize:optimized.size,width,height,sourceWidth,sourceHeight,converted:true,profile};
  }
  async function ensureMediaSessionV573b(){
    const {data:{session}}=await mediaSb.auth.getSession();mediaUser=session?.user||null;return !!mediaUser;
  }
  async function uploadAssetFile(file,folder='banners',opts={}){
    if(!file){if(opts.throwOnError)throw new Error('Aucun fichier reçu.');return null;}
    if(!(await ensureMediaSessionV573b())){
      mediaAuthWarningV573b='Stockage médias non connecté. Reconnecte-toi à Passerelle pour renouveler aussi la session du projet Médias.';
      showTransientStatusV572('🖼 '+mediaAuthWarningV573b);
      if(opts.throwOnError)throw new Error(mediaAuthWarningV573b);
      return null;
    }
    let prepared={file,originalSize:file.size,optimizedSize:file.size,converted:false};
    try{if(!opts.skipOptimize)prepared=await optimizeImageForUploadV573b(file,folder,opts)}catch(err){console.warn('Optimisation WebP impossible, fichier original conservé',err);if(opts.requireOptimize)throw err}
    const upFile=prepared.file||file;
    if(!upFile.size){const e=new Error('Le fichier extrait du ZIP est vide (0 octet).');if(opts.throwOnError)throw e;return null}
    const ext=(upFile.name.split('.').pop()||'webp').toLowerCase().replace(/[^a-z0-9]/g,'')||'webp';
    const safeName=`${Date.now()}-${Math.random().toString(36).slice(2,9)}.${ext}`;
    const cleanFolder=String(folder||'medias').replace(/^\/+|\/+$/g,'').replace(/[^a-zA-Z0-9_\/-]/g,'-');
    const path=`${mediaUser.id}/${cleanFolder}/${safeName}`;
    const {error}=await mediaSb.storage.from(MEDIA_BUCKET).upload(path,upFile,{cacheControl:'31536000',upsert:false,contentType:upFile.type||undefined});
    if(error){
      const detail=`${error.message||'Erreur Storage'}${error.statusCode?` (HTTP ${error.statusCode})`:''} · bucket ${MEDIA_BUCKET} · ${upFile.type||'type inconnu'} · ${upFile.size} octets`;
      showTransientStatusV572('Upload impossible : '+detail);
      if(opts.throwOnError)throw new Error(detail);
      return null;
    }
    const {data}=mediaSb.storage.from(MEDIA_BUCKET).getPublicUrl(path);
    if(!data?.publicUrl){const e=new Error('Fichier envoyé mais URL publique introuvable.');if(opts.throwOnError)throw e;return null}
    return data.publicUrl;
  }
  async function uploadPageBanner(pageKey,input){

  function normalizeImportTextV575(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}

  function validateNotionPackageV575(pkg){
    if(!pkg||typeof pkg!=='object')return 'Le fichier JSON est vide ou invalide.';
    const format=String(pkg.format||'');

    const work=pkg.oeuvre||pkg.work;
    if(!work||typeof work!=='object')return 'Le paquet ne contient pas de bloc « oeuvre ».';
    if(!Array.isArray(pkg.chapitres))return 'Le paquet ne contient pas de tableau « chapitres ».';
    const bad=pkg.chapitres.find(ch=>!ch||!ch.titre||ch.numero===undefined||ch.numero===null);
    if(bad)return 'Au moins un chapitre n’a ni titre ni numéro exploitable.';
    return null;
  }

  async function previewNotionPackageV575(){
    const zone=document.getElementById('notion-import-preview-v575'),status=document.getElementById('notion-import-status-v575');if(!zone||!adminEditingOeuvreId||!notionPackageV575)return;
    status.textContent='Comparaison avec le Manuscrit Passerelle…';

    if(error){status.textContent='Analyse impossible : '+error.message;return}
    const decisions=packageChaptersV575().map(raw=>{
      const ch={...raw,numero:Number(raw.numero),ordre:Number(raw.ordre??raw.numero),nb_mots:Number(raw.nb_mots??raw.mots??0)||0,notion_page_id:raw.notion_page_id||raw.source_id||null};
      const bySource=ch.notion_page_id?(existing||[]).find(x=>x.notion_page_id===ch.notion_page_id):null;
      if(bySource)return {chapter:ch,action:'update',target:bySource,reason:'Déjà importé : mise à jour sûre par ID Notion'};

    status.textContent=conflicts?'Import bloqué tant que les conflits ne sont pas résolus.':'Prévisualisation prête. Plans : 0 écriture.';

  async function applyNotionPackageV575(){

      const payload={
        titre:val('aow-titre').trim()||'Sans titre',
        sous_titre:val('aow-sous-titre').trim()||null,
        format_cible:val('aow-format').trim()||null,
        univers_id:sagaId?null:selectedCollectionId,
        saga_id:sagaId,
        sous_saga_id:sagaId?(val('aow-sous-saga').trim()||null):null,
        langue:val('aow-langue','Français').trim()||'Français',
        pitch:val('aow-pitch').trim()||null,
        resume:val('aow-resume').trim()||null,
        a_propos:val('aow-a-propos').trim()||null,
        intentions:val('aow-intentions').trim()||null,
        tient_a_coeur:checked('aow-coeur'),
        genre:val('aow-genre').trim()||null,
        sous_genre:val('aow-sous-genre').trim()||null,
        tonalite:val('aow-tonalite').trim()||null,
        temporalite:val('aow-temporalite').trim()||null,
        lieu_principal:val('aow-lieu').trim()||null,
        public_cible:val('aow-public').trim()||null,
        tropes:tropesRaw?tropesRaw.split(',').map(x=>x.trim()).filter(Boolean):null,
        enjeu_principal:val('aow-enjeu').trim()||null,
        enjeux_secondaires:enjeuxRaw?enjeuxRaw.split('\n').map(x=>x.trim()).filter(Boolean):null,
        statut:val('aow-statut').trim()||null,
        objectif_mots:objectifRaw?Number(objectifRaw):null,
        code_session:codeSession,
        atelier_project_id:codeSession,
        destination_editoriale:val('aow-destination').trim()||null,
        niveau_editorial_cible:val('aow-cible').trim()||null,
        statut_editorial_actuel:newEditorial,
        horizon_annee:horizonRaw?Number(horizonRaw):null,
        publication_envisagee:val('aow-publication').trim()||null,
        notes_editoriales:val('aow-notes-editoriales').trim()||null,
        couverture:val('aow-couverture').trim()||null,
        banniere:val('aow-banniere').trim()||null,
        module_lore:checked('aow-module-lore'),
        module_chronologie:checked('aow-module-chrono'),
        archive:checked('aow-archive'),
        updated_at:new Date().toISOString()
      };

      // La charte a son bouton dédié et validé. Le bouton général ne touche plus
      // aux couleurs : une sauvegarde métier ne peut donc plus être bloquée par
      // le sous-système graphique.
      const {data:old,error:readError}=await db().from('oeuvres')
        .select('*').eq('id',adminEditingOeuvreId).single();
      if(readError) throw readError;

      if((old?.statut_editorial_actuel||null)!==newEditorial){
        payload.date_dernier_changement_editorial=new Date().toISOString();
      }

      // On n'envoie que les colonnes réellement présentes dans la ligne Supabase.
      const allowedKeys=new Set(Object.keys(old||{}));
      const safePayload=Object.fromEntries(
        Object.entries(payload).filter(([key])=>allowedKeys.has(key))
      );

      const {data:savedWork,error}=await db().from('oeuvres')
        .update(safePayload)
        .eq('id',adminEditingOeuvreId)
        .select('*')
        .single();
      if(error) throw error;

      // Vérification minimale réelle : le titre renvoyé doit correspondre au titre envoyé.
      if(savedWork && safePayload.titre !== undefined && savedWork.titre !== safePayload.titre){
        throw new Error("Supabase n’a pas renvoyé la valeur enregistrée attendue.");
      }

      // Les écritures secondaires ne peuvent plus annuler la sauvegarde canonique.
      try{
        if(sagaId){
          const {error:sagaCollectionError}=await db().from('sagas')
            .update({univers_id:selectedCollectionId}).eq('id',sagaId);
          if(sagaCollectionError) console.warn('Collection de saga non mise à jour',sagaCollectionError);
        }

        const delMeta=await db().from('oeuvre_metadonnees').delete()
          .eq('oeuvre_id',adminEditingOeuvreId);
        if(delMeta.error) console.warn('Métadonnées : suppression',delMeta.error);

        const metaIds=[...document.querySelectorAll('.aow-meta-check:checked')].map(x=>x.value);
        if(metaIds.length){
          const mr=await db().from('oeuvre_metadonnees')
            .insert(metaIds.map(metadata_id=>({oeuvre_id:adminEditingOeuvreId,metadata_id})));
          if(mr.error) console.warn('Métadonnées : insertion',mr.error);
        }

        const resetCover=await db().from('medias')
          .update({est_couverture_actuelle:false})
          .eq('oeuvre_id',adminEditingOeuvreId).eq('type','Couverture');
        if(!resetCover.error && selectedCoverMediaId){
          const coverRes=await db().from('medias')
            .update({est_couverture_actuelle:true}).eq('id',selectedCoverMediaId);
          if(coverRes.error) console.warn('Couverture actuelle',coverRes.error);
        }
      }catch(secondaryError){
        console.warn('V24 écritures secondaires',secondaryError);
      }

      if(status) status.textContent='✓ Enregistré';
      showSaveToastV20('✓ Œuvre enregistrée');
      console.info('V24 œuvre enregistrée', {
        oeuvre_id:adminEditingOeuvreId,
        sent:safePayload,
        returned:savedWork
      });

      // On ne recharge plus immédiatement tout l'éditeur : cela évite l'effet
      // "le clic n'a rien fait" et laisse le feedback visible.
      setTimeout(()=>{ if(status) status.textContent=''; },3000);

    }catch(error){
      console.error('V24 sauvegarde générale œuvre',error);
      const message=error?.message||String(error);
      if(status) status.textContent='Erreur : '+message;
      showSaveToastV20('⚠ Œuvre non enregistrée : '+message,'error');
    }
  }

      const baseKeys=new Set(['personnage_id','nom','resume','oeuvre_id','oeuvre']);const contenu={};for(const [target,source] of Object.entries(m)){if(!source||baseKeys.has(target))continue;const v=row[source];if(v!==''&&v!=null)contenu[normHeaderV572(target)]=v}if(row.__notion_page_sections){try{contenu.notion_sections=JSON.parse(row.__notion_page_sections)}catch{}}if(row.__notion_page_markdown)contenu.notion_source_markdown=row.__notion_page_markdown;
      const payload={nom,resume:m.resume?String(row[m.resume]||'').trim():null,contenu,template_id:templateId||undefined,updated_at:new Date().toISOString(),import_batch_id:batch.id,source_type:st.source};Object.keys(payload).forEach(k=>payload[k]===undefined&&delete payload[k]);
      if(p){const {error}=await db().from('personnages').update(payload).eq('id',p.id);if(error){errors.push(`${name}: ${error.message}`);continue}updated++}else{payload.user_id=currentUser.id;const {data,error}=await db().from('personnages').insert(payload).select('id,nom,passerelle_id').single();if(error){errors.push(`${name}: ${error.message}`);continue}p=data;existing.push(data);created++}

    }

  }

  function isoLocal(d){const x=new Date(d);const y=x.getFullYear(),m=String(x.getMonth()+1).padStart(2,'0'),day=String(x.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
  function formatDateFr(v){if(!v)return '';const d=new Date(v+'T12:00:00');return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});}
  function addDaysIso(v,n){const d=new Date(v+'T12:00:00');d.setDate(d.getDate()+n);return isoLocal(d);}
  function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(12,0,0,0);return x;}
  function endOfWeek(d){const x=mondayOf(d);x.setDate(x.getDate()+6);return x;}
  function startOfPlanningRange(){if(planningView==='month')return new Date(planningCursor.getFullYear(),planningCursor.getMonth(),1);if(planningView==='week')return mondayOf(planningCursor);const x=new Date();x.setMonth(x.getMonth()-2);return x;}
  function endOfPlanningRange(){if(planningView==='month')return new Date(planningCursor.getFullYear(),planningCursor.getMonth()+1,0);if(planningView==='week')return endOfWeek(planningCursor);const x=new Date();x.setMonth(x.getMonth()+8);return x;}
  function workById(id){return planningWorks.find(o=>o.id===id)||null;}
  function chapterById(id){return planningChapters.find(c=>c.id===id)||null;}
  function sessionLabel(s){const o=workById(s.oeuvre_id);const c=chapterById(s.chapitre_id);return s.titre||[o?.titre,c?`Chapitre ${c.numero}${c.titre?' · '+c.titre:''}`:''].filter(Boolean).join(' · ')||'Session';}
  function sessionSubLabel(s){const o=workById(s.oeuvre_id);const c=chapterById(s.chapitre_id);return [s.type_session==='relecture'?'Relecture':'Écriture',o?.titre,c?`Ch. ${c.numero}`:''].filter(Boolean).join(' · ');}
  function sessionColor(s){return s.couleur||(s.type_session==='relecture'?'#59A77A':'#7C5CBF');}


  function renderHomeWeekV576(cursor,sessions,worksMap){
    const start=mondayOf(cursor),end=endOfWeek(cursor);
    let rows='';
    for(let i=0;i<7;i++){
      const d=new Date(start);d.setDate(start.getDate()+i);
      const iso=isoLocal(d),ds=sessions.filter(s=>s.date===iso);
      const dayLabel=d.toLocaleDateString('fr-FR',{weekday:'short'}).replace(/^./,x=>x.toUpperCase());
      const dateLabel=d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
      if(!ds.length){
        rows+=`<div class="home-week-row-v38 ${iso===isoLocal(new Date())?'today':''}"><div class="home-week-date-v38"><strong>${dayLabel}</strong><span>${dateLabel}</span></div><div class="home-week-session-v38 is-free"><i></i><span>Libre</span></div><div class="home-week-duration-v38"></div></div>`;
        continue;
      }
      ds.forEach((s,index)=>{
        const o=worksMap.get(s.oeuvre_id),isRead=s.type_session==='relecture',color=s.couleur||(isRead?'#59A77A':'#7C5CBF'),duration=homeSessionDurationV38(s);
        rows+=`<div class="home-week-row-v38 ${iso===isoLocal(new Date())?'today':''}" onclick="navigate('planning')"><div class="home-week-date-v38">${index===0?`<strong>${dayLabel}</strong><span>${dateLabel}</span>`:''}</div><div class="home-week-session-v38" style="--session-color:${safeText(color)}"><i></i><span><b>${isRead?'Relecture':'Écriture'}</b>${safeText(s.titre||o?.titre||'Session')}</span></div><div class="home-week-duration-v38">${safeText(duration)}</div></div>`;
      });
    }
    return `<div class="home-week-head-v38"><span>${formatDateFr(isoLocal(start))} → ${formatDateFr(isoLocal(end))}</span><div class="home-week-nav"><button class="tiny-btn" onclick="moveHomeWeekV576(-1)">←</button><button class="tiny-btn" onclick="resetHomeWeekV576()">Cette semaine</button><button class="tiny-btn" onclick="moveHomeWeekV576(1)">→</button></div></div><div class="home-week-list-v38">${rows}</div>`;
  }

      db().from('planning_sessions').select('*').gte('date',start).lte('date',end).order('date',{ascending:true}).order('ordre',{ascending:true}),

      <div class="planning-toolbar"><div class="planning-nav"><button class="tiny-btn" onclick="movePlanning(-1)">←</button><div class="planning-period">${safeText(title)}</div><button class="tiny-btn" onclick="movePlanning(1)">→</button><button class="tiny-btn" onclick="planningCursor=new Date();renderPlanning()">Aujourd’hui</button></div><div class="planning-views"><button class="tiny-btn ${planningView==='month'?'active':''}" onclick="setPlanningView('month')">Mois</button><button class="tiny-btn ${planningView==='list'?'active':''}" onclick="setPlanningView('list')">Liste</button></div></div>

      <div id="planning-modal-host"></div>`;
  }

  function renderPlanningMonth(){const y=planningCursor.getFullYear(),m=planningCursor.getMonth();const start=mondayOf(new Date(y,m,1));let html=['<div class="planning-month">',...['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d=>`<div class="planning-month-head">${d}</div>`)];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=isoLocal(d);html.push(`<div class="planning-day ${d.getMonth()!==m?'other':''} ${iso===isoLocal(new Date())?'today':''}" data-date="${iso}" ondragover="planningDragOver(event)" ondragleave="planningDragLeave(event)" ondrop="planningDrop(event,'${iso}')"><div class="planning-day-num">${d.getDate()}</div>${planningSessions.filter(s=>s.date===iso).map(renderPlanningEvent).join('')}</div>`)}html.push('</div>');return html.join('');}

  function horizonLabel(year){

  function editorialObjective(o){
    const target = o.niveau_editorial_cible;
    const status = o.statut_editorial_actuel;
    if (!target || !status) return 'À définir';
    const stage = { 'V1 à écrire':0, 'V1 en cours':1, 'V1 terminée':2, 'V1.5 à faire':3, 'V1.5 en cours':4, 'V1.5 terminée':5, 'V2 à écrire':6, 'V2 en cours':7, 'V2 terminée':8 };
    const targetDone = { 'V1':2, 'V1.5':5, 'V2':8 }[target];
    const current = stage[status];
    if (current == null || targetDone == null) return 'À définir';
    if (current === targetDone) return '✅ Objectif atteint';
    if (current > targetDone) return '✨ Cible dépassée';
    if (target === 'V1.5' && current < 5) return current >= 3 ? '🟣 En progression' : '🌿 Prochaine cible : V1.5';
    if (target === 'V2' && current < 8) return current >= 6 ? '🟣 En progression' : '💎 Prochaine cible : V2';
    return '🟣 En progression';
  }

  function destinationKey(value){
    return value || 'Non définie';
  }

  function buildDestinationDonut(data){
    const labels = [...DESTINATIONS, 'Non définie'];
    const counts = Object.fromEntries(labels.map(x => [x,0]));
    data.forEach(o => counts[destinationKey(o.destination_editoriale)] = (counts[destinationKey(o.destination_editoriale)]||0)+1);
    const total = Math.max(1, data.length);
    const palette = ['#78b55b','#aa79d6','#d4a52b','#b95a67','#73798b'];
    let cursor = 0;
    const stops = labels.map((label,i)=>{
      const start = cursor;
      cursor += counts[label] / total * 100;
      return `${palette[i]} ${start.toFixed(2)}% ${cursor.toFixed(2)}%`;
    }).join(',');
    return `<div class="be-destination-card">
      <div class="be-donut" style="background:conic-gradient(${stops});"><div class="be-donut-hole"><strong>${data.length}</strong><span>œuvres</span></div></div>
      <div class="be-legend">${labels.map((label,i)=>`<div><span class="be-dot" style="background:${palette[i]}"></span><span>${label}</span><strong>${counts[label]}</strong></div>`).join('')}</div>
    </div>`;
  }

  function codexCategoryTagsV39(value){
    return String(value||'').split(/\s*·\s*|\s*,\s*/).map(x=>x.trim()).filter(Boolean);
  }
  function normalizeNotionNameV39(name){
    return String(name||'').split('/').pop()
      .replace(/\.(md|markdown|csv)$/i,'')
      .replace(/\s+[0-9a-f]{32}$/i,'')
      .replace(/[-_]+/g,' ').trim();
  }
  function notionKeyV39(v){
    return normalizeNotionNameV39(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();

  function parseCsvV39(src){
    const rows=[]; let row=[],cell='',q=false;
    src=String(src||'').replace(/^\uFEFF/,'');
    for(let i=0;i<src.length;i++){
      const c=src[i],n=src[i+1];
      if(c==='"'&&q&&n==='"'){cell+='"';i++;continue}
      if(c==='"'){q=!q;continue}
      if(c===','&&!q){row.push(cell);cell='';continue}
      if((c==='\n'||c==='\r')&&!q){
        if(c==='\r'&&n==='\n')i++;
        row.push(cell); if(row.some(x=>String(x).trim()!==''))rows.push(row);
        row=[];cell='';continue;
      }
      cell+=c;
    }
    row.push(cell); if(row.some(x=>String(x).trim()!==''))rows.push(row);
    if(!rows.length)return [];
    const heads=rows[0].map(x=>String(x).trim());
    return rows.slice(1).map(r=>Object.fromEntries(heads.map((h,i)=>[h,String(r[i]??'').trim()])));
  }
  function markdownToCodexHtmlV39(md){
    let s=String(md||'').replace(/\r\n?/g,'\n').replace(/^#\s+.+\n+/,'');
    const esc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const inline=x=>{
      let y=esc(x);
      y=y.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,(m,alt,src)=>`<img data-notion-src="${encodeURIComponent(src.trim().replace(/^<|>$/g,''))}" alt="${alt||''}" class="codex-rich-image-v41">`);
      return y.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/_([^_]+)_/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    };
    const lines=s.split('\n'),out=[];let list=null;
    const closeList=()=>{if(list){out.push(`</${list}>`);list=null}};
    const splitTable=line=>line.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
    const isDivider=line=>/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
    for(let i=0;i<lines.length;i++){
      const line=lines[i].trimEnd();if(!line.trim()){closeList();continue}
      if(line.includes('|')&&i+1<lines.length&&isDivider(lines[i+1])){
        closeList();const heads=splitTable(line);i+=2;const rows=[];
        while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()){rows.push(splitTable(lines[i]));i++}i--;
        out.push(`<div class="codex-table-editor codex-imported-table-v41"><table><thead><tr>${heads.map(x=>`<th>${inline(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${heads.map((_,j)=>`<td>${inline(r[j]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);continue;
      }
      let m;
      if((m=line.match(/^(#{2,6})\s+(.+)$/))){closeList();const n=Math.min(6,m[1].length);out.push(`<h${n}>${inline(m[2])}</h${n}>`);continue}
      if((m=line.match(/^>\s?(.*)$/))){closeList();out.push(`<blockquote>${inline(m[1])}</blockquote>`);continue}
      if(/^---+$/.test(line.trim())){closeList();out.push('<hr>');continue}
      if((m=line.match(/^\s*[-*+]\s+(.+)$/))){if(list!=='ul'){closeList();list='ul';out.push('<ul>')}out.push(`<li>${inline(m[1])}</li>`);continue}
      if((m=line.match(/^\s*\d+\.\s+(.+)$/))){if(list!=='ol'){closeList();list='ol';out.push('<ol>')}out.push(`<li>${inline(m[1])}</li>`);continue}
      closeList();out.push(`<p>${inline(line)}</p>`);
    }
    closeList();return out.join('');
  }

  function resolveNotionAssetEntryV41(sourceName,ref){

    const targets=[norm(dir+raw),norm(raw)],base=norm(raw).split('/').pop();
    return entries.find(x=>targets.includes(norm(x.name)))||entries.find(x=>norm(x.name).split('/').pop()===base)||null;
  }
  async function materializeCodexNotionHtmlV41(it){
    let html=String(it.html||'');
    const refs=[...new Set([...html.matchAll(/<img[^>]+data-notion-src="([^"]+)"[^>]*>/g)].map(m=>m[1]))];
    for(const encoded of refs){
      let raw=encoded;try{raw=decodeURIComponent(encoded)}catch{}
      if(/^https?:/i.test(raw)){html=html.replaceAll(`data-notion-src="${encoded}"`,`src="${safeText(raw)}"`);continue}
      const hit=resolveNotionAssetEntryV41(it.source,raw);if(!hit)continue;
      const blob=await hit.entry.async('blob'),base=String(hit.name||'image').split('/').pop();

      const url=await uploadAssetFile(file,'codex/notion',{throwOnError:true});
      html=html.replaceAll(`data-notion-src="${encoded}"`,`src="${safeText(url)}"`);

  async function commitCodexNotionImportV39(btn){
    const items=codexNotionImportV39.items.filter(x=>x.selected&&x.mode!=='ignore');
    if(!items.length)return alert('Aucune page sélectionnée.');
    if(btn){btn.disabled=true;btn.textContent='Import en cours…'}
    try{
      const parent=codexNotionImportV39.level==='saga'?{saga_id:currentSagaId}:{sous_saga_id:currentSousSagaId};
      const existingR=await db().from('codex_pages').select('id,titre').match(parent);
      if(existingR.error)throw existingR.error;
      const existing=new Map((existingR.data||[]).map(x=>[notionKeyV39(x.titre),x]));
      let created=0,repaired=0,skipped=0;
      for(let i=0;i<items.length;i++){
        const it=items[i];
        const key=notionKeyV39(it.title);
        const html=it.kind==='csv'?csvToHtmlTableV39(it):await materializeCodexNotionHtmlV41(it);
        const already=existing.get(key);

        // C39c : si le premier essai a créé la fiche avant d'échouer sur le bloc,
        // on répare cette fiche vide au lieu de la considérer comme un doublon.
        if(already){
          const existingBlocks=await db().from('codex_blocks').select('id').eq('page_id',already.id).limit(1);
          if(existingBlocks.error)throw existingBlocks.error;
          if(!(existingBlocks.data||[]).length && html){
            const br=await db().from('codex_blocks').insert({
              user_id:currentUser.id,
              page_id:already.id,
              type:'texte',
              titre:'',
              ordre:1,
              largeur:100,
              contenu:{html}
            });
            if(br.error)throw br.error;
            repaired++;
          }else{
            skipped++;
          }
          continue;
        }

        const pagePayload={user_id:currentUser.id,...parent,titre:it.title||'Sans titre',categorie:(it.categories||[]).join(' · '),ordre:i};
        const pr=await db().from('codex_pages').insert(pagePayload).select('id').single();
        if(pr.error)throw pr.error;

        try{
          if(html){
            const br=await db().from('codex_blocks').insert({
              user_id:currentUser.id,
              page_id:pr.data.id,
              type:'texte',
              titre:'',
              ordre:1,
              largeur:100,
              contenu:{html}
            });
            if(br.error)throw br.error;
          }
        }catch(blockErr){
          // Ne laisse plus de fiche orpheline si l'insertion du contenu échoue.
          await db().from('codex_pages').delete().eq('id',pr.data.id);
          throw blockErr;
        }

        existing.set(key,{id:pr.data.id,titre:it.title});
        created++;
      }
      const zone=document.getElementById('codex-import-zone-v39');
      if(zone)zone.innerHTML=`<div class="admin-notice"><strong>${created} page${created!==1?'s':''} importée${created!==1?'s':''}.</strong>${repaired?` ${repaired} fiche${repaired!==1?'s':''} incomplète${repaired!==1?'s':''} réparée${repaired!==1?'s':''}.`:''}${skipped?` ${skipped} déjà présente${skipped!==1?'s':''} ignorée${skipped!==1?'s':''} pour éviter les doublons.`:''}</div>`;
      setTimeout(()=>codexNotionImportV39.level==='saga'?renderSagaCodexV56(document.getElementById('saga-tab-content')):renderSousSagaCodex(document.getElementById('soussaga-tab-content')),700);
    }catch(err){
      alert('Import Notion : '+(err?.message||err));

    }
  }

    else if (key === 'lore' || key === 'chronologie') zone.innerHTML = `<div class="empty">Le module <strong>${key==='lore'?'Univers & Lore':'Chronologie'}</strong> est activé pour cette œuvre. Sa page dédiée sera figée dans son propre chantier.</div>`;
  }

  // ============================================================
  // Onglet Écriture d'une œuvre
  // ============================================================
  let ecritureChapitres = [];
  let ecritureViewMode = 'table';

  async function renderOeuvreEcriture(zone){
    zone.innerHTML = `<div class="status-line">Chargement…</div>`;
    const [{ data: chaps }, { data: sessions }] = await Promise.all([
      db().from('chapitres').select('*').eq('oeuvre_id', currentOeuvreId).order('ordre'),
      db().from('sessions_ecriture').select('mots_ecrits, date').eq('oeuvre_id', currentOeuvreId).order('date', { ascending:false }).limit(30),
    ]);
    ecritureChapitres = chaps || [];

    const ecrits = ecritureChapitres.filter(c => (c.nb_mots||0) > 0).length;
    const aEcrire = ecritureChapitres.length - ecrits;
    const totalMots = ecritureChapitres.reduce((s,c)=>s+(c.nb_mots||0), 0);
    const povCounts = {};
    ecritureChapitres.forEach(c => { if (c.pov) povCounts[c.pov] = (povCounts[c.pov]||0)+1; });
    const moyMotsJour = sessions?.length ? Math.round(sessions.reduce((s,r)=>s+(r.mots_ecrits||0),0)/sessions.length) : null;
    const derniereSession = sessions?.[0]?.date;

    zone.innerHTML = `
      <div class="stat-cards-row">
        <div class="stat-card"><h3>Chapitres écrits</h3><div class="stat-big">${ecrits} / ${ecritureChapitres.length}</div><div style="font-size:12px; color:var(--text-dim);">${aEcrire} à écrire</div></div>
        <div class="stat-card"><h3>Total mots</h3><div class="stat-big">${totalMots.toLocaleString('fr-FR')}</div></div>
        <div class="stat-card"><h3>Mots / jour (moy.)</h3><div class="stat-big">${moyMotsJour ?? '—'}</div><div style="font-size:12px; color:var(--text-dim);">${derniereSession ? 'Dernière session : '+derniereSession : 'Aucune session enregistrée'}</div></div>
        <div class="stat-card"><h3>POV utilisés</h3>${Object.entries(povCounts).map(([k,v])=>`<div class="info-line" style="padding:3px 0; border:none;"><span>${k}</span><span>${v}</span></div>`).join('') || '<div style="font-size:12px; color:var(--text-dim);">—</div>'}</div>
      </div>

      <div class="head-row">
        <div class="row2" style="grid-template-columns:auto auto auto; gap:8px;">
          <button class="btn-secondary" id="ev-table" onclick="setEcritureView('table')">Table</button>
          <button class="btn-secondary" id="ev-cards" onclick="setEcritureView('cards')">Cartes</button>
          <button class="btn-secondary" id="ev-kanban" onclick="setEcritureView('kanban')">Kanban</button>
        </div>
        <button class="btn-primary" onclick="openChapitreModal()">+ Nouveau chapitre</button>
      </div>

      <div id="ecriture-view-zone"></div>
    `;
    setEcritureView(ecritureViewMode);
  }

  function setEcritureView(mode){
    ecritureViewMode = mode;
    ['table','cards','kanban'].forEach(m => { const b = document.getElementById('ev-'+m); if (b) b.style.background = (m===mode) ? 'var(--accent)' : 'var(--bg-2)'; if (b) b.style.color = (m===mode) ? 'var(--bg)' : 'var(--text)'; });
    const zone = document.getElementById('ecriture-view-zone');
    if (!zone) return;
    if (mode === 'table') zone.innerHTML = renderChapitresTable(ecritureChapitres);
    if (mode === 'cards') zone.innerHTML = renderChapitresCards(ecritureChapitres);
    if (mode === 'kanban') zone.innerHTML = renderChapitresKanban(ecritureChapitres);
  }

  function renderChapitresTable(chaps){
    if (!chaps.length) return `<div class="empty">Aucun chapitre pour l'instant.</div>`;
    return `<table class="ch-table"><thead><tr><th>N°</th><th>Titre</th><th>Acte</th><th>POV</th><th>Statut</th><th>Mots</th><th>Objectif</th><th></th></tr></thead><tbody>
      ${chaps.map(c => `<tr onclick="openChapitreModal('${c.id}')">
        <td>${c.numero ?? '—'}</td><td>${c.titre}</td><td>${c.acte||'—'}</td><td>${c.pov||'—'}</td>
        <td><span class="etat-pill">${c.etat||'—'}</span></td><td>${c.nb_mots||0}</td><td>${c.objectif_mots||'—'}</td>
        <td onclick="event.stopPropagation(); openMemoPanel('${c.id}','${(c.titre||'').replace(/'/g,"\\'")}')" style="color:var(--text-dim); cursor:pointer;">💬</td>
      </tr>`).join('')}
    </tbody></table>`;
  }
  function renderChapitresCards(chaps){
    if (!chaps.length) return `<div class="empty">Aucun chapitre pour l'instant.</div>`;
    return `<div class="cards-grid">${chaps.map(c => `
      <div class="ch-card" onclick="openChapitreModal('${c.id}')">
        <div style="font-size:11px; color:var(--text-dim);">N°${c.numero ?? '—'} · ${c.acte||'—'}</div>
        <div style="font-size:14px; font-weight:500; margin:4px 0 8px;">${c.titre}</div>
        <span class="etat-pill">${c.etat||'—'}</span>
        <div style="font-size:12px; color:var(--text-dim); margin-top:8px;">POV ${c.pov||'—'} · ${c.nb_mots||0} mots</div>
      </div>`).join('')}</div>`;
  }
  function renderChapitresKanban(chaps){
    const etats = [...new Set(chaps.map(c=>c.etat).filter(Boolean))];
    if (!etats.length) return `<div class="empty">Aucun chapitre pour l'instant.</div>`;
    return `<div class="kanban-row">${etats.map(e => `
      <div class="kanban-col"><h4>${e} (${chaps.filter(c=>c.etat===e).length})</h4>
        ${chaps.filter(c=>c.etat===e).map(c => `<div class="kanban-card" onclick="openChapitreModal('${c.id}')">${c.titre}<div style="font-size:11px; color:var(--text-dim); margin-top:3px;">${c.acte||''} · ${c.nb_mots||0} mots</div></div>`).join('')}
      </div>`).join('')}</div>`;
  }

  function chapitreModalHtml(){
    return `
      <div class="modal-overlay" id="modal-chapitre-overlay" onclick="if(event.target===this) closeChapitreModal()">
        <div class="modal-box">
          <div class="modal-head"><h2 id="modal-chapitre-title">Nouveau chapitre</h2><button onclick="closeChapitreModal()">✕</button></div>

            <button class="btn-secondary" onclick="closeChapitreModal()">Annuler</button>
            <button class="btn-primary" onclick="saveChapitre()">Enregistrer</button>

      </div>`;
  }
  let editingChapitreId = null;
  async function openChapitreModal(id){
    editingChapitreId = id || null;
    document.getElementById('modal-chapitre-title').textContent = id ? 'Modifier le chapitre' : 'Nouveau chapitre';
    document.getElementById('cf-delete').style.display = id ? 'block' : 'none';
    document.getElementById('cf-titre').value=''; document.getElementById('cf-numero').value='';
    document.getElementById('cf-acte').value=''; document.getElementById('cf-pov').value='';
    document.getElementById('cf-etat').value='à écrire'; document.getElementById('cf-mots').value='';
    document.getElementById('cf-objectif').value=''; document.getElementById('cf-resume').value=''; document.getElementById('cf-plan').value='';
    if (id) {
      const c = ecritureChapitres.find(x=>x.id===id);
      if (c) {
        document.getElementById('cf-titre').value=c.titre||''; document.getElementById('cf-numero').value=c.numero||'';
        document.getElementById('cf-acte').value=c.acte||''; document.getElementById('cf-pov').value=c.pov||'';
        document.getElementById('cf-etat').value=c.etat||'à écrire'; document.getElementById('cf-mots').value=c.nb_mots||'';
        document.getElementById('cf-objectif').value=c.objectif_mots||''; document.getElementById('cf-resume').value=c.resume||''; document.getElementById('cf-plan').value=c.plan||'';
      }
    }
    document.getElementById('modal-chapitre-overlay').classList.add('open');
  }
  function closeChapitreModal(){ document.getElementById('modal-chapitre-overlay').classList.remove('open'); }
  async function saveChapitre(){
    const maxOrdre = ecritureChapitres.reduce((m,c)=>Math.max(m, c.ordre||0), 0);
    const payload = {
      titre: document.getElementById('cf-titre').value.trim()||'Sans titre',
      numero: parseInt(document.getElementById('cf-numero').value)||null,
      acte: document.getElementById('cf-acte').value.trim(),
      pov: document.getElementById('cf-pov').value.trim(),
      etat: document.getElementById('cf-etat').value,
      nb_mots: parseInt(document.getElementById('cf-mots').value)||0,
      objectif_mots: parseInt(document.getElementById('cf-objectif').value)||null,
      resume: document.getElementById('cf-resume').value.trim(),
      plan: document.getElementById('cf-plan').value.trim(),
    };
    let error;
    if (editingChapitreId) ({ error } = await db().from('chapitres').update(payload).eq('id', editingChapitreId));
    else { payload.user_id = currentUser.id; payload.oeuvre_id = currentOeuvreId; payload.ordre = maxOrdre + 1; ({ error } = await db().from('chapitres').insert(payload)); }
    if (error) { alert('Erreur : ' + error.message); return; }
    closeChapitreModal();
    await renderOeuvreEcriture(document.getElementById('oeuvre-tab-content'));
  }
  async function deleteChapitre(){
    if (!confirm('Supprimer ce chapitre ?')) return;
    const { error } = await db().from('chapitres').delete().eq('id', editingChapitreId);
    if (error) { alert('Erreur : ' + error.message); return; }
    closeChapitreModal();
    await renderOeuvreEcriture(document.getElementById('oeuvre-tab-content'));
  }

  // ---- Panneau de notes (chapitre_memos) ----
  let currentMemoChapitreId = null;
  async function openMemoPanel(chapitreId, titre){
    currentMemoChapitreId = chapitreId;
    document.getElementById('memo-panel-title').textContent = 'Notes — ' + titre;
    document.getElementById('memo-overlay').classList.add('open');
    document.getElementById('memo-panel').classList.add('open');
    await loadMemos();
  }
  function closeMemoPanel(){
    document.getElementById('memo-overlay').classList.remove('open');
    document.getElementById('memo-panel').classList.remove('open');
  }
  async function loadMemos(){
    const { data, error } = await db().from('chapitre_memos').select('*').eq('chapitre_id', currentMemoChapitreId).order('created_at', { ascending:false });
    const list = document.getElementById('memo-list');
    if (error) { list.innerHTML = `<div class="empty">Erreur : ${error.message}</div>`; return; }
    list.innerHTML = data.length ? data.map(m => `<div class="memo-item"><div class="memo-date">${new Date(m.created_at).toLocaleDateString('fr-FR')}</div>${m.contenu}</div>`).join('') : `<div style="font-size:13px; color:var(--text-dim);">Aucune note pour ce chapitre.</div>`;
  }
  async function addMemo(){
    const val = document.getElementById('memo-new').value.trim();
    if (!val) return;
    const { error } = await db().from('chapitre_memos').insert({ chapitre_id: currentMemoChapitreId, contenu: val });
    if (error) { alert('Erreur : ' + error.message); return; }
    document.getElementById('memo-new').value = '';
    await loadMemos();
  }

  async function renderOeuvreManuscrit(zone){

  async function openManuscriptDrawer(id,title){

  async function saveManuscriptNote(id){const html=document.getElementById('rich-manuscript').innerHTML;const {error}=await db().from('chapitres').update({memo:html}).eq('id',id);if(error)alert('Erreur : '+error.message);else closeDrawer();}
  function insertRichImage(){const url=prompt('URL de l’image :');if(url)document.execCommand('insertImage',false,url);}
  // ============================================================
  // Onglet Personnages d'une œuvre
  // ============================================================
  let opoLinks = [];
  let personnageFilter = 'tous';
  let personnageView = 'gallery';
  async function renderOeuvrePersonnages(zone){
    zone.innerHTML=`<div class="status-line">Chargement…</div>`;
    const {data,error}=await db().from('personnages_oeuvres').select('personnage_id, role, importance, pov, faction, etat, personnages(id, nom, favori, portrait_url, resume, contenu, passerelle_id)').eq('oeuvre_id',currentOeuvreId);

  function personnageOeuvreModalHtml(){

  document.addEventListener('change', (e) => {

  function closePersonnageOeuvreModal(){ document.getElementById('modal-po-overlay').classList.remove('open'); }
  async function savePersonnageOeuvre(){
    let personnageId = editingPoPersonnageId;
    if (!personnageId) {
      const selVal = document.getElementById('po-personnage-select').value;
      if (!selVal) { alert('Choisis un personnage.'); return; }
      if (selVal === '__new__') {
        const nom = document.getElementById('po-nouveau-nom').value.trim();
        if (!nom) { alert('Donne un nom au nouveau personnage.'); return; }
        const { data, error } = await db().from('personnages').insert({ user_id: currentUser.id, nom }).select('id').single();
        if (error) { alert('Erreur : ' + error.message); return; }
        personnageId = data.id;
      } else {
        personnageId = selVal;
      }
    }

  function renderSimpleRichText(value){
    let raw=String(value||'').replace(/\r\n?/g,'\n').trim();
    if(!raw)return '';
    // Les imports Notion utilisent parfois --- comme séparateur au milieu d'une ligne.
    raw=raw.replace(/\s+---\s+/g,'\n\n---\n\n');
    const inline=(text)=>safeText(text||'')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/__(.+?)__/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/_(.+?)_/g,'<em>$1</em>');
    const blocks=raw.split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);
    return `<div class="rich-readable-v576c37">${blocks.map(block=>{
      if(/^---+$/.test(block))return '<hr>';
      const lines=block.split('\n').map(x=>x.trim()).filter(Boolean);
      if(lines.length&&lines.every(x=>/^[-•]\s+/.test(x))){
        return `<ul>${lines.map(x=>`<li>${inline(x.replace(/^[-•]\s+/,''))}</li>`).join('')}</ul>`;
      }
      // Une liste Notion peut arriver aplatie sur une seule ligne : "- item - item".
      if(/^[-•]\s+/.test(block)&&/\s+-\s+/.test(block)){
        const items=block.replace(/^[-•]\s+/,'').split(/\s+-\s+/).map(x=>x.trim()).filter(Boolean);
        return `<ul>${items.map(x=>`<li>${inline(x)}</li>`).join('')}</ul>`;
      }
      return `<p>${lines.map(inline).join('<br>')}</p>`;
    }).join('')}</div>`;
  }

  async function saveOeuvreApparence(){
    const st=document.getElementById('op-appearance-status');
    if(!currentOeuvreId){if(st)st.textContent='Erreur : œuvre introuvable.';return;}
    try{
      if(st)st.textContent='Enregistrement…';
      // V22 — sauvegarde dédiée aux œuvres.
      // Contrairement à Saga/Sous-saga, passerelle.oeuvres n'a pas de page_color.
      // soft_color est le fond canonique de la page Œuvre.
      const payload=graphicOverridePayloadV576c13('op');
      delete payload.page_color;
      const {data,error}=await db().from('oeuvres')
        .update(payload)
        .eq('id',currentOeuvreId)
        .select('id,accent_color,secondary_color,soft_color,dark_color,charte_override')
        .single();
      if(error) throw error;
      applyObjectTheme(data?.soft_color||globalAppearance.themeColor,data?.accent_color||globalAppearance.accent);
      if(st)st.textContent='✓ Apparence enregistrée';
      showSaveToastV20('✓ Apparence de l’œuvre enregistrée');
      await renderOeuvreParametres(document.getElementById('oeuvre-tab-content'));
    }catch(error){
      console.error('Sauvegarde apparence œuvre',error);
      if(st)st.textContent='Erreur : '+(error?.message||String(error));
      showSaveToastV20('⚠ Apparence non enregistrée : '+(error?.message||String(error)),'error');
    }
  }
  window.saveOeuvreApparence = saveOeuvreApparence;

.genre||'')}" placeholder="Romance, fantasy…"></div></div><div><label>✨ Ambiance <span style="color:var(--text-dim)">(séparée par des virgules)</span></label><input id="if-ambiance" value="${safeText((i.ambiance||[]).join(', '))}" placeholder="Doux, intime, mélancolique"></div>`:''}<label style="display:flex;align-items:center;gap:7px"><input type="checkbox" id="if-favori" style="width:auto" ${i.favori?'checked':''}> ⭐ Garder dans mes favorites</label>${status==='Prometteuse'&&!i.transforme_en_type?`<div style="border-top:1px solid var(--line);padding-top:12px"><strong>🌿 Prête à devenir un projet ?</strong><p style="font-size:10px;color:var(--text-dim)">La transformation réutilisera cette idée au lieu de recréer les informations.</p><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="tiny-btn" onclick="transformerIdee('oeuvre')">→ Œuvre</button><button class="tiny-btn" onclick="transformerIdee('saga')">→ Saga</button><button class="tiny-btn" onclick="transformerIdee('recueil')">→ Recueil</button></div></div>`:''}</div>`;previewIdeeImage();}

  async function saveIdee(){
    captureIdeeFormDraft();

    const titleEl=document.getElementById('if-titre'),noteEl=document.getElementById('if-note'),imageEl=document.getElementById('if-image'),colorEl=document.getElementById('if-page-color'),collectionEl=document.getElementById('if-collection'),favEl=document.getElementById('if-favori'),typeEl=document.getElementById('if-type'),genreEl=document.getElementById('if-genre'),ambEl=document.getElementById('if-ambiance'),notesEl=document.getElementById('if-notes-rich');

    }else if(type==='saga'){
      const {data,error}=await db().from('sagas').insert({nom:title,description:idee.note||'',user_id:currentUser.id}).select('id').single();

    const pct = total ? Math.round(ecrits/total*100) : 0;
    const derniers = [...(poemes||[])].filter(p=>p.updated_at).sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at)).slice(0,5);

    zone.innerHTML = `

          </div>

            <div class="stat-card"><h3>Terminés</h3><div class="stat-big">${termines}</div></div>
            <div class="stat-card"><h3>Sélectionnés</h3><div class="stat-big">${selectionnes}</div></div>
          </div>

    const maxOrdre = recueilPoemesData.reduce((m,p)=>Math.max(m, p.ordre||0), 0);
    const payload = {

      extrait: document.getElementById('pmf-extrait').value.trim(),
      texte: document.getElementById('pmf-texte').value.trim(),
      section_id: document.getElementById('pmf-section').value || null,

      payload.emplacement = document.getElementById('pmf-emplacement').value || null;
      const action = document.getElementById('pmf-action').value;
      payload.actions = action ? [action] : null;
      payload.remarque = document.getElementById('pmf-remarque').value.trim();
    }
    let error;
    if (editingPoemeId) ({ error } = await db().from('poemes').update(payload).eq('id', editingPoemeId));
    else { payload.user_id = currentUser.id; payload.recueil_id = currentRecueilId; payload.ordre = maxOrdre + 1; ({ error } = await db().from('poemes').insert(payload)); }

  function initials(str){ return (str||'').split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase(); }

  // ============================================================
  // Apparence : thème global + couleurs locales des objets
  // ============================================================
  const DEFAULT_ACCENT = '#7C5CBF';
  let globalAppearance={mode:'clair',themeColor:'#F6F3FB',accent:DEFAULT_ACCENT};
  function hexToRgb(hex){const h=(hex||'').replace('#','');if(!/^[0-9a-fA-F]{6}$/.test(h))return null;return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}
  function rgbToHex({r,g,b}){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
  function mixHex(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);if(!A||!B)return a||b;return rgbToHex({r:A.r+(B.r-A.r)*t,g:A.g+(B.g-A.g)*t,b:A.b+(B.b-A.b)*t});}
  function luminance(hex){const c=hexToRgb(hex);if(!c)return 1;return (0.2126*c.r+0.7152*c.g+0.0722*c.b)/255;}

  function activateAdminWorkTabs(){
    const root=document.querySelector('.admin-work-editor');
    if(!root) return;
    const topbar=root.querySelector('.admin-work-topbar');
    const layout=root.querySelector('.admin-work-layout');
    if(!topbar||!layout) return;

    const groups=[
      {key:'identity',label:'Identité',titles:['Identité & hiérarchie']},
      {key:'presentation',label:'Présentation',titles:['Présentation de l’œuvre']},
      {key:'narrative',label:'Narratif',titles:['Informations narratives']},
      {key:'manuscript',label:'Manuscrit & Atelier',titles:['Manuscrit & Atelier','Import Notion']},
      {key:'editorial',label:'Éditorial',titles:['Pilotage éditorial']},
      {key:'configuration',label:'Configuration',titles:['Couverture canonique','Modules de la fiche','Apparence de la page']},
      {key:'archive',label:'Archivage',titles:['Archivage']}
    ];

    const allSections=[...layout.querySelectorAll('.admin-section')];
    const byTitle=new Map(allSections.map(section=>[(section.querySelector(':scope > summary')?.textContent||section.querySelector(':scope > h2')?.textContent||'').trim(),section]));
    const tabs=document.createElement('div');
    tabs.className='admin-editor-tabs';
    const panels=document.createElement('div');
    panels.className='admin-editor-panels';

    const activate=(key)=>{
      tabs.querySelectorAll('button').forEach(btn=>btn.classList.toggle('active',btn.dataset.key===key));
      panels.querySelectorAll('.admin-editor-panel').forEach(panel=>panel.style.display=panel.dataset.key===key?'block':'none');
    };

    groups.forEach((group,index)=>{
      const sections=group.titles.map(t=>byTitle.get(t)).filter(Boolean);
      if(!sections.length) return;
      const button=document.createElement('button');
      button.type='button';
      button.dataset.key=group.key;
      button.textContent=group.label;
      button.onclick=()=>activate(group.key);
      tabs.appendChild(button);

      const panel=document.createElement('div');
      panel.className='admin-editor-panel';
      panel.dataset.key=group.key;
      panel.style.display='none';
      sections.forEach(section=>panel.appendChild(section));
      panels.appendChild(panel);
    });

    const saveStatus=layout.querySelector('#aow-save-status');
    layout.remove();
    topbar.insertAdjacentElement('afterend',tabs);
    tabs.insertAdjacentElement('afterend',panels);
    if(saveStatus){
      const statusWrap=document.createElement('div');
      statusWrap.style.marginTop='10px';
      statusWrap.appendChild(saveStatus);
      panels.insertAdjacentElement('afterend',statusWrap);
    }else if(!document.getElementById('aow-save-status')){
      const status=document.createElement('div');
      status.id='aow-save-status';
      status.className='admin-inline-status';
      panels.insertAdjacentElement('afterend',status);
    }
    const first=tabs.querySelector('button');
    if(first) activate(first.dataset.key);
  }

  function activateAdminConfigurationTabs(zone){
    if(!zone) return;

      const label=cleanLabel(section.querySelector('h2')?.textContent)||`Réglage ${index+1}`;

  async function distributeWorkWordTarget(){
    const total=Number(document.getElementById('aow-objectif')?.value||0);
    if(!total||!adminEditingOeuvreId) return alert('Renseigne d’abord un objectif global de mots.');
    const {data,error}=await db().from('chapitres').select('id,ordre').eq('oeuvre_id',adminEditingOeuvreId).order('ordre');
    if(error) return alert('Erreur : '+error.message);
    if(!data?.length) return alert('Aucun chapitre dans le Plan.');
    const base=Math.floor(total/data.length), reste=total-(base*data.length);
    const results=await Promise.all(data.map((chapitre,i)=>db().from('chapitres').update({objectif_mots:base+(i<reste?1:0)}).eq('id',chapitre.id)));
    const failed=results.find(r=>r.error);
    if(failed?.error) return alert('Erreur pendant la répartition : '+failed.error.message);
    alert(`Objectif de ${total.toLocaleString('fr-FR')} mots réparti sur ${data.length} chapitres.`);
  }

  async function saveSousSagaWorkOrderV572d(id){
    const rows=[...document.querySelectorAll('.ss-work-order-row')];
    if(!rows.length)return;
    const updates=rows.map(row=>{
      const num=row.querySelector('input[id^="ass-work-num-"]');
      const ord=row.querySelector('input[id^="ass-work-order-"]');
      const workId=(num?.id||'').replace('ass-work-num-','');
      return {workId,numero:num?.value===''?null:Number(num.value),ordre:ord?.value===''?null:Number(ord.value)};
    }).filter(x=>x.workId);
    const results=await Promise.all(updates.map(x=>db().from('oeuvres').update({numero_sous_saga:Number.isFinite(x.numero)?x.numero:null,ordre_sous_saga:Number.isFinite(x.ordre)?x.ordre:null}).eq('id',x.workId).eq('sous_saga_id',id)));
    const failed=results.find(r=>r.error);
    const host=document.querySelector('.ss-work-order-list');
    if(failed?.error){if(host)host.insertAdjacentHTML('beforebegin',`<div class="admin-inline-status error">${safeText(failed.error.message)}</div>`);return}
    if(host)host.insertAdjacentHTML('beforebegin','<div class="admin-inline-status success">Ordre des tomes enregistré ✓</div>');
    setTimeout(()=>openAdminSousSagaEditor(id),650);
  }
