<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passerelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #161513; --bg-2: #1E1C19; --card: #161513;
    --line: rgba(255,255,255,0.08);
    --text: #F3EFE6; --text-dim: #8A8780;
    --lavender: #8C7FB0; --lavender-deep: #5E5286;
    --wine: #7A3B4A;
    --accent: #C9A227;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Lora', serif; line-height:1.6; }
  h1,h2,h3,h4{ font-family:'Cormorant Garamond', serif; font-weight:600; letter-spacing:0.02em; margin:0; }
  .quote-hand{ font-family:'Caveat', cursive; font-size:1.4rem; color:var(--accent); }
  a{ color:inherit; text-decoration:none; cursor:pointer; }

  /* ---- structure générale : sidebar + contenu ---- */
  .shell{ display:flex; min-height:100vh; }
  .sidebar{ width:230px; flex-shrink:0; background:var(--bg-2); border-right:1px solid var(--line); padding:22px 0; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .sidebar-brand{ font-family:'Cormorant Garamond',serif; font-size:1.35rem; padding:0 22px 18px; border-bottom:1px solid var(--line); margin-bottom:10px; }
  .nav-group{ font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-dim); padding:16px 22px 6px; }
  .nav-link{ display:block; padding:9px 22px; font-size:14px; color:var(--text-dim); cursor:pointer; border-left:3px solid transparent; }
  .nav-link:hover{ color:var(--text); background:rgba(255,255,255,0.03); }
  .nav-link.active{ color:var(--accent); border-left-color:var(--accent); background:rgba(201,162,39,0.08); font-weight:500; }
  .sidebar-foot{ margin-top:auto; padding:16px 22px; border-top:1px solid var(--line); font-size:12px; color:var(--text-dim); }
  .sidebar-foot button{ background:none; border:1px solid var(--line); color:var(--text-dim); padding:6px 12px; border-radius:16px; cursor:pointer; font-family:'Lora',serif; font-size:11px; margin-top:8px; }

  .main{ flex:1; min-width:0; }
  .wrap{ max-width:1080px; margin:0 auto; padding:36px 32px 100px; }

  /* ---- bannière décorative ---- */
  .banner{ position:relative; border:1px solid var(--line); background:var(--bg-2); border-radius:6px; padding:36px 40px; display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:28px; }
  .banner::before, .banner::after{ content:"✦"; position:absolute; color:var(--accent); opacity:0.5; font-size:14px; }
  .banner::before{ top:16px; left:28px; } .banner::after{ bottom:16px; right:30px; }
  .banner h1{ font-size:2rem; text-align:center; }
  .banner .sub{ text-align:center; color:var(--text-dim); font-size:14px; margin-top:6px; font-style:italic; }

  /* ---- en-tête d'une fiche (œuvre, saga...) ---- */
  .oeuvre-head{ display:flex; gap:24px; margin-bottom:24px; align-items:flex-start; }
  .cover-block{ width:100px; height:130px; flex-shrink:0; border-radius:4px; background:linear-gradient(160deg, var(--lavender)33, var(--bg-2)); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond',serif; font-size:1.6rem; color:var(--text-dim); }
  .oeuvre-info{ flex:1; }
  .oeuvre-info h1{ font-size:1.9rem; margin-bottom:4px; }
  .oeuvre-sub{ color:var(--lavender); font-size:14px; margin-bottom:12px; }
  .status-badge{ display:inline-block; font-size:11px; padding:4px 12px; border-radius:20px; background:var(--accent); color:var(--bg); font-weight:500; margin-bottom:10px; }
  .progress-bar-outer{ width:100%; max-width:340px; height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin:8px 0; }
  .progress-bar-inner{ height:100%; background:var(--accent); }
  .oeuvre-meta-line{ font-size:13px; color:var(--text-dim); }

  /* ---- cartes de stats ---- */
  .stat-cards-row{ display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; margin-bottom:26px; }
  @media (max-width:800px){ .stat-cards-row{ grid-template-columns:repeat(2,1fr); } }
  .stat-card{ background:var(--card); border:1px solid var(--line); border-radius:6px; padding:20px; }
  .stat-card h3{ font-size:13px; color:var(--text-dim); font-weight:400; margin-bottom:10px; font-family:'Lora',serif; }
  .stat-big{ font-family:'Cormorant Garamond',serif; font-size:1.9rem; color:var(--accent); font-weight:600; }

  .panel{ background:var(--card); border:1px solid var(--line); border-radius:6px; padding:22px 24px; margin-bottom:20px; }
  .panel h2{ font-size:1.1rem; color:var(--lavender); margin-bottom:14px; font-family:'Lora',serif; font-weight:500; }

  .head-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; flex-wrap:wrap; gap:10px; }
  .btn-primary{ background:var(--accent); color:var(--bg); border:none; padding:10px 18px; border-radius:5px; cursor:pointer; font-family:'Lora',serif; font-size:13px; font-weight:500; }
  .btn-secondary{ background:var(--bg-2); border:1px solid var(--line); color:var(--text); padding:10px 18px; border-radius:5px; cursor:pointer; font-family:'Lora',serif; font-size:13px; }
  .search-input{ background:var(--bg-2); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:9px 14px; font-size:13px; font-family:'Lora',serif; min-width:220px; }

  /* ---- galerie de cartes (sagas, œuvres, personnages, idées) ---- */
  .gallery{ display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
  @media (max-width:820px){ .gallery{ grid-template-columns:repeat(2,1fr); } }
  .char-card{ position:relative; cursor:pointer; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--bg-2); transition:transform 0.15s ease, border-color 0.15s ease; }
  .char-card:hover{ transform:translateY(-3px); border-color:var(--accent); }
  .char-portrait{ height:100px; display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond',serif; font-size:1.7rem; color:var(--text); opacity:0.9; position:relative; }
  .fav-heart{ position:absolute; top:8px; right:10px; font-size:15px; color:var(--accent); }
  .char-name{ padding:12px 14px 3px; font-size:15px; font-weight:500; }
  .char-role{ padding:0 14px 14px; font-size:12px; color:var(--text-dim); }

  .empty{ text-align:center; padding:60px 24px; color:var(--text-dim); border:1px dashed var(--line); border-radius:6px; font-size:14px; }
  .status-line{ text-align:center; color:var(--text-dim); font-size:13px; padding:50px; }

  /* ---- auth ---- */
  .auth-box{ max-width:380px; margin:100px auto; background:var(--bg-2); border:1px solid var(--line); border-radius:8px; padding:36px; }
  .auth-box h1{ font-size:1.8rem; margin-bottom:6px; text-align:center; }
  .auth-box .sub{ text-align:center; color:var(--text-dim); font-size:13px; margin-bottom:26px; font-style:italic; }
  .auth-tabs{ display:flex; gap:4px; margin-bottom:22px; border:1px solid var(--line); border-radius:20px; padding:3px; }
  .auth-tabs button{ flex:1; background:none; border:none; color:var(--text-dim); padding:8px; border-radius:16px; cursor:pointer; font-family:'Lora',serif; font-size:13px; }
  .auth-tabs button.active{ background:var(--accent); color:var(--bg); font-weight:500; }
  label{ display:block; font-size:12px; color:var(--text-dim); margin:14px 0 5px; }
  input, select, textarea{ width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:5px; padding:10px 12px; font-family:'Lora',serif; font-size:14px; }
  textarea{ min-height:80px; resize:vertical; }
  .auth-submit{ width:100%; margin-top:22px; background:var(--accent); color:var(--bg); border:none; padding:12px; border-radius:5px; font-weight:500; cursor:pointer; font-family:'Lora',serif; font-size:14px; }
  .auth-msg{ font-size:12px; margin-top:14px; text-align:center; min-height:16px; }
  .auth-msg.error{ color:#e88; }
  .auth-msg.ok{ color:#8fc95a; }

  /* ---- modal ---- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none; align-items:flex-start; justify-content:center; z-index:100; padding:40px 20px; overflow-y:auto; }
  .modal-overlay.open{ display:flex; }
  .modal-box{ background:var(--card); border:1px solid var(--line); border-radius:6px; width:100%; max-width:560px; }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; padding:20px 26px; border-bottom:1px solid var(--line); }
  .modal-head h2{ font-size:1.3rem; }
  .modal-head button{ background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; }
  .modal-body{ padding:22px 26px; display:flex; flex-direction:column; gap:14px; max-height:65vh; overflow-y:auto; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:18px 26px; border-top:1px solid var(--line); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
</style>
</head>
<body>

<div id="app"><div class="status-line">Chargement…</div></div>

<script>
  const supabaseUrl = 'https://ilhfzulwuuxyidhityoo.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsaGZ6dWx3dXV4eWlkaGl0eW9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NDA5NTgsImV4cCI6MjEwMjQxNjk1OH0.nux1ehaes_1rPSQhaYJ3hdCcipYn3B5PQMokUzSuBl0';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);
  const db = () => sb.schema('passerelle');

  const app = document.getElementById('app');
  let currentUser = null;

  async function init(){
    const { data: { session } } = await sb.auth.getSession();
    if (session) { currentUser = session.user; renderShell(); navigate('accueil'); }
    else renderAuth();
  }

  function renderAuth(mode){
    mode = mode || 'login';
    app.innerHTML = `
      <div class="auth-box">
        <h1>✒️ Passerelle</h1>
        <div class="sub">L'atelier de vos histoires</div>
        <div class="auth-tabs">
          <button class="${mode==='login'?'active':''}" onclick="renderAuth('login')">Se connecter</button>
          <button class="${mode==='signup'?'active':''}" onclick="renderAuth('signup')">Créer un compte</button>
        </div>
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="toi@exemple.com">
        <label>Mot de passe</label>
        <input type="password" id="auth-password" placeholder="••••••••">
        <button class="auth-submit" onclick="${mode==='login' ? 'doLogin()' : 'doSignup()'}">${mode==='login' ? 'Se connecter' : 'Créer mon compte'}</button>
        <div class="auth-msg" id="auth-msg"></div>
      </div>
    `;
  }

  async function doLogin(){
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const msg = document.getElementById('auth-msg');
    msg.textContent = 'Connexion…'; msg.className = 'auth-msg';
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { msg.textContent = error.message; msg.className = 'auth-msg error'; return; }
    currentUser = data.user;
    renderShell(); navigate('accueil');
  }

  async function doSignup(){
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const msg = document.getElementById('auth-msg');
    if (password.length < 6) { msg.textContent = 'Le mot de passe doit faire au moins 6 caractères.'; msg.className = 'auth-msg error'; return; }
    msg.textContent = 'Création du compte…'; msg.className = 'auth-msg';
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) { msg.textContent = error.message; msg.className = 'auth-msg error'; return; }
    if (data.session) { currentUser = data.user; renderShell(); navigate('accueil'); }
    else { msg.textContent = 'Compte créé — vérifie ta boîte mail, puis connecte-toi.'; msg.className = 'auth-msg ok'; }
  }

  async function doLogout(){ await sb.auth.signOut(); currentUser = null; renderAuth(); }

  const NAV = [
    { group: 'Écriture', items: [
      { key:'accueil', label:'Accueil', real:true },
      { key:'oeuvres', label:'Œuvres', real:true },
      { key:'sagas', label:'Sagas', real:true },
      { key:'personnages', label:'Personnages', real:true },
      { key:'univers-lore', label:'Univers & Lore', real:false },
      { key:'poesie', label:'Poésie', real:false },
      { key:'chapitres', label:'Chapitres', real:false },
      { key:'plans', label:'Plans', real:false },
      { key:'relecture', label:'Relecture', real:true },
      { key:'idees', label:'Idées', real:true },
      { key:'bureau-editorial', label:'Bureau éditorial', real:false },
      { key:'archives', label:'Archives', real:false },
    ]}
  ];

  function renderShell(){
    app.innerHTML = `
      <div class="shell">
        <div class="sidebar">
          <div class="sidebar-brand">✒️ Passerelle</div>
          ${NAV.map(g => `
            <div class="nav-group">${g.group}</div>
            ${g.items.map(it => `<div class="nav-link" id="nav-${it.key}" onclick="navigate('${it.key}')">${it.label}</div>`).join('')}
          `).join('')}
          <div class="sidebar-foot">
            ${currentUser.email}
            <button onclick="doLogout()">Déconnexion</button>
          </div>
        </div>
        <div class="main"><div class="wrap" id="content"></div></div>
      </div>
      ${sagaModalHtml()}
      ${sousSagaModalHtml()}
      ${oeuvreModalHtml()}
      ${personnageModalHtml()}
      ${ideeModalHtml()}
    `;
  }

  function setActiveNav(key){
    document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
    const el = document.getElementById('nav-'+key);
    if (el) el.classList.add('active');
  }

  function navigate(key){
    resetTheme();
    setActiveNav(key);
    const item = NAV.flatMap(g=>g.items).find(i=>i.key===key);
    const content = document.getElementById('content');
    if (!item.real){
      content.innerHTML = `<h2 style="margin-bottom:20px;">${item.label}</h2><div class="empty">Cette page n'est pas encore branchée à Supabase.<br><span style="font-size:11px;">Le schéma existe déjà pour elle — on la construit dès qu'on y arrive dans l'ordre.</span></div>`;
      return;
    }
    if (key === 'accueil') renderAccueil();
    if (key === 'oeuvres') renderOeuvres();
    if (key === 'sagas') renderSagas();
    if (key === 'personnages') renderPersonnages();
    if (key === 'idees') renderIdees();
    if (key === 'relecture') renderRelecture();
  }

  // ============================================================
  // ACCUEIL
  // ============================================================
  async function renderAccueil(){
    const content = document.getElementById('content');
    content.innerHTML = `<div class="status-line">Chargement…</div>`;

    const now = new Date();
    const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);
    const startOfYear = new Date(now.getFullYear(), 0, 1).toISOString().slice(0,10);

    const [
      enBureau, pepiniere, dernierGraine, atelierStats, aReprendre, objectifAnnuel, sommeAnnuelle
    ] = await Promise.all([
      db().from('oeuvres').select('id, titre, statut, mots_ecrits, objectif_mots').eq('statut','En écriture').order('updated_at', { ascending:false }).limit(3),
      db().from('idees').select('statut', { count:'exact' }).in('statut', ['À creuser','Prometteuse']),
      db().from('idees').select('titre, note').order('created_at', { ascending:false }).limit(1).maybeSingle(),
      Promise.all([
        db().from('oeuvres').select('*', { count:'exact', head:true }).eq('statut','En écriture'),
        db().from('chapitres').select('*', { count:'exact', head:true }).gte('date_ecriture', startOfMonth),
        db().from('relectures').select('*', { count:'exact', head:true }).is('date_terminee', null),
      ]),
      db().from('oeuvres').select('id, titre, statut, updated_at').eq('statut','En pause').order('updated_at', { ascending:true }).limit(3),
      db().from('objectifs_annuels').select('objectif_mots').eq('annee', now.getFullYear()).maybeSingle(),
      db().from('sessions_ecriture').select('mots_ecrits').gte('date', startOfYear),
    ]);

    const [{ count: nbEnEcriture }, { count: nbChapitresMois }, { count: nbRelecturesEnCours }] = atelierStats;
    const motsAnnee = (sommeAnnuelle.data||[]).reduce((s,r)=>s+(r.mots_ecrits||0), 0);
    const objectifAnnee = objectifAnnuel.data?.objectif_mots;
    const pctAnnee = objectifAnnee ? Math.min(100, Math.round(motsAnnee/objectifAnnee*100)) : 0;

    function joursDepuis(dateStr){
      const diff = Math.floor((now - new Date(dateStr)) / 86400000);
      return diff <= 0 ? "aujourd'hui" : `il y a ${diff} jour${diff>1?'s':''}`;
    }

    content.innerHTML = `
      <div class="banner">
        <div>
          <h1>Bonjour, ${currentUser.email.split('@')[0]} ✨</h1>
          <div class="sub">Que va-t-on raconter aujourd'hui ?</div>
        </div>
      </div>

      <div class="panel">
        <h2>Sur le bureau</h2>
        ${!enBureau.data?.length ? `<div class="empty">Aucune œuvre en écriture pour l'instant.</div>` : `
        <div class="gallery">${enBureau.data.map(o => {
          const pct = o.objectif_mots ? Math.min(100, Math.round((o.mots_ecrits||0)/o.objectif_mots*100)) : null;
          return `<div class="char-card" onclick="openOeuvreDetail('${o.id}')">
            <div class="char-portrait" style="background:linear-gradient(160deg, var(--accent)33, var(--bg-2));">${initials(o.titre)}</div>
            <div class="char-name">${o.titre}</div>
            <div class="char-role">${pct!==null ? pct+'% · '+(o.mots_ecrits||0)+' / '+o.objectif_mots+' mots' : 'En écriture'}</div>
          </div>`;
        }).join('')}</div>`}
      </div>

      <div class="stat-cards-row">
        <div class="stat-card"><h3>Œuvres en écriture</h3><div class="stat-big">${nbEnEcriture ?? 0}</div></div>
        <div class="stat-card"><h3>Chapitres écrits ce mois</h3><div class="stat-big">${nbChapitresMois ?? 0}</div></div>
        <div class="stat-card"><h3>Relectures en cours</h3><div class="stat-big">${nbRelecturesEnCours ?? 0}</div></div>
        <div class="stat-card"><h3>Idées à explorer</h3><div class="stat-big">${pepiniere.count ?? 0}</div></div>
      </div>

      <div class="panel">
        <h2>Progression annuelle</h2>
        ${objectifAnnee ? `
          <div style="font-size:13px; color:var(--text-dim); margin-bottom:6px;">${motsAnnee.toLocaleString('fr-FR')} / ${objectifAnnee.toLocaleString('fr-FR')} mots — ${pctAnnee}%</div>
          <div class="progress-bar-outer"><div class="progress-bar-inner" style="width:${pctAnnee}%;"></div></div>
        ` : `
          <p style="font-size:13px; color:var(--text-dim); margin-bottom:10px;">Aucun objectif défini pour ${now.getFullYear()}.</p>
          <input type="number" id="objectif-annuel-input" placeholder="Objectif de mots pour ${now.getFullYear()}" style="max-width:260px; display:inline-block;">
          <button class="btn-primary" onclick="saveObjectifAnnuel()">Définir</button>
        `}
      </div>

      <div class="panel">
        <h2>🌱 La pépinière frémit</h2>
        ${dernierGraine.data ? `<p style="font-size:13px; color:var(--text-dim);">Dernière graine capturée : <strong style="color:var(--text);">${dernierGraine.data.titre}</strong></p>` : ''}
        <button class="btn-primary" style="margin-top:10px;" onclick="openIdeeModal()">+ Capturer une idée</button>
      </div>

      <div class="panel">
        <h2>À reprendre</h2>
        ${!aReprendre.data?.length ? `<div class="empty">Aucun projet en pause en ce moment.</div>` : aReprendre.data.map(o => `
          <div class="info-line" style="cursor:pointer;" onclick="openOeuvreDetail('${o.id}')">
            <span>${o.titre}</span>
            <span>Dernière activité : ${joursDepuis(o.updated_at)}</span>
          </div>
        `).join('')}
      </div>

      <div class="head-row" style="margin-top:10px;">
        <button class="btn-secondary" onclick="openIdeeModal()">+ Nouvelle idée</button>
        <button class="btn-secondary" onclick="openOeuvreModal()">+ Nouvelle œuvre</button>
        <button class="btn-secondary" onclick="navigate('oeuvres')">Écrire</button>
        <button class="btn-secondary" onclick="navigate('bureau-editorial')">Bureau éditorial</button>
      </div>
    `;
  }
  async function saveObjectifAnnuel(){
    const val = parseInt(document.getElementById('objectif-annuel-input').value);
    if (!val) return;
    const { error } = await db().from('objectifs_annuels').insert({ user_id: currentUser.id, annee: new Date().getFullYear(), objectif_mots: val });
    if (error) { alert('Erreur : ' + error.message); return; }
    renderAccueil();
  }

  // ============================================================
  // RELECTURE — centre de contrôle, dérivé du statut éditorial
  // ============================================================
  async function renderRelecture(){
    const content = document.getElementById('content');
    content.innerHTML = `<div class="status-line">Chargement…</div>`;
    const { data, error } = await db().from('relecture_file_travail').select('*');
    if (error) {
      content.innerHTML = `<div class="empty">Erreur : ${error.message}<br><span style="font-size:11px;">Si l'erreur mentionne "relation does not exist", le correctif de sécurité des vues n'a peut-être pas encore tourné.</span></div>`;
      return;
    }

    const enCours = data.filter(d => d.bucket_relecture === 'en_cours');
    const enAttente = data.filter(d => d.bucket_relecture === 'en_attente');
    const termineesOuAPreparerRaw = data.filter(d => d.bucket_relecture === 'recemment_terminee' || d.bucket_relecture === 'a_preparer');
    const chapitresARelire = data.reduce((s,d) => s + Math.max(0, (d.total_chapitres||0) - (d.chapitres_relus||0)), 0);
    const tempsMoy = data.map(d=>d.temps_moyen_par_chapitre).filter(v=>v!=null);
    const tempsMoyGlobal = tempsMoy.length ? Math.round(tempsMoy.reduce((a,b)=>a+b,0)/tempsMoy.length) : null;

    function carte(d, actionLabel){
      const pct = d.total_chapitres ? Math.min(100, Math.round((d.chapitres_relus||0)/d.total_chapitres*100)) : 0;
      return `
        <div class="panel" style="cursor:pointer;" onclick="openOeuvreDetail('${d.oeuvre_id}')">
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div style="font-size:15px; font-weight:500;">${d.titre}</div>
            <span class="status-badge" style="margin:0;">${d.statut_editorial_actuel||''}</span>
          </div>
          <div style="font-size:12px; color:var(--text-dim); margin:8px 0;">${d.chapitres_relus||0} / ${d.total_chapitres||0} chapitres — ${pct}%</div>
          <div class="progress-bar-outer"><div class="progress-bar-inner" style="width:${pct}%;"></div></div>
          <button class="btn-secondary" style="margin-top:12px; width:100%;">${actionLabel}</button>
        </div>`;
    }

    content.innerHTML = `
      <h2 style="margin-bottom:6px;">Relecture</h2>
      <p style="font-size:13px; color:var(--text-dim); margin-bottom:20px;">Centre de contrôle de tes manuscrits en relecture — alimenté par le statut éditorial de chaque œuvre.</p>

      <div class="stat-cards-row">
        <div class="stat-card"><h3>Relectures en cours</h3><div class="stat-big">${enCours.length}</div></div>
        <div class="stat-card"><h3>À commencer</h3><div class="stat-big">${enAttente.length}</div></div>
        <div class="stat-card"><h3>Chapitres à relire</h3><div class="stat-big">${chapitresARelire}</div></div>
        <div class="stat-card"><h3>Temps moyen / chapitre</h3><div class="stat-big" style="font-size:1.3rem;">${tempsMoyGlobal ? tempsMoyGlobal+' min' : '—'}</div></div>
      </div>

      <div class="row2" style="grid-template-columns:1fr 1fr 1fr; gap:16px;">
        <div>
          <h2 style="font-size:1rem; margin-bottom:10px; color:var(--text-dim);">🔥 En cours</h2>
          ${enCours.length ? enCours.map(d=>carte(d,'Continuer la relecture')).join('') : '<div class="empty">Rien en cours.</div>'}
        </div>
        <div>
          <h2 style="font-size:1rem; margin-bottom:10px; color:var(--text-dim);">⏳ En attente</h2>
          ${enAttente.length ? enAttente.map(d=>carte(d,'Commencer la relecture')).join('') : '<div class="empty">Rien en attente.</div>'}
        </div>
        <div>
          <h2 style="font-size:1rem; margin-bottom:10px; color:var(--text-dim);">✅ Terminées / à préparer</h2>
          ${termineesOuAPreparerRaw.length ? termineesOuAPreparerRaw.map(d=>carte(d,'Voir le récapitulatif')).join('') : '<div class="empty">Rien ici pour l\\'instant.</div>'}
        </div>
      </div>

      <div class="panel" style="margin-top:20px;">
        <h2>Comment ça fonctionne ?</h2>
        <p style="font-size:13px; color:var(--text-dim);">Les œuvres apparaissent ici selon leur statut éditorial (défini pour l'instant dans Paramètres de chaque œuvre, futur Bureau éditorial). La progression est calculée depuis les corrections de chaque chapitre — rien n'est saisi deux fois.</p>
      </div>
    `;

        <div class="row2" style="margin-top:12px;">
          <div><label>Sous-titre</label><input id="op-sous-titre" value="${o.sous_titre||''}"></div>
          <div><label>Saga</label><select id="op-saga" onchange="onOpSagaChange()"><option value="">— Indépendante —</option>${(sagasList||[]).map(s=>`<option value="${s.id}" ${o.saga_id===s.id?'selected':''}>${s.nom}</option>`).join('')}</select></div>
        </div>
        <label style="margin-top:12px;">Sous-saga</label><select id="op-sous-saga" ${o.saga_id?'':'disabled'}>${sousSagasHtml}</select>
        <div class="row2" style="margin-top:12px;">
          <div><label>Langue</label><input id="op-langue" value="${o.langue||'Français'}"></div>
          <div><label>Format</label><input id="op-format" value="${o.format_cible||''}" placeholder="Roman, Novella..."></div>
        </div>
        <label style="margin-top:12px;">Statut</label><select id="op-statut">${['En écriture','En pause','Terminée'].map(s=>`<option ${o.statut===s?'selected':''}>${s}</option>`).join('')}</select>
        <div class="row2" style="margin-top:12px;">
          <div><label>Objectif de mots</label><input type="number" id="op-objectif" value="${o.objectif_mots||''}"></div>
          <div><label>Mots écrits</label><input type="number" id="op-mots" value="${o.mots_ecrits||0}"></div>
        </div>
        <label style="margin-top:12px;">Résumé</label><textarea id="op-resume">${o.resume||''}</textarea>
        <button class="btn-primary" style="margin-top:16px;" onclick="saveOeuvreParametres()">Enregistrer</button>
      </div>
      <div class="panel">
        <h2>Éditorial (temporaire, en attendant le Bureau éditorial)</h2>
        <div class="row2">
          <div><label>Niveau éditorial cible</label><select id="op-niveau-cible">
            <option value="">—</option>${['V1','V1.5','V2'].map(v=>`<option ${o.niveau_editorial_cible===v?'selected':''}>${v}</option>`).join('')}
          </select></div>
          <div><label>Statut éditorial actuel</label><select id="op-statut-editorial">
            <option value="">—</option>${['V1 à écrire','V1 en cours','V1 terminée','V1.5 à faire','V1.5 en cours','V1.5 terminée','V2 à écrire','V2 en cours','V2 terminée'].map(v=>`<option ${o.statut_editorial_actuel===v?'selected':''}>${v}</option>`).join('')}
          </select></div>
        </div>
        <button class="btn-primary" style="margin-top:16px;" onclick="saveOeuvreEditorial()">Enregistrer</button>
      </div>
      <div class="panel">
        <h2>Apparence</h2>
        <p style="font-size:12px; color:var(--text-dim); margin-bottom:12px;">S'applique immédiatement à cette page.</p>
        <div class="row2">
          <div><label>Thème</label><select id="op-theme">
            <option value="sombre" ${o.theme_base==='sombre'?'selected':''}>Sombre</option>
            <option value="clair" ${o.theme_base==='clair'?'selected':''}>Clair</option>
          </select></div>
          <div><label>Couleur d'accent</label><input type="color" id="op-accent" value="${o.accent_color||'#C9A227'}" style="height:42px; padding:4px;"></div>
        </div>
        <button class="btn-primary" style="margin-top:16px;" onclick="saveOeuvreApparence()">Appliquer</button>
      </div>
      <div class="panel">
        <h2>Archivage</h2>
        <button class="btn-secondary" onclick="toggleArchiveOeuvre(${o.archive})">${o.archive ? 'Désarchiver' : 'Archiver cette œuvre'}</button>
      </div>
    `;
  }
  async function onOpSagaChange(){
    const sagaId = document.getElementById('op-saga').value;
    const sel = document.getElementById('op-sous-saga');
    if (!sagaId) { sel.innerHTML = '<option value="">—</option>'; sel.disabled = true; return; }
    sel.disabled = false;
    const { data } = await db().from('sous_sagas').select('id, nom').eq('saga_id', sagaId).order('ordre');
    sel.innerHTML = '<option value="">—</option>' + (data||[]).map(ss => `<option value="${ss.id}">${ss.nom}</option>`).join('');
  }
  async function saveOeuvreParametres(){
    const payload = {
      titre: document.getElementById('op-titre').value.trim()||'Sans titre',
      sous_titre: document.getElementById('op-sous-titre').value.trim(),
      saga_id: document.getElementById('op-saga').value || null,
      sous_saga_id: document.getElementById('op-sous-saga').value || null,
      langue: document.getElementById('op-langue').value.trim(),
      format_cible: document.getElementById('op-format').value.trim(),
      statut: document.getElementById('op-statut').value,
      objectif_mots: parseInt(document.getElementById('op-objectif').value)||null,
      mots_ecrits: parseInt(document.getElementById('op-mots').value)||0,
      resume: document.getElementById('op-resume').value.trim(),
    };
    const { error } = await db().from('oeuvres').update(payload).eq('id', currentOeuvreId);
    if (error) { alert('Erreur : ' + error.message); return; }
    openOeuvreDetail(currentOeuvreId);
  }
  async function saveOeuvreEditorial(){
    const payload = { niveau_editorial_cible: document.getElementById('op-niveau-cible').value || null, statut_editorial_actuel: document.getElementById('op-statut-editorial').value || null };
    const { error } = await db().from('oeuvres').update(payload).eq('id', currentOeuvreId);
    if (error) { alert('Erreur : ' + error.message); return; }
    alert('Enregistré.');
  }
  async function saveOeuvreApparence(){
    const payload = { theme_base: document.getElementById('op-theme').value, accent_color: document.getElementById('op-accent').value };
    const { error } = await db().from('oeuvres').update(payload).eq('id', currentOeuvreId);
    if (error) { alert('Erreur : ' + error.message); return; }
    applyTheme(payload.theme_base, payload.accent_color);
  }
  async function toggleArchiveOeuvre(currentlyArchived){
    const { error } = await db().from('oeuvres').update({ archive: !currentlyArchived }).eq('id', currentOeuvreId);
    if (error) { alert('Erreur : ' + error.message); return; }
    navigate('oeuvres');
  }

  function oeuvreModalHtml(){
    return `
      <div class="modal-overlay" id="modal-oeuvre-overlay" onclick="if(event.target===this) closeOeuvreModal()">
        <div class="modal-box">
          <div class="modal-head"><h2 id="modal-oeuvre-title">Nouvelle œuvre</h2><button onclick="closeOeuvreModal()">✕</button></div>
          <div class="modal-body">
            <div><label>Titre</label><input id="of-titre"></div>
            <div class="row2">
              <div><label>Saga (optionnel)</label><select id="of-saga" onchange="onOfSagaChange()"><option value="">— Indépendante —</option></select></div>
              <div><label>Sous-saga (optionnel)</label><select id="of-sous-saga"><option value="">—</option></select></div>
            </div>
            <div><label>Genre</label><input id="of-genre"></div>
            <div class="row2">
              <div><label>Statut</label><select id="of-statut"><option>En écriture</option><option>En pause</option><option>Terminée</option></select></div>
              <div><label>Objectif de mots</label><input type="number" id="of-objectif"></div>
            </div>
            <div><label>Mots écrits</label><input type="number" id="of-mots"></div>
            <div><label>Résumé</label><textarea id="of-resume"></textarea></div>
          </div>
          <div class="modal-foot"><button class="btn-secondary" onclick="closeOeuvreModal()">Annuler</button><button class="btn-primary" onclick="saveOeuvre()">Enregistrer</button></div>
        </div>
      </div>`;
  }
  let editingOeuvreId = null;
  let presetSagaId = null;

  async function loadSousSagaOptions(sagaId, selectedValue){
    const sel = document.getElementById('of-sous-saga');
    if (!sagaId) { sel.innerHTML = '<option value="">—</option>'; sel.disabled = true; return; }
    sel.disabled = false;
    const { data } = await db().from('sous_sagas').select('id, nom').eq('saga_id', sagaId).order('ordre');
    sel.innerHTML = '<option value="">—</option>' + (data||[]).map(ss => `<option value="${ss.id}">${ss.nom}</option>`).join('');
    if (selectedValue) sel.value = selectedValue;
  }
  async function onOfSagaChange(){
    await loadSousSagaOptions(document.getElementById('of-saga').value, null);
  }

  async function openOeuvreModal(id, sagaId){
    editingOeuvreId = id || null;
    presetSagaId = sagaId || null;
    document.getElementById('modal-oeuvre-title').textContent = id ? "Modifier l'œuvre" : 'Nouvelle œuvre';
    const { data: sagasList } = await db().from('sagas').select('id, nom').order('ordre');
    const sel = document.getElementById('of-saga');
    sel.innerHTML = '<option value="">— Indépendante —</option>' + (sagasList||[]).map(s => `<option value="${s.id}">${s.nom}</option>`).join('');
    document.getElementById('of-titre').value=''; document.getElementById('of-genre').value='';
    document.getElementById('of-statut').value='En écriture'; document.getElementById('of-objectif').value='';
    document.getElementById('of-mots').value=''; document.getElementById('of-resume').value='';
    sel.value = presetSagaId || '';
    let sousSagaId = null;
    if (id) {
      const { data } = await db().from('oeuvres').select('titre, saga_id, sous_saga_id, genre, statut, objectif_mots, mots_ecrits, resume').eq('id', id).single();
      if (data) {
        document.getElementById('of-titre').value = data.titre||''; sel.value = data.saga_id||'';
        document.getElementById('of-genre').value = data.genre||''; document.getElementById('of-statut').value = data.statut||'En écriture';
        document.getElementById('of-objectif').value = data.objectif_mots||''; document.getElementById('of-mots').value = data.mots_ecrits||'';
        document.getElementById('of-resume').value = data.resume||'';
        sousSagaId = data.sous_saga_id;
      }
    }
    await loadSousSagaOptions(sel.value, sousSagaId);
    document.getElementById('modal-oeuvre-overlay').classList.add('open');
  }
  function closeOeuvreModal(){ document.getElementById('modal-oeuvre-overlay').classList.remove('open'); }
  async function saveOeuvre(){
    const payload = {
      titre: document.getElementById('of-titre').value.trim()||'Sans titre',
      saga_id: document.getElementById('of-saga').value || null,
      sous_saga_id: document.getElementById('of-sous-saga').value || null,
      genre: document.getElementById('of-genre').value.trim(),
      statut: document.getElementById('of-statut').value,
      objectif_mots: parseInt(document.getElementById('of-objectif').value)||null,
      mots_ecrits: parseInt(document.getElementById('of-mots').value)||0,
      resume: document.getElementById('of-resume').value.trim(),
    };
    let error, newId;
    if (editingOeuvreId) ({ error } = await db().from('oeuvres').update(payload).eq('id', editingOeuvreId));
    else { payload.user_id = currentUser.id; const res = await db().from('oeuvres').insert(payload).select('id').single(); error = res.error; newId = res.data?.id; }
    if (error) { alert('Erreur : ' + error.message); return; }
    closeOeuvreModal();
    if (newId) { openOeuvreDetail(newId); return; }
    if (currentSagaId && (payload.saga_id === currentSagaId)) { await renderSagaOeuvres(document.getElementById('saga-tab-content')); }
    else { await renderOeuvres(); }
  }

  // ============================================================
  // PERSONNAGES
  // ============================================================
  async function renderPersonnages(){
    const content = document.getElementById('content');
    content.innerHTML = `
      <div class="head-row"><h2>Personnages</h2><button class="btn-primary" onclick="openPersonnageModal()">+ Créer un personnage</button></div>
      <div id="personnages-zone"><div class="status-line">Chargement…</div></div>
    `;
    const { data, error } = await db().from('personnages').select('id, nom, resume, favori').order('created_at', { ascending:false });
    const zone = document.getElementById('personnages-zone');
    if (error) { zone.innerHTML = `<div class="empty">Erreur : ${error.message}</div>`; return; }
    if (!data.length) { zone.innerHTML = `<div class="empty">Aucun personnage pour l'instant.<br><br><button class="btn-primary" onclick="openPersonnageModal()">Créer ton premier personnage</button></div>`; return; }
    zone.innerHTML = `<div class="gallery">${data.map(p => `
      <div class="char-card" onclick="openPersonnageModal('${p.id}')">
        ${p.favori ? '<span class="fav-heart">♥</span>' : ''}
        <div class="char-portrait" style="background:linear-gradient(160deg, var(--lavender)33, var(--bg-2));">${initials(p.nom)}</div>
        <div class="char-name">${p.nom}</div>
        <div class="char-role">${p.resume || '—'}</div>
      </div>`).join('')}</div>`;
  }

  function personnageModalHtml(){
    return `
      <div class="modal-overlay" id="modal-personnage-overlay" onclick="if(event.target===this) closePersonnageModal()">
        <div class="modal-box">
          <div class="modal-head"><h2 id="modal-personnage-title">Nouveau personnage</h2><button onclick="closePersonnageModal()">✕</button></div>
          <div class="modal-body">
            <div><label>Nom</label><input id="pf-nom"></div>
            <div><label>Résumé</label><textarea id="pf-resume"></textarea></div>
            <div style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="pf-favori" style="width:auto;"><label style="margin:0;" for="pf-favori">Personnage favori</label></div>
          </div>
          <div class="modal-foot"><button class="btn-secondary" onclick="closePersonnageModal()">Annuler</button><button class="btn-primary" onclick="savePersonnage()">Enregistrer</button></div>
        </div>
      </div>`;
  }
  let editingPersonnageId = null;
  async function openPersonnageModal(id){
    editingPersonnageId = id || null;
    document.getElementById('modal-personnage-title').textContent = id ? 'Modifier le personnage' : 'Nouveau personnage';
    document.getElementById('pf-nom').value=''; document.getElementById('pf-resume').value=''; document.getElementById('pf-favori').checked=false;
    if (id) {
      const { data } = await db().from('personnages').select('nom, resume, favori').eq('id', id).single();
      if (data) { document.getElementById('pf-nom').value=data.nom||''; document.getElementById('pf-resume').value=data.resume||''; document.getElementById('pf-favori').checked=!!data.favori; }
    }
    document.getElementById('modal-personnage-overlay').classList.add('open');
  }
  function closePersonnageModal(){ document.getElementById('modal-personnage-overlay').classList.remove('open'); }
  async function savePersonnage(){
    const payload = { nom: document.getElementById('pf-nom').value.trim()||'Sans nom', resume: document.getElementById('pf-resume').value.trim(), favori: document.getElementById('pf-favori').checked };
    let error;
    if (editingPersonnageId) ({ error } = await db().from('personnages').update(payload).eq('id', editingPersonnageId));
    else { payload.user_id = currentUser.id; ({ error } = await db().from('personnages').insert(payload)); }
    if (error) { alert('Erreur : ' + error.message); return; }
    closePersonnageModal(); await renderPersonnages();
  }

  // ============================================================
  // IDÉES ("la pépinière")
  // ============================================================
  async function renderIdees(){
    const content = document.getElementById('content');
    content.innerHTML = `
      <div class="head-row"><h2>🌱 La pépinière</h2><button class="btn-primary" onclick="openIdeeModal()">+ Nouvelle idée</button></div>
      <div id="idees-zone"><div class="status-line">Chargement…</div></div>
    `;
    const { data, error } = await db().from('idees').select('id, titre, note, statut, potentiel').order('created_at', { ascending:false });
    const zone = document.getElementById('idees-zone');
    if (error) { zone.innerHTML = `<div class="empty">Erreur : ${error.message}</div>`; return; }
    if (!data.length) { zone.innerHTML = `<div class="empty">Ta pépinière est vide pour l'instant.<br><br><button class="btn-primary" onclick="openIdeeModal()">Capturer ta première idée</button></div>`; return; }
    zone.innerHTML = `<div class="gallery">${data.map(i => `
      <div class="char-card" onclick="openIdeeModal('${i.id}')">
        <div class="char-portrait" style="background:linear-gradient(160deg, #5B9B6E33, var(--bg-2));">🌱</div>
        <div class="char-name">${i.titre}</div>
        <div class="char-role">${i.statut||'Graine'}${i.potentiel ? ' · '+'★'.repeat(i.potentiel) : ''}</div>
      </div>`).join('')}</div>`;
  }

  function ideeModalHtml(){
    return `
      <div class="modal-overlay" id="modal-idee-overlay" onclick="if(event.target===this) closeIdeeModal()">
        <div class="modal-box">
          <div class="modal-head"><h2 id="modal-idee-title">Nouvelle idée</h2><button onclick="closeIdeeModal()">✕</button></div>
          <div class="modal-body">
            <div><label>Titre</label><input id="if-titre"></div>
            <div><label>L'idée</label><textarea id="if-note"></textarea></div>
            <div class="row2">
              <div><label>Statut</label><select id="if-statut"><option>Graine</option><option>À creuser</option><option>Prometteuse</option><option>En sommeil</option><option>Abandonnée</option></select></div>
              <div><label>Potentiel (1 à 5)</label><input type="number" min="1" max="5" id="if-potentiel"></div>
            </div>
          </div>
          <div class="modal-foot"><button class="btn-secondary" onclick="closeIdeeModal()">Annuler</button><button class="btn-primary" onclick="saveIdee()">Enregistrer</button></div>
        </div>
      </div>`;
  }
  let editingIdeeId = null;
  async function openIdeeModal(id){
    editingIdeeId = id || null;
    document.getElementById('modal-idee-title').textContent = id ? "Modifier l'idée" : 'Nouvelle idée';
    document.getElementById('if-titre').value=''; document.getElementById('if-note').value='';
    document.getElementById('if-statut').value='Graine'; document.getElementById('if-potentiel').value='';
    if (id) {
      const { data } = await db().from('idees').select('titre, note, statut, potentiel').eq('id', id).single();
      if (data) { document.getElementById('if-titre').value=data.titre||''; document.getElementById('if-note').value=data.note||''; document.getElementById('if-statut').value=data.statut||'Graine'; document.getElementById('if-potentiel').value=data.potentiel||''; }
    }
    document.getElementById('modal-idee-overlay').classList.add('open');
  }
  function closeIdeeModal(){ document.getElementById('modal-idee-overlay').classList.remove('open'); }
  async function saveIdee(){
    const payload = { titre: document.getElementById('if-titre').value.trim()||'Sans titre', note: document.getElementById('if-note').value.trim(), statut: document.getElementById('if-statut').value, potentiel: parseInt(document.getElementById('if-potentiel').value)||null };
    let error;
    if (editingIdeeId) ({ error } = await db().from('idees').update(payload).eq('id', editingIdeeId));
    else { payload.user_id = currentUser.id; ({ error } = await db().from('idees').insert(payload)); }
    if (error) { alert('Erreur : ' + error.message); return; }
    closeIdeeModal(); await renderIdees();
  }

  function initials(str){ return (str||'').split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase(); }

  // ============================================================
  // Apparence par fiche (theme_base + accent_color, appliqués pour de vrai)
  // ============================================================
  const DEFAULT_ACCENT = '#C9A227';
  const LIGHT_PALETTE = { '--bg':'#F3EFE6', '--bg-2':'#EAE4D6', '--card':'#FFFFFF', '--line':'rgba(27,36,54,0.14)', '--text':'#1B2436', '--text-dim':'#6B7280' };
  const DARK_PALETTE = { '--bg':'#161513', '--bg-2':'#1E1C19', '--card':'#161513', '--line':'rgba(255,255,255,0.08)', '--text':'#F3EFE6', '--text-dim':'#8A8780' };

  function applyTheme(themeBase, accentColor){
    const palette = themeBase === 'clair' ? LIGHT_PALETTE : DARK_PALETTE;
    Object.entries(palette).forEach(([k,v]) => document.documentElement.style.setProperty(k, v));
    document.documentElement.style.setProperty('--accent', accentColor || DEFAULT_ACCENT);
  }
  function resetTheme(){ applyTheme('sombre', DEFAULT_ACCENT); }

  init();
</script>
</body>
</html>
