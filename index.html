  async function transformerIdee(type){
    const idee = ideesData.find(x=>x.id===editingIdeeId);
    if (!idee) return;
    if (!confirm(`Transformer « ${idee.titre} » en ${type} ?`)) return;
    let newId, tableName, updatePayload = { transforme_en_type: type };
    if (type === 'oeuvre') {
      tableName = 'oeuvres';
      const { data, error } = await db().from('oeuvres').insert({ titre: idee.titre, resume: idee.note, user_id: currentUser.id }).select('id').single();
      if (error) { alert('Erreur : ' + error.message); return; }
      newId = data.id; updatePayload.transforme_en_oeuvre_id = newId;
    } else if (type === 'saga') {
      const { data, error } = await db().from('sagas').insert({ nom: idee.titre, description: idee.note, user_id: currentUser.id }).select('id').single();
      if (error) { alert('Erreur : ' + error.message); return; }
      newId = data.id; updatePayload.transforme_en_saga_id = newId;
    } else if (type === 'recueil') {
      const { data, error } = await db().from('recueils').insert({ titre: idee.titre, resume: idee.note, user_id: currentUser.id }).select('id').single();
      if (error) { alert('Erreur : ' + error.message); return; }
      newId = data.id; updatePayload.transforme_en_recueil_id = newId;
    }
    await db().from('idees').update(updatePayload).eq('id', editingIdeeId);
    closeIdeeModal();
    if (type === 'oeuvre') openOeuvreDetail(newId);
    else if (type === 'saga') openSagaDetail(newId);
    else if (type === 'recueil') openRecueilDetail(newId);
  }

  let editingPoemeId = null;
  async function openPoemeModal(id){
    editingPoemeId = id || null;
    document.getElementById('modal-poeme-title').textContent = id ? 'Modifier le poème' : (currentRecueilType==='anthologie' ? 'Compiler un poème' : 'Nouveau poème');

  function closePoemeModal(){ document.getElementById('modal-poeme-overlay').classList.remove('open'); }
  async function savePoeme(){
    const motsClesRaw = document.getElementById('pmf-motscles').value.trim();
    const maxOrdre = recueilPoemesData.reduce((m,p)=>Math.max(m, p.ordre||0), 0);
    const payload = {
      titre: document.getElementById('pmf-titre').value.trim()||'Sans titre',
      statut: document.getElementById('pmf-statut').value,
      statut_selection: document.getElementById('pmf-selection').value || null,
      theme_principal: document.getElementById('pmf-theme').value.trim(),
      date_ecriture: document.getElementById('pmf-date').value || null,
      mots_cles: motsClesRaw ? motsClesRaw.split(',').map(t=>t.trim()).filter(Boolean) : null,
      extrait: document.getElementById('pmf-extrait').value.trim(),
      texte: document.getElementById('pmf-texte').value.trim(),
      section_id: document.getElementById('pmf-section').value || null,
    };
    if (currentRecueilType === 'anthologie') {
      payload.recueil_origine_id = document.getElementById('pmf-recueil-origine').value || null;
      payload.emplacement = document.getElementById('pmf-emplacement').value || null;
      const action = document.getElementById('pmf-action').value;
      payload.actions = action ? [action] : null;
      payload.remarque = document.getElementById('pmf-remarque').value.trim();
    }
    let error;
    if (editingPoemeId) ({ error } = await db().from('poemes').update(payload).eq('id', editingPoemeId));
    else { payload.user_id = currentUser.id; payload.recueil_id = currentRecueilId; payload.ordre = maxOrdre + 1; ({ error } = await db().from('poemes').insert(payload)); }
    if (error) { alert('Erreur : ' + error.message); return; }
    closePoemeModal();
    const zone = document.getElementById('recueil-tab-content');
    if (activeRecueilTab === 'structure') await renderRecueilStructure(zone); else await renderRecueilPoemes(zone);
  }
  async function deletePoeme(){
    if (!confirm('Supprimer ce poème ?')) return;
    const { error } = await db().from('poemes').delete().eq('id', editingPoemeId);
    if (error) { alert('Erreur : ' + error.message); return; }
    closePoemeModal();
    const zone = document.getElementById('recueil-tab-content');
    if (activeRecueilTab === 'structure') await renderRecueilStructure(zone); else await renderRecueilPoemes(zone);
  }

  // ---- Structure du recueil ----
  let structureSections = [];
  let structurePoemesBySection = {};

  async function renderRecueilStructure(zone){
    zone.innerHTML = `<div class="status-line">Chargement…</div>`;
    const { data: rInfo } = await db().from('recueils').select('type_recueil').eq('id', currentRecueilId).single();
    currentRecueilType = rInfo?.type_recueil || 'original';
    const [{ data: sections, error }, { data: poemes }] = await Promise.all([
      db().from('sections_recueil').select('*').eq('recueil_id', currentRecueilId).order('ordre'),
      db().from('poemes').select('*').eq('recueil_id', currentRecueilId).order('ordre'),
    ]);
    if (error) { zone.innerHTML = `<div class="empty">Erreur : ${error.message}</div>`; return; }
    structureSections = sections;
    recueilPoemesData = poemes || [];
    structurePoemesBySection = {};
    (poemes||[]).forEach(p => { const k = p.section_id||'__sans__'; (structurePoemesBySection[k] = structurePoemesBySection[k]||[]).push(p); });

    const totalEcrits = (poemes||[]).filter(p=>p.statut!=='à écrire').length;
    const totalTermines = (poemes||[]).filter(p=>p.statut==='terminé').length;
    const romain = (n) => ['','I','II','III','IV','V','VI','VII','VIII','IX','X'][n] || n;

    zone.innerHTML = `
      <div class="row2" style="grid-template-columns:1fr 2fr 1fr; gap:20px; align-items:start;">
        <div class="panel">
          <h2>Sections du recueil</h2>
          ${structureSections.length ? structureSections.map((s,i) => `
            <div class="info-line" style="cursor:pointer;" onclick="scrollToSection('${s.id}')">
              <span>${romain(i+1)} · ${s.nom}</span>
              <span style="color:var(--text-dim);">${(structurePoemesBySection[s.id]||[]).length} poème(s)</span>
            </div>`).join('') : '<div style="font-size:12px; color:var(--text-dim);">Aucune section pour l\u2019instant.</div>'}
          <button class="btn-secondary" style="margin-top:12px; width:100%;" onclick="openSectionModal()">+ Ajouter une section</button>
        </div>

        <div id="structure-sections-zone">
          ${structureSections.map((s,i) => `
            <div class="panel" id="section-${s.id}">
              <div class="head-row" style="margin-bottom:10px;">
                <h2 style="margin:0;">SECTION ${romain(i+1)} · ${s.nom.toUpperCase()}</h2>
                <span style="font-size:12px; color:var(--text-dim);">${(structurePoemesBySection[s.id]||[]).length}${s.objectif_poemes ? ' / '+s.objectif_poemes : ''} poèmes</span>
              </div>
              ${(structurePoemesBySection[s.id]||[]).length ? `<table class="ch-table"><thead><tr><th>Ordre</th><th>Titre</th><th>Statut</th><th>Date</th><th>Mots-clés</th></tr></thead><tbody>
                ${(structurePoemesBySection[s.id]||[]).map(p => `<tr onclick="openPoemeModal('${p.id}')"><td>${p.numero??'—'}</td><td>${p.titre}</td><td><span class="etat-pill">${p.statut||'—'}</span></td><td>${p.date_ecriture||'—'}</td><td>${(p.mots_cles||[]).join(', ')||'—'}</td></tr>`).join('')}
              </tbody></table>` : '<div class="empty">Aucun poème dans cette section.</div>'}
              <button class="btn-secondary" style="margin-top:10px; width:100%;" onclick="openPoemeModalForSection('${s.id}')">+ Ajouter un poème à cette section</button>
            </div>`).join('')}
          ${(structurePoemesBySection['__sans__']||[]).length ? `
            <div class="panel">
              <h2>Sans section</h2>
              <table class="ch-table"><thead><tr><th>Titre</th><th>Statut</th></tr></thead><tbody>
                ${structurePoemesBySection['__sans__'].map(p => `<tr onclick="openPoemeModal('${p.id}')"><td>${p.titre}</td><td><span class="etat-pill">${p.statut||'—'}</span></td></tr>`).join('')}
              </tbody></table>
            </div>` : ''}
        </div>

        <div>
          <div class="panel">
            <h2>Résumé de la structure</h2>
            <div class="info-line"><span>Sections</span><span>${structureSections.length}</span></div>
            <div class="info-line"><span>Poèmes écrits</span><span>${totalEcrits}</span></div>
            <div class="info-line"><span>Poèmes terminés</span><span>${totalTermines}</span></div>
          </div>
          <div class="panel">
            <h2>Conseils d'organisation</h2>
            <div style="font-size:13px; color:var(--text-dim); line-height:1.8;">
              • Commence par les poèmes qui posent l'ambiance.<br>
              • Place les plus marquants au cœur du recueil.<br>
              • Termine sur une montée ou une ouverture.<br>
              • Relis l'ensemble pour vérifier le rythme.
            </div>
          </div>
        </div>
      </div>
    `;
  }
  function scrollToSection(id){ document.getElementById('section-'+id)?.scrollIntoView({ behavior:'smooth' }); }
  function openPoemeModalForSection(sectionId){
    openPoemeModal();
    setTimeout(() => { const sel = document.getElementById('pmf-section'); if (sel) sel.value = sectionId; }, 0);
  }

  function sectionModalHtml(){
    return `
      <div class="modal-overlay" id="modal-section-overlay" onclick="if(event.target===this) closeSectionModal()">
        <div class="modal-box">
          <div class="modal-head"><h2>Nouvelle section</h2><button onclick="closeSectionModal()">✕</button></div>
          <div class="modal-body">
            <div><label>Nom de la section</label><input id="sef-nom" placeholder="ex : Les fêlures"></div>
            <div><label>Objectif de poèmes pour cette section</label><input type="number" id="sef-objectif"></div>
          </div>
          <div class="modal-foot"><button class="btn-secondary" onclick="closeSectionModal()">Annuler</button><button class="btn-primary" onclick="saveSection()">Enregistrer</button></div>
        </div>
      </div>`;
  }
  function openSectionModal(){ document.getElementById('sef-nom').value=''; document.getElementById('sef-objectif').value=''; document.getElementById('modal-section-overlay').classList.add('open'); }
  function closeSectionModal(){ document.getElementById('modal-section-overlay').classList.remove('open'); }
  async function saveSection(){
    const maxOrdre = structureSections.reduce((m,s)=>Math.max(m, s.ordre||0), 0);
    const payload = { recueil_id: currentRecueilId, nom: document.getElementById('sef-nom').value.trim()||'Sans titre', objectif_poemes: parseInt(document.getElementById('sef-objectif').value)||null, ordre: maxOrdre+1 };
    const { error } = await db().from('sections_recueil').insert(payload);
    if (error) { alert('Erreur : ' + error.message); return; }
    closeSectionModal();
    await renderRecueilStructure(document.getElementById('recueil-tab-content'));
  }

  async function renderRecueilParametres(zone){
    const { data: r } = await db().from('recueils').select('*').eq('id', currentRecueilId).single();
    zone.innerHTML = `
      <div class="panel">
        <h2>Informations générales</h2>
        <label>Titre</label><input id="rp-titre" value="${r.titre||''}">
        <div class="row2" style="margin-top:12px;">
          <div><label>Type</label><select id="rp-type"><option value="original" ${r.type_recueil==='original'?'selected':''}>Recueil original</option><option value="anthologie" ${r.type_recueil==='anthologie'?'selected':''}>Anthologie</option></select></div>
          <div><label>Statut</label><input id="rp-statut" value="${r.statut||''}"></div>
        </div>
        <label style="margin-top:12px;">Objectif de poèmes</label><input type="number" id="rp-objectif" value="${r.objectif_poemes||''}">
        <label style="margin-top:12px;">Résumé</label><textarea id="rp-resume">${r.resume||''}</textarea>
        <button class="btn-primary" style="margin-top:16px;" onclick="saveRecueilParametres()">Enregistrer</button>
      </div>
      <div class="panel">
        <h2>Images</h2>
        <p style="font-size:12px; color:var(--text-dim); margin-bottom:10px;">Colle l'URL d'une image déjà hébergée quelque part (pas encore d'upload direct).</p>
        <label>URL de la couverture</label><input id="rp-couverture" value="${r.couverture||''}" placeholder="https://...">
        <label style="margin-top:10px;">URL de la bannière</label><input id="rp-banniere" value="${r.banniere||''}" placeholder="https://...">
        <button class="btn-primary" style="margin-top:16px;" onclick="saveRecueilImages()">Enregistrer les images</button>
      </div>
      <div class="panel">
        <h2>Archivage</h2>
        <button class="btn-secondary" onclick="toggleArchiveRecueil(${r.archive})">${r.archive?'Désarchiver':'Archiver ce recueil'}</button>
      </div>
    `;
  }
  async function saveRecueilImages(){
    const payload = { couverture: document.getElementById('rp-couverture').value.trim()||null, banniere: document.getElementById('rp-banniere').value.trim()||null };
    const { error } = await db().from('recueils').update(payload).eq('id', currentRecueilId);
    if (error) { alert('Erreur : ' + error.message); return; }
    openRecueilDetail(currentRecueilId);
  }
  async function saveRecueilParametres(){
    const payload = { titre: document.getElementById('rp-titre').value.trim()||'Sans titre', type_recueil: document.getElementById('rp-type').value, statut: document.getElementById('rp-statut').value.trim(), objectif_poemes: parseInt(document.getElementById('rp-objectif').value)||null, resume: document.getElementById('rp-resume').value.trim() };
    const { error } = await db().from('recueils').update(payload).eq('id', currentRecueilId);
    if (error) { alert('Erreur : ' + error.message); return; }
    openRecueilDetail(currentRecueilId);
  }
  async function toggleArchiveRecueil(currentlyArchived){
    const { error } = await db().from('recueils').update({ archive: !currentlyArchived }).eq('id', currentRecueilId);
    if (error) { alert('Erreur : ' + error.message); return; }
    navigate('poesie');
  }

  function initials(str){ return (str||'').split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase(); }

  // ============================================================
  // Apparence par fiche (theme_base + accent_color, appliqués pour de vrai)
  // ============================================================
  const DEFAULT_ACCENT = '#7C5CBF';
  const LIGHT_PALETTE = { '--bg':'#FFFFFF', '--bg-2':'#F6F3FB', '--card':'#FFFFFF', '--line':'rgba(124,92,191,0.18)', '--text':'#2B2140', '--text-dim':'#7A7290' };
  const DARK_PALETTE = { '--bg':'#161513', '--bg-2':'#1E1C19', '--card':'#161513', '--line':'rgba(255,255,255,0.08)', '--text':'#F3EFE6', '--text-dim':'#8A8780' };

  function applyTheme(themeBase, accentColor){
    const palette = themeBase === 'clair' ? LIGHT_PALETTE : DARK_PALETTE;
    Object.entries(palette).forEach(([k,v]) => document.documentElement.style.setProperty(k, v));
    document.documentElement.style.setProperty('--accent', accentColor || DEFAULT_ACCENT);
  }
  function resetTheme(){ applyTheme('clair', DEFAULT_ACCENT); }

  init();
</script>
</body>
</html>
